,"kind":"comorbidity","pdf":[330,330],"html":"<p>Les taux de comorbidité avec les troubles liés à des substances sont élevés dans la schizophrénie. Plus de la moitié des personnes présentant une schizophrénie ont un trouble de l’usage du tabac et fument régulièrement des cigarettes. La comorbidité avec les troubles anxieux est de plus en plus reconnue dans la schizophrénie. Les taux de trouble obsessionnel-compulsif et de trouble panique sont plus élevés chez les personnes présentant une schizophrénie que dans la population générale. Une personnalité schizotypique ou paranoïaque peut parfois précéder le début de la schizophrénie.</p><p>L’espérance de vie est réduite chez les personnes présentant une schizophrénie en raison des affections médicales associées. La prise de poids, le diabète, le syndrome métabolique et les maladies cardiovasculaires et pulmonaires sont plus fréquents dans la schizophrénie que dans la population générale. Un faible engagement dans les comportements de préservation de la santé (par exemple, dépistage du cancer, exercice physique) augmente le risque de maladies chroniques, mais d’autres facteurs liés au trouble, notamment les médicaments, le mode de vie, le tabagisme et l’alimentation, peuvent également jouer un rôle. Une vulnérabilité commune à la psychose et aux affections médicales peut expliquer une partie de la comorbidité médicale de la schizophrénie.</p>"}]},{"id":"schizoaffectif","title":"Trouble schizoaffectif","english":"Schizoaffective Disorder","codes":["F25.0","F25.1"],"criteriaPdf":[331,331],"pdf":[330,339],"aliases":["schizo-affectif","schizoaffective","psychose schizoaffective"],"pages":"121–126","chapter":"psychoses","related":["schizophrenie","psychotique-induit","psychotique-affection-medicale"],"family":"psychoses-primaires","sections":[{"title":"Critères diagnostiques","kind":"criteria","pdf":[331,331],"html":"<p><strong>A.</strong> Une période ininterrompue de maladie pendant laquelle survient un épisode thymique majeur (dépressif caractérisé ou maniaque) simultanément au critère A de la schizophrénie.</p><p><strong>Note :</strong> L’épisode dépressif caractérisé doit comprendre le critère A1 : humeur dépressive.</p><p><strong>B.</strong> Des idées délirantes ou des hallucinations pendant 2 semaines ou plus en l’absence d’un épisode thymique majeur (dépressif ou maniaque) à un moment de l’évolution de la maladie.</p><p><strong>C.</strong> Des symptômes répondant aux critères d’un épisode thymique majeur sont présents pendant la majorité de la durée totale des phases actives et résiduelles de la maladie.</p><p><strong>D.</strong> La perturbation n’est pas attribuable aux effets d’une substance (par exemple, une substance donnant lieu à abus, un médicament) ou à une autre affection médicale.</p>"},{"title":"Spécifications","kind":"specifiers","pdf":[331,332],"html":"<h4>Spécifier le type :</h4><p><strong>F25.0 — Type bipolaire :</strong> Ce sous-type s’applique si un épisode maniaque fait partie de la présentation. Des épisodes dépressifs caractérisés peuvent également survenir.</p><p><strong>F25.1 — Type dépressif :</strong> Ce sous-type s’applique si seuls des épisodes dépressifs caractérisés font partie de la présentation.</p><h4>Spécifier si :</h4><p><strong>Avec catatonie</strong> (pour la définition, se référer aux critères de la catatonie associée à un autre trouble mental, p. 135).</p><p><strong>Note de codage :</strong> Utiliser le code supplémentaire F06.1, catatonie associée au trouble schizoaffectif, pour indiquer la présence de la catatonie comorbide.</p><h4>Spécifier si :</h4><p>Les spécifications évolutives suivantes ne doivent être utilisées qu’après une durée d’un an du trouble et si elles ne sont pas en contradiction avec les critères diagnostiques d’évolution.</p><p><strong>Premier épisode, actuellement en épisode aigu :</strong> Première manifestation du trouble répondant aux critères diagnostiques définissant les symptômes et leur durée. Un épisode aigu est une période pendant laquelle les critères symptomatiques sont remplis.</p><p><strong>Premier épisode, actuellement en rémission partielle :</strong> La rémission partielle est une période pendant laquelle l’amélioration obtenue après un épisode précédent se maintient et durant laquelle les critères définissant le trouble ne sont que partiellement remplis.</p><p><strong>Premier épisode, actuellement en rémission complète :</strong> La rémission complète est une période suivant un épisode précédent, pendant laquelle aucun symptôme spécifique du trouble n’est présent.</p><p><strong>Épisodes multiples, actuellement en épisode aigu :</strong> Des épisodes multiples peuvent être retenus après un minimum de deux épisodes (c’est-à-dire après un premier épisode, une rémission et au moins une rechute).</p><p><strong>Épisodes multiples, actuellement en rémission partielle</strong></p><p><strong>Épisodes multiples, actuellement en rémission complète</strong></p><p><strong>Continu :</strong> Les symptômes répondant aux critères symptomatiques diagnostiques du trouble persistent pendant la majeure partie de l’évolution de la maladie, les périodes de symptômes sous le seuil diagnostique étant très brèves par rapport à l’ensemble de l’évolution.</p><p><strong>Non spécifié</strong></p><h4>Spécifier la sévérité actuelle :</h4><p>La sévérité est cotée par une évaluation quantitative des principaux symptômes de psychose, comprenant les idées délirantes, les hallucinations, le discours désorganisé, le comportement psychomoteur anormal et les symptômes négatifs. Chacun de ces symptômes peut être coté pour sa sévérité actuelle (la plus importante au cours des 7 derniers jours) sur une échelle à 5 points allant de 0 (absent) à 4 (présent et sévère). (Voir les Dimensions de la sévérité des symptômes psychotiques cotées par le clinicien dans le chapitre « Mesures d’évaluation ».)</p><p><strong>Note :</strong> Le diagnostic de trouble schizoaffectif peut être posé sans utiliser cette spécification de sévérité.</p>"},{"title":"Caractéristiques diagnostiques","kind":"clinical","pdf":[333,334],"html":"<p>Le diagnostic de trouble schizoaffectif repose sur l’évaluation d’une période ininterrompue de maladie pendant laquelle la personne continue à présenter des symptômes actifs ou résiduels de maladie psychotique. Le diagnostic est habituellement, mais pas nécessairement, posé pendant la période de maladie psychotique. À un moment de cette période, le critère A de la schizophrénie doit être rempli. Les critères B (dysfonctionnement social), C (durée de 6 mois) et F (exclusion d’un trouble du spectre de l’autisme ou d’un autre trouble de la communication débutant dans l’enfance) de la schizophrénie n’ont pas à être remplis. En plus de répondre au critère A de la schizophrénie, la personne présente un épisode thymique majeur (dépressif caractérisé ou maniaque) (critère A du trouble schizoaffectif). La perte d’intérêt ou de plaisir étant fréquente dans la schizophrénie, pour remplir le critère A du trouble schizoaffectif, l’épisode dépressif caractérisé doit comprendre une humeur dépressive envahissante (c’est-à-dire que la présence d’une diminution marquée de l’intérêt ou du plaisir ne suffit pas). Les épisodes dépressifs ou maniaques sont présents pendant la majorité de la durée totale de la maladie (c’est-à-dire après que le critère A a été rempli) (critère C du trouble schizoaffectif). Pour distinguer le trouble schizoaffectif d’un trouble dépressif ou bipolaire avec caractéristiques psychotiques, des idées délirantes ou des hallucinations doivent être présentes pendant au moins 2 semaines en l’absence d’un épisode thymique majeur (dépressif ou maniaque) à un moment de l’évolution de la maladie (critère B du trouble schizoaffectif). Les symptômes ne doivent pas être attribuables aux effets d’une substance ou à une autre affection médicale (critère D du trouble schizoaffectif).</p><p>Le critère C du trouble schizoaffectif précise que des symptômes thymiques répondant aux critères d’un épisode thymique majeur doivent être présents pendant la majorité de la durée totale des phases actives et résiduelles de la maladie. Le critère C exige l’évaluation des symptômes thymiques sur l’ensemble de l’évolution de la maladie psychotique au cours de la vie. Si les symptômes thymiques ne sont présents que pendant une période relativement brève, le diagnostic est celui de schizophrénie et non de trouble schizoaffectif. Pour décider si la présentation d’une personne répond au critère C, le clinicien doit examiner la durée totale de la maladie psychotique (c’est-à-dire les symptômes actifs comme résiduels) et déterminer à quels moments des symptômes thymiques significatifs (non traités ou nécessitant un traitement par antidépresseur et/ou stabilisateur de l’humeur) ont accompagné les symptômes psychotiques. Cette détermination nécessite des informations historiques suffisantes et un jugement clinique. Par exemple, une personne ayant des antécédents de 4 années de symptômes actifs et résiduels de schizophrénie développe des épisodes dépressifs et maniaques qui, considérés ensemble, n’occupent pas plus d’un an au cours de ces 4 années de maladie psychotique. Cette présentation ne répondrait pas au critère C.</p><p>Outre les cinq domaines symptomatiques identifiés dans les critères diagnostiques, l’évaluation des domaines de la cognition, de la dépression et de la manie est essentielle pour établir des distinctions d’importance majeure entre les différents troubles du spectre de la schizophrénie et les autres troubles psychotiques.</p>"},{"title":"Caractéristiques associées","kind":"associated","pdf":[334,334],"html":"<p>Le fonctionnement professionnel et social est fréquemment altéré, mais il ne s’agit pas d’un critère définissant le trouble (à la différence de la schizophrénie). Une restriction des contacts sociaux et des difficultés de soins personnels sont associées au trouble schizoaffectif, mais les symptômes négatifs peuvent être moins sévères et moins persistants que ceux observés dans la schizophrénie. L’anosognosie (c’est-à-dire un faible insight) est également fréquente dans le trouble schizoaffectif, mais les déficits d’insight peuvent être moins sévères et moins envahissants que dans la schizophrénie. Les personnes présentant un trouble schizoaffectif peuvent avoir un risque accru de développer ultérieurement des épisodes de trouble dépressif caractérisé ou de trouble bipolaire si les symptômes thymiques persistent après la rémission des symptômes répondant au critère A de la schizophrénie. Des troubles liés à l’alcool et à d’autres substances peuvent être associés.</p><p>Il n’existe aucun test ni aucune mesure biologique pouvant apporter une aide définitive au diagnostic de trouble schizoaffectif. L’évaluation neuropsychologique montre habituellement des déficits cognitifs dans des domaines tels que les fonctions exécutives, la mémoire verbale et la vitesse de traitement, qui peuvent être moins prononcés que dans la schizophrénie. Le trouble schizoaffectif est souvent caractérisé par une perte de volume de substance grise à l’imagerie cérébrale, de façon très similaire à la schizophrénie.</p>"},{"title":"Prévalence","kind":"prevalence","pdf":[334,335],"html":"<p>Le trouble schizoaffectif semble environ trois fois moins fréquent que la schizophrénie. Sa prévalence vie entière a été estimée à 0,3 % dans un échantillon finlandais et est plus élevée chez les femmes que chez les hommes lorsque les critères diagnostiques du DSM-IV sont utilisés. On s’attend à ce que ce taux soit plus faible en raison de l’exigence plus stricte du critère C du DSM-5 (c’est-à-dire que les symptômes thymiques répondant aux critères d’un épisode thymique majeur doivent être présents pendant la majorité de la durée totale des phases actives et résiduelles de la maladie).</p>"},{"title":"Développement et évolution","kind":"course","pdf":[335,336],"html":"<p>L’âge habituel de début du trouble schizoaffectif est le début de l’âge adulte, bien que le trouble puisse débuter à tout moment entre l’adolescence et un âge avancé. Un nombre important de personnes ayant initialement reçu un diagnostic d’une autre maladie psychotique recevront ultérieurement un diagnostic de trouble schizoaffectif, lorsque la configuration des épisodes thymiques sera devenue plus apparente, tandis que d’autres peuvent recevoir un diagnostic de trouble de l’humeur avant que des symptômes psychotiques indépendants soient détectés.</p><p>Inversement, chez certaines personnes, le diagnostic passera au fil du temps de celui de trouble schizoaffectif à celui de trouble de l’humeur ou de schizophrénie. Le passage d’un diagnostic de trouble schizoaffectif à celui de schizophrénie était plus fréquent que le passage à un trouble de l’humeur selon les critères du DSM-IV, et cette différence devrait être plus prononcée avec le DSM-5, car le critère C actuel du trouble schizoaffectif est devenu plus strict : il exige que les symptômes thymiques soient présents pendant la majorité de la maladie, par comparaison avec la définition du DSM-IV qui exigeait seulement leur présence pendant une portion « substantielle ». Le pronostic du trouble schizoaffectif est quelque peu meilleur que celui de la schizophrénie, mais moins bon que celui des troubles de l’humeur.</p><p>Le trouble schizoaffectif peut présenter diverses configurations temporelles. La configuration suivante est typique : une personne peut présenter des hallucinations auditives prononcées et des idées délirantes persécutoires pendant 2 mois avant le début d’un épisode dépressif caractérisé manifeste. Les symptômes psychotiques et l’épisode dépressif caractérisé complet sont ensuite présents pendant 4 mois. Puis la personne se rétablit complètement de l’épisode dépressif caractérisé, mais les symptômes psychotiques persistent encore 1 mois avant de disparaître eux aussi. Pendant cette période de maladie, les symptômes de la personne ont répondu simultanément aux critères d’un épisode dépressif caractérisé et au critère A de la schizophrénie ; au cours de cette même période, des hallucinations auditives et des idées délirantes étaient présentes avant et après la phase dépressive. La période totale de maladie a duré environ 7 mois, avec des symptômes psychotiques seuls pendant les 2 premiers mois, des symptômes dépressifs et psychotiques pendant les 4 mois suivants, et des symptômes psychotiques seuls pendant le dernier mois. Dans ce cas, l’épisode dépressif était présent pendant la majorité de la durée totale de la perturbation psychotique ; la présentation permet donc de poser un diagnostic de trouble schizoaffectif.</p><p>La relation temporelle entre les symptômes thymiques et les symptômes psychotiques au cours de la vie est variable. Des symptômes dépressifs ou maniaques peuvent survenir avant le début de la psychose, pendant les épisodes psychotiques aigus, pendant les périodes résiduelles et après la disparition de la psychose. Par exemple, une personne peut présenter des symptômes thymiques prononcés pendant la phase prodromique de la schizophrénie. Cette configuration n’indique pas nécessairement un trouble schizoaffectif, puisque c’est la coexistence des symptômes psychotiques et thymiques qui est diagnostique. Chez une personne dont les symptômes répondent clairement aux critères du trouble schizoaffectif, mais qui ne présente au cours du suivi ultérieur que des symptômes psychotiques résiduels (tels qu’une psychose sous le seuil diagnostique et/ou des symptômes négatifs prononcés), le diagnostic peut être changé pour celui de schizophrénie, à mesure que la proportion totale de maladie psychotique devient plus importante par rapport aux symptômes thymiques.</p><p>Le trouble schizoaffectif de type bipolaire peut être plus fréquent chez les adultes jeunes, tandis que le trouble schizoaffectif de type dépressif peut être plus fréquent chez les adultes plus âgés.</p>"},{"title":"Facteurs de risque et pronostiques","kind":"risk","pdf":[336,337],"html":"<h4>Génétiques et physiologiques</h4><p>Chez les apparentés au premier degré de personnes présentant une schizophrénie, il peut exister un risque accru de trouble schizoaffectif. Le risque de trouble schizoaffectif peut également être augmenté chez les personnes ayant un apparenté au premier degré présentant un trouble bipolaire ou un trouble schizoaffectif lui-même. Les signatures composites de génétique moléculaire appelées scores de risque polygénique pour la schizophrénie, le trouble bipolaire et le trouble dépressif caractérisé peuvent toutes être élevées dans le trouble schizoaffectif.</p>"},{"title":"Questions diagnostiques liées à la culture","kind":"culture","pdf":[337,337],"html":"<p>Les facteurs culturels et socioéconomiques doivent être pris en compte, en particulier lorsque la personne et le clinicien ne partagent pas le même contexte culturel et économique. Des idées paraissant délirantes dans un contexte culturel (par exemple, le mauvais œil, le fait de provoquer une maladie par des malédictions, l’influence des esprits) peuvent être communément admises dans d’autres. Certaines données de la littérature indiquent également que les populations afro-américaines et hispaniques dont les symptômes répondent aux critères du trouble schizoaffectif risquent davantage de recevoir un diagnostic de schizophrénie. Pour limiter l’impact des biais du clinicien, il faut veiller à réaliser une évaluation complète incluant les symptômes psychotiques comme les symptômes thymiques.</p>"},{"title":"Association avec les pensées ou comportements suicidaires","kind":"suicide","pdf":[337,337],"html":"<p>Le risque de suicide sur la vie entière dans la schizophrénie et le trouble schizoaffectif est de 5 %, et la présence de symptômes dépressifs est corrélée à un risque plus élevé de suicide. Des données indiquent que les taux de suicide sont plus élevés dans les populations nord-américaines que dans les populations européennes, d’Europe de l’Est, sud-américaines et indiennes de personnes présentant une schizophrénie ou un trouble schizoaffectif.</p>"},{"title":"Conséquences fonctionnelles du trouble schizoaffectif","kind":"functional","pdf":[337,337],"html":"<p>Le trouble schizoaffectif est associé à un dysfonctionnement global, notamment dans les domaines social et professionnel, mais le dysfonctionnement n’est pas un critère diagnostique (contrairement à la schizophrénie), et il existe une variabilité importante entre les personnes ayant reçu un diagnostic de trouble schizoaffectif.</p>"},{"title":"Diagnostic différentiel","kind":"differential","pdf":[337,338],"html":"<h4>Autres troubles mentaux et affections médicales</h4><p>Une grande diversité d’affections psychiatriques et médicales peut se manifester par des symptômes psychotiques et thymiques et doit être prise en compte dans le diagnostic différentiel du trouble schizoaffectif. Il s’agit notamment du delirium ; du trouble neurocognitif majeur ; du trouble psychotique ou du trouble neurocognitif induit par une substance ou un médicament ; des troubles bipolaires avec caractéristiques psychotiques ; du trouble dépressif caractérisé avec caractéristiques psychotiques ; des troubles dépressifs ou bipolaires avec caractéristiques catatoniques ; de la personnalité schizotypique, schizoïde ou paranoïaque ; du trouble psychotique bref ; du trouble schizophréniforme ; de la schizophrénie ; du trouble délirant ; et des autres troubles spécifiés et non spécifiés du spectre de la schizophrénie et autres troubles psychotiques.</p><h4>Trouble psychotique dû à une autre affection médicale</h4><p>D’autres affections médicales et l’usage de substances peuvent se manifester par une association de symptômes psychotiques et thymiques ; un trouble psychotique dû à une autre affection médicale doit donc être exclu.</p><h4>Schizophrénie, troubles bipolaires et dépressifs</h4><p>Il est souvent difficile de distinguer le trouble schizoaffectif de la schizophrénie et des troubles dépressifs et bipolaires avec caractéristiques psychotiques. Le critère C est conçu pour distinguer le trouble schizoaffectif de la schizophrénie, et le critère B pour le distinguer d’un trouble dépressif ou bipolaire avec caractéristiques psychotiques. Plus précisément, le trouble schizoaffectif peut être distingué d’un trouble dépressif caractérisé ou bipolaire avec caractéristiques psychotiques par la présence d’idées délirantes et/ou d’hallucinations prononcées pendant au moins 2 semaines en l’absence d’un épisode thymique majeur. À l’inverse, dans un trouble dépressif ou bipolaire avec caractéristiques psychotiques, les caractéristiques psychotiques ne surviennent que pendant le ou les épisodes thymiques. Comme la proportion relative de symptômes thymiques et psychotiques peut changer au fil du temps, le diagnostic approprié peut être modifié pour devenir, ou cesser d’être, celui de trouble schizoaffectif. (Par exemple, un diagnostic de trouble schizoaffectif posé pour un épisode dépressif caractérisé sévère et prononcé durant 4 mois pendant les 6 premiers mois d’une maladie psychotique chronique serait changé pour celui de schizophrénie si des symptômes psychotiques actifs ou des symptômes résiduels prononcés persistent pendant plusieurs années sans récurrence d’un autre épisode thymique.) Une meilleure clarification de la proportion relative de symptômes thymiques et psychotiques au cours du temps et de leur concomitance peut nécessiter des informations complémentaires provenant du dossier médical et d’informateurs.</p>"},{"title":"Comorbidité","kind":"comorbidity","pdf":[339,339],"html":"<p>De nombreuses personnes ayant reçu un diagnostic de trouble schizoaffectif reçoivent également un diagnostic d’autres troubles mentaux, en particulier des troubles de l’usage de substances et des troubles anxieux. De même, l’incidence des affections médicales, notamment du syndrome métabolique, est supérieure au taux de base de la population générale et entraîne une diminution de l’espérance de vie.</p>"}]},{"id":"psychotique-induit","title":"Trouble psychotique induit par une substance ou un médicament","english":"Substance/Medication-Induced Psychotic Disorder","codes":["F10.159","F10.259","F10.959","F12.159","F12.259","F12.959","F16.159","F16.259","F16.959","F18.159","F18.259","F18.959","F13.159","F13.259","F13.959","F15.159","F15.259","F15.959","F14.159","F14.259","F14.959","F19.159","F19.259","F19.959"],"criteriaPdf":[339,340],"pdf":[339,348],"aliases":["psychose induite","psychose toxique","psychose médicamenteuse","psychose sous cannabis","psychose sous cocaïne","psychose sous amphétamines","psychose alcoolique","hallucinose alcoolique","psychose cannabique","pharmacopsychose"],"pages":"126–131","chapter":"psychoses","related":["psychotique-affection-medicale","schizophrenie","psychotique-non-specifie"],"family":"psychoses-secondaires","codeLabel":"Codage selon la substance","sections":[{"title":"Critères diagnostiques","kind":"criteria","pdf":[339,340],"html":"<p><strong>A.</strong> Présence d’un ou des deux symptômes suivants :</p><ol><li>Idées délirantes.</li><li>Hallucinations.</li></ol><p><strong>B.</strong> Des éléments de l’anamnèse, de l’examen physique ou des examens de laboratoire attestent à la fois (1) et (2) :</p><ol><li>Les symptômes du critère A se sont développés pendant ou peu après une intoxication par une substance ou un sevrage de cette substance, ou après une exposition à un médicament ou son sevrage.</li><li>La substance ou le médicament en cause est capable de produire les symptômes du critère A.</li></ol><p><strong>C.</strong> La perturbation n’est pas mieux expliquée par un trouble psychotique qui n’est pas induit par une substance ou un médicament. Les éléments en faveur d’un trouble psychotique indépendant peuvent notamment être les suivants :</p><p>Les symptômes ont précédé le début de l’usage de la substance ou du médicament ; les symptômes persistent pendant une période substantielle (par exemple, environ 1 mois) après la fin d’un sevrage aigu ou d’une intoxication sévère ; ou d’autres éléments attestent l’existence d’un trouble psychotique indépendant, non induit par une substance ou un médicament (par exemple, des antécédents d’épisodes récurrents sans lien avec une substance ou un médicament).</p><p><strong>D.</strong> La perturbation ne survient pas exclusivement au cours d’un état confusionnel (delirium).</p><p><strong>E.</strong> La perturbation entraîne une détresse cliniquement significative ou une altération du fonctionnement social, professionnel ou dans d’autres domaines importants.</p><p><strong>Note :</strong> Ce diagnostic doit être retenu à la place d’un diagnostic d’intoxication par une substance ou de sevrage d’une substance uniquement lorsque les symptômes du critère A prédominent dans le tableau clinique et sont suffisamment sévères pour justifier une attention clinique.</p>"},{"title":"Note de codage et codes selon la substance","kind":"recording","pdf":[340,341],"html":"<p><strong>Note de codage :</strong> Les codes ICD-10-CM des troubles psychotiques induits par [une substance ou un médicament spécifique] figurent dans le tableau ci-dessous. Le code ICD-10-CM dépend de la présence ou non d’un trouble comorbide de l’usage d’une substance appartenant à la même classe. Dans tous les cas, aucun diagnostic supplémentaire distinct de trouble de l’usage d’une substance n’est porté. Si un trouble léger de l’usage d’une substance est comorbide avec le trouble psychotique induit par cette substance, le quatrième caractère du code est « 1 », et le clinicien doit inscrire « trouble léger de l’usage de [substance] » avant le trouble psychotique induit par la substance (par exemple, « trouble léger de l’usage de cocaïne avec trouble psychotique induit par la cocaïne »). Si un trouble moyen ou grave de l’usage d’une substance est comorbide avec le trouble psychotique induit par cette substance, le quatrième caractère du code est « 2 », et le clinicien doit inscrire « trouble moyen de l’usage de [substance] » ou « trouble grave de l’usage de [substance] », selon la sévérité du trouble comorbide de l’usage de la substance. En l’absence de trouble comorbide de l’usage d’une substance (par exemple, après un usage massif unique de la substance), le quatrième caractère du code est « 9 », et le clinicien doit inscrire uniquement le trouble psychotique induit par la substance.</p><table><caption>Codes ICD-10-CM</caption><thead><tr><th>Substance</th><th>Avec trouble léger de l’usage</th><th>Avec trouble moyen ou grave de l’usage</th><th>Sans trouble de l’usage</th></tr></thead><tbody><tr><th>Alcool</th><td>F10.159</td><td>F10.259</td><td>F10.959</td></tr><tr><th>Cannabis</th><td>F12.159</td><td>F12.259</td><td>F12.959</td></tr><tr><th>Phencyclidine</th><td>F16.159</td><td>F16.259</td><td>F16.959</td></tr><tr><th>Autre hallucinogène</th><td>F16.159</td><td>F16.259</td><td>F16.959</td></tr><tr><th>Substance inhalée</th><td>F18.159</td><td>F18.259</td><td>F18.959</td></tr><tr><th>Sédatif, hypnotique ou anxiolytique</th><td>F13.159</td><td>F13.259</td><td>F13.959</td></tr><tr><th>Substance de type amphétaminique (ou autre stimulant)</th><td>F15.159</td><td>F15.259</td><td>F15.959</td></tr><tr><th>Cocaïne</th><td>F14.159</td><td>F14.259</td><td>F14.959</td></tr><tr><th>Autre substance (ou substance inconnue)</th><td>F19.159</td><td>F19.259</td><td>F19.959</td></tr></tbody></table>"},{"title":"Spécifications","kind":"specifiers","pdf":[341,342],"html":"<h4>Spécifier</h4><p>Voir le tableau 1 du chapitre « Troubles liés à une substance et troubles addictifs », qui indique si les spécifications « avec début pendant l’intoxication » et/ou « avec début pendant le sevrage » s’appliquent à une classe donnée de substances ; ou spécifier « avec début après l’usage d’un médicament » :</p><p><strong>Avec début pendant l’intoxication :</strong> Si les critères d’intoxication par la substance sont remplis et si les symptômes se développent pendant l’intoxication.</p><p><strong>Avec début pendant le sevrage :</strong> Si les critères de sevrage de la substance sont remplis et si les symptômes se développent pendant le sevrage ou peu après celui-ci.</p><p><strong>Avec début après l’usage d’un médicament :</strong> Si les symptômes se sont développés à l’instauration du médicament, lors d’une modification de son usage ou pendant son sevrage.</p><h4>Spécifier la sévérité actuelle</h4><p>La sévérité est cotée par une évaluation quantitative des principaux symptômes de psychose, notamment les idées délirantes, les hallucinations, les comportements psychomoteurs anormaux et les symptômes négatifs. Chacun de ces symptômes peut être coté pour sa sévérité actuelle (la plus importante au cours des 7 derniers jours) sur une échelle en 5 points allant de 0 (absent) à 4 (présent et sévère). Voir les « Dimensions de la sévérité des symptômes psychotiques évaluées par le clinicien » dans le chapitre « Mesures d’évaluation ».</p><p><strong>Note :</strong> Le diagnostic de trouble psychotique induit par une substance ou un médicament peut être porté sans utiliser cette spécification de sévérité.</p>"},{"title":"Procédures d’enregistrement","kind":"recording","pdf":[342,343],"html":"<p>Le nom du trouble psychotique induit par une substance ou un médicament commence par la substance spécifique (par exemple, cocaïne, dexaméthasone) supposée être à l’origine des idées délirantes ou des hallucinations. Le code diagnostique est choisi dans le tableau inclus dans les critères diagnostiques, en fonction de la classe du produit et de la présence ou de l’absence d’un trouble comorbide de l’usage d’une substance. Pour les substances qui n’appartiennent à aucune des classes (par exemple, dexaméthasone), le code « autre substance (ou substance inconnue) » doit être utilisé ; ce même code doit également être utilisé lorsqu’une substance est considérée comme un facteur étiologique mais que sa classe spécifique est inconnue.</p><p>Lors de l’enregistrement du nom du trouble, le trouble comorbide de l’usage d’une substance (s’il existe) est mentionné en premier, suivi du mot « avec », puis du nom du trouble psychotique induit par la substance, puis de la spécification du début (c’est-à-dire début pendant l’intoxication, début pendant le sevrage). Par exemple, dans le cas d’idées délirantes survenant pendant une intoxication chez un homme présentant un trouble grave de l’usage de cocaïne, le diagnostic est F14.259 trouble grave de l’usage de cocaïne avec trouble psychotique induit par la cocaïne, avec début pendant l’intoxication. Aucun diagnostic distinct de trouble grave comorbide de l’usage de cocaïne n’est porté. Si le trouble psychotique induit par une substance survient sans trouble comorbide de l’usage d’une substance (par exemple, après un usage massif unique de la substance), aucun trouble de l’usage d’une substance associé n’est mentionné (par exemple, F16.959 trouble psychotique induit par la phencyclidine, avec début pendant l’intoxication). Lorsqu’on estime que plusieurs substances jouent un rôle significatif dans le développement des symptômes psychotiques, chacune doit être inscrite séparément (par exemple, F12.259 trouble grave de l’usage de cannabis avec trouble psychotique induit par le cannabis, avec début pendant l’intoxication ; F16.159 trouble léger de l’usage de phencyclidine avec trouble psychotique induit par la phencyclidine, avec début pendant l’intoxication).</p>"},{"title":"Caractéristiques diagnostiques","kind":"clinical","pdf":[343,344],"html":"<p>Les caractéristiques essentielles du trouble psychotique induit par une substance ou un médicament sont des idées délirantes et/ou des hallucinations au premier plan (critère A), considérées comme dues aux effets physiologiques d’une substance ou d’un médicament (c’est-à-dire une drogue, un médicament ou une exposition à un toxique) (critère B). Les hallucinations dont la personne reconnaît qu’elles sont induites par une substance ou un médicament ne sont pas incluses ici ; elles relèvent plutôt d’un diagnostic d’intoxication par une substance ou de sevrage d’une substance, accompagné de la spécification « avec perturbations des perceptions » (applicable au sevrage d’alcool ; à l’intoxication par le cannabis ; au sevrage de sédatifs, d’hypnotiques ou d’anxiolytiques ; et à l’intoxication par des stimulants).</p><p>Le trouble psychotique induit par une substance ou un médicament se distingue d’un trouble psychotique indépendant par la prise en compte du début, de l’évolution et d’autres facteurs. Pour les drogues, l’anamnèse, l’examen physique ou les examens de laboratoire doivent apporter des éléments attestant un usage, une intoxication ou un sevrage. Les troubles psychotiques induits par une substance ou un médicament apparaissent pendant ou peu après l’exposition à un médicament ou son sevrage, ou après une intoxication par une substance ou son sevrage, mais ils peuvent persister pendant des semaines, tandis que les troubles psychotiques indépendants peuvent précéder le début de l’usage de la substance ou du médicament, ou survenir pendant des périodes d’abstinence prolongée. Une fois apparus, les symptômes psychotiques peuvent se poursuivre aussi longtemps que l’usage de la substance ou du médicament continue. La présence de caractéristiques atypiques d’un trouble psychotique indépendant constitue un autre élément à prendre en compte (par exemple, âge de début ou évolution atypiques). Ainsi, l’apparition de novo d’idées délirantes chez une personne de sexe masculin de plus de 35 ans, sans antécédent connu de trouble psychotique indépendant, doit faire envisager la possibilité d’un trouble psychotique induit par une substance ou un médicament. Même des antécédents de trouble psychotique indépendant n’excluent pas la possibilité d’un trouble psychotique induit par une substance ou un médicament. À l’inverse, les facteurs suggérant que les symptômes psychotiques s’expliquent mieux par un trouble psychotique indépendant comprennent la persistance de symptômes psychotiques pendant une période substantielle (c’est-à-dire un mois ou plus) après la fin de l’intoxication par une substance ou du sevrage aigu de celle-ci, ou après l’arrêt de l’usage du médicament ; ou des antécédents de troubles psychotiques indépendants récurrents. D’autres causes de symptômes psychotiques doivent être envisagées, même chez une personne en état d’intoxication ou de sevrage d’une substance, car les problèmes d’usage de substances ne sont pas rares chez les personnes présentant des troubles psychotiques non induits par une substance ou un médicament.</p><p>Outre les deux domaines symptomatiques définis dans les critères diagnostiques (c’est-à-dire les idées délirantes et les hallucinations), l’évaluation des domaines symptomatiques de la cognition, de la dépression et de la manie est essentielle pour établir des distinctions déterminantes entre les différents troubles du spectre de la schizophrénie et autres troubles psychotiques.</p>"},{"title":"Caractéristiques associées","kind":"associated","pdf":[344,345],"html":"<p>Des troubles psychotiques peuvent survenir en association avec une intoxication par les classes de substances suivantes : alcool ; cannabis ; hallucinogènes, y compris phencyclidine et substances apparentées ; substances inhalées ; sédatifs, hypnotiques et anxiolytiques ; stimulants (y compris cocaïne) ; et autres substances (ou substances inconnues). Des troubles psychotiques peuvent survenir en association avec le sevrage des classes de substances suivantes : alcool ; sédatifs, hypnotiques et anxiolytiques ; et autres substances (ou substances inconnues).</p><p>Parmi les médicaments dont il a été rapporté qu’ils pouvaient provoquer des symptômes psychotiques figurent les anesthésiques et les analgésiques, les agents anticholinergiques, les anticonvulsivants, les antihistaminiques, les antihypertenseurs et les médicaments cardiovasculaires, les médicaments antimicrobiens, les médicaments antiparkinsoniens, les agents chimiothérapeutiques (par exemple, ciclosporine, procarbazine), les corticostéroïdes, les médicaments gastro-intestinaux, les myorelaxants, les anti-inflammatoires non stéroïdiens, d’autres médicaments en vente libre (par exemple, phényléphrine, pseudoéphédrine), les antidépresseurs et le disulfirame. Les toxiques dont il a été rapporté qu’ils pouvaient induire des symptômes psychotiques comprennent les anticholinestérasiques, les insecticides organophosphorés, le sarin et d’autres gaz neurotoxiques, le monoxyde de carbone, le dioxyde de carbone et des substances volatiles telles que les carburants ou les peintures.</p>"},{"title":"Prévalence","kind":"prevalence","pdf":[345,345],"html":"<p>La prévalence du trouble psychotique induit par une substance ou un médicament dans la population générale est inconnue. Selon les études, entre 7 % et 25 % des personnes présentant un premier épisode psychotique dans différents contextes ont un trouble psychotique induit par une substance ou un médicament.</p>"},{"title":"Développement et évolution","kind":"course","pdf":[345,346],"html":"<p>Le début des symptômes psychotiques peut varier considérablement selon la substance. Par exemple, fumer une forte dose de cocaïne peut provoquer une psychose en quelques minutes, tandis que des jours ou des semaines d’usage de fortes doses d’alcool ou de sédatifs peuvent être nécessaires pour provoquer une psychose. Le trouble psychotique induit par l’alcool, avec hallucinations, ne survient généralement qu’après une ingestion prolongée et importante d’alcool chez des personnes ayant un trouble moyen à grave de l’usage d’alcool, et les hallucinations sont généralement auditives.</p><p>Les troubles psychotiques induits par les substances de type amphétaminique et par la cocaïne partagent des caractéristiques cliniques similaires. Des idées délirantes de persécution peuvent se développer rapidement, peu après l’usage d’amphétamine ou d’un sympathomimétique ayant une action similaire. L’hallucination d’insectes ou de vermine rampant dans ou sous la peau (formication) peut entraîner un grattage et d’importantes excoriations cutanées. Le trouble psychotique induit par le cannabis peut se développer peu après l’usage d’une forte dose de cannabis et comporte habituellement des idées délirantes de persécution, une anxiété marquée, une labilité émotionnelle et une dépersonnalisation. Le trouble régresse habituellement en une journée, mais peut persister plus longtemps dans certains cas.</p><p>Le trouble psychotique induit par une substance ou un médicament peut parfois persister après l’arrêt de l’agent en cause, de sorte qu’il peut être initialement difficile de le distinguer d’un trouble psychotique indépendant. Il a été rapporté que des agents tels que les substances de type amphétaminique, la phencyclidine et la cocaïne provoquaient des états psychotiques temporaires qui peuvent parfois persister pendant des semaines ou davantage malgré l’arrêt de l’agent et un traitement neuroleptique. Plus tard dans la vie, la polymédication pour des affections médicales et l’exposition à des médicaments destinés au parkinsonisme, aux maladies cardiovasculaires et à d’autres affections médicales peuvent être associées à une probabilité plus élevée de psychose induite par des médicaments prescrits, plutôt que par des drogues.</p><p>Selon les données d’une étude de registre danoise ayant suivi longitudinalement des cas de psychose induite par une substance sur 20 ans, environ un tiers (32 %) des personnes présentant une psychose induite par une substance reçoivent ultérieurement un diagnostic de trouble du spectre de la schizophrénie (26 %) ou de trouble bipolaire (8 %), le taux le plus élevé (44 %) concernant le trouble psychotique induit par le cannabis.</p>"},{"title":"Marqueurs diagnostiques","kind":"clinical","pdf":[346,346],"html":"<p>Pour les substances dont les concentrations sanguines pertinentes peuvent être mesurées (par exemple, alcoolémie, autres concentrations sanguines quantifiables telles que la digoxinémie), la présence d’une concentration compatible avec une toxicité peut renforcer la certitude diagnostique.</p>"},{"title":"Retentissement fonctionnel du trouble psychotique induit par une substance ou un médicament","kind":"functional","pdf":[346,346],"html":"<p>Le trouble psychotique induit par une substance ou un médicament est habituellement très invalidant et, par conséquent, il est observé le plus souvent dans les services d’urgence, les personnes étant fréquemment amenées dans un contexte de soins aigus lorsqu’il survient. Toutefois, l’incapacité est généralement limitée dans le temps et disparaît après l’arrêt de l’agent en cause.</p>"},{"title":"Diagnostic différentiel","kind":"differential","pdf":[346,348],"html":"<h4>Intoxication par une substance ou sevrage d’une substance</h4><p>Les personnes intoxiquées par des stimulants, du cannabis, l’opioïde mépéridine ou de la phencyclidine, ou celles en sevrage d’alcool ou de sédatifs, peuvent éprouver des perceptions altérées qu’elles reconnaissent comme des effets du produit. Si l’épreuve de réalité concernant ces expériences reste intacte (c’est-à-dire si la personne reconnaît que la perception est induite par la substance, n’y croit pas et n’agit pas en fonction d’elle), le diagnostic n’est pas celui de trouble psychotique induit par une substance ou un médicament. On diagnostique plutôt une intoxication par une substance ou un sevrage d’une substance, avec perturbations des perceptions (par exemple, intoxication par la cocaïne, avec perturbations des perceptions). Les hallucinations de type « flashback », qui peuvent survenir longtemps après l’arrêt de l’usage d’hallucinogènes, relèvent du diagnostic de trouble persistant des perceptions dû aux hallucinogènes. Si les symptômes psychotiques induits par une substance ou un médicament surviennent exclusivement au cours d’un état confusionnel (delirium), comme dans les formes sévères de sevrage d’alcool, ils sont considérés comme une caractéristique associée de l’état confusionnel et ne font pas l’objet d’un diagnostic distinct. Des idées délirantes dans le contexte d’un trouble neurocognitif majeur ou léger seraient diagnostiquées comme un trouble neurocognitif majeur ou léger, avec perturbation du comportement.</p><h4>Trouble psychotique indépendant</h4><p>Le trouble psychotique induit par une substance ou un médicament se distingue d’un trouble psychotique indépendant, tel que la schizophrénie, le trouble schizoaffectif, le trouble délirant, le trouble psychotique bref, un autre trouble du spectre de la schizophrénie ou autre trouble psychotique spécifié, ou un trouble du spectre de la schizophrénie ou autre trouble psychotique non spécifié, par le fait qu’une substance est considérée comme liée étiologiquement aux symptômes.</p><h4>Trouble psychotique dû à une autre affection médicale</h4><p>Un trouble psychotique induit par une substance ou un médicament, dû à un traitement prescrit pour un trouble mental ou une affection médicale, doit débuter pendant que la personne reçoit le médicament (ou pendant son sevrage, s’il existe un syndrome de sevrage associé à ce médicament). Les personnes ayant une affection médicale prenant souvent des médicaments pour cette affection, le clinicien doit envisager la possibilité que les symptômes psychotiques soient causés par les conséquences physiologiques de l’affection médicale elle-même plutôt que par le médicament ; dans ce cas, on diagnostique un trouble psychotique dû à une autre affection médicale. L’anamnèse constitue souvent la base principale de ce jugement. Il peut parfois être nécessaire de modifier le traitement de l’affection médicale (par exemple, substitution ou arrêt d’un médicament) pour déterminer empiriquement, chez cette personne, si le médicament est l’agent causal. Si le clinicien a établi que la perturbation est attribuable à la fois à une affection médicale et à l’usage d’une substance ou d’un médicament, les deux diagnostics (c’est-à-dire trouble psychotique dû à une autre affection médicale et trouble psychotique induit par une substance ou un médicament) peuvent être portés.</p><h4>Autre trouble du spectre de la schizophrénie ou autre trouble psychotique spécifié ou non spécifié</h4><p>Les symptômes psychotiques inclus dans le diagnostic de trouble psychotique induit par une substance ou un médicament se limitent aux idées délirantes ou aux hallucinations. Les personnes ayant d’autres symptômes psychotiques induits par une substance (par exemple, comportement désorganisé ou catatonique ; discours désorganisé ; incohérence ou contenu irrationnel) doivent être classées dans la catégorie autre trouble du spectre de la schizophrénie ou autre trouble psychotique spécifié ou non spécifié.</p>"}]},{"id":"psychotique-affection-medicale","title":"Trouble psychotique dû à une autre affection médicale","english":"Psychotic Disorder Due to Another Medical Condition","codes":["F06.2","F06.0"],"criteriaPdf":[348,349],"pdf":[348,355],"aliases":["psychose organique","psychose secondaire","psychose due à une affection médicale"],"pages":"131–134","chapter":"psychoses","related":["psychotique-induit","schizophrenie","catatonie-medicale"],"family":"psychoses-secondaires","sections":[{"title":"Critères diagnostiques","kind":"criteria","pdf":[348,348],"html":"<p><strong>A.</strong> Hallucinations ou idées délirantes au premier plan.</p><p><strong>B.</strong> Des éléments de l’anamnèse, de l’examen physique ou des examens de laboratoire indiquent que la perturbation est la conséquence physiopathologique directe d’une autre affection médicale.</p><p><strong>C.</strong> La perturbation n’est pas mieux expliquée par un autre trouble mental.</p><p><strong>D.</strong> La perturbation ne survient pas exclusivement au cours d’un état confusionnel (delirium).</p><p><strong>E.</strong> La perturbation entraîne une détresse cliniquement significative ou une altération du fonctionnement social, professionnel ou dans d’autres domaines importants.</p>"},{"title":"Spécifications et note de codage","kind":"specifiers","pdf":[348,349],"html":"<h4>Spécifier si</h4><p>Coder selon le symptôme prédominant :</p><p><strong>F06.2 — Avec idées délirantes :</strong> Si les idées délirantes constituent le symptôme prédominant.</p><p><strong>F06.0 — Avec hallucinations :</strong> Si les hallucinations constituent le symptôme prédominant.</p><p><strong>Note de codage :</strong> Inclure le nom de l’autre affection médicale dans le nom du trouble mental (par exemple, F06.2 trouble psychotique dû à une tumeur maligne pulmonaire, avec idées délirantes). L’autre affection médicale doit être codée et mentionnée séparément, immédiatement avant le trouble psychotique dû à l’affection médicale (par exemple, C34.90 tumeur maligne pulmonaire ; F06.2 trouble psychotique dû à une tumeur maligne pulmonaire, avec idées délirantes).</p><h4>Spécifier la sévérité actuelle</h4><p>La sévérité est cotée par une évaluation quantitative des principaux symptômes de psychose, notamment les idées délirantes, les hallucinations, les comportements psychomoteurs anormaux et les symptômes négatifs. Chacun de ces symptômes peut être coté pour sa sévérité actuelle (la plus importante au cours des 7 derniers jours) sur une échelle en 5 points allant de 0 (absent) à 4 (présent et sévère). Voir les « Dimensions de la sévérité des symptômes psychotiques évaluées par le clinicien » dans le chapitre « Mesures d’évaluation ».</p><p><strong>Note :</strong> Le diagnostic de trouble psychotique dû à une autre affection médicale peut être porté sans utiliser cette spécification de sévérité.</p>"},{"title":"Spécifications","kind":"specifiers","pdf":[349,349],"html":"<p>Outre les domaines symptomatiques définis dans les critères diagnostiques, l’évaluation des domaines symptomatiques de la cognition, de la dépression et de la manie est essentielle pour établir des distinctions déterminantes entre les différents troubles du spectre de la schizophrénie et autres troubles psychotiques.</p>"},{"title":"Caractéristiques diagnostiques","kind":"clinical","pdf":[349,351],"html":"<p>Les caractéristiques essentielles du trouble psychotique dû à une autre affection médicale sont des idées délirantes ou des hallucinations au premier plan, considérées comme attribuables aux effets physiologiques d’une autre affection médicale et qui ne sont pas mieux expliquées par un autre trouble mental (par exemple, les symptômes ne constituent pas une réponse psychologique à une affection médicale sévère, auquel cas un diagnostic de trouble psychotique bref, avec facteur de stress marqué, serait approprié).</p><p>Les hallucinations peuvent survenir dans n’importe quelle modalité sensorielle (c’est-à-dire visuelle, olfactive, gustative, tactile ou auditive), mais certains facteurs étiologiques sont susceptibles de provoquer des phénomènes hallucinatoires spécifiques. Par exemple, des hallucinations olfactives évoquent une épilepsie temporale. Les hallucinations peuvent aller de phénomènes simples et non structurés à des phénomènes très complexes et organisés, selon les facteurs étiologiques et environnementaux. Le trouble psychotique dû à une autre affection médicale n’est généralement pas diagnostiqué si la personne conserve son épreuve de réalité à l’égard des hallucinations et reconnaît qu’elles résultent de l’affection médicale. Les idées délirantes peuvent avoir des thèmes variés, notamment somatiques, mégalomaniaques, religieux et, le plus souvent, persécutoires. Dans l’ensemble, toutefois, les associations entre idées délirantes et affections médicales particulières semblent moins spécifiques que dans le cas des hallucinations.</p><p>Bien qu’il n’existe pas de recommandations infaillibles pour déterminer si la perturbation psychotique est attribuable sur le plan étiologique à une autre affection médicale, trois éléments peuvent orienter la démarche : la plausibilité biologique, la temporalité et le caractère typique. Premièrement, il faut identifier la présence d’une affection médicale susceptible de provoquer des symptômes psychotiques par un mécanisme physiologique présumé (par exemple, infection généralisée sévère ; porphyrie ; lupus ; épilepsie temporale) (plausibilité biologique). Le deuxième élément consiste à déterminer s’il existe une association temporelle entre le début, l’exacerbation ou la rémission de l’affection médicale et ceux de la perturbation psychotique (temporalité). Le troisième élément en faveur d’une étiologie médicale des symptômes psychotiques est la présence de caractéristiques qui seraient atypiques d’un trouble psychotique indépendant (par exemple, âge de début atypique, présence d’hallucinations visuelles ou olfactives) (caractère typique). Enfin, les causes de symptômes psychotiques autres que les effets physiologiques d’une affection médicale doivent être envisagées et exclues (par exemple, trouble psychotique induit par une substance ou un médicament, symptômes psychotiques survenant comme effets indésirables du traitement de l’affection médicale).</p><p>L’association temporelle avec le début ou l’exacerbation de l’affection médicale offre la plus grande certitude diagnostique quant à l’attribution des idées délirantes ou des hallucinations à une affection médicale. Des facteurs supplémentaires peuvent comprendre des traitements concomitants de l’affection médicale sous-jacente qui confèrent indépendamment un risque de psychose, comme une corticothérapie pour des affections auto-immunes.</p><p>Le diagnostic de trouble psychotique dû à une autre affection médicale dépend de l’état clinique de chaque personne, et les examens diagnostiques varient selon cet état. Une grande variété d’affections médicales peut provoquer des symptômes psychotiques. Il s’agit notamment d’affections neurologiques (par exemple, tumeurs, maladies cérébrovasculaires, maladie de Huntington, maladie de Parkinson, sclérose en plaques, épilepsie, lésion ou altération d’un nerf auditif ou visuel, surdité, migraine, infections du système nerveux central), d’affections endocriniennes (par exemple, hyperthyroïdie et hypothyroïdie, hyperparathyroïdie et hypoparathyroïdie, hypercorticisme et hypocorticisme), d’affections métaboliques (par exemple, hypoxie, hypercapnie, hypoglycémie), de carence en vitamine B12, de déséquilibres hydriques ou électrolytiques, de maladies hépatiques ou rénales, et d’affections auto-immunes avec atteinte du système nerveux central (par exemple, lupus érythémateux systémique, encéphalite auto-immune à anticorps anti-récepteur N-méthyl-D-aspartate [NMDA]). Les constatations associées à l’examen physique et aux examens de laboratoire, ainsi que les profils de prévalence ou de début, reflètent l’affection médicale étiologique.</p>"},{"title":"Prévalence","kind":"prevalence","pdf":[351,352],"html":"<p>Les taux de prévalence du trouble psychotique dû à une autre affection médicale sont difficiles à estimer étant donné la grande variété des étiologies médicales sous-jacentes. La prévalence sur la vie entière a été estimée entre 0,21 % et 0,54 % dans des études menées en Suède et en Finlande. Lorsque les résultats de prévalence sont stratifiés par groupe d’âge, les personnes de plus de 65 ans présentent une prévalence significativement plus élevée, de 0,74 %, que celles des groupes d’âge plus jeunes en Finlande. Les taux de psychose varient également selon l’affection médicale sous-jacente ; les affections le plus souvent associées à une psychose comprennent les troubles endocriniens et métaboliques non traités, les affections auto-immunes (par exemple, lupus érythémateux systémique, encéphalite auto-immune à anticorps anti-récepteur NMDA) ou l’épilepsie temporale. La psychose attribuable à l’épilepsie a été subdivisée en psychose ictale, postictale et interictale. La plus fréquente est la psychose postictale, observée chez 2 % à 7,8 % des personnes ayant une épilepsie. Chez les personnes âgées, la prévalence du trouble pourrait être plus élevée chez les femmes, bien que les autres caractéristiques liées au sexe ou au genre ne soient pas claires et varient considérablement selon la répartition par sexe et par genre des affections médicales sous-jacentes. On estime que 60 % des personnes âgées présentant une psychose d’apparition récente ont une étiologie médicale à leurs symptômes psychotiques.</p>"},{"title":"Développement et évolution","kind":"course","pdf":[352,352],"html":"<p>Le trouble psychotique dû à une autre affection médicale peut être un état transitoire unique ou être récurrent, évoluant par cycles avec les exacerbations et les rémissions de l’affection médicale sous-jacente. Bien que le traitement de cette affection aboutisse souvent à une résolution de la psychose, ce n’est pas toujours le cas, et des symptômes psychotiques peuvent persister longtemps après l’événement médical (par exemple, trouble psychotique dû à une lésion cérébrale focale). Dans le contexte d’affections chroniques telles que la sclérose en plaques ou la psychose interictale chronique de l’épilepsie, la psychose peut suivre une évolution prolongée.</p><p>L’expression du trouble psychotique dû à une autre affection médicale ne diffère pas substantiellement dans sa phénoménologie selon l’âge de survenue. Cependant, les groupes d’âge plus avancé présentent une prévalence plus élevée du trouble, très probablement en raison de l’augmentation de la charge de morbidité médicale liée à l’âge avancé et des effets cumulatifs d’expositions délétères et de processus liés à l’âge (par exemple, athérosclérose). La nature des affections médicales sous-jacentes est susceptible de varier au cours de la vie : les groupes plus jeunes sont davantage touchés par l’épilepsie, les traumatismes crâniens, les maladies auto-immunes et les affections néoplasiques de la première partie et du milieu de la vie, tandis que les groupes plus âgés sont davantage touchés par une maladie neurodégénérative (par exemple, maladie d’Alzheimer), des accidents vasculaires cérébraux, des événements anoxiques et des comorbidités touchant plusieurs systèmes.</p><p>Des facteurs sous-jacents liés à l’avancée en âge, tels qu’une altération cognitive préexistante ainsi que des déficiences visuelles et auditives, peuvent conférer un risque accru de psychose, peut-être en abaissant le seuil de survenue de celle-ci.</p>"},{"title":"Facteurs de risque et pronostiques","kind":"risk","pdf":[353,353],"html":"<h4>Facteurs modifiant l’évolution</h4><p>L’identification et le traitement de l’affection médicale sous-jacente ont le plus grand impact sur l’évolution, bien qu’une lésion préexistante du système nerveux central puisse entraîner une évolution moins favorable (par exemple, traumatisme crânien, maladie cérébrovasculaire).</p>"},{"title":"Association avec les pensées ou comportements suicidaires","kind":"suicide","pdf":[353,353],"html":"<p>Le risque suicidaire dans le contexte d’un trouble psychotique dû à une autre affection médicale n’est pas clairement défini, bien que certaines affections telles que l’épilepsie et la sclérose en plaques soient associées à une augmentation des taux de suicide, qui peut être encore accentuée en présence d’une psychose.</p>"},{"title":"Retentissement fonctionnel du trouble psychotique dû à une autre affection médicale","kind":"functional","pdf":[353,353],"html":"<p>L’incapacité fonctionnelle est généralement sévère dans le contexte d’un trouble psychotique dû à une autre affection médicale, mais elle varie considérablement selon le type d’affection et devrait s’améliorer lorsque celle-ci se résout avec succès.</p>"},{"title":"Diagnostic différentiel","kind":"differential","pdf":[353,354],"html":"<h4>État confusionnel (delirium) et trouble neurocognitif majeur ou léger</h4><p>Des hallucinations et des idées délirantes surviennent fréquemment dans le contexte d’un état confusionnel ; aucun diagnostic distinct de trouble psychotique dû à une autre affection médicale n’est porté si les idées délirantes et/ou les hallucinations surviennent exclusivement au cours de l’état confusionnel. En revanche, un diagnostic de trouble psychotique dû à une autre affection médicale peut être porté en plus d’un diagnostic de trouble neurocognitif majeur ou léger si les idées délirantes ou les hallucinations sont considérées comme une conséquence physiologique du processus pathologique à l’origine du trouble neurocognitif (par exemple, trouble psychotique dû à une maladie à corps de Lewy, avec idées délirantes).</p><h4>Trouble psychotique induit par une substance ou un médicament</h4><p>En présence d’éléments attestant un usage récent ou prolongé d’une substance (y compris des médicaments ayant des effets psychoactifs), un sevrage d’une substance ou d’un médicament pouvant provoquer des symptômes psychotiques lors du sevrage, ou une exposition à un toxique (par exemple, intoxication par le LSD [diéthylamide de l’acide lysergique], sevrage d’alcool), un trouble psychotique induit par une substance ou un médicament doit être envisagé. Des symptômes survenant pendant ou peu après (c’est-à-dire dans les 4 semaines) une intoxication par une substance ou son sevrage, ou après l’usage d’un médicament, peuvent être particulièrement évocateurs d’un trouble psychotique induit par une substance, selon la nature, la durée ou la quantité de la substance utilisée. Si le clinicien a établi que la perturbation est due à la fois à une affection médicale et à l’usage d’une substance, les deux diagnostics (c’est-à-dire trouble psychotique dû à une autre affection médicale et trouble psychotique induit par une substance ou un médicament) peuvent être portés.</p><h4>Trouble psychotique</h4><p>Le trouble psychotique dû à une autre affection médicale doit être distingué d’un trouble psychotique qui n’est pas dû à une autre affection médicale (par exemple, schizophrénie, trouble délirant, trouble schizoaffectif) ou d’un trouble dépressif majeur ou bipolaire, avec caractéristiques psychotiques. Dans les troubles psychotiques et les troubles dépressifs ou bipolaires avec caractéristiques psychotiques, aucun mécanisme physiologique causal spécifique et direct associé à une affection médicale ne peut être démontré. Un âge de début tardif et l’absence d’antécédents personnels ou familiaux de schizophrénie ou de trouble délirant suggèrent la nécessité d’une évaluation approfondie pour exclure le diagnostic de trouble psychotique dû à une autre affection médicale. Les hallucinations auditives comportant des voix prononçant des phrases complexes sont plus caractéristiques de la schizophrénie que du trouble psychotique dû à une affection médicale. Bien que certains symptômes suggèrent une étiologie médicale ou toxique (par exemple, hallucinations visuelles ou olfactives, caractère onirique des idées délirantes [la personne étant un observateur non impliqué]), il n’existe aucun signe ou symptôme pathognomonique qui oriente sans équivoque le clinicien dans un sens ou dans l’autre. Les hallucinations visuelles ne sont pas rares dans la schizophrénie ou le trouble bipolaire, et des hallucinations olfactives (par exemple, odeurs désagréables) sont également compatibles avec un diagnostic de schizophrénie. Les cliniciens ne doivent donc pas accorder un poids excessif à une hallucination particulière isolée lorsqu’ils doivent choisir entre une cause psychiatrique et une cause médicale de la psychopathologie.</p>"},{"title":"Comorbidité","kind":"comorbidity","pdf":[355,355],"html":"<p>Chez les personnes de plus de 80 ans, le trouble psychotique dû à une autre affection médicale est associé à un trouble neurocognitif majeur (démence) concomitant. La maladie d’Alzheimer s’accompagne fréquemment d’une psychose, et la psychose est une caractéristique définissant la maladie à corps de Lewy.</p>"}]},{"id":"catatonie-associee","title":"Catatonie associée à un autre trouble mental","english":"Catatonia Associated With Another Mental Disorder (Catatonia Specifier)","codes":["F06.1"],"criteriaPdf":[356,357],"pdf":[356,358],"aliases":["spécification catatonique","catatonie psychiatrique","catatonia specifier"],"pages":"135–136","chapter":"psychoses","related":["catatonie-medicale","catatonie-non-specifiee","schizophrenie","autisme"],"family":"catatonie","sections":[{"title":"Critères diagnostiques","kind":"criteria","pdf":[356,356],"html":"<p><strong>F06.1</strong></p><p><strong>A.</strong> Le tableau clinique est dominé par trois (ou plus) des symptômes suivants :</p><ol><li><strong>Stupeur</strong> (c’est-à-dire absence d’activité psychomotrice ; absence de relation active avec l’environnement).</li><li><strong>Catalepsie</strong> (c’est-à-dire induction passive d’une posture maintenue contre la gravité).</li><li><strong>Flexibilité cireuse</strong> (c’est-à-dire résistance légère et uniforme au positionnement par l’examinateur).</li><li><strong>Mutisme</strong> (c’est-à-dire absence ou quasi-absence de réponse verbale [à exclure en cas d’aphasie connue]).</li><li><strong>Négativisme</strong> (c’est-à-dire opposition ou absence de réponse aux consignes ou aux stimuli extérieurs).</li><li><strong>Prise de posture</strong> (c’est-à-dire maintien spontané et actif d’une posture contre la gravité).</li><li><strong>Maniérisme</strong> (c’est-à-dire caricature bizarre et circonstanciée d’actions normales).</li><li><strong>Stéréotypie</strong> (c’est-à-dire mouvements répétitifs, anormalement fréquents et non orientés vers un but).</li><li><strong>Agitation</strong> non influencée par les stimuli extérieurs.</li><li><strong>Grimaces.</strong></li><li><strong>Écholalie</strong> (c’est-à-dire imitation des paroles d’autrui).</li><li><strong>Échopraxie</strong> (c’est-à-dire imitation des mouvements d’autrui).</li></ol>"},{"title":"Note de codage","kind":"recording","pdf":[357,357],"html":"<p><strong>Note de codage :</strong> Indiquer le nom du trouble mental associé lors de l’enregistrement du nom de l’affection (c’est-à-dire F06.1 catatonie associée à un trouble dépressif majeur). Coder d’abord le trouble mental associé (par exemple, trouble du neurodéveloppement, trouble psychotique bref, trouble schizophréniforme, schizophrénie, trouble schizoaffectif, trouble bipolaire, trouble dépressif majeur ou autre trouble mental) (par exemple, F25.1 trouble schizoaffectif, type dépressif ; F06.1 catatonie associée à un trouble schizoaffectif).</p>"},{"title":"Caractéristiques diagnostiques","kind":"clinical","pdf":[357,357],"html":"<p>La catatonie associée à un autre trouble mental (spécification « catatonie ») peut être utilisée lorsque les critères de catatonie sont remplis au cours d’un trouble du neurodéveloppement, psychotique, bipolaire, dépressif ou d’un autre trouble mental. La spécification « catatonie » est appropriée lorsque le tableau clinique est caractérisé par une perturbation psychomotrice marquée et comporte au moins trois des 12 caractéristiques diagnostiques énumérées au critère A. La catatonie est habituellement diagnostiquée en hospitalisation et survient chez jusqu’à 35 % des personnes ayant une schizophrénie, mais la majorité des cas de catatonie concerne des personnes présentant des troubles dépressifs ou bipolaires. Une méta-analyse d’échantillons cliniques a indiqué qu’environ 9 % des patients avaient une catatonie. Avant d’utiliser la spécification « catatonie » dans les troubles du neurodéveloppement, psychotiques, bipolaires, dépressifs ou d’autres troubles mentaux, il faut exclure une grande variété d’autres affections médicales ; celles-ci comprennent, sans s’y limiter, les affections dues à des maladies infectieuses, métaboliques ou neurologiques (voir « Trouble catatonique dû à une autre affection médicale »). La catatonie peut également être un effet indésirable d’un médicament (voir le chapitre « Troubles des mouvements induits par un médicament et autres effets indésirables des médicaments »). En raison de la gravité des complications, une attention particulière doit être portée à la possibilité que la catatonie soit attribuable à un syndrome malin des neuroleptiques, G21.0.</p>"},{"title":"Questions diagnostiques liées à la culture","kind":"culture","pdf":[357,358],"html":"<p>L’association entre catatonie et troubles de l’humeur a été retrouvée dans un large éventail de contextes culturels.</p>"}]},{"id":"catatonie-medicale","title":"Trouble catatonique dû à une autre affection médicale","english":"Catatonic Disorder Due to Another Medical Condition","codes":["F06.1"],"criteriaPdf":[358,359],"pdf":[358,360],"aliases":["catatonie organique","catatonie secondaire"],"pages":"136–137","chapter":"psychoses","related":["catatonie-associee","catatonie-non-specifiee","psychotique-affection-medicale"],"family":"catatonie","sections":[{"title":"Critères diagnostiques","kind":"criteria","pdf":[358,359],"html":"<p><strong>F06.1</strong></p><p><strong>A.</strong> Le tableau clinique est dominé par trois (ou plus) des symptômes suivants :</p><ol><li><strong>Stupeur</strong> (c’est-à-dire absence d’activité psychomotrice ; absence de relation active avec l’environnement).</li><li><strong>Catalepsie</strong> (c’est-à-dire induction passive d’une posture maintenue contre la gravité).</li><li><strong>Flexibilité cireuse</strong> (c’est-à-dire résistance légère et uniforme au positionnement par l’examinateur).</li><li><strong>Mutisme</strong> (c’est-à-dire absence ou quasi-absence de réponse verbale [note : non applicable s’il existe une aphasie établie]).</li><li><strong>Négativisme</strong> (c’est-à-dire opposition ou absence de réponse aux consignes ou aux stimuli extérieurs).</li><li><strong>Prise de posture</strong> (c’est-à-dire maintien spontané et actif d’une posture contre la gravité).</li><li><strong>Maniérisme</strong> (c’est-à-dire caricature bizarre et circonstanciée d’actions normales).</li><li><strong>Stéréotypie</strong> (c’est-à-dire mouvements répétitifs, anormalement fréquents et non orientés vers un but).</li><li><strong>Agitation</strong> non influencée par les stimuli extérieurs.</li><li><strong>Grimaces.</strong></li><li><strong>Écholalie</strong> (c’est-à-dire imitation des paroles d’autrui).</li><li><strong>Échopraxie</strong> (c’est-à-dire imitation des mouvements d’autrui).</li></ol><p><strong>B.</strong> Des éléments de l’anamnèse, de l’examen physique ou des examens de laboratoire indiquent que la perturbation est la conséquence physiopathologique directe d’une autre affection médicale.</p><p><strong>C.</strong> La perturbation n’est pas mieux expliquée par un autre trouble mental (par exemple, un épisode maniaque).</p><p><strong>D.</strong> La perturbation ne survient pas exclusivement au cours d’un état confusionnel (delirium).</p><p><strong>E.</strong> La perturbation entraîne une détresse cliniquement significative ou une altération du fonctionnement social, professionnel ou dans d’autres domaines importants.</p>"},{"title":"Note de codage","kind":"recording","pdf":[359,359],"html":"<p><strong>Note de codage :</strong> Inclure le nom de l’affection médicale dans le nom du trouble mental (par exemple, F06.1 trouble catatonique dû à une encéphalopathie hépatique). L’autre affection médicale doit être codée et mentionnée séparément, immédiatement avant le trouble catatonique dû à l’affection médicale (par exemple, K72.90 encéphalopathie hépatique ; F06.1 trouble catatonique dû à une encéphalopathie hépatique).</p>"},{"title":"Caractéristiques diagnostiques","kind":"clinical","pdf":[359,359],"html":"<p>La caractéristique essentielle du trouble catatonique dû à une autre affection médicale est la présence d’une catatonie considérée comme attribuable aux effets physiologiques d’une autre affection médicale. La catatonie peut être diagnostiquée par la présence d’au moins 3 des 12 caractéristiques cliniques du critère A. Des éléments de l’anamnèse, de l’examen physique ou des examens de laboratoire doivent indiquer que la catatonie est attribuable à une autre affection médicale (critère B). Le diagnostic n’est pas porté si la catatonie est mieux expliquée par un autre trouble mental (par exemple, épisode maniaque) (critère C), ou si elle survient exclusivement au cours d’un état confusionnel (delirium) (critère D).</p>"},{"title":"Caractéristiques associées","kind":"associated","pdf":[359,360],"html":"<p>Une variété d’affections médicales peut provoquer une catatonie, en particulier des affections neurologiques (par exemple, tumeurs, traumatismes crâniens, maladies cérébrovasculaires, encéphalite) et des affections métaboliques (par exemple, hypercalcémie, encéphalopathie hépatique, homocystinurie, acidocétose diabétique). Les constatations associées à l’examen physique et aux examens de laboratoire, ainsi que les profils de prévalence et de début, reflètent ceux de l’affection médicale étiologique.</p>"},{"title":"Diagnostic différentiel","kind":"differential","pdf":[360,360],"html":"<p>Aucun diagnostic distinct de trouble catatonique dû à une autre affection médicale n’est porté si la catatonie survient exclusivement au cours d’un état confusionnel (delirium) ou d’un syndrome malin des neuroleptiques. Toutefois, même si un diagnostic distinct de catatonie ne peut être porté, les recherches suggèrent que des symptômes catatoniques surviennent dans une proportion significative des cas d’état confusionnel. Si la personne prend actuellement un traitement neuroleptique, il convient d’envisager des troubles des mouvements induits par un médicament (par exemple, une posture anormale peut être due à une dystonie aiguë induite par un neuroleptique) ou un syndrome malin des neuroleptiques (par exemple, des caractéristiques de type catatonique peuvent être présentes, avec des anomalies associées des paramètres vitaux et/ou des examens de laboratoire). Des symptômes catatoniques peuvent être présents dans chacun des cinq troubles psychotiques suivants : trouble psychotique bref, trouble schizophréniforme, schizophrénie, trouble schizoaffectif et trouble psychotique induit par une substance ou un médicament. La catatonie peut également être présente dans certains troubles du neurodéveloppement, dans tous les troubles bipolaires et dépressifs, et dans d’autres troubles mentaux.</p>"}]},{"id":"catatonie-non-specifiee","title":"Catatonie non spécifiée","english":"Unspecified Catatonia","codes":["R29.818","F06.1"],"criteriaPdf":[360,361],"pdf":[360,361],"aliases":["catatonie sans précision"],"pages":"137","chapter":"psychoses","related":["catatonie-associee","catatonie-medicale"],"family":"catatonie","codeLabel":"R29.818 puis F06.1","sections":[{"title":"Définition diagnostique","kind":"criteria","pdf":[360,360],"html":"<p>Cette catégorie s’applique aux présentations dans lesquelles des symptômes caractéristiques de la catatonie entraînent une détresse cliniquement significative ou une altération du fonctionnement social, professionnel ou dans d’autres domaines importants, mais où soit la nature du trouble mental ou de l’autre affection médicale sous-jacente n’est pas claire, soit les critères complets de catatonie ne sont pas remplis, soit les informations sont insuffisantes pour poser un diagnostic plus spécifique (par exemple, dans un service d’urgence).</p>"},{"title":"Note de codage","kind":"recording","pdf":[361,361],"html":"<p><strong>Note de codage :</strong> Coder d’abord R29.818, autres symptômes touchant les systèmes nerveux et musculosquelettique, suivi de F06.1, catatonie non spécifiée.</p>"}]},{"id":"psychotique-autre","title":"Autre trouble du spectre de la schizophrénie ou autre trouble psychotique spécifié","english":"Other Specified Schizophrenia Spectrum and Other Psychotic Disorder","codes":["F28"],"criteriaPdf":[361,362],"pdf":[361,362],"aliases":["syndrome de psychose atténuée","hallucinations auditives persistantes","délire partagé","folie à deux","psychose autre spécifiée"],"pages":"138","chapter":"psychoses","related":["psychotique-non-specifie","delirant","schizotypique"],"family":"psychoses-autres","sections":[{"title":"Définition diagnostique et présentations spécifiées","kind":"criteria","pdf":[361,362],"html":"<p><strong>F28</strong></p><p>Cette catégorie s’applique aux présentations dans lesquelles prédominent des symptômes caractéristiques d’un trouble du spectre de la schizophrénie ou d’un autre trouble psychotique, entraînant une détresse cliniquement significative ou une altération du fonctionnement social, professionnel ou dans d’autres domaines importants, mais qui ne remplissent les critères complets d’aucun des troubles de la classe diagnostique du spectre de la schizophrénie et des autres troubles psychotiques. La catégorie autre trouble du spectre de la schizophrénie ou autre trouble psychotique spécifié est utilisée dans les situations où le clinicien choisit de communiquer la raison précise pour laquelle la présentation ne remplit les critères d’aucun trouble spécifique du spectre de la schizophrénie ou autre trouble psychotique. Pour ce faire, il inscrit « autre trouble du spectre de la schizophrénie ou autre trouble psychotique spécifié », suivi de la raison précise (par exemple, « hallucinations auditives persistantes »).</p><p>Voici des exemples de présentations pouvant être précisées à l’aide de la désignation « autre spécifié » :</p><ol><li><strong>Hallucinations auditives persistantes</strong> survenant en l’absence de toute autre caractéristique.</li><li><strong>Idées délirantes avec épisodes thymiques se chevauchant de façon significative :</strong> Il s’agit d’idées délirantes persistantes avec des périodes de chevauchement d’épisodes thymiques, présentes pendant une proportion substantielle de la perturbation délirante (de telle sorte que le critère du trouble délirant stipulant une perturbation thymique seulement brève n’est pas rempli).</li><li><strong>Syndrome de psychose atténuée :</strong> Ce syndrome est caractérisé par des symptômes de type psychotique situés en dessous du seuil d’une psychose complète (par exemple, les symptômes sont moins sévères et plus transitoires, et l’insight est relativement préservé).</li><li><strong>Symptômes délirants dans le contexte d’une relation avec une personne présentant des idées délirantes au premier plan :</strong> Dans le contexte d’une relation, le matériel délirant de la personne ayant un trouble psychotique fournit le contenu des mêmes idées délirantes entretenues par l’autre personne, laquelle peut par ailleurs ne pas présenter de symptômes remplissant les critères d’un trouble psychotique.</li></ol>"}]},{"id":"psychotique-non-specifie","title":"Trouble du spectre de la schizophrénie ou autre trouble psychotique non spécifié","english":"Unspecified Schizophrenia Spectrum and Other Psychotic Disorder","codes":["F29"],"criteriaPdf":[362,362],"pdf":[362,362],"aliases":["psychose non spécifiée","psychose sans précision"],"pages":"138","chapter":"psychoses","related":["psychotique-autre","psychotique-bref","psychotique-induit"],"family":"psychoses-autres","sections":[{"title":"Définition diagnostique","kind":"criteria","pdf":[362,362],"html":"<p><strong>F29</strong></p><p>Cette catégorie s’applique aux présentations dans lesquelles prédominent des symptômes caractéristiques d’un trouble du spectre de la schizophrénie ou d’un autre trouble psychotique, entraînant une détresse cliniquement significative ou une altération du fonctionnement social, professionnel ou dans d’autres domaines importants, mais qui ne remplissent les critères complets d’aucun des troubles de la classe diagnostique du spectre de la schizophrénie et des autres troubles psychotiques. La catégorie trouble du spectre de la schizophrénie ou autre trouble psychotique non spécifié est utilisée dans les situations où le clinicien choisit de ne pas préciser la raison pour laquelle les critères d’un trouble spécifique du spectre de la schizophrénie ou autre trouble psychotique ne sont pas remplis, et comprend les présentations pour lesquelles les informations sont insuffisantes pour poser un diagnostic plus spécifique (par exemple, dans un service d’urgence).</p>"}]}],"contentFiles":["intellectuel-communication","autisme-tdah","apprentissages-moteurs","psychoses-introduction","psychoses-delirants-brefs","psychoses-schizophrenie-schizoaffectif","psychoses-induites-catatonie"],"quickSearch":["TDAH","TSA","Schizophrénie","Catatonie"],"chapterIntros":{"neurodev":{"title":"Troubles du neurodéveloppement","sections":[{"title":"Troubles du neurodéveloppement","kind":"clinical","pdf":[174,178],"html":"<p>Les troubles du neurodéveloppement constituent un groupe d’affections dont le début se situe pendant la période développementale. Ils se manifestent généralement tôt dans le développement, souvent avant l’entrée à l’école, et se caractérisent par des déficits développementaux ou des différences dans les processus cérébraux qui entraînent une altération du fonctionnement personnel, social, scolaire ou professionnel. L’étendue de ces déficits ou différences va de limitations très spécifiques des apprentissages ou du contrôle des fonctions exécutives à des altérations globales des compétences sociales ou des capacités intellectuelles. Alors qu’on les pensait autrefois définis de façon catégorielle, les approches dimensionnelles plus récentes de la mesure des symptômes montrent un continuum de sévérité, souvent sans frontière très nette avec le développement typique. Le diagnostic d’un trouble nécessite donc à la fois des symptômes et une altération du fonctionnement.</p>\n<p>Les troubles du neurodéveloppement sont fréquemment associés entre eux ; par exemple, les personnes présentant un trouble du spectre de l’autisme ont souvent un trouble du développement intellectuel (handicap intellectuel), et de nombreux enfants présentant un déficit de l’attention/hyperactivité (TDAH) ont également un trouble spécifique des apprentissages. Les troubles du neurodéveloppement sont
