personnes présentant un trouble explosif intermittent montrent une agressivité grave envers autrui, qui n'est pas caractéristique du TDAH, et n'éprouvent pas les difficultés à soutenir l'attention observées dans le TDAH. En outre, le trouble explosif intermittent est rare pendant l'enfance. Il peut être diagnostiqué en présence d'un TDAH.</p>\n<h4>Autres troubles du neurodéveloppement</h4><p>L'activité motrice accrue qui peut survenir dans le TDAH doit être distinguée du comportement moteur répétitif caractérisant le trouble des mouvements stéréotypés et certains cas de trouble du spectre de l'autisme. Dans le trouble des mouvements stéréotypés, le comportement moteur est généralement fixe et répétitif (p. ex. balancement du corps, morsures de soi-même), tandis que l'agitation motrice et intérieure du TDAH est habituellement généralisée et ne se caractérise pas par des mouvements stéréotypés répétitifs. Dans le syndrome de Tourette, des tics multiples fréquents peuvent être confondus avec l'agitation généralisée du TDAH. Une observation prolongée peut être nécessaire pour distinguer l'agitation des salves de tics multiples.</p>\n<h4>Trouble spécifique des apprentissages</h4><p>Les enfants présentant seulement un trouble spécifique des apprentissages peuvent paraître inattentifs en raison de la frustration, d'un manque d'intérêt ou de capacités limitées dans certains processus neurocognitifs, notamment la mémoire de travail et la vitesse de traitement, alors que leur inattention est fortement réduite lorsqu'ils effectuent une tâche qui ne mobilise pas le processus cognitif déficitaire.</p>\n<h4>Trouble du développement intellectuel (handicap intellectuel)</h4><p>Les symptômes de TDAH sont fréquents chez les enfants présentant un trouble du développement intellectuel placés dans des milieux scolaires inadaptés à leurs capacités intellectuelles. Dans de tels cas, les symptômes ne sont pas manifestes pendant les tâches non scolaires. Le diagnostic de TDAH en présence d'un trouble du développement intellectuel exige que l'inattention ou l'hyperactivité soit excessive pour l'âge mental.</p>\n<h4>Trouble du spectre de l'autisme</h4><p>Les personnes présentant un TDAH et celles présentant un trouble du spectre de l'autisme montrent une inattention, un dysfonctionnement social et des comportements difficiles à gérer. Le dysfonctionnement social et le rejet par les pairs observés dans le TDAH doivent être distingués du désengagement social, de l'isolement et de l'indifférence aux signaux de communication faciaux et intonatifs observés dans le trouble du spectre de l'autisme. Les enfants présentant un trouble du spectre de l'autisme peuvent faire des crises de colère du fait de leur incapacité à tolérer un changement par rapport au déroulement attendu des événements. À l'inverse, les enfants présentant un TDAH peuvent mal se comporter ou faire une crise de colère lors d'une transition importante en raison de l'impulsivité ou d'un faible contrôle de soi.</p>\n<h4>Trouble réactionnel de l'attachement</h4><p>Les enfants présentant un trouble réactionnel de l'attachement peuvent montrer une désinhibition sociale, mais pas l'ensemble du groupe de symptômes du TDAH, et présentent d'autres caractéristiques, telles que l'absence de relations durables, qui ne sont pas caractéristiques du TDAH.</p>\n<h4>Troubles anxieux</h4><p>Le TDAH partage avec les troubles anxieux des symptômes d'inattention. Les personnes présentant un TDAH sont inattentives du fait de leur engagement préférentiel dans des activités nouvelles et stimulantes ou de leur préoccupation pour des activités agréables. Cela se distingue de l'inattention attribuable aux inquiétudes et aux ruminations observées dans les troubles anxieux. Une agitation peut se rencontrer dans les troubles anxieux. Toutefois, dans le TDAH, ce symptôme n'est pas associé aux inquiétudes et aux ruminations.</p>\n<h4>Trouble de stress post-traumatique</h4><p>Chez les enfants, les difficultés de concentration associées au trouble de stress post-traumatique (TSPT) peuvent conduire à un diagnostic erroné de TDAH. Les enfants de moins de 6 ans manifestent souvent le TSPT par des symptômes non spécifiques tels que l'agitation, l'irritabilité, l'inattention et une mauvaise concentration, qui peuvent imiter un TDAH. Les parents peuvent également minimiser les symptômes de leur enfant liés au traumatisme, et les enseignants comme les autres aidants ignorent souvent l'exposition de l'enfant à des événements traumatiques. Une évaluation approfondie des expositions antérieures à des événements traumatiques peut permettre d'écarter un TSPT.</p>\n<h4>Troubles dépressifs</h4><p>Les personnes présentant un trouble dépressif peuvent avoir une incapacité à se concentrer. Toutefois, dans les troubles de l'humeur, les difficultés de concentration ne deviennent prédominantes que pendant un épisode dépressif.</p>\n<h4>Trouble bipolaire</h4><p>Les personnes présentant un trouble bipolaire peuvent avoir une activité accrue, une mauvaise concentration et une impulsivité augmentée, mais ces caractéristiques sont épisodiques, contrairement au TDAH dont les symptômes sont persistants. En outre, dans le trouble bipolaire, l'augmentation de l'impulsivité ou de l'inattention s'accompagne d'une humeur élevée, d'idées de grandeur et d'autres caractéristiques bipolaires spécifiques. Les enfants présentant un TDAH peuvent montrer des changements importants de l'humeur au cours d'une même journée ; cette labilité se distingue d'un épisode maniaque ou hypomaniaque, qui doit durer 4 jours ou plus pour constituer un indicateur clinique de trouble bipolaire, même chez l'enfant. Le trouble bipolaire est rare chez les préadolescents, même lorsque l'irritabilité sévère et la colère sont au premier plan, tandis que le TDAH est fréquent chez les enfants et adolescents présentant une colère et une irritabilité excessives.</p>\n<h4>Trouble disruptif avec dysrégulation émotionnelle</h4><p>Le trouble disruptif avec dysrégulation émotionnelle est caractérisé par une irritabilité envahissante et une intolérance à la frustration, mais l'impulsivité et l'attention désorganisée n'en sont pas des caractéristiques essentielles. Cependant, la plupart des enfants et adolescents présentant ce trouble ont aussi des symptômes remplissant les critères du TDAH, qui est diagnostiqué séparément.</p>\n<h4>Troubles de l'usage de substances</h4><p>Distinguer le TDAH des troubles de l'usage de substances peut être problématique si la première présentation des symptômes du TDAH suit le début d'un usage nocif ou fréquent. Des éléments clairs en faveur d'un TDAH antérieur au mésusage de substances, provenant d'informateurs ou de dossiers antérieurs, peuvent être essentiels au diagnostic différentiel.</p>\n<h4>Troubles de la personnalité</h4><p>Chez les adolescents et les adultes, il peut être difficile de distinguer le TDAH des personnalités borderline, narcissique ou d'autres troubles de la personnalité. Certains troubles de la personnalité tendent à partager la désorganisation, l'intrusion sociale, la dysrégulation émotionnelle et la dysrégulation cognitive. Toutefois, le TDAH n'est pas caractérisé par la peur de l'abandon, l'autoagressivité, l'ambivalence extrême ou d'autres caractéristiques des troubles de la personnalité. Une observation clinique prolongée, un entretien avec un informateur ou une histoire détaillée peuvent être nécessaires pour distinguer un comportement impulsif, socialement intrusif ou inapproprié d'un comportement narcissique, agressif ou dominateur, et établir ce diagnostic différentiel.</p>\n<h4>Troubles psychotiques</h4><p>Le TDAH n'est pas diagnostiqué si les symptômes d'inattention et d'hyperactivité surviennent exclusivement au cours d'un trouble psychotique.</p>\n<h4>Symptômes de TDAH induits par un médicament</h4><p>Les symptômes d'inattention, d'hyperactivité ou d'impulsivité attribuables à l'utilisation d'un médicament (p. ex. bronchodilatateurs, isoniazide, neuroleptiques entraînant une akathisie, traitement substitutif thyroïdien) sont diagnostiqués comme d'autres troubles spécifiés ou non spécifiés liés à une autre substance, ou à une substance inconnue.</p>\n<h4>Troubles neurocognitifs</h4><p>Bien qu'une altération de l'attention complexe puisse faire partie des domaines cognitifs atteints dans un trouble neurocognitif, elle doit représenter un déclin par rapport à un niveau antérieur de performance pour justifier un diagnostic de trouble neurocognitif majeur ou léger. De plus, le trouble neurocognitif majeur ou léger débute habituellement à l'âge adulte. À l'inverse, l'inattention du TDAH doit avoir été présente avant l'âge de 12 ans et ne représente pas un déclin par rapport au fonctionnement antérieur.</p>"},{"title":"Comorbidité","kind":"comorbidity","pdf":[246,247],"html":"<p>Bien que le TDAH soit plus fréquent chez les personnes de sexe masculin, celles de sexe féminin présentant un TDAH ont des taux plus élevés de plusieurs troubles comorbides, notamment le trouble oppositionnel avec provocation, le trouble du spectre de l'autisme et les troubles de la personnalité et de l'usage de substances. Le trouble oppositionnel avec provocation est associé au TDAH chez environ la moitié des enfants ayant une présentation combinée et chez environ un quart de ceux ayant une présentation inattentive prédominante. Le trouble des conduites est associé au TDAH chez environ un quart des enfants ou adolescents ayant une présentation combinée, selon l'âge et le contexte. La plupart des enfants et adolescents ayant un trouble disruptif avec dysrégulation émotionnelle présentent des symptômes qui remplissent également les critères du TDAH ; une proportion plus faible d'enfants présentant un TDAH a des symptômes répondant aux critères du trouble disruptif avec dysrégulation émotionnelle. Les troubles anxieux, le trouble dépressif caractérisé, le trouble obsessionnel-compulsif et le trouble explosif intermittent surviennent chez une minorité des personnes présentant un TDAH, mais plus souvent que dans la population générale. Bien que les troubles de l'usage de substances soient relativement plus fréquents chez les adultes présentant un TDAH dans la population générale, ils ne concernent qu'une minorité de ces adultes. Chez l'adulte, la personnalité antisociale et d'autres troubles de la personnalité peuvent être associés au TDAH.</p>\n<p>Le TDAH peut coexister, selon des profils symptomatiques variables, avec d'autres troubles du neurodéveloppement, notamment le trouble spécifique des apprentissages, le trouble du spectre de l'autisme, le trouble du développement intellectuel, les troubles du langage, le trouble développemental de la coordination et les troubles de tics.</p>\n<p>Les troubles du sommeil comorbides du TDAH sont associés à des altérations cognitives diurnes (p. ex. inattention). De nombreuses personnes présentant un TDAH rapportent une somnolence diurne pouvant remplir les critères d'un trouble d'hypersomnolence. Un quart à la moitié des personnes présentant un TDAH rapportent des difficultés de sommeil ; les études ont montré une association du TDAH avec l'insomnie, les troubles du rythme circadien veille-sommeil, les troubles respiratoires du sommeil et le syndrome des jambes sans repos.</p>\n<p>Des taux élevés de plusieurs affections médicales, en particulier les allergies, les maladies auto-immunes et l'épilepsie, ont été observés chez les personnes présentant un TDAH.</p>"}]},{"id":"tdah-autre","family":"attention","title":"Autre déficit de l’attention / hyperactivité spécifié","english":"Other Specified Attention-Deficit/Hyperactivity Disorder","codes":["F90.8"],"aliases":["TDAH autre spécifié","TDAH subsyndromique"],"pages":"76","pdf":[247,248],"kind":"description","related":["tdah","tdah-non-specifie"],"chapter":"neurodev","sections":[{"title":"Définition","kind":"criteria","pdf":[247,248],"html":"<p><strong>F90.8</strong></p><p>Cette catégorie s'applique aux présentations dans lesquelles prédominent des symptômes caractéristiques du déficit de l'attention/hyperactivité entraînant une détresse cliniquement significative ou une altération du fonctionnement social, professionnel ou d'autres domaines importants, mais qui ne remplissent pas l'ensemble des critères du déficit de l'attention/hyperactivité ni de l'un des troubles de la classe diagnostique des troubles du neurodéveloppement. La catégorie « autre déficit de l'attention/hyperactivité spécifié » est utilisée lorsque le clinicien choisit de communiquer la raison précise pour laquelle la présentation ne remplit pas les critères du déficit de l'attention/hyperactivité ou d'un trouble neurodéveloppemental particulier. Pour ce faire, il inscrit « autre déficit de l'attention/hyperactivité spécifié », suivi de la raison précise (p. ex. « avec un nombre insuffisant de symptômes d'inattention »).</p>"}]},{"id":"tdah-non-specifie","family":"attention","title":"Déficit de l’attention / hyperactivité non spécifié","english":"Unspecified Attention-Deficit/Hyperactivity Disorder","codes":["F90.9"],"aliases":["TDAH non précisé","TDAH non spécifié"],"pages":"76","pdf":[248,248],"kind":"description","related":["tdah","tdah-autre"],"chapter":"neurodev","sections":[{"title":"Définition","kind":"criteria","pdf":[248,248],"html":"<p><strong>F90.9</strong></p><p>Cette catégorie s'applique aux présentations dans lesquelles prédominent des symptômes caractéristiques du déficit de l'attention/hyperactivité entraînant une détresse cliniquement significative ou une altération du fonctionnement social, professionnel ou d'autres domaines importants, mais qui ne remplissent pas l'ensemble des critères du déficit de l'attention/hyperactivité ni de l'un des troubles de la classe diagnostique des troubles du neurodéveloppement. La catégorie « déficit de l'attention/hyperactivité non spécifié » est utilisée dans les situations où le clinicien choisit de ne pas préciser la raison pour laquelle les critères du déficit de l'attention/hyperactivité ou d'un trouble neurodéveloppemental particulier ne sont pas remplis ; elle comprend les présentations pour lesquelles les informations disponibles sont insuffisantes pour établir un diagnostic plus précis.</p>"}]},{"id":"apprentissages","family":"apprentissages","title":"Trouble spécifique des apprentissages","english":"Specific Learning Disorder","codes":["F81.0","F81.81","F81.2"],"aliases":["dyslexie","dysorthographie","dyscalculie","lecture","écriture","orthographe","mathématiques","dysgraphie","calcul","dyslexique","dyscalculique","difficultés scolaires"],"pages":"76–85","pdf":[248,266],"criteriaPages":"76–78","criteriaPdf":[249,252],"related":["langage","tdah","coordination"],"chapter":"neurodev","sections":[{"title":"Critères diagnostiques","kind":"criteria","pdf":[248,250],"html":"<p><strong>A.</strong> Difficultés à apprendre et à utiliser des compétences scolaires, comme l’indique la présence d’au moins un des symptômes suivants, qui persistent depuis au moins 6 mois malgré la mise en place d’interventions ciblant ces difficultés :</p><ol><li>Lecture de mots inexacte ou lente et laborieuse (par exemple, lit des mots isolés à voix haute de façon incorrecte ou lentement et avec hésitation, devine fréquemment les mots, éprouve des difficultés à déchiffrer les mots).</li><li>Difficulté à comprendre le sens de ce qui est lu (par exemple, peut lire un texte correctement mais ne pas comprendre la succession des événements, les relations, les inférences ou les significations plus profondes de ce qui est lu).</li><li>Difficultés orthographiques (par exemple, peut ajouter, omettre ou remplacer des voyelles ou des consonnes).</li><li>Difficultés d’expression écrite (par exemple, fait de multiples erreurs de grammaire ou de ponctuation dans les phrases ; organise mal les paragraphes ; l’expression écrite des idées manque de clarté).</li><li>Difficultés à maîtriser le sens des nombres, les faits numériques ou le calcul (par exemple, comprend mal les nombres, leur grandeur et leurs relations ; compte sur ses doigts pour additionner des nombres à un chiffre au lieu de se rappeler les faits arithmétiques comme le font ses pairs ; perd le fil pendant un calcul arithmétique et peut changer de procédure).</li><li>Difficultés de raisonnement mathématique (par exemple, éprouve de grandes difficultés à appliquer des concepts, des faits ou des procédures mathématiques pour résoudre des problèmes quantitatifs).</li></ol><p><strong>B.</strong> Les compétences scolaires atteintes sont nettement et de façon quantifiable inférieures à celles attendues pour l’âge chronologique de la personne et interfèrent significativement avec les performances scolaires ou professionnelles ou avec les activités de la vie quotidienne, comme le confirment des mesures standardisées des acquisitions administrées individuellement et une évaluation clinique complète. Chez les personnes de 17 ans et plus, une histoire documentée de difficultés d’apprentissage ayant un retentissement peut remplacer l’évaluation standardisée.</p><p><strong>C.</strong> Les difficultés d’apprentissage commencent pendant les années de scolarité mais peuvent ne devenir pleinement manifestes que lorsque les exigences relatives aux compétences scolaires atteintes dépassent les capacités limitées de la personne (par exemple, lors de tests chronométrés, de la lecture ou de la rédaction de rapports longs et complexes dans un délai court, ou d’une charge scolaire excessivement élevée).</p><p><strong>D.</strong> Les difficultés d’apprentissage ne sont pas mieux expliquées par un handicap intellectuel, une acuité visuelle ou auditive non corrigée, d’autres troubles mentaux ou neurologiques, une adversité psychosociale, une maîtrise insuffisante de la langue d’enseignement ou un enseignement inadéquat.</p><p><strong>Note :</strong> Les quatre critères diagnostiques doivent être remplis sur la base d’une synthèse clinique de l’histoire de la personne (développementale, médicale, familiale et scolaire), des comptes rendus scolaires et de l’évaluation psychoéducative.</p>"},{"title":"Spécifications et sévérité","kind":"specifiers","pdf":[250,252],"html":"<p><strong>Note de codage :</strong> Préciser tous les domaines scolaires et toutes les sous-compétences qui sont atteints. Lorsque plusieurs domaines sont atteints, chacun doit être codé individuellement selon les spécifications suivantes.</p><h4>Spécifier si :</h4><p><strong>F81.0 — Avec déficit de la lecture :</strong></p><ul><li>Exactitude de la lecture des mots</li><li>Vitesse ou fluidité de la lecture</li><li>Compréhension de la lecture</li></ul><p><strong>Note :</strong> La dyslexie est un autre terme utilisé pour désigner un ensemble de difficultés d’apprentissage caractérisées par des problèmes de reconnaissance exacte ou fluide des mots, un mauvais décodage et de faibles capacités orthographiques. Si le terme dyslexie est utilisé pour préciser ce profil particulier de difficultés, il est important de préciser également toute difficulté supplémentaire présente, telle que des difficultés de compréhension de la lecture ou de raisonnement mathématique.</p><p><strong>F81.81 — Avec déficit de l’expression écrite :</strong></p><ul><li>Exactitude orthographique</li><li>Exactitude de la grammaire et de la ponctuation</li><li>Clarté ou organisation de l’expression écrite</li></ul><p><strong>F81.2 — Avec déficit des mathématiques :</strong></p><ul><li>Sens des nombres</li><li>Mémorisation des faits arithmétiques</li><li>Exactitude ou fluidité du calcul</li><li>Exactitude du raisonnement mathématique</li></ul><p><strong>Note :</strong> La dyscalculie est un autre terme utilisé pour désigner un ensemble de difficultés caractérisées par des problèmes de traitement de l’information numérique, d’apprentissage des faits arithmétiques et de réalisation de calculs exacts ou fluides. Si le terme dyscalculie est utilisé pour préciser ce profil particulier de difficultés mathématiques, il est important de préciser également toute difficulté supplémentaire présente, telle que des difficultés de raisonnement mathématique ou d’exactitude du raisonnement verbal.</p><h4>Spécifier la sévérité actuelle :</h4><p><strong>Léger :</strong> Certaines difficultés d’apprentissage des compétences dans un ou deux domaines scolaires, mais d’une sévérité suffisamment faible pour que la personne puisse compenser ou fonctionner de manière satisfaisante lorsqu’elle bénéficie d’aménagements ou de services de soutien adaptés, notamment pendant les années de scolarité.</p><p><strong>Moyen :</strong> Difficultés marquées d’apprentissage des compétences dans un ou plusieurs domaines scolaires, telles que la personne a peu de chances d’en acquérir la maîtrise sans certaines périodes d’enseignement intensif et spécialisé pendant les années de scolarité. Des aménagements ou des services de soutien, au moins pendant une partie de la journée à l’école, au travail ou à domicile, peuvent être nécessaires pour accomplir les activités avec exactitude et efficacité.</p><p><strong>Grave :</strong> Difficultés sévères d’apprentissage des compétences, affectant plusieurs domaines scolaires, telles que la personne a peu de chances d’apprendre ces compétences sans un enseignement individualisé, spécialisé et intensif continu pendant la majeure partie des années de scolarité. Même avec un ensemble d’aménagements ou de services adaptés à domicile, à l’école ou au travail, la personne peut ne pas être en mesure d’accomplir efficacement toutes les activités.</p>"},{"title":"Procédures d’enregistrement","kind":"recording","pdf":[252,252],"html":"<p>Chaque domaine scolaire et chaque sous-compétence atteints du trouble spécifique des apprentissages doivent être consignés. En raison des exigences de codage de la CIM, les déficits de la lecture, de l’expression écrite et des mathématiques, avec leurs déficits correspondants de sous-compétences, doivent être codés et consignés séparément. Par exemple, des déficits de la lecture et des mathématiques, avec des déficits de vitesse ou de fluidité de lecture, de compréhension de la lecture, d’exactitude ou de fluidité du calcul et d’exactitude du raisonnement mathématique, seraient codés et consignés comme suit : F81.0 trouble spécifique des apprentissages avec déficit de la lecture, avec déficit de la vitesse ou de la fluidité de la lecture et déficit de la compréhension de la lecture ; F81.2 trouble spécifique des apprentissages avec déficit des mathématiques, avec déficit de l’exactitude ou de la fluidité du calcul et déficit de l’exactitude du raisonnement mathématique.</p>"},{"title":"Caractéristiques diagnostiques","kind":"clinical","pdf":[252,256],"html":"<p>Le trouble spécifique des apprentissages est un trouble neurodéveloppemental d’origine biologique, à l’origine d’anomalies au niveau cognitif associées aux signes comportementaux du trouble. Cette origine biologique comporte une interaction de facteurs génétiques, épigénétiques et environnementaux qui affectent la capacité du cerveau à percevoir ou à traiter les informations verbales ou non verbales de façon efficace et exacte.</p><p>Une caractéristique essentielle du trouble spécifique des apprentissages est la difficulté persistante à apprendre des compétences scolaires fondamentales (critère A), qui débute pendant les années d’enseignement formel, c’est-à-dire pendant la période développementale. Les compétences scolaires fondamentales comprennent la lecture exacte et fluide de mots isolés, la compréhension de la lecture, l’expression écrite et l’orthographe, le calcul arithmétique et le raisonnement mathématique (résolution de problèmes mathématiques). Contrairement à la parole ou à la marche, qui sont des acquisitions développementales apparaissant avec la maturation cérébrale, les compétences scolaires (par exemple, lecture, orthographe, écriture, mathématiques) doivent être enseignées et apprises explicitement. Le trouble spécifique des apprentissages perturbe le processus habituel d’apprentissage des compétences scolaires ; il n’est pas simplement la conséquence d’un manque d’occasions d’apprendre ou d’un enseignement inadéquat. Les difficultés à maîtriser ces compétences fondamentales peuvent aussi entraver les apprentissages dans d’autres matières scolaires (par exemple, histoire, sciences, sciences sociales), mais ces problèmes sont attribuables aux difficultés d’apprentissage des compétences scolaires sous-jacentes.</p><p>Les difficultés à apprendre à associer les lettres aux sons de sa langue — pour lire des mots imprimés —, souvent appelées dyslexie (trouble spécifique des apprentissages avec déficit de la lecture), constituent l’une des manifestations les plus fréquentes du trouble. Les difficultés d’apprentissage se manifestent par un ensemble de comportements ou de symptômes observables et descriptifs, énumérés dans les critères A1 à A6. Ces symptômes cliniques peuvent être observés, explorés au cours de l’entretien clinique ou établis à partir des comptes rendus scolaires, d’échelles d’évaluation ou de descriptions figurant dans des bilans scolaires ou psychologiques antérieurs. Les difficultés d’apprentissage sont persistantes et non transitoires. Chez l’enfant et l’adolescent, la persistance est définie par des progrès limités dans les apprentissages — sans élément indiquant que la personne rattrape ses camarades — pendant au moins 6 mois malgré une aide supplémentaire à domicile ou à l’école. Par exemple, des difficultés d’apprentissage de la lecture de mots isolés qui ne régressent pas complètement ou rapidement après un enseignement des compétences phonologiques ou des stratégies d’identification des mots peuvent indiquer un trouble spécifique des apprentissages. Les éléments attestant des difficultés persistantes peuvent provenir de comptes rendus scolaires cumulés, de recueils de travaux évalués de l’enfant, de mesures fondées sur le programme scolaire ou de l’entretien clinique. Chez l’adulte, une difficulté persistante désigne des difficultés durables de lecture-écriture ou de calcul qui se sont manifestées pendant l’enfance ou l’adolescence, comme l’indiquent les éléments cumulés des comptes rendus scolaires, des recueils de travaux évalués ou des bilans antérieurs.</p><p>Une deuxième caractéristique essentielle est que les performances dans les compétences scolaires atteintes sont nettement inférieures à celles attendues pour l’âge (critère B). Un indicateur clinique robuste des difficultés d’apprentissage scolaire est un faible niveau de réussite pour l’âge, ou un niveau moyen qui ne peut être maintenu qu’au prix d’efforts ou de soutiens extraordinairement élevés. Chez l’enfant, les faibles compétences scolaires interfèrent significativement avec les performances à l’école, comme l’indiquent les comptes rendus scolaires et les notes ou évaluations des enseignants. Un autre indicateur clinique, en particulier chez l’adulte, est l’évitement des activités nécessitant ces compétences. Également à l’âge adulte, de faibles compétences scolaires interfèrent avec les performances professionnelles ou les activités quotidiennes qui les nécessitent, selon les déclarations de la personne ou celles d’autrui. Toutefois, ce critère exige aussi des éléments psychométriques provenant d’un test d’acquisitions scolaires administré individuellement, psychométriquement valide, culturellement approprié et référencé à des normes ou à des critères. Les compétences scolaires se distribuent sur un continuum : il n’existe donc pas de seuil naturel permettant de distinguer les personnes avec et sans trouble spécifique des apprentissages. Ainsi, tout seuil utilisé pour définir un niveau de réussite scolaire significativement bas — par exemple, des compétences nettement inférieures aux attentes pour l’âge — est dans une large mesure arbitraire. De faibles scores à un ou plusieurs tests ou sous-tests standardisés dans un domaine scolaire — au moins 1,5 écart-type sous la moyenne de la population pour l’âge, soit un score standard de 78 ou moins, inférieur au 7e percentile — sont nécessaires pour obtenir la plus grande certitude diagnostique. Toutefois, les scores précis varient selon les tests standardisés utilisés. Sur la base du jugement clinique, un seuil moins strict peut être utilisé, par exemple 1,0 écart-type sous la moyenne pour l’âge, lorsque les difficultés d’apprentissage sont étayées par des éléments convergents issus de l’évaluation clinique, de l’histoire scolaire, des comptes rendus scolaires ou des scores aux tests. De plus, comme les tests standardisés ne sont pas disponibles dans toutes les langues, le diagnostic peut alors reposer en partie sur le jugement clinique porté sur les résultats aux mesures disponibles.</p><p>Une troisième caractéristique centrale est que les difficultés d’apprentissage sont facilement apparentes dès les premières années scolaires chez la plupart des personnes (critère C). Chez d’autres, cependant, elles peuvent ne devenir pleinement manifestes que plus tard dans la scolarité, lorsque les exigences d’apprentissage augmentent et dépassent les capacités limitées de la personne.</p><p>Une autre caractéristique diagnostique essentielle est que les difficultés sont considérées comme « spécifiques » pour quatre raisons. Premièrement, elles ne sont pas mieux expliquées par des troubles du développement intellectuel — trouble du développement intellectuel (handicap intellectuel), retard global du développement —, des troubles auditifs ou visuels, ou des troubles neurologiques ou moteurs (critère D). Le trouble spécifique des apprentissages affecte les apprentissages chez des personnes qui présentent par ailleurs des niveaux normaux de fonctionnement intellectuel, généralement estimés par un QI supérieur à environ 70, avec une marge de ± 5 points tenant compte de l’erreur de mesure. L’expression « sous-performance scolaire inattendue » est souvent citée comme caractéristique définissant le trouble, dans la mesure où les déficits spécifiques d’apprentissage ne font pas partie d’une difficulté d’apprentissage plus générale, comme dans le trouble du développement intellectuel ou le retard global du développement.</p><p>Deuxièmement, les difficultés d’apprentissage ne peuvent pas être attribuées à des facteurs externes plus généraux, tels qu’un désavantage économique ou environnemental, un absentéisme chronique ou l’absence d’un enseignement tel qu’il est habituellement dispensé dans la communauté de la personne. Troisièmement, elles ne peuvent pas être attribuées à des troubles neurologiques — par exemple un AVC pédiatrique — ou moteurs, ou à des troubles visuels ou auditifs, qui s’accompagnent souvent de difficultés d’apprentissage scolaire mais se distinguent par la présence de signes neurologiques. Enfin, les difficultés peuvent être limitées à une seule compétence ou à un seul domaine scolaire, par exemple la lecture de mots isolés ou la récupération ou le calcul de faits numériques.</p><p>Le trouble spécifique des apprentissages peut également survenir chez des personnes identifiées comme intellectuellement « surdouées ». Ces personnes peuvent maintenir un fonctionnement scolaire apparemment adéquat grâce à des stratégies de compensation, à des efforts extraordinairement importants ou à un soutien, jusqu’à ce que les exigences d’apprentissage ou les procédures d’évaluation — par exemple des épreuves chronométrées — fassent obstacle à la démonstration de leurs apprentissages ou à l’accomplissement des tâches demandées. Dans ces cas, leurs scores d’acquisition sont faibles par rapport à leur niveau de capacité ou à leurs performances dans d’autres domaines, plutôt que par rapport à la moyenne de la population.</p><p>Une évaluation complète est nécessaire. Le trouble spécifique des apprentissages ne peut être diagnostiqué qu’après le début de l’enseignement formel, mais il peut l’être à tout moment ensuite chez l’enfant, l’adolescent ou l’adulte, à condition de disposer d’éléments en faveur d’un début pendant les années d’enseignement formel, c’est-à-dire pendant la période développementale. Aucune source d’information unique ne suffit pour établir ce diagnostic. Il s’agit d’un diagnostic clinique fondé sur une synthèse de l’histoire médicale, développementale, scolaire et familiale de la personne ; de l’histoire des difficultés d’apprentissage, y compris leurs manifestations antérieures et actuelles ; de leur impact sur le fonctionnement scolaire, professionnel ou social ; des comptes rendus scolaires antérieurs ou actuels ; de recueils de travaux mobilisant des compétences scolaires ; d’évaluations fondées sur le programme scolaire ; et de scores antérieurs ou actuels à des tests standardisés individuels d’acquisitions scolaires. Si un trouble intellectuel, sensoriel, neurologique ou moteur est suspecté, l’évaluation clinique du trouble spécifique des apprentissages doit aussi comprendre des méthodes adaptées à ces troubles. L’évaluation complète fait donc intervenir des professionnels possédant une expertise du trouble spécifique des apprentissages et de l’évaluation psychologique ou cognitive. Puisque le trouble persiste habituellement à l’âge adulte, une réévaluation est rarement nécessaire, sauf en cas de changements marqués des difficultés — amélioration ou aggravation — ou lorsqu’elle est demandée à des fins particulières.</p>"},{"title":"Caractéristiques associées","kind":"associated","pdf":[256,257],"html":"<p>Les symptômes du trouble spécifique des apprentissages — difficultés concernant certains aspects de la lecture, de l’écriture ou des mathématiques — sont fréquemment associés. Un profil hétérogène des capacités est fréquent : par exemple, des capacités supérieures à la moyenne en dessin, conception et autres aptitudes visuospatiales peuvent coexister avec une lecture lente, laborieuse et inexacte et une faible compréhension de la lecture et expression écrite. Le trouble est fréquemment, mais pas toujours, précédé pendant les années préscolaires par des retards de l’attention, du langage ou des capacités motrices, qui peuvent persister et lui être associés.</p><p>Les personnes présentant ce trouble obtiennent habituellement, mais pas systématiquement, de faibles performances aux tests psychologiques des processus cognitifs. Cependant, on ne sait toujours pas clairement si ces anomalies cognitives sont la cause, un corrélat ou la conséquence des difficultés d’apprentissage. Les déficits cognitifs associés aux difficultés d’apprentissage de la lecture des mots sont bien documentés et les connaissances sur les déficits cognitifs associés à l’acquisition des compétences mathématiques se développent, mais les déficits associés à d’autres manifestations du trouble, comme la compréhension de la lecture ou l’expression écrite, restent insuffisamment précisés.</p><p>Bien que certains déficits cognitifs individuels contribuent particulièrement à chaque symptôme, d’autres sont communs à différents sous-types du trouble, par exemple la vitesse de traitement, et peuvent contribuer à l’association des symptômes. L’association fréquente des symptômes et les déficits cognitifs communs aux différents sous-types suggèrent des mécanismes biologiques sous-jacents partagés.</p><p>Ainsi, des personnes ayant des symptômes comportementaux ou des scores aux tests similaires présentent des déficits cognitifs variés, et nombre de ces déficits de traitement se retrouvent aussi dans d’autres troubles du neurodéveloppement : déficit de l’attention/hyperactivité (TDAH), trouble du spectre de l’autisme, troubles de la communication et trouble développemental de la coordination.</p><p>En tant que groupe, les personnes atteintes présentent des altérations circonscrites du traitement cognitif ainsi que de la structure et du fonctionnement cérébraux. Des différences génétiques sont également observables au niveau du groupe. Cependant, les tests cognitifs, l’imagerie cérébrale ou les tests génétiques ne sont actuellement pas utiles au diagnostic, et l’évaluation des déficits des processus cognitifs n’est pas requise pour l’évaluation diagnostique.</p>"},{"title":"Prévalence","kind":"prevalence","pdf":[257,257],"html":"<p>La prévalence du trouble spécifique des apprentissages dans les domaines scolaires de la lecture, de l’écriture et des mathématiques est de 5 % à 15 % chez les enfants d’âge scolaire au Brésil, en Irlande du Nord et aux États-Unis. La prévalence chez l’adulte est inconnue.</p>"},{"title":"Développement et évolution","kind":"course","pdf":[257,260],"html":"<p>Le début, le repérage et le diagnostic du trouble spécifique des apprentissages surviennent habituellement pendant les années d’école élémentaire, lorsque l’enfant doit apprendre à lire, à orthographier, à écrire et à faire des mathématiques. Toutefois, des précurseurs tels que des retards ou déficits du langage, des difficultés à faire des rimes ou à compter, ou des difficultés de motricité fine nécessaires à l’écriture apparaissent fréquemment dans la petite enfance, avant le début de l’enseignement formel.</p><p>Les manifestations peuvent être comportementales, par exemple une réticence à s’engager dans les apprentissages ou un comportement oppositionnel. Le trouble dure toute la vie, mais son évolution et son expression clinique varient, en partie selon les interactions entre les exigences des tâches de l’environnement, l’étendue et la sévérité des difficultés d’apprentissage, les capacités d’apprentissage de la personne, les comorbidités et les dispositifs de soutien et d’intervention disponibles. Néanmoins, les problèmes de fluidité et de compréhension de la lecture, d’orthographe, d’expression écrite et de compétences numériques dans la vie quotidienne persistent habituellement à l’âge adulte.</p><p>Les manifestations symptomatiques changent avec l’âge : une personne peut donc présenter un ensemble de difficultés d’apprentissage persistant ou changeant au cours de la vie. Les adultes ayant un trouble spécifique des apprentissages semblent connaître des limitations d’activité et des restrictions de participation dans les domaines de la communication, des interactions interpersonnelles et de la vie communautaire, sociale et civique.</p><p>Parmi les symptômes observables chez les enfants d’âge préscolaire figurent un manque d’intérêt pour les jeux portant sur les sons du langage — répétitions ou rimes — et des difficultés à apprendre les comptines. Ces enfants peuvent fréquemment parler comme des tout-petits, mal prononcer les mots et avoir du mal à retenir les noms des lettres, des nombres ou des jours de la semaine. Ils peuvent ne pas reconnaître les lettres de leur propre prénom et éprouver des difficultés à apprendre à compter. À l’âge de l’entrée à l’école, les enfants atteints peuvent être incapables de reconnaître et d’écrire les lettres ou leur propre prénom, ou continuer à utiliser une orthographe inventée au-delà des périodes développementales habituelles.</p><p>Ils peuvent avoir du mal à décomposer les mots parlés en syllabes — par exemple, « cowboy » en « cow » et « boy » — et à reconnaître les mots qui riment, par exemple « cat », « bat », « hat ». Les enfants à cet âge peuvent aussi avoir du mal à associer les lettres à leurs sons — par exemple la lettre b produit le son /b/ — et être incapables de reconnaître les phonèmes, par exemple ne pas savoir lequel d’un ensemble de mots comme « dog », « man », « car » commence par le même son que « cat ».</p><p>Chez l’enfant d’âge élémentaire, le trouble se manifeste habituellement par une difficulté marquée à apprendre les correspondances entre lettres et sons, particulièrement chez les enfants anglophones, le décodage fluide des mots, l’orthographe ou les faits arithmétiques. La lecture à voix haute est lente, inexacte et laborieuse, et certains enfants peinent à comprendre la grandeur représentée par un nombre parlé ou écrit. Les enfants des premières classes du primaire, de la 1re à la 3e année, peuvent continuer à avoir des difficultés à reconnaître et manipuler les phonèmes, être incapables de lire des mots fréquents d’une syllabe comme « mat » ou « top », et ne pas reconnaître des mots courants à l’orthographe irrégulière, comme « said » ou « two ». Ils peuvent faire des erreurs de lecture indiquant des difficultés à relier les sons et les lettres — par exemple « big » à la place de « got » — et avoir du mal à ordonner les nombres et les lettres. Ils peuvent également avoir du mal à mémoriser les faits numériques ou les procédures arithmétiques d’addition, de soustraction, etc., se plaindre que la lecture ou l’arithmétique est difficile et éviter ces activités. Les enfants des classes intermédiaires, de la 4e à la 6e année, peuvent mal prononcer ou omettre des parties de mots longs à plusieurs syllabes — par exemple dire « conible » pour « convertible », « aminal » pour « animal » — et confondre des mots de sonorité voisine, comme « tornado » et « volcano ». Ils peuvent avoir du mal à mémoriser les dates, les noms et les numéros de téléphone et à terminer les devoirs ou les tests à temps. Ils peuvent aussi présenter une faible compréhension, avec ou sans lecture lente, laborieuse et inexacte, et avoir du mal à lire les petits mots grammaticaux tels que « that », « the », « an », « in ». Leur orthographe et leurs productions écrites peuvent être très médiocres. Ils peuvent lire correctement le début d’un mot puis en deviner la suite de façon très approximative — par exemple lire « clover » comme « clock » — et exprimer une peur de la lecture à voix haute ou refuser de lire à voix haute.</p><p>En revanche, les adolescents peuvent avoir maîtrisé le décodage des mots, alors que la lecture reste lente et laborieuse ; ils sont susceptibles de présenter des difficultés marquées de compréhension de la lecture et d’expression écrite, y compris une mauvaise orthographe, ainsi qu’une maîtrise insuffisante des faits arithmétiques ou de la résolution de problèmes mathématiques. Pendant l’adolescence et à l’âge adulte, les personnes peuvent continuer à faire de nombreuses fautes d’orthographe, lire les mots isolés et les textes lentement et avec beaucoup d’effort, et avoir du mal à prononcer les mots à plusieurs syllabes. Elles peuvent devoir relire fréquemment les documents pour les comprendre ou en dégager l’idée principale et éprouver des difficultés à faire des inférences à partir d’un texte écrit. Les adolescents et adultes peuvent éviter les activités demandant de lire ou de calculer, comme lire pour le plaisir ou lire des instructions. Les adultes présentent des difficultés orthographiques persistantes, une lecture lente et laborieuse ou des difficultés à tirer des inférences importantes à partir d’informations numériques figurant dans des documents professionnels. Ils peuvent éviter les activités de loisir ou professionnelles exigeant de lire ou d’écrire, ou recourir à d’autres moyens d’accès à l’écrit, tels que les logiciels de synthèse vocale ou de reconnaissance vocale, les livres audio et les médias audiovisuels.</p><p>Une autre expression clinique est celle de difficultés d’apprentissage circonscrites persistant tout au long de la vie, par exemple une incapacité à maîtriser le sens élémentaire des nombres — savoir lequel de deux nombres ou groupes de points représente la plus grande quantité — ou un manque de maîtrise de l’identification des mots ou de l’orthographe. L’évitement ou la réticence à s’engager dans les activités nécessitant des compétences scolaires est fréquent chez l’enfant, l’adolescent et l’adulte. Les personnes ayant de faibles compétences en lecture et en mathématiques sont plus susceptibles de rapporter une détresse socioémotionnelle, par exemple tristesse ou solitude, au fur et à mesure de leur progression à l’école élémentaire.</p><p>Des épisodes d’anxiété sévère ou des troubles anxieux, comprenant plaintes somatiques ou attaques de panique, sont fréquents tout au long de la vie et accompagnent aussi bien les formes circonscrites que les formes plus larges des difficultés d’apprentissage.</p>"},{"title":"Facteurs de risque et pronostiques","kind":"risk","pdf":[260,262],"html":"<h4>Environnementaux</h4><p>Les facteurs environnementaux, notamment les conditions socioéconomiques — par exemple un faible niveau socioéconomique — et l’exposition à des neurotoxiques, augmentent le risque de trouble spécifique des apprentissages ou de difficultés en lecture et en mathématiques. Les risques comprennent une exposition prénatale ou précoce à l’un des éléments suivants : pollution atmosphérique, nicotine, polybromodiphényléthers ou polychlorobiphényles (retardateurs de flamme), plomb ou manganèse.</p><h4>Génétiques et physiologiques</h4><p>Le trouble spécifique des apprentissages semble présenter une agrégation familiale, particulièrement lorsqu’il touche la lecture, les mathématiques et l’orthographe. Le risque relatif de trouble spécifique des apprentissages en lecture ou en mathématiques est nettement plus élevé — par exemple respectivement 4 à 8 fois et 5 à 10 fois plus élevé — chez les apparentés du premier degré des personnes présentant ces difficultés que chez ceux de personnes ne les présentant pas. Il faut noter que les taux varient selon la méthode utilisée pour établir le statut diagnostique du parent : tests objectifs ou autoévaluation. Les antécédents familiaux de difficultés de lecture (dyslexie) et les compétences parentales en lecture-écriture prédisent des difficultés de lecture-écriture ou un trouble spécifique des apprentissages chez les descendants, ce qui indique le rôle conjoint des facteurs génétiques et environnementaux.</p><p>L’héritabilité est élevée tant pour les capacités que pour les déficits de lecture dans les langues alphabétiques et non alphabétiques, ainsi que pour la plupart des manifestations des capacités et des déficits d’apprentissage — par exemple, des estimations d’héritabilité supérieures à 0,6. La covariation entre les diverses manifestations des difficultés d’apprentissage est forte, ce qui suggère que les gènes associés à une présentation sont fortement corrélés à ceux associés à une autre manifestation.</p><p>Une naissance prématurée ou un très faible poids de naissance constituent un risque de trouble spécifique des apprentissages. Chez les personnes ayant une neurofibromatose de type 1, le risque est élevé, jusqu’à 75 % présentant un trouble des apprentissages.</p><h4>Facteurs modifiant l’évolution</h4><p>Des problèmes marqués d’inattention, de comportements internalisés et externalisés pendant les années préscolaires prédisent des difficultés ultérieures en lecture et en mathématiques — mais pas nécessairement un trouble spécifique des apprentissages — et une absence de réponse à des interventions scolaires efficaces. Une altération du langage pendant les années préscolaires est fortement associée à un déficit ultérieur de lecture, par exemple de lecture des mots ou de compréhension de la lecture. Ainsi, un retard ou des troubles de la parole ou du langage, ou une altération du traitement cognitif — conscience phonologique, mémoire de travail, dénomination sérielle rapide — peuvent prédire un trouble spécifique ultérieur de la lecture et de l’expression écrite. De plus, un diagnostic de TDAH dans l’enfance est associé à de moins bonnes performances en lecture et en mathématiques à l’âge adulte. L’association au TDAH prédit un devenir en santé mentale moins favorable que celui observé dans le trouble spécifique des apprentissages sans TDAH. Un enseignement systématique, intensif et individualisé, utilisant des interventions fondées sur des données probantes, peut améliorer ou atténuer les difficultés chez certaines personnes ou favoriser des stratégies de compensation chez d’autres, atténuant ainsi un devenir qui serait autrement défavorable.</p>"},{"title":"Questions diagnostiques liées à la culture","kind":"culture","pdf":[262,263],"html":"<p>Le trouble spécifique des apprentissages est observé dans différents milieux linguistiques et ethnoraciaux et dans différents contextes culturels et socioéconomiques, mais ses manifestations peuvent varier selon la nature des systèmes symboliques parlés et écrits et les pratiques culturelles et éducatives. Par exemple, les exigences cognitives de la lecture et du travail sur les nombres varient considérablement selon les systèmes orthographiques. En anglais, le symptôme clinique caractéristique observable des difficultés d’apprentissage de la lecture est une lecture inexacte et lente des mots isolés ; dans d’autres langues alphabétiques où les correspondances entre sons et lettres sont plus directes, comme l’espagnol et l’allemand, et dans les langues non alphabétiques, comme le chinois et le japonais, la caractéristique principale est une lecture lente mais exacte. Chez les personnes apprenant l’anglais, l’évaluation doit examiner si les difficultés de lecture résultent d’une maîtrise limitée de l’anglais ou d’un trouble spécifique des apprentissages. Les facteurs de risque chez ces personnes comprennent des antécédents familiaux de trouble spécifique des apprentissages ou un retard du langage dans la langue maternelle, ainsi que des difficultés d’apprentissage, des déficits de mémoire phonologique en anglais et une absence de rattrapage des pairs. Si des différences culturelles ou linguistiques sont suspectées — par exemple un effet de la maîtrise limitée de l’anglais —, l’évaluation doit prendre en compte les compétences dans la première langue ou langue maternelle et dans la seconde langue, ici l’anglais. Il est important de noter que les enfants parlant à domicile une langue phonologiquement différente de celle d’enseignement ne sont pas plus susceptibles de présenter des déficits phonologiques que leurs pairs parlant la même langue à domicile et à l’école. Les difficultés de lecture associées peuvent varier selon les langues : par exemple, elles sont moins fréquentes chez les enfants lisant le chinois et présentant un trouble développemental de la coordination à Taïwan que chez ceux des pays anglophones, peut-être en raison des caractéristiques des deux langues écrites, logographique ou alphabétique. L’évaluation peut prendre en compte le contexte linguistique et culturel dans lequel vit la personne ainsi que son histoire éducative et d’apprentissage dans son contexte linguistique et culturel d’origine. Les facteurs de risque de problèmes d’apprentissage chez les enfants réfugiés et migrants comprennent les stéréotypes et faibles attentes des enseignants, le harcèlement, les discriminations ethniques et racialisées, les incompréhensions parentales des styles et attentes éducatifs, les traumatismes et les facteurs de stress postmigratoires.</p>"},{"title":"Questions diagnostiques liées au sexe et au genre","kind":"gender","pdf":[263,263],"html":"<p>Le trouble spécifique des apprentissages est plus fréquent chez les sujets masculins que féminins, avec des rapports d’environ 2:1 à 3:1 ; cela ne peut pas être attribué à des facteurs tels qu’un biais de repérage, des variations de définition ou de mesure, la langue, l’origine ethnoraciale ou le niveau socioéconomique. Les différences entre les sexes dans la dyslexie — trouble spécifique des apprentissages avec déficit de la lecture — peuvent être en partie médiées par la vitesse de traitement.</p>"},{"title":"Association avec les pensées ou comportements suicidaires","kind":"suicide","pdf":[263,263],"html":"<p>Chez des adolescents américains de 15 ans scolarisés dans l’enseignement public, de faibles capacités de lecture étaient associées aux pensées et comportements suicidaires comparativement aux adolescents ayant des scores de lecture habituels, même après prise en compte des variables sociodémographiques et psychiatriques. Dans une étude en population générale d’adultes au Canada, la prévalence des tentatives de suicide au cours de la vie était plus élevée chez les personnes ayant un trouble spécifique des apprentissages que chez celles n’en ayant pas, même après ajustement pour les adversités de l’enfance, les antécédents de maladie mentale et d’usage de substances et les facteurs sociodémographiques. Parmi les personnes présentant ce trouble, le fait d’avoir été témoin de violences conjugales parentales chroniques et d’avoir eu un trouble dépressif caractérisé était associé à un risque accru de comportement suicidaire.</p>"},{"title":"Conséquences fonctionnelles du trouble spécifique des apprentissages","kind":"functional","pdf":[263,264],"html":"<p>Le trouble spécifique des apprentissages peut avoir des conséquences fonctionnelles défavorables tout au long de la vie : niveau scolaire atteint plus faible, taux plus élevés d’abandon du secondaire, taux plus faibles d’études postsecondaires, détresse psychologique élevée et moins bonne santé mentale générale, chômage et sous-emploi plus fréquents et revenus plus faibles. L’abandon scolaire et les symptômes dépressifs associés augmentent le risque de devenir défavorable en santé mentale, y compris les pensées ou comportements suicidaires, tandis que des niveaux élevés de soutien social ou émotionnel prédisent de meilleurs résultats en santé mentale.</p>"},{"title":"Diagnostic différentiel","kind":"differential","pdf":[264,265],"html":"<h4>Variations normales des acquisitions scolaires</h4><p>Le trouble spécifique des apprentissages se distingue des variations normales de réussite scolaire attribuables à des facteurs externes — manque d’occasions éducatives, enseignement constamment médiocre, apprentissage dans une seconde langue — car les difficultés persistent malgré des possibilités éducatives adéquates, une exposition au même enseignement que les pairs et une maîtrise de la langue d’enseignement, même lorsqu’elle diffère de la langue parlée principale.</p><h4>Trouble du développement intellectuel (handicap intellectuel)</h4><p>Le trouble spécifique des apprentissages diffère des difficultés générales d’apprentissage associées au trouble du développement intellectuel, car les difficultés surviennent en présence d’un fonctionnement intellectuel normal, c’est-à-dire un QI d’au moins 70 ± 5. En présence d’un trouble du développement intellectuel, le trouble spécifique des apprentissages ne peut être diagnostiqué que si les difficultés dépassent celles habituellement associées au trouble intellectuel.</p><h4>Difficultés d’apprentissage dues à des troubles neurologiques ou sensoriels</h4><p>Le trouble spécifique des apprentissages se distingue des difficultés dues à des troubles neurologiques ou sensoriels — AVC pédiatrique, traumatisme crânien, déficience auditive ou visuelle — car, dans ces cas, des anomalies sont présentes à l’examen neurologique.</p><h4>Troubles neurocognitifs</h4><p>Le trouble spécifique des apprentissages se distingue des problèmes d’apprentissage associés aux troubles cognitifs neurodégénératifs. Dans le trouble spécifique des apprentissages, l’expression clinique de difficultés spécifiques survient pendant la période développementale, parfois seulement lorsque les demandes augmentent et dépassent les capacités limitées, comme cela peut arriver à l’âge adulte ; les difficultés ne se manifestent pas par un déclin marqué par rapport à un état antérieur.</p><h4>Déficit de l’attention/hyperactivité</h4><p>Le trouble spécifique des apprentissages se distingue des faibles performances scolaires associées au TDAH, car dans ce dernier les problèmes ne traduisent pas nécessairement des difficultés spécifiques d’acquisition des compétences scolaires, mais peuvent refléter des difficultés à mettre ces compétences en œuvre. Toutefois, l’association du trouble spécifique des apprentissages et du TDAH est plus fréquente que ne le voudrait le hasard. Si les critères des deux troubles sont remplis, les deux diagnostics peuvent être posés.</p><h4>Troubles psychotiques</h4><p>Le trouble spécifique des apprentissages se distingue des difficultés de traitement cognitif associées à la schizophrénie ou à d’autres troubles psychotiques, car ces troubles s’accompagnent d’un déclin, souvent rapide, dans ces domaines fonctionnels. Toutefois, les déficits de lecture du trouble spécifique des apprentissages sont plus sévères que ne le laisseraient prévoir les altérations cognitives générales associées à la schizophrénie. Si les critères des deux troubles sont remplis, les deux diagnostics peuvent être posés.</p>"},{"title":"Comorbidité","kind":"comorbidity","pdf":[265,266],"html":"<p>Les différents types de trouble spécifique des apprentissages sont fréquemment associés entre eux — par exemple les déficits de mathématiques et de lecture — et à d’autres troubles du neurodéveloppement, tels que TDAH, troubles de la communication, trouble développemental de la coordination et trouble du spectre de l’autisme, ou à d’autres troubles mentaux, tels que troubles anxieux et dépressifs, ou à des problèmes comportementaux. Les estimations de l’association des difficultés en mathématiques et en lecture varient notamment selon les tests utilisés pour définir les difficultés mathématiques, probablement parce qu’un même symptôme — par exemple des problèmes arithmétiques — peut être associé à différents déficits cognitifs, comme un déficit des compétences langagières ou du traitement des nombres. Ces comorbidités n’excluent pas nécessairement le diagnostic, mais peuvent rendre les tests et le diagnostic différentiel plus difficiles, car chacun des troubles associés interfère indépendamment avec les activités quotidiennes, y compris les apprentissages. Le jugement clinique est donc nécessaire pour attribuer cette altération aux difficultés d’apprentissage. S’il apparaît qu’un autre diagnostic pourrait expliquer les difficultés d’acquisition des compétences scolaires fondamentales décrites au critère A, le trouble spécifique des apprentissages ne doit pas être diagnostiqué.</p>"}]},{"id":"coordination","family":"moteurs","title":"Trouble développemental de la coordination","subtitle":"TDC","english":"Developmental Coordination Disorder","codes":["F82"],"aliases":["dyspraxie","TDC","TAC","maladresse","dysgraphie","coordination","motricité fine","dyspraxique","graphisme","geste graphique"],"pages":"85–89","pdf":[266,272],"criteriaPages":"85–86","criteriaPdf":[266,266],"related":["apprentissages","tdah","autisme"],"chapter":"neurodev","sections":[{"title":"Critères diagnostiques","kind":"criteria","pdf":[266,266],"html":"<p><strong>F82</strong></p><p><strong>A.</strong> L’acquisition et l’exécution d’habiletés motrices coordonnées sont nettement inférieures à ce qui est attendu compte tenu de l’âge chronologique de la personne et des occasions d’apprentissage et d’utilisation de ces habiletés. Les difficultés se manifestent par une maladresse — par exemple, laisser tomber ou heurter des objets — ainsi que par une lenteur et une inexactitude dans l’exécution des habiletés motrices, comme attraper un objet, utiliser des ciseaux ou des couverts, écrire à la main, faire du vélo ou participer à des activités sportives.</p><p><strong>B.</strong> Le déficit des habiletés motrices du critère A interfère de manière significative et persistante avec les activités de la vie quotidienne adaptées à l’âge chronologique, comme les soins personnels et l’entretien de soi, et affecte la productivité scolaire, les activités préprofessionnelles et professionnelles, les loisirs et le jeu.</p><p><strong>C.</strong> Les symptômes débutent pendant la période développementale précoce.</p><p><strong>D.</strong> Les déficits des habiletés motrices ne sont pas mieux expliqués par un trouble du développement intellectuel (handicap intellectuel) ou une déficience visuelle et ne sont pas attribuables à une affection neurologique touchant le mouvement, comme une paralysie cérébrale, une dystrophie musculaire ou un trouble dégénératif.</p>"},{"title":"Caractéristiques diagnostiques","kind":"clinical","pdf":[267,268],"html":"<p>Le diagnostic de trouble développemental de la coordination est établi par une synthèse clinique de l’histoire développementale et médicale, de l’examen physique, des comptes rendus scolaires ou professionnels et d’une évaluation individuelle utilisant des tests standardisés psychométriquement valides et culturellement adaptés. Les manifestations de l’altération des compétences nécessitant une coordination motrice (critère A) varient avec l’âge. Les jeunes enfants peuvent présenter un retard des acquisitions motrices — position assise, déplacement à quatre pattes, marche —, bien que beaucoup atteignent ces étapes aux âges habituels. Ils peuvent aussi tarder à acquérir des compétences comme emprunter les escaliers, pédaler, boutonner une chemise, faire des puzzles et utiliser des fermetures à glissière. Même lorsque la compétence est acquise, l’exécution des mouvements peut paraître maladroite, lente ou moins précise que chez leurs pairs. Les enfants plus âgés et les adultes peuvent montrer une lenteur ou une inexactitude dans les aspects moteurs d’activités telles que les puzzles, la construction de maquettes, les jeux de ballon, particulièrement en équipe, l’écriture manuscrite, la frappe au clavier, la conduite automobile ou les soins personnels.</p><p>Le trouble développemental de la coordination n’est diagnostiqué que si l’altération des habiletés motrices interfère significativement avec l’exécution des activités quotidiennes ou la participation à celles-ci dans la vie familiale, sociale, scolaire ou communautaire (critère B). Ces activités comprennent par exemple s’habiller, manger avec des ustensiles adaptés à l’âge et sans se salir, participer à des jeux physiques avec les autres, utiliser des outils spécifiques en classe tels que règles et ciseaux et participer à des activités physiques en équipe à l’école. Non seulement la capacité à réaliser ces actions est altérée, mais une lenteur marquée d’exécution est également fréquente. L’écriture manuscrite est souvent affectée, avec des conséquences sur la lisibilité ou la vitesse de production écrite et sur la réussite scolaire ; ce retentissement se distingue d’une difficulté spécifique des apprentissages par l’importance de la composante motrice de la production écrite. Chez l’adulte, les problèmes de coordination affectent les compétences quotidiennes dans les études et le travail, surtout celles qui demandent rapidité et précision.</p><p>Le critère C stipule que les symptômes doivent débuter pendant la période développementale précoce. Cependant, le trouble n’est habituellement pas diagnostiqué avant l’âge de 5 ans, en raison de la variabilité importante de l’âge d’acquisition de nombreuses habiletés motrices, du manque de stabilité des mesures dans la petite enfance — certains enfants rattrapent leur retard — ou parce que d’autres causes de retard moteur peuvent ne pas s’être encore pleinement manifestées.</p><p>Le critère D précise que le diagnostic est posé si les difficultés de coordination ne sont pas mieux expliquées par une déficience visuelle et ne sont pas attribuables à une affection neurologique. L’examen de la fonction visuelle et l’examen neurologique doivent donc être inclus dans l’évaluation diagnostique. Si un trouble du développement intellectuel (handicap intellectuel) est présent, les difficultés motrices dépassent celles attendues pour l’âge mental ; toutefois, aucun seuil de QI ni critère de discordance n’est spécifié.</p><p>Le trouble développemental de la coordination n’a pas de sous-types distincts ; cependant, les personnes peuvent être principalement atteintes dans les habiletés motrices globales ou dans les habiletés motrices fines, y compris l’écriture manuscrite.</p><p>D’autres termes utilisés pour décrire ce trouble comprennent la dyspraxie de l’enfant, le trouble spécifique du développement de la fonction motrice et le syndrome de l’enfant maladroit.</p>"},{"title":"Caractéristiques associées","kind":"associated","pdf":[268,268],"html":"<p>Certains enfants ayant un trouble développemental de la coordination présentent une activité motrice supplémentaire, habituellement inhibée, telle que des mouvements choréiformes des membres non soutenus ou des mouvements en miroir. Ces mouvements de « débordement » sont considérés comme des immaturités neurodéveloppementales ou des signes neurologiques mineurs plutôt que comme des anomalies neurologiques. Tant dans la littérature actuelle que dans la pratique clinique, leur rôle dans le diagnostic reste incertain et nécessite des évaluations complémentaires.</p>"},{"title":"Prévalence","kind":"prevalence","pdf":[268,268],"html":"<p>La prévalence du trouble développemental de la coordination chez les enfants de 5 à 11 ans varie de 5 % à 8 % selon les pays. Au Royaume-Uni, 1,8 % des enfants de 7 ans reçoivent un diagnostic de trouble sévère et 3 % un diagnostic de trouble probable ; elle est de 7 % à 8 % au Canada, en Suède et à Taïwan. Les garçons sont plus souvent atteints que les filles, avec un rapport garçons/filles compris entre 2:1 et 7:1.</p>"},{"title":"Développement et évolution","kind":"course","pdf":[269,269],"html":"<p>L’évolution du trouble développemental de la coordination est variable mais stable au moins aux suivis à 1 et 2 ans. Bien qu’une amélioration à plus long terme soit possible, les difficultés de coordination des mouvements persistent pendant l’adolescence chez environ 50 % à 70 % des enfants. Le début se situe dans la petite enfance. Un retard des acquisitions motrices peut constituer le premier signe, ou le trouble peut être repéré pour la première fois lorsque l’enfant essaie des tâches comme tenir un couteau et une fourchette, boutonner ses vêtements ou jouer au ballon. Au milieu de l’enfance, des difficultés concernent les aspects moteurs des puzzles, de la construction de maquettes, des jeux de ballon et de l’écriture, ainsi que l’organisation des affaires lorsque le séquençage et la coordination motrice sont nécessaires. Au début de l’âge adulte, les difficultés persistent dans l’apprentissage de nouvelles tâches faisant appel à des habiletés motrices complexes ou automatiques, dont la conduite et l’utilisation d’outils. L’incapacité à prendre des notes et à écrire rapidement peut affecter les performances professionnelles. La coexistence d’autres troubles, décrits dans la rubrique « Comorbidité », exerce un effet supplémentaire sur la présentation, l’évolution et le devenir.</p>"},{"title":"Facteurs de risque et pronostiques","kind":"risk","pdf":[269,269],"html":"<h4>Environnementaux</h4><p>Le trouble développemental de la coordination est associé à la prématurité, au faible poids de naissance et à l’exposition prénatale à l’alcool.</p><h4>Génétiques et physiologiques</h4><p>Des altérations des processus neurodéveloppementaux sous-jacents ont été observées dans les compétences visuomotrices, notamment la perception visuomotrice et la représentation mentale spatiale. Un dysfonctionnement cérébelleux, affectant la capacité à réaliser des ajustements moteurs rapides lorsque la complexité des mouvements demandés augmente, peut aussi intervenir. Toutefois, la base neurale précise du trouble reste incertaine. En raison de son association avec d’autres troubles du neurodéveloppement, notamment le déficit de l’attention/hyperactivité (TDAH), les troubles spécifiques des apprentissages et le trouble du spectre de l’autisme, un effet génétique partagé a été proposé. Cependant, une association concordante chez les jumeaux n’apparaît que dans les cas sévères.</p><h4>Facteurs modifiant l’évolution</h4><p>Les personnes ayant à la fois un TDAH et un trouble développemental de la coordination présentent davantage d’altération que celles ayant un TDAH sans trouble de la coordination.</p>"},{"title":"Questions diagnostiques liées à la culture","kind":"culture","pdf":[270,270],"html":"<p>Le trouble développemental de la coordination se rencontre dans différents contextes culturels, ethnoraciaux et socioéconomiques. Cependant, des variations culturelles du développement moteur, accéléré ou retardé par rapport aux normes américaines, ont été rapportées. Elles semblent associées aux pratiques de soins liées aux attentes concernant la mobilité autonome pendant le développement, à des possibilités insuffisantes de mobilité chez les enfants vivant dans une grande pauvreté et à des différences de méthode de mesure. Par définition, les « activités de la vie quotidienne » impliquent des différences culturelles qui nécessitent de tenir compte du contexte de vie de l’enfant et des occasions appropriées qu’il a eues d’apprendre et de pratiquer ces activités. Une prévalence plus élevée dans les études portant sur les enfants de certains pays à revenus faibles ou intermédiaires peut refléter l’impact du désavantage socioéconomique sur le développement moteur.</p>"},{"title":"Conséquences fonctionnelles du trouble développemental de la coordination","kind":"functional","pdf":[270,270],"html":"<p>Le trouble développemental de la coordination entraîne une altération des performances fonctionnelles dans les activités quotidiennes (critère B), aggravée par les affections associées. Ses conséquences comprennent une participation réduite aux jeux et sports collectifs ; une faible estime de soi et un faible sentiment de valeur personnelle ; des difficultés émotionnelles ou comportementales ; une altération de la réussite scolaire ; une mauvaise condition physique ; une activité physique réduite et une obésité ; et une mauvaise qualité de vie liée à la santé.</p>"},{"title":"Diagnostic différentiel","kind":"differential","pdf":[270,271],"html":"<h4>Déficits moteurs dus à une autre affection médicale</h4><p>Les problèmes de coordination peuvent être associés à une altération de la fonction visuelle et à des troubles neurologiques spécifiques, comme une paralysie cérébrale, des lésions progressives du cervelet ou des affections neuromusculaires. Dans ces cas, des éléments supplémentaires sont présents à l’examen neurologique.</p><h4>Trouble du développement intellectuel (handicap intellectuel)</h4><p>Si un trouble du développement intellectuel est présent, les compétences motrices peuvent être altérées conformément au handicap intellectuel. Toutefois, si les difficultés motrices dépassent ce que ce trouble peut expliquer et si les critères du trouble développemental de la coordination sont remplis, ce dernier peut aussi être diagnostiqué.</p><h4>Déficit de l’attention/hyperactivité</h4><p>Les personnes ayant un TDAH peuvent tomber, heurter des objets ou renverser des choses. Une observation attentive dans différents contextes est nécessaire pour déterminer si le manque de compétence motrice est attribuable à la distractibilité et à l’impulsivité plutôt qu’au trouble développemental de la coordination. Si les critères des deux troubles sont remplis, les deux diagnostics peuvent être posés.</p><h4>Trouble du spectre de l’autisme</h4><p>Les personnes ayant un TSA peuvent ne pas être intéressées par la participation à des tâches exigeant une coordination complexe, comme les sports de ballon, ce qui affecte les résultats aux tests et le fonctionnement sans refléter la compétence motrice fondamentale. L’association du trouble développemental de la coordination et du TSA est fréquente. Si les critères des deux troubles sont remplis, les deux diagnostics peuvent être posés.</p><h4>Syndrome d’hypermobilité articulaire</h4><p>Les personnes présentant des syndromes provoquant une hyperextensibilité articulaire, constatée à l’examen physique et souvent accompagnée d’une plainte douloureuse, peuvent présenter des symptômes similaires à ceux du trouble développemental de la coordination.</p>"},{"title":"Comorbidité","kind":"comorbidity","pdf":[271,272],"html":"<p>Les troubles fréquemment associés au trouble développemental de la coordination comprennent les troubles de la communication ; le trouble spécifique des apprentissages, en particulier de la lecture et de l’écriture ; les problèmes d’inattention, dont le TDAH, qui est l’affection coexistante la plus fréquente avec environ 50 % d’association ; le trouble du spectre de l’autisme ; les problèmes comportementaux perturbateurs et émotionnels ; et le syndrome d’hypermobilité articulaire. Différentes configurations d’association peuvent être présentes : par exemple, une combinaison de troubles sévères de la lecture, de difficultés de motricité fine et d’écriture manuscrite, ou une autre combinaison d’altération du contrôle du mouvement et de la planification motrice. La présence d’autres troubles n’exclut pas le trouble développemental de la coordination, mais peut rendre les tests plus difficiles et interférer indépendamment avec l’exécution des activités quotidiennes, ce qui exige le jugement de l’examinateur pour attribuer l’altération aux habiletés motrices.</p>"}]},{"id":"mouvements-stereotypes","family":"moteurs","title":"Trouble des mouvements stéréotypés","english":"Stereotypic Movement Disorder","codes":["F98.4"],"aliases":["stéréotypies","stereotypies","balancement","flapping","automutilation","autoagressivité","mouvements répétitifs","se balancer","stéréotypie"],"pages":"89–93","pdf":[272,279],"criteriaPages":"89","criteriaPdf":[272,273],"related":["autisme","tourette","developpement-intellectuel"],"chapter":"neurodev","sections":[{"title":"Critères diagnostiques","kind":"criteria","pdf":[272,272],"html":"<p><strong>F98.4</strong></p><p><strong>A.</strong> Comportement moteur répétitif, semblant contraint et apparemment sans but (par exemple, secouer ou agiter les mains, balancement du corps, se cogner la tête, se mordre, frapper son propre corps).</p><p><strong>B.</strong> Le comportement moteur répétitif interfère avec les activités sociales, scolaires ou autres et peut entraîner des blessures auto-infligées.</p><p><strong>C.</strong> Le début se situe pendant la période développementale précoce.</p><p><strong>D.</strong> Le comportement moteur répétitif n’est pas attribuable aux effets physiologiques d’une substance ou à une affection neurologique et n’est pas mieux expliqué par un autre trouble neurodéveloppemental ou mental, comme une trichotillomanie (arrachage de cheveux) ou un trouble obsessionnel-compulsif.</p>"},{"title":"Spécifications à indiquer et sévérité actuelle","kind":"specifiers","pdf":[272,273],"html":"<h4>Spécifier si :</h4><ul><li><strong>Avec comportement autoagressif</strong> (ou comportement qui entraînerait une blessure si des mesures préventives n’étaient pas utilisées).</li><li><strong>Sans comportement autoagressif.</strong></li></ul><h4>Spécifier si :</h4><p><strong>Associé à une affection génétique ou autre affection médicale connue, à un trouble neurodéveloppemental ou à un facteur environnemental</strong> (par exemple, syndrome de Lesch-Nyhan, trouble du développement intellectuel [handicap intellectuel], exposition intra-utérine à l’alcool).</p><p><strong>Note de codage :</strong> Utiliser un code supplémentaire pour identifier l’affection génétique ou autre affection médicale, le trouble neurodéveloppemental ou le facteur environnemental associé.</p><h4>Spécifier la sévérité actuelle :</h4><p><strong>Léger :</strong> Les symptômes sont facilement interrompus par une stimulation sensorielle ou une distraction.</p><p><strong>Moyen :</strong> Les symptômes nécessitent des mesures de protection explicites et une modification comportementale.</p><p><strong>Grave :</strong> Une surveillance continue et des mesures de protection sont nécessaires pour prévenir des blessures graves.</p>"},{"title":"Procédures d’enregistrement","kind":"recording","pdf":[273,273],"html":"<p>Pour un trouble des mouvements stéréotypés associé à une affection génétique ou autre affection médicale connue, à un trouble neurodéveloppemental ou à un facteur environnemental, consigner « trouble des mouvements stéréotypés associé à [nom de l’affection, du trouble ou du facteur] », par exemple « trouble des mouvements stéréotypés associé au syndrome de Lesch-Nyhan ».</p>"},{"title":"Spécifications","kind":"specifiers","pdf":[273,273],"html":"<p>La sévérité des mouvements stéréotypés non autoagressifs va de présentations légères, facilement interrompues par une stimulation sensorielle ou une distraction, à des mouvements continus interférant fortement avec toutes les activités quotidiennes. La sévérité des comportements autoagressifs varie selon plusieurs dimensions, notamment la fréquence, l’impact sur le fonctionnement adaptatif et la gravité des lésions corporelles, depuis de légères ecchymoses ou un érythème provoqués par des coups de la main contre le corps jusqu’à des lacérations ou amputations des doigts, ou un décollement de rétine provoqué par des chocs de la tête.</p>"},{"title":"Caractéristiques diagnostiques","kind":"clinical","pdf":[273,275],"html":"<p>La caractéristique essentielle du trouble des mouvements stéréotypés est un comportement moteur répétitif, semblant contraint et apparemment sans but (critère A). Ces comportements sont souvent des mouvements rythmiques de la tête, des mains ou du corps sans fonction adaptative évidente. Les mouvements peuvent répondre ou non aux tentatives de les arrêter. Chez les enfants au développement habituel, les mouvements répétitifs peuvent généralement être arrêtés lorsque l’attention est attirée sur eux ou lorsque l’enfant est distrait de leur exécution. Chez les enfants présentant des troubles du neurodéveloppement, les comportements répondent habituellement moins à ces efforts. Dans d’autres cas, la personne présente des comportements d’auto-restriction, comme s’asseoir sur ses mains, envelopper ses bras dans ses vêtements ou chercher un dispositif protecteur.</p><p>Le répertoire des comportements est variable ; chaque personne présente son propre comportement caractéristique, sa « signature ». Les exemples de mouvements stéréotypés non autoagressifs comprennent notamment le balancement du corps, les mouvements bilatéraux de battement ou de rotation des mains, l’agitation ou le papillonnement des doigts devant le visage, les mouvements de battement des bras et les hochements de tête ; une ouverture étirée de la bouche est fréquemment observée en association aux mouvements des membres supérieurs. Les comportements stéréotypés autoagressifs comprennent notamment les chocs répétés de la tête, les gifles sur le visage, les pressions sur les yeux et les morsures des mains, des lèvres ou d’autres parties du corps. Les pressions sur les yeux sont particulièrement préoccupantes ; elles surviennent plus fréquemment chez les enfants ayant une déficience visuelle. Plusieurs mouvements peuvent être combinés, par exemple incliner la tête, balancer le torse et agiter de façon répétée une petite ficelle devant le visage.</p><p>Les mouvements stéréotypés peuvent survenir de nombreuses fois par jour et durer de quelques secondes à plusieurs minutes ou davantage. Leur fréquence varie de nombreuses occurrences dans une seule journée à plusieurs semaines entre les épisodes. Les comportements varient selon le contexte : ils apparaissent lorsque la personne est absorbée par d’autres activités, excitée, stressée, fatiguée ou ennuyée. Le critère A exige que les mouvements soient « apparemment » sans but. Toutefois, les mouvements peuvent remplir certaines fonctions. Par exemple, ils peuvent réduire l’anxiété en réponse à des facteurs de stress externes.</p><p>Le critère B exige que les mouvements interfèrent avec les activités sociales, scolaires ou autres et qu’ils puissent, chez certains enfants, entraîner des blessures auto-infligées, ou en entraîneraient sans mesures protectrices. La présence ou l’absence de comportement autoagressif doit être indiquée à l’aide des spécifications « avec comportement autoagressif » ou « sans comportement autoagressif ». Le début se situe pendant la période développementale précoce (critère C).</p><p>Le critère D exige que le comportement répétitif et stéréotypé ne soit pas attribuable aux effets physiologiques d’une subst
