ance ou à une affection neurologique et ne soit pas mieux expliqué par un autre trouble neurodéveloppemental ou mental. La présence de mouvements stéréotypés peut indiquer un problème neurodéveloppemental non détecté, en particulier chez les enfants de 1 à 3 ans.</p>"},{"title":"Prévalence","kind":"prevalence","pdf":[275,275],"html":"<p>Les mouvements stéréotypés simples, comme le balancement, sont fréquents chez les jeunes enfants au développement habituel, par exemple 5 % à 19 % au Royaume-Uni et aux États-Unis. Les mouvements stéréotypés complexes sont beaucoup moins fréquents, touchant environ 3 % à 4 %. Entre 4 % et 16 % des personnes présentant un trouble du développement intellectuel (handicap intellectuel), dans des échantillons de pays à revenus élevés, manifestent des stéréotypies et des comportements autoagressifs. Le risque est plus élevé chez les personnes ayant un trouble intellectuel grave. Parmi celles vivant en établissement résidentiel, 10 % à 15 % peuvent présenter un trouble des mouvements stéréotypés avec autoagressivité. Les comportements et intérêts répétitifs et restreints peuvent constituer des marqueurs de risque d’apparition de comportements autoagressifs, d’agressivité et de destruction chez les enfants ayant un trouble intellectuel grave.</p>"},{"title":"Développement et évolution","kind":"course","pdf":[275,275],"html":"<p>Les mouvements stéréotypés débutent habituellement au cours des 3 premières années de vie. Les mouvements simples sont fréquents chez le nourrisson et peuvent intervenir dans l’acquisition de la maîtrise motrice. Parmi les enfants qui développent des stéréotypies motrices complexes, environ 80 % présentent des symptômes avant 24 mois, 12 % entre 24 et 35 mois et 8 % à 36 mois ou plus. Chez la plupart des enfants au développement habituel, la sévérité et la fréquence des mouvements diminuent avec le temps. Les stéréotypies motrices complexes peuvent débuter chez le nourrisson ou plus tard dans la période développementale. Chez les personnes présentant un trouble du développement intellectuel, les comportements stéréotypés autoagressifs peuvent persister pendant des années, même si leur forme ou leur configuration peut changer.</p>"},{"title":"Facteurs de risque et pronostiques","kind":"risk","pdf":[276,276],"html":"<h4>Environnementaux</h4><p>L’isolement social est un facteur de risque d’autostimulation pouvant évoluer vers des mouvements stéréotypés avec autoagressivité répétitive. Le stress environnemental peut aussi déclencher un comportement stéréotypé. La peur peut modifier l’état physiologique et augmenter la fréquence des comportements stéréotypés.</p><h4>Génétiques et physiologiques</h4><p>On considère que le trouble des mouvements stéréotypés est en partie héritable, compte tenu de la fréquence élevée des antécédents familiaux de stéréotypies motrices. Une réduction significative du volume du putamen chez les enfants ayant des stéréotypies suggère que des voies cortico-striatales distinctes associées aux comportements habituels — circuits reliant les régions prémotrices au putamen postérieur — pourraient constituer le siège anatomique sous-jacent des stéréotypies motrices complexes. Un fonctionnement cognitif plus faible est lié à un risque plus élevé de comportements stéréotypés et à une moins bonne réponse aux interventions.</p><p>Les mouvements stéréotypés sont plus fréquents chez les personnes présentant un trouble du développement intellectuel de sévérité moyenne à grave ou profonde, qui semblent avoir un risque plus élevé du fait d’un syndrome particulier, comme le syndrome de Rett, ou d’un facteur environnemental, comme un environnement relativement peu stimulant. Un comportement autoagressif répétitif peut constituer un phénotype comportemental dans des syndromes neurogénétiques. Par exemple, dans le syndrome de Lesch-Nyhan, des mouvements dystoniques stéréotypés s’associent à des automutilations des doigts, des morsures des lèvres et d’autres formes d’autoagressivité si la personne n’est pas contenue ; dans les syndromes de Rett et de Cornelia de Lange, des blessures auto-infligées peuvent résulter des stéréotypies main-bouche.</p><p>Les comportements stéréotypés peuvent également résulter d’une affection médicale douloureuse, comme une otite moyenne, des problèmes dentaires ou un reflux gastro-œsophagien.</p>"},{"title":"Questions diagnostiques liées à la culture","kind":"culture","pdf":[276,276],"html":"<p>Les comportements répétitifs stéréotypés, avec ou sans autoagressivité, se manifestent de différentes façons dans de nombreuses cultures. Les attitudes culturelles envers les comportements inhabituels peuvent retarder le diagnostic. La tolérance culturelle générale et les attitudes envers les mouvements stéréotypés varient et doivent être prises en compte.</p>"},{"title":"Diagnostic différentiel","kind":"differential","pdf":[276,279],"html":"<h4>Développement habituel</h4><p>Les mouvements stéréotypés simples sont fréquents chez le nourrisson et dans la petite enfance. Le balancement peut survenir lors du passage du sommeil à l’éveil et disparaît habituellement avec l’âge. Les stéréotypies complexes sont moins fréquentes chez les enfants au développement habituel et peuvent généralement être interrompues par une distraction ou une stimulation sensorielle. La routine quotidienne de la personne est rarement affectée et les mouvements ne provoquent généralement pas de détresse chez l’enfant. Le diagnostic ne serait pas approprié dans ces circonstances.</p><h4>Trouble du spectre de l’autisme</h4><p>Les mouvements stéréotypés peuvent être un symptôme révélateur du TSA, qui doit être envisagé lors de l’évaluation de mouvements et comportements répétitifs. Les déficits de communication sociale et de réciprocité du TSA sont généralement absents du trouble des mouvements stéréotypés ; l’interaction sociale, la communication sociale et les comportements et intérêts rigides et répétitifs sont donc des éléments distinctifs. En présence d’un TSA, le trouble des mouvements stéréotypés n’est diagnostiqué que lorsqu’il existe une autoagressivité ou lorsque les comportements sont suffisamment sévères pour devenir un objectif de traitement.</p><h4>Tics</h4><p>Les stéréotypies débutent habituellement plus tôt — avant 3 ans — que les tics, dont l’âge moyen de début est de 4 à 6 ans. Leur configuration ou leur topographie est également constante et fixe, contrairement aux tics dont la présentation est variable et change habituellement avec le temps. Les stéréotypies peuvent toucher les bras, les mains ou l’ensemble du corps, tandis que les tics concernent fréquemment les yeux, le visage, la tête et les épaules. Les stéréotypies sont plus fixes, rythmiques et prolongées que les tics, généralement brefs, rapides, aléatoires et fluctuants. Les stéréotypies sont égosyntoniques — les enfants les apprécient —, contrairement aux tics, qui sont habituellement égodystoniques. Les tics fluctuent dans leur localisation et dans le temps et se distinguent par l’association à un besoin prémonitoire, sensation physique précédant de nombreux mouvements de tic. Tics et mouvements stéréotypés diminuent tous deux avec la distraction.</p><h4>Troubles obsessionnels-compulsifs et apparentés</h4><p>Le trouble des mouvements stéréotypés se distingue du trouble obsessionnel-compulsif (TOC) par l’absence d’obsessions et par la nature des comportements répétitifs. Dans le TOC, la personne se sent obligée d’exécuter des comportements répétitifs en réponse à une obsession ou selon des règles devant être appliquées rigidement, tandis que dans le trouble des mouvements stéréotypés les comportements semblent contraints mais apparemment sans but. La trichotillomanie (arrachage de cheveux) et la dermatillomanie (triturage de la peau) se caractérisent par des comportements répétitifs centrés sur le corps, qui peuvent sembler contraints mais ne sont pas apparemment sans but et peuvent ne pas être structurés ou rythmiques. De plus, leur début ne se situe habituellement pas dans la période développementale précoce, mais plutôt autour de la puberté ou plus tard.</p><h4>Autres affections neurologiques et médicales</h4><p>Le diagnostic de mouvements stéréotypés exige d’exclure les habitudes, les maniérismes, les dyskinésies paroxystiques et la chorée héréditaire bénigne. Une histoire et un examen neurologiques sont nécessaires pour rechercher les éléments évocateurs d’autres troubles, comme les myoclonies, la dystonie, les tics et la chorée. Les mouvements involontaires associés à une affection neurologique peuvent être distingués par leurs signes et symptômes. Par exemple, les mouvements répétitifs stéréotypés de la dyskinésie tardive peuvent être distingués par des antécédents d’utilisation chronique de neuroleptiques et par une dyskinésie orale ou faciale caractéristique ou des mouvements irréguliers du tronc ou des membres. Ces types de mouvements ne provoquent pas de blessures auto-infligées.</p><p>Les stéréotypies sont une manifestation fréquente de divers troubles neurogénétiques, comme les syndromes de Lesch-Nyhan, de Rett, de l’X fragile, de Cornelia de Lange et de Smith-Magenis. Pour un trouble des mouvements stéréotypés associé à une affection génétique ou autre affection médicale connue, à un trouble neurodéveloppemental ou à un facteur environnemental, consigner « trouble des mouvements stéréotypés associé à [nom de l’affection, du trouble ou du facteur] », par exemple associé au syndrome de Lesch-Nyhan.</p><h4>Comportements répétitifs induits par une substance</h4><p>Un diagnostic de trouble des mouvements stéréotypés n’est pas approprié pour le triturage ou le grattage répétitif de la peau associé à une intoxication aux amphétamines ou à leur abus. Dans de tels cas, le diagnostic de trouble obsessionnel-compulsif ou apparenté induit par une substance ou un médicament s’applique.</p><h4>Stéréotypies fonctionnelles (de conversion)</h4><p>Les mouvements stéréotypés doivent être distingués des mouvements fonctionnels (de conversion). Un début soudain, la distractibilité, une configuration changeante avec une amélioration ou une aggravation inexpliquée et la coexistence d’autres symptômes du trouble neurologique fonctionnel (trouble de conversion) sont quelques-unes des caractéristiques habituelles qui aident à reconnaître les stéréotypies fonctionnelles.</p>"},{"title":"Comorbidité","kind":"comorbidity","pdf":[279,279],"html":"<p>Les comorbidités fréquentes chez les enfants ayant des stéréotypies motrices chroniques comprennent le déficit de l’attention/hyperactivité, les problèmes de coordination motrice, les tics ou le syndrome de Tourette et l’anxiété.</p>"}]},{"id":"tourette","family":"moteurs","title":"Syndrome de Gilles de la Tourette","english":"Tourette’s Disorder","codes":["F95.2"],"aliases":["Tourette","Gilles de la Tourette","tics","tic moteur","tic vocal","coprolalie","écholalie","tic","tics moteurs et vocaux"],"pages":"93–98","pdf":[279,288],"criteriaPages":"93","criteriaPdf":[279,279],"related":["tics-persistants","tics-provisoires","tics-autres","mouvements-stereotypes"],"chapter":"neurodev","sections":[{"title":"Critères diagnostiques","kind":"criteria","pdf":[279,279],"html":"<p><strong>F95.2</strong></p><p><strong>Note :</strong> Un tic est un mouvement moteur ou une vocalisation soudain, rapide, récurrent et non rythmique.</p><p><strong>A.</strong> Des tics moteurs multiples et un ou plusieurs tics vocaux ont été présents à un moment quelconque au cours de la maladie, sans être nécessairement concomitants.</p><p><strong>B.</strong> La fréquence des tics peut augmenter et diminuer, mais ils ont persisté pendant plus d’un an depuis l’apparition du premier tic.</p><p><strong>C.</strong> Le début se situe avant l’âge de 18 ans.</p><p><strong>D.</strong> La perturbation n’est pas attribuable aux effets physiologiques d’une substance, par exemple la cocaïne, ou à une autre affection médicale, par exemple une maladie de Huntington ou une encéphalite postvirale.</p>"},{"title":"Spécifications","kind":"specifiers","pdf":[280,280],"html":"<p>La spécification « avec tics moteurs seulement » ou « avec tics vocaux seulement » n’est requise que pour les tics moteurs ou vocaux persistants (chroniques).</p>"},{"title":"Caractéristiques diagnostiques","kind":"clinical","pdf":[280,283],"html":"<p>Les troubles de tics comprennent cinq catégories diagnostiques : le syndrome de Tourette, les tics moteurs ou vocaux persistants (chroniques), les tics provisoires, les autres tics spécifiés et les tics non spécifiés. Le diagnostic de chacun des troubles spécifiques repose sur la présence de tics moteurs et/ou vocaux (critère A), leur durée (critère B), l’âge de début (critère C) et l’absence de cause connue, telle qu’une autre affection médicale ou un usage de substances (critère D). Les diagnostics sont organisés de manière hiérarchique : syndrome de Tourette, puis tics moteurs ou vocaux persistants [chroniques], puis tics provisoires, puis autres tics spécifiés et tics non spécifiés. Une fois qu’un trouble a été diagnostiqué à un niveau de cette hiérarchie, un diagnostic d’un niveau inférieur ne peut pas être posé (critère E).</p><p>Les tics sont habituellement des mouvements moteurs ou des vocalisations soudains, rapides, récurrents et non rythmiques. Certains tics moteurs peuvent être des mouvements de torsion ou de contraction plus lents, de durée variable. Une personne peut présenter différents tics au fil du temps, mais à tout moment le répertoire de tics peut se répéter d’une manière caractéristique. Bien que les tics puissent concerner presque n’importe quel groupe musculaire ou vocalisation, certains, tels que les clignements des yeux ou le raclement de gorge, sont fréquents dans les différentes populations de patients. Une sensation désagréable localisée (sensation prémonitoire) précède souvent le tic, et la plupart des personnes rapportent un « besoin » de le réaliser. Les tics sont donc généralement vécus comme involontaires, mais certains peuvent être supprimés volontairement pendant des durées variables.</p><p>Le fait de parler explicitement des tics peut les déclencher. De même, observer un geste ou entendre un son chez une autre personne peut conduire une personne ayant des tics à produire un geste ou un son similaire, que les autres peuvent interpréter à tort comme intentionnel. Cela peut être particulièrement problématique lors d’interactions avec des figures d’autorité qui n’ont pas une compréhension adéquate des tics, comme des enseignants, supérieurs hiérarchiques ou policiers.</p><p>Les tics sont classiquement qualifiés de simples ou de complexes. Les tics moteurs simples se caractérisent par l’implication limitée de groupes musculaires spécifiques, sont souvent de courte durée et peuvent comprendre des clignements des yeux, des grimaces, des haussements d’épaules ou une extension des extrémités. Les tics vocaux simples comprennent les raclements de gorge, reniflements, petits cris, aboiements ou grognements, souvent produits par la contraction du diaphragme ou des muscles de l’oropharynx. Les tics moteurs complexes sont plus prolongés et comprennent souvent une combinaison de tics simples, par exemple tourner la tête et hausser les épaules simultanément. Les tics complexes peuvent paraître intentionnels, tels que des gestes de la tête ou des mouvements du torse. Ils peuvent aussi comporter l’imitation des mouvements d’autrui (échopraxie), ou des gestes sexuels ou interdits (copropraxie). De même, les tics vocaux complexes ont une signification linguistique — mots ou parties de mots — et peuvent comprendre la répétition de ses propres sons ou mots (palilalie), la répétition du dernier mot ou de la dernière phrase entendus (écholalie), ou l’émission de mots socialement inacceptables, y compris des obscénités ou des insultes ethniques, raciales ou religieuses (coprolalie). Il est important de noter que la coprolalie est une émission brusque et aiguë, de type aboiement ou grognement, sans la prosodie des paroles inappropriées similaires observées dans les interactions humaines.</p><p>La présence de tics moteurs et/ou vocaux varie entre les cinq troubles (critère A). Dans le syndrome de Tourette, les tics moteurs et vocaux doivent tous deux être présents, sans l’être nécessairement en même temps ; dans les tics moteurs ou vocaux persistants (chroniques), seuls des tics moteurs ou seuls des tics vocaux sont présents. Dans les tics provisoires, des tics moteurs et/ou vocaux peuvent être présents. Dans les autres tics spécifiés ou non spécifiés, les tics ou symptômes ressemblant à des tics sont mieux caractérisés comme des tics, mais leur présentation ou leur âge de début sont atypiques, ou leur étiologie est connue.</p><p>Le critère de durée minimale d’un an (critère B) garantit que les personnes recevant un diagnostic de syndrome de Tourette ou de tics moteurs ou vocaux persistants (chroniques) ont présenté des symptômes persistants. La sévérité des tics fluctue et certaines personnes peuvent avoir des intervalles de plusieurs semaines ou mois sans tics. Cependant, une personne ayant des tics depuis plus d’un an à compter du premier tic est considérée comme présentant des symptômes persistants, indépendamment des périodes intermittentes sans tics. Chez une personne présentant des tics moteurs et/ou vocaux depuis moins d’un an à compter du premier tic, un diagnostic de tics provisoires peut être envisagé. Les tics doivent débuter avant l’âge de 18 ans (critère C). Les troubles de tics commencent habituellement pendant la période prépubertaire, à un âge moyen de 4 à 6 ans ; l’incidence des premiers débuts diminue à la fin de l’adolescence. Un premier début à l’âge adulte est extrêmement rare et souvent associé à des expositions à des substances illicites, comme un usage excessif de cocaïne, à une atteinte du système nerveux central ou à un trouble neurologique fonctionnel. Bien qu’un premier début soit inhabituel chez l’adolescent et l’adulte, il n’est pas rare qu’ils consultent pour une première évaluation diagnostique et qu’une évaluation attentive retrouve des antécédents de tics plus légers remontant à l’enfance, même si les phases antérieures du développement comprenaient des périodes de plusieurs mois ou années sans tics. L’apparition initiale de mouvements anormaux évoquant des tics hors de la tranche d’âge habituelle doit conduire à rechercher d’autres troubles du mouvement, notamment des mouvements complexes ou des vocalisations fonctionnels ressemblant à des tics.</p><p>Les tics ne peuvent pas être attribuables aux effets physiologiques d’une substance ou à une autre affection médicale (critère D). Lorsque l’histoire, l’examen physique et/ou les résultats biologiques apportent des éléments solides en faveur d’une cause plausible, proche et probable, un diagnostic d’autres tics spécifiés doit être utilisé.</p><p>Le fait d’avoir antérieurement rempli les critères du syndrome de Tourette exclut un diagnostic de tics moteurs ou vocaux persistants (chroniques) (critère E). De même, un diagnostic antérieur de tics moteurs ou vocaux persistants (chroniques) exclut un diagnostic de tics provisoires, d’autres tics spécifiés ou de tics non spécifiés (critère E).</p>"},{"title":"Prévalence","kind":"prevalence","pdf":[283,283],"html":"<p>Les tics sont fréquents pendant l’enfance mais transitoires dans la plupart des cas. Une enquête nationale américaine a estimé à 3 pour 1 000 la prévalence des cas cliniquement repérés. Leur fréquence était plus faible chez les Afro-Américains et les personnes Latinx, ce qui peut être lié aux différences d’accès aux soins. La prévalence estimée du syndrome de Tourette au Canada varie de 3 à 9 pour 1 000 chez les enfants d’âge scolaire. Globalement, les sujets masculins sont plus souvent atteints que les sujets féminins, avec un rapport variant de 2:1 à 4:1. Les études épidémiologiques montrent la présence de tics chez les enfants de tous les continents, mais les taux exacts de prévalence sont influencés par les différences méthodologiques des recherches.</p>"},{"title":"Développement et évolution","kind":"course","pdf":[283,284],"html":"<p>Les tics débutent habituellement entre 4 et 6 ans. Le clignement des yeux est particulièrement caractéristique comme symptôme initial. Le pic de sévérité survient entre 10 et 12 ans, puis la sévérité diminue pendant l’adolescence. De nombreux adultes ayant des tics présentent une diminution des symptômes. Toutefois, une proportion des personnes conserve des symptômes sévères ou connaît une aggravation à l’âge adulte.</p><p>Les tics se manifestent de façon similaire dans tous les groupes d’âge et tout au long de la vie. Leur sévérité — fréquence et intensité — fluctue et, avec le temps, les groupes musculaires concernés et la nature des vocalisations changent. De nombreuses personnes, y compris de jeunes enfants, rapportent une sensation corporelle localisée précédant le tic et un besoin prémonitoire de bouger. Il peut être difficile de trouver les mots pour décrire ces sensations et ces besoins. Les tics associés à un besoin prémonitoire peuvent être vécus comme pas totalement « involontaires », dans la mesure où l’on peut résister au besoin et au tic. Une personne peut aussi ressentir la nécessité de répéter un tic ou de le réaliser d’une manière particulière jusqu’à avoir le sentiment qu’il a été fait « exactement comme il faut ». L’expression du tic ou d’une série de tics est souvent suivie d’un soulagement et d’une diminution de la tension.</p><p>La vulnérabilité à l’apparition d’affections associées change à mesure que les personnes traversent les âges de risque de ces différentes affections. Par exemple, les enfants prépubères ayant des tics sont plus susceptibles de présenter un TDAH, un TOC et une anxiété de séparation associés. Les adolescents et adultes sont plus vulnérables à l’apparition de troubles de l’humeur et de troubles anxieux ainsi que de troubles liés à l’usage de substances.</p>"},{"title":"Facteurs de risque et pronostiques","kind":"risk","pdf":[284,285],"html":"<h4>Environnementaux</h4><p>Au début du développement cérébral, plusieurs facteurs de risque environnementaux ont été identifiés, dont l’âge paternel avancé et des événements indésirables pré- et périnataux : altération de la croissance fœtale, fièvre maternelle pendant l’accouchement, tabagisme maternel, stress psychosocial maternel sévère, naissance prématurée, présentation du siège et accouchement par césarienne.</p><h4>Génétiques et physiologiques</h4><p>Les facteurs génétiques influencent l’expression et la sévérité des tics. L’héritabilité des troubles de tics est estimée entre 70 % et 85 %, sans différence de risque familial ou d’héritabilité entre sujets masculins et féminins. Des allèles de risque importants pour le syndrome de Tourette et des variants génétiques rares dans les familles ayant des tics ont été identifiés. Des variants génétiques communs ont aussi été identifiés. Ils sont partagés entre les troubles de tics selon un gradient corrélé à la sévérité de la maladie. Les troubles de tics existent probablement sur un continuum développemental, tant du point de vue phénoménologique que génétique.</p><p>Les troubles de tics chroniques partagent une variance génétique avec le TOC, le TDAH et d’autres troubles du neurodéveloppement, dont le TSA. De plus, les personnes ayant des tics présentent un risque accru de développer une maladie auto-immune, par exemple une thyroïdite de Hashimoto. Il apparaît de plus en plus clairement que le système immunitaire et la neuro-inflammation jouent des rôles importants dans la pathobiologie des tics, au moins dans un sous-groupe de personnes atteintes, par exemple celles ayant une chorée de Sydenham. Cependant, des travaux supplémentaires sont nécessaires pour comprendre les fondements biocomportementaux et le rôle causal potentiel des infections dans d’autres affections neuropsychiatriques, dont le syndrome neuropsychiatrique pédiatrique à début aigu et le trouble neuropsychiatrique pédiatrique auto-immun associé aux infections streptococciques.</p><h4>Facteurs modifiant l’évolution</h4><p>L’anxiété, l’excitation et l’épuisement accentuent les tics ; ceux-ci s’améliorent pendant les activités calmes et concentrées. Par exemple, de nombreuses personnes ont habituellement moins de tics lorsqu’elles effectuent des tâches nécessitant une attention soutenue et un contrôle moteur. Les événements stressants ou excitants, comme passer un examen ou participer à des activités excitantes, aggravent souvent les tics.</p>"},{"title":"Questions diagnostiques liées à la culture","kind":"culture","pdf":[285,285],"html":"<p>Les caractéristiques cliniques, l’évolution et l’étiologie des troubles de tics ne semblent pas varier selon l’origine ethnique, racialisée et culturelle. Toutefois, ces origines peuvent influencer la façon dont les troubles sont perçus et pris en charge dans la famille et la communauté, et ainsi les modalités de recherche d’aide et les choix thérapeutiques, comme l’âge de présentation aux services spécialisés. Par exemple, la distance sociale souhaitée à l’égard des personnes ayant des tics — lors du travail ou des études en commun — était plus importante dans un échantillon coréen que dans les études américaines.</p>"},{"title":"Questions diagnostiques liées au sexe et au genre","kind":"gender","pdf":[285,286],"html":"<p>Les sujets masculins sont plus souvent atteints que les sujets féminins, mais il n’existe pas de différence entre les sexes concernant les types de tics, l’âge de début ou l’évolution. Les femmes ayant des tics persistants peuvent être plus susceptibles de présenter une anxiété et une dépression.</p>"},{"title":"Association avec les pensées ou comportements suicidaires","kind":"suicide","pdf":[286,286],"html":"<p>Une étude cas-cohorte appariée conduite en Suède de 1969 à 2013 a montré que les personnes ayant un syndrome de Tourette ou des tics moteurs ou vocaux persistants (chroniques) présentent un risque nettement accru de tentative de suicide (odds ratio de 3,86) et de décès par suicide (odds ratio de 4,39), même après ajustement pour les comorbidités psychiatriques, par rapport à des témoins appariés de la population générale. La persistance des tics au-delà du jeune âge adulte et une tentative de suicide antérieure étaient les prédicteurs les plus forts du décès par suicide. Des données cas-témoins suggèrent qu’environ un jeune sur dix ayant des tics moteurs ou vocaux persistants (chroniques) présente des pensées et/ou comportements suicidaires, particulièrement dans un contexte de colère ou de frustration, en association avec l’anxiété ou la dépression, des difficultés sociales ou un retrait, l’agressivité et des problèmes internalisés, la sévérité des tics et leur retentissement.</p>"},{"title":"Conséquences fonctionnelles des tics","kind":"functional","pdf":[286,287],"html":"<p>De nombreuses personnes ayant des tics de sévérité légère à moyenne n’éprouvent ni détresse ni altération du fonctionnement et peuvent même ne pas avoir conscience de leurs tics. Les personnes ayant des symptômes plus sévères ont généralement davantage de difficultés dans la vie quotidienne, mais même des personnes ayant des tics moyens ou graves peuvent bien fonctionner. Une affection associée, telle qu’un TDAH ou un TOC, peut avoir davantage d’impact sur le fonctionnement que les tics eux-mêmes. Moins fréquemment, les tics perturbent les activités quotidiennes et entraînent isolement social, conflits interpersonnels, victimisation par les pairs, impossibilité de travailler ou d’aller à l’école et baisse de qualité de vie. Les personnes ont souvent du mal à concentrer leur attention sur les tâches professionnelles lorsqu’elles essaient activement de supprimer leurs tics. Elles peuvent aussi éprouver une détresse psychologique importante, voire des pensées suicidaires. Les complications rares du syndrome de Tourette comprennent des blessures physiques, comme des lésions oculaires provoquées par des coups portés au visage, et des lésions orthopédiques ou neurologiques, par exemple une pathologie discale liée à des mouvements violents de la tête et du cou.</p>"},{"title":"Diagnostic différentiel","kind":"differential","pdf":[287,288],"html":"<h4>Mouvements anormaux pouvant accompagner d’autres affections médicales, notamment d’autres troubles du mouvement</h4><p>Les stéréotypies motrices sont définies comme des mouvements involontaires rythmiques, répétitifs et prévisibles, qui paraissent intentionnels mais ne remplissent pas de fonction adaptative évidente. Elles sont souvent autoapaisantes ou agréables et s’arrêtent avec la distraction. Les exemples comprennent les mouvements répétitifs d’agitation ou de rotation des mains, les battements des bras et les mouvements des doigts. Elles peuvent habituellement être différenciées des tics par leur début plus précoce, souvent avant 3 ans, leur durée prolongée de quelques secondes à plusieurs minutes, leur caractère répétitif et rythmique dans la forme et la localisation, l’absence de sensation ou de besoin prémonitoire et leur arrêt avec la distraction, comme entendre son nom ou être touché. La chorée correspond à des mouvements rapides, aléatoires, continus, brusques, irréguliers, imprévisibles et non stéréotypés, habituellement bilatéraux, qui touchent toutes les parties du corps : visage, tronc et membres. Leur moment d’apparition, leur direction et leur répartition varient d’un instant à l’autre ; les mouvements s’aggravent habituellement lors des tentatives d’action volontaire. La dystonie est une contraction simultanée et soutenue de muscles agonistes et antagonistes, entraînant une posture ou un mouvement déformé de parties du corps. Les postures dystoniques sont souvent déclenchées par des tentatives de mouvements volontaires et ne sont pas observées pendant le sommeil.</p><h4>Dyskinésies paroxystiques</h4><p>Les dyskinésies paroxystiques se caractérisent par des mouvements involontaires épisodiques, dystoniques ou choréoathétosiques, déclenchés par un mouvement volontaire ou un effort, et survenant moins fréquemment à partir d’une activité de fond habituelle.</p><h4>Myoclonies</h4><p>Une myoclonie se caractérise par un mouvement soudain unidirectionnel, souvent non rythmique. Elle peut être aggravée par le mouvement et survenir pendant le sommeil. Elle se distingue des tics par sa rapidité, l’impossibilité de la supprimer et l’absence de sensation ou de besoin prémonitoire.</p><h4>Troubles obsessionnels-compulsifs et apparentés</h4><p>Distinguer les compulsions du TOC des tics complexes peut être difficile, d’autant qu’ils sont fréquemment associés chez une même personne. Les compulsions visent à prévenir ou à réduire l’anxiété ou la détresse et sont habituellement réalisées en réponse à une obsession, comme une peur de contamination. À l’inverse, de nombreuses personnes ayant des tics ressentent la nécessité d’effectuer l’action d’une certaine façon, symétriquement des deux côtés du corps, un certain nombre de fois ou jusqu’à obtenir une sensation de « juste comme il faut ». Les troubles des comportements répétitifs centrés sur le corps — arrachage persistant de cheveux, triturage de la peau, rongement des ongles — sont davantage orientés vers un but et plus complexes que les tics.</p><h4>Tics fonctionnels</h4><p>Des troubles fonctionnels doivent également être envisagés lorsqu’une personne présente des « attaques de tics » qui peuvent se prolonger pendant des durées allant de 15 minutes à plusieurs heures.</p>"},{"title":"Comorbidité","kind":"comorbidity","pdf":[288,288],"html":"<p>De nombreuses affections médicales et psychiatriques ont été décrites en association avec les tics ; le TDAH, les comportements perturbateurs et le TOC et les troubles apparentés sont particulièrement fréquents. Les enfants ayant un TDAH peuvent présenter des comportements perturbateurs, une immaturité sociale et des difficultés d’apprentissage qui interfèrent avec les progrès scolaires et les relations interpersonnelles et entraînent davantage d’altération que les tics eux-mêmes. Les symptômes obsessionnels-compulsifs observés dans les troubles de tics tendent à débuter plus tôt et sont souvent caractérisés par un besoin de symétrie et d’exactitude et/ou par des pensées interdites ou taboues, comme des obsessions agressives, sexuelles ou religieuses et les compulsions associées. Les personnes ayant des tics peuvent aussi présenter d’autres troubles du mouvement, par exemple une chorée de Sydenham ou un trouble des mouvements stéréotypés, ainsi que d’autres affections neurodéveloppementales et psychiatriques, telles qu’un TSA ou un trouble spécifique des apprentissages. Comme indiqué plus haut, les adolescents et adultes ayant des tics présentent un risque accru de développer un trouble de l’humeur, un trouble anxieux ou un trouble lié à l’usage de substances.</p>"}]},{"id":"tics-persistants","family":"moteurs","title":"Tics moteurs ou vocaux persistants (chroniques)","english":"Persistent (Chronic) Motor or Vocal Tic Disorder","codes":["F95.1"],"aliases":["tics chroniques","tics moteurs","tics vocaux","tic chronique"],"pages":"93–98","pdf":[279,288],"criteriaPages":"93","criteriaPdf":[280,280],"related":["tourette","tics-provisoires","tics-autres"],"chapter":"neurodev","sections":[{"title":"Critères diagnostiques","kind":"criteria","pdf":[279,280],"html":"<p><strong>F95.1</strong></p><p><strong>Note :</strong> Un tic est un mouvement moteur ou une vocalisation soudain, rapide, récurrent et non rythmique.</p><p><strong>A.</strong> Un ou plusieurs tics moteurs ou vocaux ont été présents au cours de la maladie, mais pas à la fois des tics moteurs et vocaux.</p><p><strong>B.</strong> La fréquence des tics peut augmenter et diminuer, mais ils ont persisté pendant plus d’un an depuis l’apparition du premier tic.</p><p><strong>C.</strong> Le début se situe avant l’âge de 18 ans.</p><p><strong>D.</strong> La perturbation n’est pas attribuable aux effets physiologiques d’une substance, par exemple la cocaïne, ou à une autre affection médicale, par exemple une maladie de Huntington ou une encéphalite postvirale.</p><p><strong>E.</strong> Les critères d’un syndrome de Tourette n’ont jamais été remplis.</p><h4>Spécifier si :</h4><ul><li>Avec tics moteurs seulement</li><li>Avec tics vocaux seulement</li></ul>"},{"title":"Spécifications","kind":"specifiers","pdf":[280,280],"html":"<p>La spécification « avec tics moteurs seulement » ou « avec tics vocaux seulement » n’est requise que pour les tics moteurs ou vocaux persistants (chroniques).</p>"},{"title":"Caractéristiques diagnostiques","kind":"clinical","pdf":[280,283],"html":"<p>Les troubles de tics comprennent cinq catégories diagnostiques : le syndrome de Tourette, les tics moteurs ou vocaux persistants (chroniques), les tics provisoires, les autres tics spécifiés et les tics non spécifiés. Le diagnostic de chacun des troubles spécifiques repose sur la présence de tics moteurs et/ou vocaux (critère A), leur durée (critère B), l’âge de début (critère C) et l’absence de cause connue, telle qu’une autre affection médicale ou un usage de substances (critère D). Les diagnostics sont organisés de manière hiérarchique : syndrome de Tourette, puis tics moteurs ou vocaux persistants [chroniques], puis tics provisoires, puis autres tics spécifiés et tics non spécifiés. Une fois qu’un trouble a été diagnostiqué à un niveau de cette hiérarchie, un diagnostic d’un niveau inférieur ne peut pas être posé (critère E).</p><p>Les tics sont habituellement des mouvements moteurs ou des vocalisations soudains, rapides, récurrents et non rythmiques. Certains tics moteurs peuvent être des mouvements de torsion ou de contraction plus lents, de durée variable. Une personne peut présenter différents tics au fil du temps, mais à tout moment le répertoire de tics peut se répéter d’une manière caractéristique. Bien que les tics puissent concerner presque n’importe quel groupe musculaire ou vocalisation, certains, tels que les clignements des yeux ou le raclement de gorge, sont fréquents dans les différentes populations de patients. Une sensation désagréable localisée (sensation prémonitoire) précède souvent le tic, et la plupart des personnes rapportent un « besoin » de le réaliser. Les tics sont donc généralement vécus comme involontaires, mais certains peuvent être supprimés volontairement pendant des durées variables.</p><p>Le fait de parler explicitement des tics peut les déclencher. De même, observer un geste ou entendre un son chez une autre personne peut conduire une personne ayant des tics à produire un geste ou un son similaire, que les autres peuvent interpréter à tort comme intentionnel. Cela peut être particulièrement problématique lors d’interactions avec des figures d’autorité qui n’ont pas une compréhension adéquate des tics, comme des enseignants, supérieurs hiérarchiques ou policiers.</p><p>Les tics sont classiquement qualifiés de simples ou de complexes. Les tics moteurs simples se caractérisent par l’implication limitée de groupes musculaires spécifiques, sont souvent de courte durée et peuvent comprendre des clignements des yeux, des grimaces, des haussements d’épaules ou une extension des extrémités. Les tics vocaux simples comprennent les raclements de gorge, reniflements, petits cris, aboiements ou grognements, souvent produits par la contraction du diaphragme ou des muscles de l’oropharynx. Les tics moteurs complexes sont plus prolongés et comprennent souvent une combinaison de tics simples, par exemple tourner la tête et hausser les épaules simultanément. Les tics complexes peuvent paraître intentionnels, tels que des gestes de la tête ou des mouvements du torse. Ils peuvent aussi comporter l’imitation des mouvements d’autrui (échopraxie), ou des gestes sexuels ou interdits (copropraxie). De même, les tics vocaux complexes ont une signification linguistique — mots ou parties de mots — et peuvent comprendre la répétition de ses propres sons ou mots (palilalie), la répétition du dernier mot ou de la dernière phrase entendus (écholalie), ou l’émission de mots socialement inacceptables, y compris des obscénités ou des insultes ethniques, raciales ou religieuses (coprolalie). Il est important de noter que la coprolalie est une émission brusque et aiguë, de type aboiement ou grognement, sans la prosodie des paroles inappropriées similaires observées dans les interactions humaines.</p><p>La présence de tics moteurs et/ou vocaux varie entre les cinq troubles (critère A). Dans le syndrome de Tourette, les tics moteurs et vocaux doivent tous deux être présents, sans l’être nécessairement en même temps ; dans les tics moteurs ou vocaux persistants (chroniques), seuls des tics moteurs ou seuls des tics vocaux sont présents. Dans les tics provisoires, des tics moteurs et/ou vocaux peuvent être présents. Dans les autres tics spécifiés ou non spécifiés, les tics ou symptômes ressemblant à des tics sont mieux caractérisés comme des tics, mais leur présentation ou leur âge de début sont atypiques, ou leur étiologie est connue.</p><p>Le critère de durée minimale d’un an (critère B) garantit que les personnes recevant un diagnostic de syndrome de Tourette ou de tics moteurs ou vocaux persistants (chroniques) ont présenté des symptômes persistants. La sévérité des tics fluctue et certaines personnes peuvent avoir des intervalles de plusieurs semaines ou mois sans tics. Cependant, une personne ayant des tics depuis plus d’un an à compter du premier tic est considérée comme présentant des symptômes persistants, indépendamment des périodes intermittentes sans tics. Chez une personne présentant des tics moteurs et/ou vocaux depuis moins d’un an à compter du premier tic, un diagnostic de tics provisoires peut être envisagé. Les tics doivent débuter avant l’âge de 18 ans (critère C). Les troubles de tics commencent habituellement pendant la période prépubertaire, à un âge moyen de 4 à 6 ans ; l’incidence des premiers débuts diminue à la fin de l’adolescence. Un premier début à l’âge adulte est extrêmement rare et souvent associé à des expositions à des substances illicites, comme un usage excessif de cocaïne, à une atteinte du système nerveux central ou à un trouble neurologique fonctionnel. Bien qu’un premier début soit inhabituel chez l’adolescent et l’adulte, il n’est pas rare qu’ils consultent pour une première évaluation diagnostique et qu’une évaluation attentive retrouve des antécédents de tics plus légers remontant à l’enfance, même si les phases antérieures du développement comprenaient des périodes de plusieurs mois ou années sans tics. L’apparition initiale de mouvements anormaux évoquant des tics hors de la tranche d’âge habituelle doit conduire à rechercher d’autres troubles du mouvement, notamment des mouvements complexes ou des vocalisations fonctionnels ressemblant à des tics.</p><p>Les tics ne peuvent pas être attribuables aux effets physiologiques d’une substance ou à une autre affection médicale (critère D). Lorsque l’histoire, l’examen physique et/ou les résultats biologiques apportent des éléments solides en faveur d’une cause plausible, proche et probable, un diagnostic d’autres tics spécifiés doit être utilisé.</p><p>Le fait d’avoir antérieurement rempli les critères du syndrome de Tourette exclut un diagnostic de tics moteurs ou vocaux persistants (chroniques) (critère E). De même, un diagnostic antérieur de tics moteurs ou vocaux persistants (chroniques) exclut un diagnostic de tics provisoires, d’autres tics spécifiés ou de tics non spécifiés (critère E).</p>"},{"title":"Prévalence","kind":"prevalence","pdf":[283,283],"html":"<p>Les tics sont fréquents pendant l’enfance mais transitoires dans la plupart des cas. Une enquête nationale américaine a estimé à 3 pour 1 000 la prévalence des cas cliniquement repérés. Leur fréquence était plus faible chez les Afro-Américains et les personnes Latinx, ce qui peut être lié aux différences d’accès aux soins. La prévalence estimée du syndrome de Tourette au Canada varie de 3 à 9 pour 1 000 chez les enfants d’âge scolaire. Globalement, les sujets masculins sont plus souvent atteints que les sujets féminins, avec un rapport variant de 2:1 à 4:1. Les études épidémiologiques montrent la présence de tics chez les enfants de tous les continents, mais les taux exacts de prévalence sont influencés par les différences méthodologiques des recherches.</p>"},{"title":"Développement et évolution","kind":"course","pdf":[283,284],"html":"<p>Les tics débutent habituellement entre 4 et 6 ans. Le clignement des yeux est particulièrement caractéristique comme symptôme initial. Le pic de sévérité survient entre 10 et 12 ans, puis la sévérité diminue pendant l’adolescence. De nombreux adultes ayant des tics présentent une diminution des symptômes. Toutefois, une proportion des personnes conserve des symptômes sévères ou connaît une aggravation à l’âge adulte.</p><p>Les tics se manifestent de façon similaire dans tous les groupes d’âge et tout au long de la vie. Leur sévérité — fréquence et intensité — fluctue et, avec le temps, les groupes musculaires concernés et la nature des vocalisations changent. De nombreuses personnes, y compris de jeunes enfants, rapportent une sensation corporelle localisée précédant le tic et un besoin prémonitoire de bouger. Il peut être difficile de trouver les mots pour décrire ces sensations et ces besoins. Les tics associés à un besoin prémonitoire peuvent être vécus comme pas totalement « involontaires », dans la mesure où l’on peut résister au besoin et au tic. Une personne peut aussi ressentir la nécessité de répéter un tic ou de le réaliser d’une manière particulière jusqu’à avoir le sentiment qu’il a été fait « exactement comme il faut ». L’expression du tic ou d’une série de tics est souvent suivie d’un soulagement et d’une diminution de la tension.</p><p>La vulnérabilité à l’apparition d’affections associées change à mesure que les personnes traversent les âges de risque de ces différentes affections. Par exemple, les enfants prépubères ayant des tics sont plus susceptibles de présenter un TDAH, un TOC et une anxiété de séparation associés. Les adolescents et adultes sont plus vulnérables à l’apparition de troubles de l’humeur et de troubles anxieux ainsi que de troubles liés à l’usage de substances.</p>"},{"title":"Facteurs de risque et pronostiques","kind":"risk","pdf":[284,285],"html":"<h4>Environnementaux</h4><p>Au début du développement cérébral, plusieurs facteurs de risque environnementaux ont été identifiés, dont l’âge paternel avancé et des événements indésirables pré- et périnataux : altération de la croissance fœtale, fièvre maternelle pendant l’accouchement, tabagisme maternel, stress psychosocial maternel sévère, naissance prématurée, présentation du siège et accouchement par césarienne.</p><h4>Génétiques et physiologiques</h4><p>Les facteurs génétiques influencent l’expression et la sévérité des tics. L’héritabilité des troubles de tics est estimée entre 70 % et 85 %, sans différence de risque familial ou d’héritabilité entre sujets masculins et féminins. Des allèles de risque importants pour le syndrome de Tourette et des variants génétiques rares dans les familles ayant des tics ont été identifiés. Des variants génétiques communs ont aussi été identifiés. Ils sont partagés entre les troubles de tics selon un gradient corrélé à la sévérité de la maladie. Les troubles de tics existent probablement sur un continuum développemental, tant du point de vue phénoménologique que génétique.</p><p>Les troubles de tics chroniques partagent une variance génétique avec le TOC, le TDAH et d’autres troubles du neurodéveloppement, dont le TSA. De plus, les personnes ayant des tics présentent un risque accru de développer une maladie auto-immune, par exemple une thyroïdite de Hashimoto. Il apparaît de plus en plus clairement que le système immunitaire et la neuro-inflammation jouent des rôles importants dans la pathobiologie des tics, au moins dans un sous-groupe de personnes atteintes, par exemple celles ayant une chorée de Sydenham. Cependant, des travaux supplémentaires sont nécessaires pour comprendre les fondements biocomportementaux et le rôle causal potentiel des infections dans d’autres affections neuropsychiatriques, dont le syndrome neuropsychiatrique pédiatrique à début aigu et le trouble neuropsychiatrique pédiatrique auto-immun associé aux infections streptococciques.</p><h4>Facteurs modifiant l’évolution</h4><p>L’anxiété, l’excitation et l’épuisement accentuent les tics ; ceux-ci s’améliorent pendant les activités calmes et concentrées. Par exemple, de nombreuses personnes ont habituellement moins de tics lorsqu’elles effectuent des tâches nécessitant une attention soutenue et un contrôle moteur. Les événements stressants ou excitants, comme passer un examen ou participer à des activités excitantes, aggravent souvent les tics.</p>"},{"title":"Questions diagnostiques liées à la culture","kind":"culture","pdf":[285,285],"html":"<p>Les caractéristiques cliniques, l’évolution et l’étiologie des troubles de tics ne semblent pas varier selon l’origine ethnique, racialisée et culturelle. Toutefois, ces origines peuvent influencer la façon dont les troubles sont perçus et pris en charge dans la famille et la communauté, et ainsi les modalités de recherche d’aide et les choix thérapeutiques, comme l’âge de présentation aux services spécialisés. Par exemple, la distance sociale souhaitée à l’égard des personnes ayant des tics — lors du travail ou des études en commun — était plus importante dans un échantillon coréen que dans les études américaines.</p>"},{"title":"Questions diagnostiques liées au sexe et au genre","kind":"gender","pdf":[285,286],"html":"<p>Les sujets masculins sont plus souvent atteints que les sujets féminins, mais il n’existe pas de différence entre les sexes concernant les types de tics, l’âge de début ou l’évolution. Les femmes ayant des tics persistants peuvent être plus susceptibles de présenter une anxiété et une dépression.</p>"},{"title":"Association avec les pensées ou comportements suicidaires","kind":"suicide","pdf":[286,286],"html":"<p>Une étude cas-cohorte appariée conduite en Suède de 1969 à 2013 a montré que les personnes ayant un syndrome de Tourette ou des tics moteurs ou vocaux persistants (chroniques) présentent un risque nettement accru de tentative de suicide (odds ratio de 3,86) et de décès par suicide (odds ratio de 4,39), même après ajustement pour les comorbidités psychiatriques, par rapport à des témoins appariés de la population générale. La persistance des tics au-delà du jeune âge adulte et une tentative de suicide antérieure étaient les prédicteurs les plus forts du décès par suicide. Des données cas-témoins suggèrent qu’environ un jeune sur dix ayant des tics moteurs ou vocaux persistants (chroniques) présente des pensées et/ou comportements suicidaires, particulièrement dans un contexte de colère ou de frustration, en association avec l’anxiété ou la dépression, des difficultés sociales ou un retrait, l’agressivité et des problèmes internalisés, la sévérité des tics et leur retentissement.</p>"},{"title":"Conséquences fonctionnelles des tics","kind":"functional","pdf":[286,287],"html":"<p>De nombreuses personnes ayant des tics de sévérité légère à moyenne n’éprouvent ni détresse ni altération du fonctionnement et peuvent même ne pas avoir conscience de leurs tics. Les personnes ayant des symptômes plus sévères ont généralement davantage de difficultés dans la vie quotidienne, mais même des personnes ayant des tics moyens ou graves peuvent bien fonctionner. Une affection associée, telle qu’un TDAH ou un TOC, peut avoir davantage d’impact sur le fonctionnement que les tics eux-mêmes. Moins fréquemment, les tics perturbent les activités quotidiennes et entraînent isolement social, conflits interpersonnels, victimisation par les pairs, impossibilité de travailler ou d’aller à l’école et baisse de qualité de vie. Les personnes ont souvent du mal à concentrer leur attention sur les tâches professionnelles lorsqu’elles essaient activement de supprimer leurs tics. Elles peuvent aussi éprouver une détresse psychologique importante, voire des pensées suicidaires. Les complications rares du syndrome de Tourette comprennent des blessures physiques, comme des lésions oculaires provoquées par des coups portés au visage, et des lésions orthopédiques ou neurologiques, par exemple une pathologie discale liée à des mouvements violents de la tête et du cou.</p>"},{"title":"Diagnostic différentiel","kind":"differential","pdf":[287,288],"html":"<h4>Mouvements anormaux pouvant accompagner d’autres affections médicales, notamment d’autres troubles du mouvement</h4><p>Les stéréotypies motrices sont définies comme des mouvements involontaires rythmiques, répétitifs et prévisibles, qui paraissent intentionnels mais ne remplissent pas de fonction adaptative évidente. Elles sont souvent autoapaisantes ou agréables et s’arrêtent avec la distraction. Les exemples comprennent les mouvements répétitifs d’agitation ou de rotation des mains, les battements des bras et les mouvements des doigts. Elles peuvent habituellement être différenciées des tics par leur début plus précoce, souvent avant 3 ans, leur durée prolongée de quelques secondes à plusieurs minutes, leur caractère répétitif et rythmique dans la forme et la localisation, l’absence de sensation ou de besoin prémonitoire et leur arrêt avec la distraction, comme entendre son nom ou être touché. La chorée correspond à des mouvements rapides, aléatoires, continus, brusques, irréguliers, imprévisibles et non stéréotypés, habituellement bilatéraux, qui touchent toutes les parties du corps : visage, tronc et membres. Leur moment d’apparition, leur direction et leur répartition varient d’un instant à l’autre ; les mouvements s’aggravent habituellement lors des tentatives d’action volontaire. La dystonie est une contraction simultanée et soutenue de muscles agonistes et antagonistes, entraînant une posture ou un mouvement déformé de parties du corps. Les postures dystoniques sont souvent déclenchées par des tentatives de mouvements volontaires et ne sont pas observées pendant le sommeil.</p><h4>Dyskinésies paroxystiques</h4><p>Les dyskinésies paroxystiques se caractérisent par des mouvements involontaires épisodiques, dystoniques ou choréoathétosiques, déclenchés par un mouvement volontaire ou un effort, et survenant moins fréquemment à partir d’une activité de fond habituelle.</p><h4>Myoclonies</h4><p>Une myoclonie se caractérise par un mouvement soudain unidirectionnel, souvent non rythmique. Elle peut être aggravée par le mouvement et survenir pendant le sommeil. Elle se distingue des tics par sa rapidité, l’impossibilité de la supprimer et l’absence de sensation ou de besoin prémonitoire.</p><h4>Troubles obsessionnels-compulsifs et apparentés</h4><p>Distinguer les compulsions du TOC des tics complexes peut être difficile, d’autant qu’ils sont fréquemment associés chez une même personne. Les compulsions visent à prévenir ou à réduire l’anxiété ou la détresse et sont habituellement réalisées en réponse à une obsession, comme une peur de contamination. À l’inverse, de nombreuses personnes ayant des tics ressentent la nécessité d’effectuer l’action d’une certaine façon, symétriquement des deux côtés du corps, un certain nombre de fois ou jusqu’à obtenir une sensation de « juste comme il faut ». Les troubles des comportements répétitifs centrés sur le corps — arrachage persistant de cheveux, triturage de la peau, rongement des ongles — sont davantage orientés vers un but et plus complexes que les tics.</p><h4>Tics fonctionnels</h4><p>Des troubles fonctionnels doivent également être envisagés lorsqu’une personne présente des « attaques de tics » qui peuvent se prolonger pendant des durées allant de 15 minutes à plusieurs heures.</p>"},{"title":"Comorbidité","kind":"comorbidity","pdf":[288,288],"html":"<p>De nombreuses affections médicales et psychiatriques ont été décrites en association avec les tics ; le TDAH, les comportements perturbateurs et le TOC et les troubles apparentés sont particulièrement fréquents. Les enfants ayant un TDAH peuvent présenter des comportements perturbateurs, une immaturité sociale et des difficultés d’apprentissage qui interfèrent avec les progrès scolaires et les relations interpersonnelles et entraînent davantage d’altération que les tics eux-mêmes. Les symptômes obsessionnels-compulsifs observés dans les troubles de tics tendent à débuter plus tôt et sont souvent caractérisés par un besoin de symétrie et d’exactitude et/ou par des pensées interdites ou taboues, comme des obsessions agressives, sexuelles ou religieuses et les compulsions associées. Les personnes ayant des tics peuvent aussi présenter d’autres troubles du mouvement, par exemple une chorée de Sydenham ou un trouble des mouvements stéréotypés, ainsi que d’autres affections neurodéveloppementales et psychiatriques, telles qu’un TSA ou un trouble spécifique des apprentissages. Comme indiqué plus haut, les adolescents et adultes ayant des tics présentent un risque accru de développer un trouble de l’humeur, un trouble anxieux ou un trouble lié à l’usage de substances.</p>"}]},{"id":"tics-provisoires","family":"moteurs","title":"Tics provisoires","english":"Provisional Tic Disorder","codes":["F95.0"],"aliases":["tic provisoire","tics transitoires","tics récents"],"pages":"93–98","pdf":[280,288],"criteriaPages":"93","criteriaPdf":[280,280],"related":["tourette","tics-persistants","tics-non-specifies"],"chapter":"neurodev","sections":[{"title":"Critères diagnostiques","kind":"criteria","pdf":[280,280],"html":"<p><strong>F95.0</strong></p><p><strong>Note :</strong> Un tic est un mouvement moteur ou une vocalisation soudain, rapide, récurrent et non rythmique.</p><p><strong>A.</strong> Un ou plusieurs tics moteurs et/ou vocaux.</p><p><strong>B.</strong> Les tics sont présents depuis moins d’un an depuis l’apparition du premier tic.</p><p><strong>C.</strong> Le début se situe avant l’âge de 18 ans.</p><p><strong>D.</strong> La perturbation n’est pas attribuable aux effets physiologiques d’une substance, par exemple la cocaïne, ou à une autre affection médicale, par exemple une maladie de Huntington ou une encéphalite postvirale.</p><p><strong>E.</strong> Les critères d’un syndrome de Tourette ou de tics moteurs ou vocaux persistants (chroniques) n’ont jamais été remplis.</p>"},{"title":"Spécifications","kind":"specifiers","pdf":[280,280],"html":"<p>La spécification « avec tics moteurs seulement » ou « avec tics vocaux seulement » n’est requise que pour les tics moteurs ou vocaux persistants (chroniques).</p>"},{"title":"Caractéristiques diagnostiques","kind":"clinical","pdf":[280,283],"html":"<p>Les troubles de tics comprennent cinq catégories diagnostiques : le syndrome de Tourette, les tics moteurs ou vocaux persistants (chroniques), les tics provisoires, les autres tics spécifiés et les tics non spécifiés. Le diagnostic de chacun des troubles spécifiques repose sur la présence de tics moteurs et/ou vocaux (critère A), leur durée (critère B), l’âge de début (critère C) et l’absence de cause connue, telle qu’une autre affection médicale ou un usage de substances (critère D). Les diagnostics sont organisés de manière hiérarchique : syndrome de Tourette, puis tics moteurs ou vocaux persistants [chroniques], puis tics provisoires, puis autres tics spécifiés et tics non spécifiés. Une fois qu’un trouble a été diagnostiqué à un niveau de cette hiérarchie, un diagnostic d’un niveau inférieur ne peut pas être posé (critère E).</p><p>Les tics sont habituellement des mouvements moteurs ou des vocalisations soudains, rapides, récurrents et non rythmiques. Certains tics moteurs peuvent être des mouvements de torsion ou de contraction plus lents, de durée variable. Une personne peut présenter différents tics au fil du temps, mais à tout moment le répertoire de tics peut se répéter d’une manière caractéristique. Bien que les tics puissent concerner presque n’importe quel groupe musculaire ou vocalisation, certains, tels que les clignements des yeux ou le raclement de gorge, sont fréquents dans les différentes populations de patients. Une sensation désagréable localisée (sensation prémonitoire) précède souvent le tic, et la plupart des personnes rapportent un « besoin » de le réaliser. Les tics sont donc généralement vécus comme involontaires, mais certains peuvent être supprimés volontairement pendant des durées variables.</p><p>Le fait de parler explicitement des tics peut les déclencher. De même, observer un geste ou entendre un son chez une autre personne peut conduire une personne ayant des tics à produire un geste ou un son similaire, que les autres peuvent interpréter à tort comme intentionnel. Cela peut être particulièrement problématique lors d’interactions avec des figures d’autorité qui n’ont pas une compréhension adéquate des tics, comme des enseignants, supérieurs hiérarchiques ou policiers.</p><p>Les tics sont classiquement qualifiés de simples ou de complexes. Les tics moteurs simples se caractérisent par l’implication limitée de groupes musculaires spécifiques, sont souvent de courte durée et peuvent comprendre des clignements des yeux, des grimaces, des haussements d’épaules ou une extension des extrémités. Les tics vocaux simples comprennent les raclements de gorge, reniflements, petits cris, aboiements ou grognements, souvent produits par la contraction du diaphragme ou des muscles de l’oropharynx. Les tics moteurs complexes sont plus prolongés et comprennent souvent une combinaison de tics simples, par exemple tourner la tête et hausser les épaules simultanément. Les tics complexes peuvent paraître intentionnels, tels que des gestes de la tête ou des mouvements du torse. Ils peuvent aussi comporter l’imitation des mouvements d’autrui (échopraxie), ou des gestes sexuels ou interdits (copropraxie). De même, les tics vocaux complexes ont une signification linguistique — mots ou parties de mots — et peuvent comprendre la répétition de ses propres sons ou mots (palilalie), la répétition du dernier mot ou de la dernière phrase entendus (écholalie), ou l’émission de mots socialement inacceptables, y compris des obscénités ou des insultes ethniques, raciales ou religieuses (coprolalie). Il est important de noter que la coprolalie est une émission brusque et aiguë, de type aboiement ou grognement, sans la prosodie des paroles inappropriées similaires observées dans les interactions humaines.</p><p>La présence de tics moteurs et/ou vocaux varie entre les cinq troubles (critère A). Dans le syndrome de Tourette, les tics moteurs et vocaux doivent tous deux être présents, sans l’être nécessairement en même temps ; dans les tics moteurs ou vocaux persistants (chroniques), seuls des tics moteurs ou seuls des tics vocaux sont présents. Dans les tics provisoires, des tics moteurs et/ou vocaux peuvent être présents. Dans les autres tics spécifiés ou non spécifiés, les tics ou symptômes ressemblant à des tics sont mieux caractérisés comme des tics, mais leur présentation ou leur âge de début sont atypiques, ou leur étiologie est connue.</p><p>Le critère de durée minimale d’un an (critère B) garantit que les personnes recevant un diagnostic de syndrome de Tourette ou de tics moteurs ou vocaux persistants (chroniques) ont présenté des symptômes persistants. La sévérité des tics fluctue et certaines personnes peuvent avoir des intervalles de plusieurs semaines ou mois sans tics. Cependant, une personne ayant des tics depuis plus d’un an à compter du premier tic est considérée comme présentant des symptômes persistants, indépendamment des périodes intermittentes sans tics. Chez une personne présentant des tics moteurs et/ou vocaux depuis moins d’un an à compter du premier tic, un diagnostic de tics provisoires peut être envisagé. Les tics doivent débuter avant l’âge de 18 ans (critère C). Les troubles de tics commencent habituellement pendant la période prépubertaire, à un âge moyen de 4 à 6 ans ; l’incidence des premiers débuts diminue à la fin de l’adolescence. Un premier début à l’âge adulte est extrêmement rare et souvent associé à des expositions à des substances illicites, comme un usage excessif de cocaïne, à une atteinte du système nerveux central ou à un trouble neurologique fonctionnel. Bien qu’un premier début soit inhabituel chez l’adolescent et l’adulte, il n’est pas rare qu’ils consultent pour une première évaluation diagnostique et qu’une évaluation attentive retrouve des antécédents de tics plus légers remontant à l’enfance, même si les phases antérieures du développement comprenaient des périodes de plusieurs mois ou années sans tics. L’apparition initiale de mouvements anormaux évoquant des tics hors de la tranche d’âge habituelle doit conduire à rechercher d’autres troubles du mouvement, notamment des mouvements complexes ou des vocalisations fonctionnels ressemblant à des tics.</p><p>Les tics ne peuvent pas être attribuables aux effets physiologiques d’une substance ou à une autre affection médicale (critère D). Lorsque l’histoire, l’examen physique et/ou les résultats biologiques apportent des éléments solides en faveur d’une cause plausible, proche et probable, un diagnostic d’autres tics spécifiés doit être utilisé.</p><p>Le fait d’avoir antérieurement rempli les critères du syndrome de Tourette exclut un diagnostic de tics moteurs ou vocaux persistants (chroniques) (critère E). De même, un diagnostic antérieur de tics moteurs ou vocaux persistants (chroniques) exclut un diagnostic de tics provisoires, d’autres tics spécifiés ou de tics non spécifiés (critère E).</p>"},{"title":"Prévalence","kind":"prevalence","pdf":[283,283],"html":"<p>Les tics sont fréquents pendant l’enfance mais transitoires dans la plupart des cas. Une enquête nationale américaine a estimé à 3 pour 1 000 la prévalence des cas cliniquement repérés. Leur fréquence était plus faible chez les Afro-Américains et les personnes Latinx, ce qui peut être lié aux différences d’accès aux soins. La prévalence estimée du syndrome de Tourette au Canada varie de 3 à 9 pour 1 000 chez les enfants d’âge scolaire. Globalement, les sujets masculins sont plus souvent atteints que les sujets féminins, avec un rapport variant de 2:1 à 4:1. Les études épidémiologiques montrent la présence de tics chez les enfants de tous les continents, mais les taux exacts de prévalence sont influencés par les différences méthodologiques des recherches.</p>"},{"title":"Développement et évolution","kind":"course","pdf":[283,284],"html":"<p>Les tics débutent habituellement entre 4 et 6 ans. Le clignement des yeux est particulièrement caractéristique comme symptôme initial. Le pic de sévérité survient entre 10 et 12 ans, puis la sévérité diminue pendant l’adolescence. De nombreux adultes ayant des tics présentent une diminution des symptômes. Toutefois, une proportion des personnes conserve des symptômes sévères ou connaît une aggravation à l’âge adulte.</p><p>Les tics se manifestent de façon similaire dans tous les groupes d’âge et tout au long de la vie. Leur sévérité — fréquence et intensité — fluctue et, avec le temps, les groupes musculaires concernés et la nature des vocalisations changent. De nombreuses personnes, y compris de jeunes enfants, rapportent une sensation corporelle localisée précédant le tic et un besoin prémonitoire de bouger. Il peut être difficile de trouver les mots pour décrire ces sensations et ces besoins. Les tics associés à un besoin prémonitoire peuvent être vécus comme pas totalement « involontaires », dans la mesure où l’on peut résister au besoin et au tic. Une personne peut aussi ressentir la nécessité de répéter un tic ou de le réaliser d’une manière particulière jusqu’à avoir le sentiment qu’il a été fait « exactement comme il faut ». L’expression du tic ou d’une série de tics est souvent suivie d’un soulagement et d’une diminution de la tension.</p><p>La vulnérabilité à l’apparition d’affections associées change à mesure que les personnes traversent les âges de risque de ces différentes affections. Par exemple, les enfants prépubères ayant des tics sont plus susceptibles de présenter un TDAH, un TOC et une anxiété de séparation associés. Les adolescents et adultes sont plus vulnérables à l’apparition de troubles de l’humeur et de troubles anxieux ainsi que de troubles liés à l’usage de substances.</p>"},{"title":"Facteurs de risque et pronostiques","kind":"risk","pdf":[284,285],"html":"<h4>Environnementaux</h4><p>Au début du développement cérébral, plusieurs facteurs de risque environnementaux ont été identifiés, dont l’âge paternel avancé et des événements indésirables pré- et périnataux : altération de la croissance fœtale, fièvre maternelle pendant l’accouchement, tabagisme maternel, stress psychosocial maternel sévère, naissance prématurée, présentation du siège et accouchement par césarienne.</p><h4>Génétiques et physiologiques</h4><p>Les facteurs génétiques influencent l’expression et la sévérité des tics. L’héritabilité des troubles de tics est estimée entre 70 % et 85 %, sans différence de risque familial ou d’héritabilité entre sujets masculins et féminins. Des allèles de risque importants pour le syndrome de Tourette et des variants génétiques rares dans les familles ayant des tics ont été identifiés. Des variants génétiques communs ont aussi été identifiés. Ils sont partagés entre les troubles de tics selon un gradient corrélé à la sévérité de la maladie. Les troubles de tics existent probablement sur un continuum développemental, tant du point de vue phénoménologique que génétique.</p><p>Les troubles de tics chroniques partagent une variance génétique avec le TOC, le TDAH et d’autres troubles du neurodéveloppement, dont le TSA. De plus, les personnes ayant des tics présentent un risque accru de développer une maladie auto-immune, par exemple une thyroïdite de Hashimoto. Il apparaît de plus en plus clairement que le système immunitaire et la neuro-inflammation jouent des rôles importants dans la pathobiologie des tics, au moins dans un sous-groupe de personnes atteintes, par exemple celles ayant une chorée de Sydenham. Cependant, des travaux supplémentaires sont nécessaires pour comprendre les fondements biocomportementaux et le rôle causal potentiel des infections dans d’autres affections neuropsychiatriques, dont le syndrome neuropsychiatrique pédiatrique à début aigu et le trouble neuropsychiatrique pédiatrique auto-immun associé aux infections streptococciques.</p><h4>Facteurs modifiant l’évolution</h4><p>L’anxiété, l’excitation et l’épuisement accentuent les tics ; ceux-ci s’améliorent pendant les activités calmes et concentrées. Par exemple, de nombreuses personnes ont habituellement moins de tics lorsqu’elles effectuent des tâches nécessitant une attention soutenue et un contrôle moteur. Les événements stressants ou excitants, comme passer un examen ou participer à des activités excitantes, aggravent souvent les tics.</p>"},{"title":"Questions diagnostiques liées à la culture","kind":"culture","pdf":[285,285],"html":"<p>Les caractéristiques cliniques, l’évolution et l’étiologie des troubles de tics ne semblent pas varier selon l’origine ethnique, racialisée et culturelle. Toutefois, ces origines peuvent influencer la façon dont les troubles sont perçus et pris en charge dans la famille et la communauté, et ainsi les modalités de recherche d’aide et les choix thérapeutiques, comme l’âge de présentation aux services spécialisés. Par exemple, la distance sociale souhaitée à l’égard des personnes ayant des tics — lors du travail ou des études en commun — était plus importante dans un échantillon coréen que dans les études américaines.</p>"},{"title":"Questions diagnostiques liées au sexe et au genre","kind":"gender","pdf":[285,286],"html":"<p>Les sujets masculins sont plus souvent atteints que les sujets féminins, mais il n’existe pas de différence entre les sexes concernant les types de tics, l’âge de début ou l’évolution. Les femmes ayant des tics persistants peuvent être plus susceptibles de présenter une anxiété et une dépression.</p>"},{"title":"Association avec les pensées ou comportements suicidaires","kind":"suicide","pdf":[286,286],"html":"<p>Une étude cas-cohorte appariée conduite en Suède de 1969 à 2013 a montré que les personnes ayant un syndrome de Tourette ou des tics moteurs ou vocaux persistants (chroniques) présentent un risque nettement accru de tentative de suicide (odds ratio de 3,86) et de décès par suicide (odds ratio de 4,39), même après ajustement pour les comorbidités psychiatriques, par rapport à des témoins appariés de la population générale. La persistance des tics au-delà du jeune âge adulte et une tentative de suicide antérieure étaient les prédicteurs les plus forts du décès par suicide. Des données cas-témoins suggèrent qu’environ un jeune sur dix ayant des tics moteurs ou vocaux persistants (chroniques) présente des pensées et/ou comportements suicidaires, particulièrement dans un contexte de colère ou de frustration, en association avec l’anxiété ou la dépression, des difficultés sociales ou un retrait, l’agressivité et des problèmes internalisés, la sévérité des tics et leur retentissement.</p>"},{"title":"Conséquences fonctionnelles des tics","kind":"functional","pdf":[286,287],"html":"<p>De nombreuses personnes ayant des tics de sévérité légère à moyenne n’éprouvent ni détresse ni altération du fonctionnement et peuvent même ne pas avoir conscience de leurs tics. Les personnes ayant des symptômes plus sévères ont généralement davantage de difficultés dans la vie quotidienne, mais même des personnes ayant des tics moyens ou graves peuvent bien fonctionner. Une affection associée, telle qu’un TDAH ou un TOC, peut avoir davantage d’impact sur le fonctionnement que les tics eux-mêmes. Moins fréquemment, les tics perturbent les activités quotidiennes et entraînent isolement social, conflits interpersonnels, victimisation par les pairs, impossibilité de travailler ou d’aller à l’école et baisse de qualité de vie. Les personnes ont souvent du mal à concentrer leur attention sur les tâches professionnelles lorsqu’elles essaient activement de supprimer leurs tics. Elles peuvent aussi éprouver une détresse psychologique importante, voire des pensées suicidaires. Les complications rares du syndrome de Tourette comprennent des blessures physiques, comme des lésions oculaires provoquées par des coups portés au visage, et des lésions orthopédiques ou neurologiques, par exemple une pathologie discale liée à des mouvements violents de la tête et du cou.</p>"},{"title":"Diagnostic différentiel","kind":"differential","pdf":[287,288],"html":"<h4>Mouvements anormaux pouvant accompagner d’autres affections médicales, notamment d’autres troubles du mouvement</h4><p>Les stéréotypies motrices sont définies comme des mouvements involontaires rythmiques, répétitifs et prévisibles, qui paraissent intentionnels mais ne remplissent pas de fonction adaptative évidente. Elles sont souvent autoapaisantes ou agréables et s’arrêtent avec la distraction. Les exemples comprennent les mouvements répétitifs d’agitation ou de rotation des mains, les battements des bras et les mouvements des doigts. Elles peuvent habituellement être différenciées des tics par leur début plus précoce, souvent avant 3 ans, leur durée prolongée de quelques secondes à plusieurs minutes, leur caractère répétitif et rythmique dans la forme et la localisation, l’absence de sensation ou de besoin prémonitoire et leur arrêt avec la distraction, comme entendre son nom ou être touché. La chorée correspond à des mouvements rapides, aléatoires, continus, brusques, irréguliers, imprévisibles et non stéréotypés, habituellement bilatéraux, qui touchent toutes les parties du corps : visage, tronc et membres. Leur moment d’apparition, leur direction et leur répartition varient d’un instant à l’autre ; les mouvements s’aggravent habituellement lors des tentatives d’action volontaire. La dystonie est une contraction simultanée et soutenue de muscles agonistes et antagonistes, entraînant une posture ou un mouvement déformé de parties du corps. Les postures dystoniques sont souvent déclenchées par des tentatives de mouvements volontaires et ne sont pas observées pendant le sommeil.</p><h4>Dyskinésies paroxystiques</h4><p>Les dyskinésies paroxystiques se caractérisent par des mouvements involontaires épisodiques, dystoniques ou choréoathétosiques, déclenchés par un mouvement volontaire ou un effort, et survenant moins fréquemment à partir d’une activité de fond habituelle.</p><h4>Myoclonies</h4><p>Une myoclonie se caractérise par un mouvement soudain unidirectionnel, souvent non rythmique. Elle peut être aggravée par le mouvement et survenir pendant le sommeil. Elle se distingue des tics par sa rapidité, l’impossibilité de la supprimer et l’absence de sensation ou de besoin prémonitoire.</p><h4>Troubles obsessionnels-compulsifs et apparentés</h4><p>Distinguer les compulsions du TOC des tics complexes peut être difficile, d’autant qu’ils sont fréquemment associés chez une même personne. Les compulsions visent à prévenir ou à réduire l’anxiété ou la détresse et sont habituellement réalisées en réponse à une obsession, comme une peur de contamination. À l’inverse, de nombreuses personnes ayant des tics ressentent la nécessité d’effectuer l’action d’une certaine façon, symétriquement des deux côtés du corps, un certain nombre de fois ou jusqu’à obtenir une sensation de « juste comme il faut ». Les troubles des comportements répétitifs centrés sur le corps — arrachage persistant de cheveux, triturage de la peau, rongement des ongles — sont davantage orientés vers un but et plus complexes que les tics.</p><h4>Tics fonctionnels</h4><p>Des troubles fonctionnels doivent également être envisagés lorsqu’une personne présente des « attaques de tics » qui peuvent se prolonger pendant des durées allant de 15 minutes à plusieurs heures.</p>"},{"title":"Comorbidité","kind":"comorbidity","pdf":[288,288],"html":"<p>De nombreuses affections médicales et psychiatriques ont été décrites en association avec les tics ; le TDAH, les comportements perturbateurs et le TOC et les troubles apparentés sont particulièrement fréquents. Les enfants ayant un TDAH peuvent présenter des comportements perturbateurs, une immaturité sociale et des difficultés d’apprentissage qui interfèrent avec les progrès scolaires et les relations interpersonnelles et entraînent davantage d’altération que les tics eux-mêmes. Les symptômes obsessionnels-compulsifs observés dans les troubles de tics tendent à débuter plus tôt et sont souvent caractérisés par un besoin de symétrie et d’exactitude et/ou par des pensées interdites ou taboues, comme des obsessions agressives, sexuelles ou religieuses et les compulsions associées. Les personnes ayant des tics peuvent aussi présenter d’autres troubles du mouvement, par exemple une chorée de Sydenham ou un trouble des mouvements stéréotypés, ainsi que d’autres affections neurodéveloppementales et psychiatriques, telles qu’un TSA ou un trouble spécifique des apprentissages. Comme indiqué plus haut, les adolescents et adultes ayant des tics présentent un risque accru de développer un trouble de l’humeur, un trouble anxieux ou un trouble lié à l’usage de substances.</p>"}]},{"id":"tics-autres","family":"moteurs","title":"Autres tics spécifiés","english":"Other Specified Tic Disorder","codes":["F95.8"],"aliases":["tic autre spécifié","tics début adulte","tics atypiques"],"pages":"98","pdf":[288,289],"kind":"description","related":["tourette","tics-persistants","tics-non-specifies"],"chapter":"neurodev","sections":[{"title":"Définition","kind":"criteria","pdf":[288,289],"html":"<p><strong>F95.8</strong></p><p>Cette catégorie s’applique aux présentations dans lesquelles prédominent des symptômes caractéristiques d’un trouble de tics, entraînant une détresse cliniquement significative ou une altération du fonctionnement social, professionnel ou d’autres domaines importants, sans remplir l’ensemble des critères d’un trouble de tics ni d’aucun des troubles de la classe diagnostique des troubles du neurodéveloppement. La catégorie des autres tics spécifiés est utilisée lorsque le clinicien choisit de communiquer la raison précise pour laquelle la présentation ne remplit pas les critères d’un trouble de tics ou d’un trouble neurodéveloppemental spécifique. Cela consiste à consigner « autres tics spécifiés », suivi de la raison précise, par exemple « avec un début après l’âge de 18 ans ».</p>"}]},{"id":"tics-non-specifies","family":"moteurs","title":"Tics non spécifiés","english":"Unspecified Tic Disorder","codes":["F95.9"],"aliases":["tic non précisé","tics non spécifiés"],"pages":"98","pdf":[289,289],"kind":"description","related":["tourette","tics-persistants","tics-autres"],"chapter":"neurodev","sections":[{"title":"Définition","kind":"criteria","pdf":[289,289],"html":"<p><strong>F95.9</strong></p><p>Cette catégorie s’applique aux présentations dans lesquelles prédominent des symptômes caractéristiques d’un trouble de tics, entraînant une détresse cliniquement significative ou une altération du fonctionnement social, professionnel ou d’autres domaines importants, sans remplir l’ensemble des critères d’un trouble de tics ni d’aucun des troubles de la classe diagnostique des troubles du neurodéveloppement. La catégorie des tics non spécifiés est utilisée lorsque le clinicien choisit de ne pas préciser la raison pour laquelle les critères d’un trouble de tics ou d’un trouble neurodéveloppemental spécifique ne sont pas remplis. Elle comprend les présentations pour lesquelles les informations sont insuffisantes pour établir un diagnostic plus précis.</p>"}]},{"id":"neurodev-autre","family":"autres","title":"
