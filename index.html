s éléments suivants, actuellement ou dans les antécédents (les exemples sont illustratifs et non exhaustifs ; voir le texte) :</p>\n<ol><li>Déficits de la réciprocité socio-émotionnelle, allant, par exemple, d'une approche sociale anormale et d'une incapacité à entretenir les échanges conversationnels habituels, à un partage réduit des intérêts, des émotions ou des affects, jusqu'à l'incapacité d'initier des interactions sociales ou d'y répondre.</li><li>Déficits des comportements de communication non verbale utilisés dans l'interaction sociale, allant, par exemple, d'une communication verbale et non verbale mal intégrée, à des anomalies du contact visuel et du langage corporel ou à des déficits dans la compréhension et l'utilisation des gestes, jusqu'à une absence totale d'expressions faciales et de communication non verbale.</li><li>Déficits dans le développement, le maintien et la compréhension des relations, allant, par exemple, de difficultés à ajuster son comportement aux différents contextes sociaux, à des difficultés à partager des jeux imaginatifs ou à se faire des amis, jusqu'à l'absence d'intérêt pour les pairs.</li></ol>\n<p><strong>B.</strong> Caractère restreint et répétitif des comportements, intérêts ou activités, se manifestant par <strong>au moins deux</strong> des éléments suivants, actuellement ou dans les antécédents (les exemples sont illustratifs et non exhaustifs ; voir le texte) :</p>\n<ol><li>Mouvements moteurs, utilisation d'objets ou parole stéréotypés ou répétitifs (p. ex. stéréotypies motrices simples, alignement de jouets ou retournement répété d'objets, écholalie, expressions idiosyncrasiques).</li><li>Insistance sur l'immuabilité, adhésion inflexible aux routines ou comportements verbaux ou non verbaux ritualisés (p. ex. détresse extrême face à de petits changements, difficultés lors des transitions, modes de pensée rigides, rituels de salutation, besoin de suivre le même trajet ou de manger les mêmes aliments chaque jour).</li><li>Intérêts très restreints et fixes, anormaux par leur intensité ou leur objet (p. ex. attachement marqué à des objets inhabituels ou préoccupation à leur égard, intérêts excessivement circonscrits ou persévérants).</li><li>Hyper- ou hyporéactivité aux stimulations sensorielles ou intérêt inhabituel pour les aspects sensoriels de l'environnement (p. ex. indifférence apparente à la douleur ou à la température, réaction aversive à certains sons ou textures, flairage ou toucher excessif d'objets, fascination visuelle pour les lumières ou les mouvements).</li></ol>\n<p><strong>C.</strong> Les symptômes doivent être présents pendant la période développementale précoce (mais ils peuvent ne devenir pleinement manifestes que lorsque les exigences sociales dépassent les capacités limitées, ou être masqués plus tard par des stratégies apprises).</p>\n<p><strong>D.</strong> Les symptômes entraînent une altération cliniquement significative du fonctionnement social, professionnel ou d'autres domaines importants du fonctionnement actuel.</p>\n<p><strong>E.</strong> Ces perturbations ne sont pas mieux expliquées par un trouble du développement intellectuel (handicap intellectuel) ou un retard global du développement. Le trouble du développement intellectuel et le trouble du spectre de l'autisme sont fréquemment associés ; pour poser conjointement ces deux diagnostics, la communication sociale doit être inférieure à ce qui est attendu pour le niveau général de développement.</p>\n<p><strong>Note :</strong> Les personnes ayant un diagnostic DSM-IV bien établi de trouble autistique, de syndrome d'Asperger ou de trouble envahissant du développement non spécifié doivent recevoir le diagnostic de trouble du spectre de l'autisme. Les personnes présentant des déficits marqués de la communication sociale, mais dont les symptômes ne remplissent pas par ailleurs les critères du trouble du spectre de l'autisme, doivent être évaluées pour un trouble de la communication sociale (pragmatique).</p>\n<p><strong>Spécifier la sévérité actuelle</strong> selon les altérations de la communication sociale et les comportements restreints et répétitifs (voir tableau 2) :</p><ul><li>Nécessitant un soutien très important.</li><li>Nécessitant un soutien important.</li><li>Nécessitant un soutien.</li></ul>\n<p><strong>Spécifier si :</strong></p><ul><li>Avec ou sans altération intellectuelle associée.</li><li>Avec ou sans altération du langage associée.</li></ul>\n<p><strong>Spécifier si :</strong></p><ul><li>Associé à une affection génétique ou autre affection médicale connue, ou à un facteur environnemental. <strong>Note de codage :</strong> Utiliser un code supplémentaire pour identifier l'affection génétique ou autre affection médicale associée.</li><li>Associé à un problème neurodéveloppemental, mental ou comportemental.</li></ul>\n<p><strong>Spécifier si :</strong></p><ul><li>Avec catatonie (pour la définition, se référer aux critères de la catatonie associée à un autre trouble mental, p. 135). <strong>Note de codage :</strong> Utiliser le code supplémentaire F06.1, catatonie associée au trouble du spectre de l'autisme, pour indiquer la présence de la catatonie comorbide.</li></ul>"},{"title":"Tableau 2 — Niveaux de sévérité du trouble du spectre de l’autisme","kind":"specifiers","pdf":[214,215],"html":"<p>Exemples de niveaux de besoins de soutien.</p>\n<table><thead><tr><th>Niveau de sévérité</th><th>Communication sociale</th><th>Comportements restreints et répétitifs</th></tr></thead><tbody>\n<tr><th>Niveau 3<br>« Nécessitant un soutien très important »</th><td>Des déficits sévères des compétences de communication sociale verbale et non verbale entraînent des altérations sévères du fonctionnement, des initiatives d'interactions sociales très limitées et des réponses minimales aux sollicitations sociales d'autrui. Par exemple, une personne dont la parole intelligible se limite à quelques mots, qui initie rarement une interaction et qui, lorsqu'elle le fait, adopte des approches inhabituelles visant seulement à satisfaire ses besoins, et ne répond qu'aux approches sociales très directes.</td><td>L'inflexibilité du comportement, l'extrême difficulté à faire face au changement ou d'autres comportements restreints et répétitifs interfèrent fortement avec le fonctionnement dans tous les domaines. Grande détresse ou difficulté à changer d'objet d'attention ou d'action.</td></tr>\n<tr><th>Niveau 2<br>« Nécessitant un soutien important »</th><td>Déficits marqués des compétences de communication sociale verbale et non verbale ; altérations sociales apparentes même lorsque des soutiens sont en place ; initiatives d'interactions sociales limitées ; réponses réduites ou anormales aux sollicitations sociales d'autrui. Par exemple, une personne qui parle en phrases simples, dont les interactions sont limitées à des intérêts spécifiques étroits et dont la communication non verbale est nettement inhabituelle.</td><td>L'inflexibilité du comportement, les difficultés à faire face au changement ou d'autres comportements restreints et répétitifs sont assez fréquents pour être évidents pour un observateur occasionnel et interfèrent avec le fonctionnement dans divers contextes. Détresse ou difficulté à changer d'objet d'attention ou d'action.</td></tr>\n<tr><th>Niveau 1<br>« Nécessitant un soutien »</th><td>En l'absence de soutien, les déficits de communication sociale entraînent des altérations perceptibles. Difficulté à initier les interactions sociales, avec des exemples clairs de réponses atypiques ou inefficaces aux sollicitations sociales d'autrui. La personne peut paraître moins intéressée par les interactions sociales. Par exemple, une personne capable de parler en phrases complètes et qui s'engage dans la communication, mais dont les échanges conversationnels avec autrui échouent et dont les tentatives de se faire des amis sont inhabituelles et généralement infructueuses.</td><td>L'inflexibilité du comportement interfère de manière significative avec le fonctionnement dans un ou plusieurs contextes. Difficulté à passer d'une activité à une autre. Les problèmes d'organisation et de planification entravent l'autonomie.</td></tr>\n</tbody></table>"},{"title":"Procédures d’enregistrement","kind":"recording","pdf":[215,216],"html":"<p>Il peut être utile de noter le niveau de soutien nécessaire pour chacun des deux domaines psychopathologiques centraux du tableau 2 (p. ex. « nécessitant un soutien très important pour les déficits de communication sociale et nécessitant un soutien important pour les comportements restreints et répétitifs »). Il convient ensuite de consigner la spécification « avec altération intellectuelle associée » ou « sans altération intellectuelle associée », puis celle concernant l'altération du langage. En cas d'altération du langage associée, le niveau actuel de fonctionnement verbal doit être indiqué (p. ex. « avec altération du langage associée — absence de parole intelligible » ou « avec altération du langage associée — langage par phrases »).</p>\n<p>Pour les troubles du spectre de l'autisme auxquels s'appliquent les spécifications « associé à une affection génétique ou autre affection médicale connue, ou à un facteur environnemental » ou « associé à un problème neurodéveloppemental, mental ou comportemental », noter trouble du spectre de l'autisme associé à (nom de l'affection, du trouble ou du facteur) (p. ex. trouble du spectre de l'autisme associé à une sclérose tubéreuse de Bourneville). Ces spécifications s'appliquent aux présentations dans lesquelles l'affection ou le problème mentionné est potentiellement pertinent pour les soins cliniques de la personne ; elles ne signifient pas nécessairement que l'affection ou le problème est causalement lié au trouble du spectre de l'autisme. Si le problème neurodéveloppemental, mental ou comportemental associé remplit les critères d'un trouble neurodéveloppemental ou d'un autre trouble mental, le trouble du spectre de l'autisme et l'autre trouble doivent tous deux être diagnostiqués.</p>\n<p>Si une catatonie est présente, noter séparément « catatonie associée au trouble du spectre de l'autisme ». Pour plus d'informations, voir les critères de catatonie associée à un autre trouble mental dans le chapitre « Spectre de la schizophrénie et autres troubles psychotiques ».</p>"},{"title":"Spécifications","kind":"specifiers","pdf":[216,218],"html":"<p>Les spécifications de sévérité (voir tableau 2) peuvent servir à décrire succinctement la symptomatologie actuelle (qui peut se situer en dessous du niveau 1), en tenant compte du fait que la sévérité peut varier selon le contexte et fluctuer au cours du temps. La sévérité des difficultés de communication sociale et celle des comportements restreints et répétitifs doivent être évaluées séparément. Les catégories descriptives de sévérité ne doivent pas être utilisées pour déterminer l'éligibilité aux services ni leur attribution. En effet, les personnes ayant globalement de meilleures compétences peuvent rencontrer des difficultés psychosociales différentes, voire plus importantes. Les besoins en services ne peuvent donc être établis qu'individuellement, au moyen d'une discussion sur les priorités et objectifs personnels.</p>\n<p>Concernant la spécification « avec ou sans altération intellectuelle associée », la compréhension du profil intellectuel, souvent inégal, d'un enfant ou d'un adulte présentant un trouble du spectre de l'autisme est nécessaire à l'interprétation des caractéristiques diagnostiques. Des estimations distinctes des compétences verbales et non verbales sont nécessaires (p. ex. utiliser des tests non verbaux non chronométrés pour évaluer les points forts potentiels des personnes dont le langage est limité).</p>\n<p>Pour utiliser la spécification « avec ou sans altération du langage associée », le niveau actuel de fonctionnement verbal doit être évalué et décrit. Les descriptions précises accompagnant « avec altération du langage associée » peuvent notamment être : absence de parole intelligible (non verbal), mots isolés seulement, ou langage par phrases. Pour les personnes « sans altération du langage associée », le niveau de langage peut être précisé par « parle en phrases complètes » ou « langage fluent ». Comme le langage réceptif peut être en retard sur le développement du langage expressif dans le trouble du spectre de l'autisme, les compétences réceptives et expressives doivent être examinées séparément.</p>\n<p>La spécification « associé à une affection génétique ou autre affection médicale connue, ou à un facteur environnemental » peut être appliquée lorsqu'une personne présente une affection génétique connue (p. ex. syndrome de Rett, syndrome de l'X fragile, trisomie 21), une affection médicale connue (p. ex. épilepsie), ou des antécédents d'exposition in utero à un tératogène ou à une infection connus (p. ex. syndrome fœtal au valproate, syndrome d'alcoolisation fœtale, rubéole fœtale). Cette spécification ne doit pas être considérée comme synonyme de causalité du trouble du spectre de l'autisme. Une affection peut être indiquée comme associée au trouble du spectre de l'autisme lorsqu'elle est jugée potentiellement pertinente sur le plan clinique ou susceptible d'éclairer les soins, et non parce que le clinicien affirme une cause. Les exemples comprennent le trouble du spectre de l'autisme associé à une variation particulière du nombre de copies génomiques, susceptible d'avoir un intérêt clinique même si l'anomalie en question peut ne pas avoir directement causé le trouble ni lui avoir été précédemment liée, ou la maladie de Crohn, qui peut exacerber les symptômes comportementaux.</p>\n<p>La spécification « associé à un problème neurodéveloppemental, mental ou comportemental » peut être utilisée pour indiquer des problèmes (p. ex. irritabilité, problèmes de sommeil, comportements autoagressifs ou régression développementale) qui contribuent à la formulation fonctionnelle ou constituent une cible du traitement. Les troubles neurodéveloppementaux, mentaux ou comportementaux supplémentaires doivent également être notés comme diagnostics distincts (p. ex. déficit de l'attention/hyperactivité ; trouble développemental de la coordination ; troubles disruptifs, du contrôle des impulsions et des conduites ; troubles anxieux, dépressifs ou bipolaires ; tics ou syndrome de Tourette ; troubles de l'alimentation, de l'élimination ou du sommeil).</p>\n<p>La catatonie peut être une affection comorbide du trouble du spectre de l'autisme. Outre les symptômes classiques de maintien de postures, de négativisme (opposition ou absence de réponse aux consignes ou aux stimuli externes), de mutisme et de stupeur, une augmentation ou une aggravation des stéréotypies et des comportements autoagressifs peut appartenir au complexe symptomatique de la catatonie dans le contexte du trouble du spectre de l'autisme.</p>"},{"title":"Caractéristiques diagnostiques","kind":"clinical","pdf":[218,222],"html":"<p>Les caractéristiques essentielles du trouble du spectre de l'autisme sont une altération persistante de la communication sociale réciproque et des interactions sociales (critère A), ainsi que des comportements, intérêts ou activités restreints et répétitifs (critère B). Ces symptômes sont présents dès la petite enfance et limitent ou altèrent le fonctionnement quotidien (critères C et D). Le stade auquel l'altération fonctionnelle devient évidente varie selon les caractéristiques de la personne et de son environnement. Les caractéristiques diagnostiques centrales sont manifestes pendant la période développementale, mais l'intervention, la compensation et les soutiens actuels peuvent masquer les difficultés au moins dans certains contextes. Les manifestations du trouble varient également beaucoup selon la sévérité de la condition autistique, le niveau développemental, l'âge chronologique et, éventuellement, le genre ; d'où le terme de spectre. Chez les personnes sans altération cognitive ou langagière, les déficits (p. ex. critères A et B) peuvent se manifester plus subtilement que chez celles qui présentent une altération intellectuelle ou langagière associée, et elles peuvent déployer des efforts considérables pour les masquer. Les déficits de communication sociale du critère A seront plus subtils si la personne dispose de meilleures compétences globales de communication (p. ex. langage fluent, absence d'altération intellectuelle). De même, les déficits du critère B, c'est-à-dire les comportements et intérêts restreints, peuvent être moins évidents si les intérêts sont plus proches des normes habituelles pour l'âge (p. ex. l'Égypte ancienne ou les trains, plutôt que l'agitation d'une ficelle). Le trouble du spectre de l'autisme englobe les troubles autrefois désignés comme autisme infantile précoce, autisme de l'enfant, autisme de Kanner, autisme de haut niveau, autisme atypique, trouble envahissant du développement non spécifié, trouble désintégratif de l'enfance et syndrome d'Asperger.</p>\n<p>Les altérations de la communication sociale et des interactions sociales précisées au critère A sont envahissantes et durables. Les diagnostics sont les plus valides et les plus fiables lorsqu'ils reposent sur plusieurs sources d'information : observations du clinicien, histoire recueillie auprès des aidants et, lorsque cela est possible, autoévaluation. Les déficits verbaux et non verbaux de communication sociale se manifestent différemment selon l'âge, le niveau intellectuel et les capacités langagières de la personne, ainsi que selon d'autres facteurs tels que les traitements antérieurs et le soutien actuel. De nombreuses personnes présentent des déficits langagiers, allant d'une absence complète de parole à un retard de langage, une mauvaise compréhension de la parole, une parole en écho ou un langage guindé et excessivement littéral. Même lorsque les compétences formelles de langage (p. ex. vocabulaire, grammaire) sont intactes, l'utilisation du langage pour une communication sociale réciproque est altérée dans le trouble du spectre de l'autisme.</p>\n<p>Les déficits de réciprocité socio-émotionnelle, c'est-à-dire de la capacité à entrer en relation avec autrui et à partager pensées et sentiments, peuvent se manifester, par exemple, chez de jeunes enfants par peu ou pas d'initiatives d'interaction sociale et aucun partage d'émotions, ainsi que par une imitation réduite ou absente du comportement d'autrui. Le langage présent est souvent à sens unique, sans réciprocité sociale, et sert à demander ou à nommer plutôt qu'à commenter, partager des sentiments ou converser. Chez les enfants plus âgés et les adultes sans altération intellectuelle ni retard de langage, les déficits de réciprocité socio-émotionnelle peuvent apparaître surtout dans les difficultés à traiter les signaux sociaux complexes et à y répondre (p. ex. quand et comment se joindre à une conversation, ce qu'il ne faut pas dire). Les personnes ayant développé des stratégies de compensation pour certaines difficultés sociales continuent d'éprouver des difficultés dans les situations nouvelles ou sans soutien et souffrent de l'effort et de l'anxiété liés au calcul conscient de ce qui est socialement intuitif pour la plupart des personnes. Ce comportement peut contribuer à un moindre repérage du trouble du spectre de l'autisme chez ces personnes, peut-être particulièrement chez les femmes adultes. Des évaluations plus longues, une observation dans des situations naturelles et des questions sur le coût des interactions sociales peuvent donc être nécessaires. Interrogées sur ce coût, ces personnes peuvent, par exemple, répondre que les interactions sociales les épuisent, qu'elles ne peuvent se concentrer en raison de l'effort mental nécessaire pour surveiller les conventions sociales, que leur estime de soi souffre de ne pas pouvoir être elles-mêmes, et ainsi de suite.</p>\n<p>Les déficits des comportements de communication non verbale utilisés dans l'interaction sociale se manifestent par une utilisation absente, réduite ou atypique du contact visuel (par rapport aux normes culturelles), des gestes, des expressions faciales, de l'orientation du corps ou de l'intonation de la parole. Une caractéristique précoce du trouble du spectre de l'autisme est l'altération de l'attention conjointe : absence de pointage, de présentation ou d'apport d'objets pour partager un intérêt avec autrui, ou absence de suivi du pointage ou du regard de quelqu'un d'autre. Les personnes peuvent apprendre quelques gestes fonctionnels, mais leur répertoire est plus restreint que celui des autres et elles n'utilisent souvent pas spontanément des gestes expressifs dans la communication. Chez les jeunes et les adultes au langage fluent, la difficulté à coordonner communication non verbale et parole peut donner l'impression d'un « langage corporel » étrange, figé ou exagéré pendant les interactions. L'altération peut être relativement subtile à l'intérieur d'un mode particulier (p. ex. une personne peut avoir un assez bon contact visuel lorsqu'elle parle), mais être perceptible dans la mauvaise intégration du contact visuel, des gestes, de la posture corporelle, de la prosodie et de l'expression faciale au service de la communication sociale, ou dans la difficulté à les maintenir pendant une durée prolongée ou en situation de stress.</p>\n<p>Les déficits dans le développement, le maintien et la compréhension des relations doivent être appréciés au regard des normes d'âge, de genre et de culture. L'intérêt social peut être absent, réduit ou atypique, se traduisant par le rejet d'autrui, la passivité ou des approches inappropriées paraissant agressives ou perturbatrices. Ces difficultés sont particulièrement évidentes chez les jeunes enfants, chez lesquels le jeu social partagé et l'imagination font souvent défaut (p. ex. jeu de faire semblant souple et adapté à l'âge), puis qui insistent sur des règles de jeu très fixes. Les personnes plus âgées peuvent avoir du mal à comprendre quel comportement est approprié dans une situation et ne l'est pas dans une autre (p. ex. attitude désinvolte lors d'un entretien d'embauche), ou les différentes façons dont le langage peut servir à communiquer (p. ex. ironie, petits mensonges de politesse). Une préférence apparente peut exister pour les activités solitaires ou les interactions avec des personnes beaucoup plus jeunes ou plus âgées. Il existe souvent un désir de nouer des amitiés sans idée complète ou réaliste de ce qu'implique l'amitié (p. ex. amitiés à sens unique ou fondées uniquement sur des intérêts particuliers communs). Les relations avec la fratrie, les collègues et les aidants sont également importantes à considérer en termes de réciprocité.</p>\n<p>Le trouble du spectre de l'autisme est aussi défini par des comportements, intérêts ou activités restreints et répétitifs (comme le précise le critère B), dont les manifestations varient avec l'âge et les capacités, les interventions et les soutiens actuels. Les comportements stéréotypés ou répétitifs comprennent les stéréotypies motrices simples (p. ex. battements des mains, mouvements répétés des doigts), l'utilisation répétitive d'objets (p. ex. faire tourner des pièces de monnaie, aligner des jouets) et la parole répétitive (p. ex. écholalie, répétition immédiate ou différée des mots entendus ; utilisation de « tu » pour parler de soi ; utilisation stéréotypée de mots, de phrases ou de schémas prosodiques). L'adhésion excessive aux routines et les modes de comportement restreints peuvent se manifester par une résistance au changement (p. ex. détresse face à de petits changements apparents, comme emprunter un autre trajet pour aller à l'école ou au travail ; insistance pour respecter les règles ; rigidité de la pensée) ou par des comportements verbaux ou non verbaux ritualisés (p. ex. questions répétitives, marche répétée le long d'un périmètre). Les intérêts très restreints et fixes du trouble du spectre de l'autisme tendent à être anormaux par leur intensité ou leur objet (p. ex. un tout-petit fortement attaché à une casserole ou à un morceau de ficelle ; un enfant préoccupé par les aspirateurs ; un adulte passant des heures à recopier des horaires). Certaines fascinations et routines peuvent être liées à une hyper- ou hyporéactivité apparente aux stimulations sensorielles, se manifestant par des réactions extrêmes à certains sons ou textures, le flairage ou le toucher excessif d'objets, la fascination pour les lumières ou les objets qui tournent et, parfois, une indifférence apparente à la douleur, à la chaleur ou au froid. Les réactions extrêmes ou les rituels impliquant le goût, l'odeur, la texture ou l'aspect des aliments, ainsi que les restrictions alimentaires excessives, sont fréquents et peuvent constituer un motif de présentation du trouble du spectre de l'autisme.</p>\n<p>De nombreuses personnes présentant un trouble du spectre de l'autisme sans altération intellectuelle ou langagière apprennent à supprimer leurs comportements répétitifs en public. Chez elles, des comportements répétitifs tels que le balancement ou les mouvements répétés des doigts peuvent avoir une fonction anxiolytique ou d'auto-apaisement.</p>\n<p>Les intérêts particuliers peuvent être une source de plaisir et de motivation et offrir, plus tard dans la vie, des perspectives d'éducation et d'emploi. Les critères diagnostiques peuvent être remplis lorsque les comportements, intérêts ou activités restreints et répétitifs étaient clairement présents pendant l'enfance ou à un moment du passé, même si les symptômes ne sont plus présents.</p>\n<p>Le critère D exige que ces caractéristiques entraînent une altération cliniquement significative du fonctionnement social, professionnel ou d'autres domaines importants du fonctionnement actuel. Le critère E précise que les déficits de communication sociale, bien que parfois accompagnés d'un trouble du développement intellectuel (handicap intellectuel), ne correspondent pas au niveau développemental de la personne : les altérations dépassent les difficultés attendues sur la base de ce niveau.</p>\n<p>Des instruments diagnostiques comportementaux standardisés dotés de bonnes propriétés psychométriques, comprenant des entretiens avec les aidants, des questionnaires et des mesures d'observation clinique, sont disponibles et peuvent améliorer la fiabilité du diagnostic dans le temps et entre cliniciens. Cependant, les symptômes du trouble du spectre de l'autisme se répartissent selon des dimensions pour lesquelles il n'existe pas de scores seuils universellement acceptés définissant un trouble. Le diagnostic reste donc clinique, prenant en compte toutes les informations disponibles, et n'est pas dicté uniquement par le score à un questionnaire ou à une mesure d'observation particulière.</p>"},{"title":"Caractéristiques associées","kind":"associated","pdf":[222,223],"html":"<p>De nombreuses personnes présentant un trouble du spectre de l'autisme ont également une altération intellectuelle et/ou langagière (p. ex. parole tardive, compréhension du langage en retard sur la production). Même celles dont l'intelligence est moyenne ou élevée présentent généralement un profil de compétences inégal. L'écart entre compétences intellectuelles et compétences adaptatives fonctionnelles est souvent important. Les déficits de théorie de l'esprit, c'est-à-dire les difficultés à voir le monde du point de vue d'autrui, sont fréquents chez les personnes autistes, mais ils ne sont pas nécessairement présents dans tous les cas. Les déficits des fonctions exécutives sont également fréquents mais non spécifiques, de même que les difficultés de cohérence centrale, c'est-à-dire la capacité à comprendre le contexte ou à « voir l'ensemble », avec, par conséquent, une tendance à se focaliser excessivement sur les détails.</p>\n<p>Des déficits moteurs sont souvent présents, notamment une démarche inhabituelle, une maladresse et d'autres signes moteurs anormaux (p. ex. marche sur la pointe des pieds). Des comportements autoagressifs (p. ex. se cogner la tête, se mordre le poignet) peuvent survenir, et les comportements perturbateurs ou difficiles sont plus fréquents chez les enfants et adolescents présentant un trouble du spectre de l'autisme que dans d'autres troubles, y compris le trouble du développement intellectuel. Certaines personnes développent des comportements moteurs de type catatonique (ralentissement et « blocage » en cours d'action), mais ils n'ont généralement pas l'ampleur d'un épisode catatonique. Cependant, une personne présentant un trouble du spectre de l'autisme peut connaître une détérioration marquée des symptômes moteurs et présenter un épisode catatonique complet avec des symptômes tels que mutisme, maintien de postures, grimaces et flexibilité cireuse. La période de plus grand risque de catatonie comorbide semble se situer à l'adolescence.</p>"},{"title":"Prévalence","kind":"prevalence","pdf":[223,223],"html":"<p>Aux États-Unis, les fréquences rapportées pour le trouble du spectre de l'autisme se situent entre 1 % et 2 % de la population, avec des estimations similaires dans les échantillons d'enfants et d'adultes. Cependant, la prévalence semble plus basse chez les enfants afro-américains (1,1 %) et Latinx (0,8 %) que chez les enfants blancs (1,3 %), même après prise en compte de l'effet des ressources socioéconomiques. La prévalence rapportée peut être influencée par des erreurs diagnostiques, un retard diagnostique ou un sous-diagnostic chez les personnes de certains milieux ethnoraciaux. Dans les pays autres que les États-Unis, la prévalence s'est rapprochée de 1 % de la population (prévalence mondiale médiane de 0,62 %), sans variation substantielle selon la région géographique ou l'origine ethnique, ni entre les échantillons d'enfants et d'adultes. À l'échelle mondiale, le ratio masculin/féminin dans les échantillons épidémiologiques bien documentés semble être de 3:1, avec des préoccupations concernant un repérage insuffisant du trouble du spectre de l'autisme chez les femmes et les filles.</p>"},{"title":"Développement et évolution","kind":"course","pdf":[223,226],"html":"<p>L'âge et le mode de début doivent également être notés pour le trouble du spectre de l'autisme. Ses caractéristiques comportementales deviennent d'abord évidentes pendant la petite enfance, certains cas présentant un manque d'intérêt pour les interactions sociales dès la première année de vie. Les symptômes sont habituellement reconnus pendant la deuxième année (entre 12 et 24 mois), mais peuvent être observés avant 12 mois si les retards développementaux sont sévères, ou après 24 mois si les symptômes sont plus subtils. La description du mode de début peut inclure des informations sur les retards développementaux précoces ou les pertes de compétences sociales ou langagières. Lorsque des compétences ont été perdues, les parents ou les aidants peuvent rapporter une détérioration progressive ou relativement rapide des comportements sociaux ou des capacités langagières. Cela survient habituellement entre 12 et 24 mois.</p>\n<p>Les études prospectives montrent que, dans la plupart des cas, le début du trouble du spectre de l'autisme s'accompagne d'un déclin de comportements sociaux et communicationnels essentiels au cours des deux premières années de vie. De tels déclins fonctionnels sont rares dans les autres troubles du neurodéveloppement et peuvent constituer un indicateur particulièrement utile de la présence du trouble du spectre de l'autisme. Dans de rares cas, une régression développementale survient après au moins deux années de développement normal (anciennement décrite comme trouble désintégratif de l'enfance) ; elle est beaucoup plus inhabituelle et justifie des investigations médicales plus approfondies (notamment syndrome de pointes-ondes continues pendant le sommeil lent et syndrome de Landau-Kleffner). Ces affections encéphalopathiques comportent souvent des pertes de compétences au-delà de la communication sociale (p. ex. perte de l'autonomie pour les soins personnels, de la propreté, des compétences motrices) (voir aussi le syndrome de Rett dans la rubrique « Diagnostic différentiel » de ce trouble).</p>\n<p>Les premiers symptômes du trouble du spectre de l'autisme comprennent fréquemment un retard du développement du langage, souvent accompagné d'un manque d'intérêt social ou d'interactions sociales inhabituelles (p. ex. tirer les personnes par la main sans tenter de les regarder), de formes de jeu inhabituelles (p. ex. transporter des jouets sans jamais jouer avec eux) et de modes de communication inhabituels (p. ex. connaître l'alphabet mais ne pas répondre à son propre prénom). Une surdité peut être suspectée, mais elle est habituellement écartée. Pendant la deuxième année, les comportements inhabituels et répétitifs et l'absence de jeu typique deviennent plus apparents. Comme de nombreux jeunes enfants au développement typique ont des préférences marquées et apprécient la répétition (p. ex. manger les mêmes aliments, regarder plusieurs fois la même vidéo), il peut être difficile, chez l'enfant d'âge préscolaire, de distinguer les comportements restreints et répétitifs ayant une valeur diagnostique pour le trouble du spectre de l'autisme. La distinction clinique repose sur le type, la fréquence et l'intensité du comportement (p. ex. un enfant qui aligne chaque jour des objets pendant des heures et est très perturbé si l'un d'eux est déplacé).</p>\n<p>Le trouble du spectre de l'autisme n'est pas une affection dégénérative, et les apprentissages ainsi que la compensation se poursuivent habituellement tout au long de la vie. Les symptômes sont souvent les plus marqués dans la petite enfance et les premières années scolaires ; des progrès développementaux sont habituels plus tard dans l'enfance, au moins dans certains domaines (p. ex. intérêt accru pour les interactions sociales). Une petite proportion de personnes connaissent une dégradation comportementale pendant l'adolescence, alors que la plupart des autres s'améliorent. Autrefois, seule une minorité de personnes présentant un trouble du spectre de l'autisme vivaient et travaillaient de manière indépendante à l'âge adulte ; comme le diagnostic est désormais plus fréquemment posé chez celles qui ont des capacités langagières et intellectuelles supérieures, davantage de personnes parviennent à trouver un domaine correspondant à leurs intérêts particuliers et à leurs compétences et occupent ainsi un emploi productif. L'accès aux services de réadaptation professionnelle améliore significativement l'accès à l'emploi en milieu ordinaire des jeunes présentant un trouble du spectre de l'autisme à l'âge de transition vers l'âge adulte.</p>\n<p>De façon générale, les personnes ayant des niveaux d'altération moins élevés peuvent mieux fonctionner de manière indépendante. Cependant, même ces personnes peuvent rester socialement naïves et vulnérables, avoir du mal à organiser sans aide les exigences pratiques et être sujettes à l'anxiété et à la dépression. De nombreux adultes disent utiliser des stratégies de compensation et des mécanismes d'adaptation pour masquer leurs difficultés en public, mais souffrent du stress et de l'effort nécessaires pour maintenir une façade socialement acceptable. Les connaissances sur le grand âge dans le trouble du spectre de l'autisme sont relativement limitées, mais la littérature a documenté des taux plus élevés d'affections médicales associées.</p>\n<p>Certaines personnes consultent pour un premier diagnostic à l'âge adulte, éventuellement à la suite du diagnostic d'autisme d'un enfant dans la famille ou d'une rupture des relations au travail ou au domicile. Obtenir une histoire développementale détaillée peut alors être difficile et il importe de prendre en compte les difficultés rapportées par la personne elle-même. Lorsque l'observation clinique suggère que les critères sont actuellement réunis, un trouble du spectre de l'autisme peut être diagnostiqué, particulièrement si des antécédents de faibles compétences sociales et communicationnelles pendant l'enfance étayent cette hypothèse. Un récit convaincant, fourni par les parents ou un autre proche, faisant état d'amitiés réciproques ordinaires et durables et de bonnes compétences de communication non verbale tout au long de l'enfance réduirait considérablement la probabilité d'un diagnostic de trouble du spectre de l'autisme ; toutefois, des informations développementales ambiguës ou absentes ne suffisent pas, à elles seules, à l'exclure.</p>\n<p>Les manifestations des altérations sociales et communicationnelles et des comportements restreints ou répétitifs qui définissent le trouble du spectre de l'autisme sont claires pendant la période développementale. Plus tard, l'intervention ou la compensation ainsi que les soutiens actuels peuvent masquer ces difficultés, au moins dans certains contextes. Globalement, les symptômes demeurent suffisants pour entraîner une altération actuelle du fonctionnement social, professionnel ou d'autres domaines importants.</p>"},{"title":"Facteurs de risque et facteurs pronostiques","kind":"risk","pdf":[226,226],"html":"<p>Les facteurs pronostiques individuels les mieux établis dans le trouble du spectre de l'autisme sont la présence ou l'absence d'un trouble du développement intellectuel et d'une altération du langage associés (p. ex. disposer d'un langage fonctionnel à l'âge de 5 ans est un signe de bon pronostic), ainsi que les problèmes de santé mentale supplémentaires. L'épilepsie, lorsqu'elle est comorbide, est associée à un handicap intellectuel plus important et à de moindres capacités verbales.</p>\n<h4>Environnementaux</h4><p>Divers facteurs de risque des troubles du neurodéveloppement, tels qu'un âge parental avancé, une prématurité extrême ou une exposition in utero à certains médicaments ou tératogènes comme l'acide valproïque, peuvent contribuer de façon générale au risque de trouble du spectre de l'autisme.</p>\n<h4>Génétiques et physiologiques</h4><p>Les estimations de l'héritabilité du trouble du spectre de l'autisme ont varié de 37 % à plus de 90 %, à partir des taux de concordance chez les jumeaux ; une cohorte plus récente portant sur cinq pays a estimé cette héritabilité à 80 %. Actuellement, jusqu'à 15 % des cas de trouble du spectre de l'autisme semblent associés à une mutation génétique connue, différentes variations de novo du nombre de copies ou mutations de novo de gènes précis étant associées au trouble dans différentes familles. Toutefois, même lorsqu'une mutation génétique connue est associée au trouble du spectre de l'autisme, sa pénétrance ne semble pas complète (c'est-à-dire que toutes les personnes porteuses de la même anomalie génétique ne développent pas un trouble du spectre de l'autisme). Le risque dans la majorité des cas paraît polygénique, avec peut-être des centaines de loci génétiques apportant chacun une contribution relativement faible. On ne sait pas clairement si ces résultats s'appliquent de la même manière à toutes les populations raciales ou ethniques, compte tenu de la faible inclusion des communautés de couleur dans la recherche génétique.</p>"},{"title":"Questions diagnostiques liées à la culture","kind":"culture","pdf":[227,227],"html":"<p>Il existe des différences culturelles dans les normes relatives aux interactions sociales, à la communication non verbale et aux relations, mais les personnes présentant un trouble du spectre de l'autisme sont nettement en difficulté au regard des normes de leur propre contexte culturel. La culture influence la perception des comportements autistiques, l'importance accordée à certains comportements plutôt qu'à d'autres, ainsi que les attentes relatives au comportement des enfants et aux pratiques parentales. Des écarts considérables d'âge au diagnostic de trouble du spectre de l'autisme sont observés chez les enfants de divers milieux ethnoraciaux ; la plupart des études constatent un retard diagnostique chez les enfants de groupes ethniques et racialisés socialement opprimés. Outre un diagnostic plus tardif, les enfants afro-américains reçoivent plus souvent à tort un diagnostic de trouble de l'adaptation ou de trouble des conduites que les enfants blancs.</p>"},{"title":"Questions diagnostiques liées au sexe et au genre","kind":"gender","pdf":[227,227],"html":"<p>Le trouble du spectre de l'autisme est diagnostiqué trois à quatre fois plus souvent chez les personnes de sexe masculin que chez celles de sexe féminin, et l'âge moyen au diagnostic est plus tardif chez ces dernières. Dans les échantillons cliniques, les personnes de sexe féminin tendent à présenter plus souvent un trouble du développement intellectuel associé ainsi qu'une épilepsie, ce qui suggère que les filles sans altération intellectuelle ni retard de langage peuvent ne pas être repérées, peut-être en raison d'une manifestation plus subtile des difficultés sociales et communicationnelles. Comparativement aux personnes de sexe masculin présentant un trouble du spectre de l'autisme, celles de sexe féminin peuvent avoir une meilleure conversation réciproque, partager plus volontiers leurs intérêts, mieux intégrer les comportements verbaux et non verbaux et davantage modifier leur comportement selon la situation, malgré des difficultés de compréhension sociale similaires. Les tentatives de cacher ou de masquer les comportements autistiques (p. ex. en copiant l'habillement, la voix et les manières de femmes socialement à l'aise) peuvent également rendre le diagnostic plus difficile chez certaines personnes de sexe féminin. En moyenne, leurs comportements répétitifs peuvent être un peu moins évidents et leurs intérêts particuliers peuvent avoir un objet plus social (p. ex. un chanteur, un acteur) ou plus « normatif » (p. ex. les chevaux), tout en restant inhabituels par leur intensité. Des taux de diversité de genre plus élevés que dans la population générale ont été rapportés dans le trouble du spectre de l'autisme, avec une diversité plus importante chez les personnes de sexe féminin que chez celles de sexe masculin.</p>"},{"title":"Association aux pensées ou comportements suicidaires","kind":"suicide","pdf":[227,228],"html":"<p>Les personnes présentant un trouble du spectre de l'autisme ont un risque de décès par suicide plus élevé que celles qui ne présentent pas ce trouble. Parmi les enfants présentant un trouble du spectre de l'autisme, ceux dont la communication sociale était altérée avaient, à l'âge de 16 ans, un risque plus élevé de comportements autoagressifs avec intention suicidaire, d'idées suicidaires et de projets suicidaires que ceux dont la communication sociale n'était pas altérée. Les adolescents et jeunes adultes présentant un trouble du spectre de l'autisme ont un risque accru de tentative de suicide comparativement à des témoins appariés sur l'âge et le sexe, même après ajustement sur les facteurs démographiques et les comorbidités psychiatriques.</p>"},{"title":"Conséquences fonctionnelles du trouble du spectre de l’autisme","kind":"functional","pdf":[228,229],"html":"<p>Chez les jeunes enfants présentant un trouble du spectre de l'autisme, le manque de compétences sociales et communicationnelles peut entraver l'apprentissage, en particulier celui qui passe par l'interaction sociale ou les situations avec des pairs. Au domicile, l'insistance sur les routines et l'aversion au changement, ainsi que les sensibilités sensorielles, peuvent perturber l'alimentation et le sommeil et rendre les soins ordinaires (p. ex. coupe de cheveux, soins dentaires) extrêmement difficiles. Les compétences adaptatives sont habituellement inférieures au QI mesuré. Les difficultés extrêmes de planification, d'organisation et d'adaptation au changement ont un effet négatif sur la réussite scolaire, même chez les élèves dont l'intelligence est supérieure à la moyenne. À l'âge adulte, ces personnes peuvent éprouver des difficultés à devenir indépendantes en raison d'une rigidité persistante et de difficultés face à la nouveauté.</p>\n<p>De nombreuses personnes présentant un trouble du spectre de l'autisme, même sans trouble du développement intellectuel, ont un fonctionnement psychosocial adulte médiocre selon des indicateurs tels que la vie indépendante et l'emploi rémunéré. Les conséquences fonctionnelles dans le grand âge sont inconnues, mais l'isolement social et les problèmes de communication (p. ex. une moindre recherche d'aide) risquent d'avoir des conséquences sur la santé à un âge avancé.</p>\n<p>Un trouble du développement intellectuel, une épilepsie, des troubles mentaux et des affections médicales chroniques associés peuvent être liés à un risque plus élevé de mortalité prématurée chez les personnes présentant un trouble du spectre de l'autisme. Les décès par blessures et intoxications sont plus fréquents que dans la population générale, de même que les décès par suicide. La noyade est la première cause de décès accidentel chez les enfants présentant un trouble du spectre de l'autisme.</p>"},{"title":"Diagnostic différentiel","kind":"differential","pdf":[229,232],"html":"<h4>Déficit de l'attention/hyperactivité</h4><p>Les anomalies de l'attention, qu'elle soit excessivement focalisée ou facilement distraite, sont fréquentes chez les personnes présentant un trouble du spectre de l'autisme, de même que l'hyperactivité. Par ailleurs, certaines personnes présentant un TDAH peuvent montrer des déficits de communication sociale, par exemple interrompre les autres, parler trop fort et ne pas respecter l'espace personnel. Bien qu'il puisse être difficile de distinguer le TDAH du trouble du spectre de l'autisme, l'évolution développementale et l'absence de comportements restreints et répétitifs et d'intérêts inhabituels dans le TDAH aident à différencier les deux affections. Un diagnostic concomitant de TDAH doit être envisagé lorsque les difficultés attentionnelles ou l'hyperactivité dépassent celles habituellement observées chez les personnes d'âge mental comparable ; le TDAH est l'une des comorbidités les plus fréquentes du trouble du spectre de l'autisme.</p>\n<h4>Trouble du développement intellectuel (handicap intellectuel) sans trouble du spectre de l'autisme</h4><p>Chez les très jeunes enfants, il peut être difficile de distinguer un trouble du développement intellectuel sans trouble du spectre de l'autisme d'un trouble du spectre de l'autisme. Les personnes présentant un trouble du développement intellectuel qui n'ont pas développé de langage ou de compétences symboliques posent aussi un problème de diagnostic différentiel, car les comportements répétitifs sont également fréquents chez elles. Un diagnostic de trouble du spectre de l'autisme chez une personne présentant un trouble du développement intellectuel est approprié lorsque la communication sociale et les interactions sont significativement altérées par rapport au niveau développemental de ses compétences non verbales (p. ex. motricité fine, résolution non verbale de problèmes). À l'inverse, le trouble du développement intellectuel est le diagnostic approprié lorsqu'il n'existe pas de discordance apparente entre le niveau des compétences de communication sociale et celui des autres compétences intellectuelles.</p>\n<h4>Troubles du langage et trouble de la communication sociale (pragmatique)</h4><p>Dans certaines formes de trouble du langage, il peut exister des problèmes de communication et certaines difficultés sociales secondaires. Toutefois, un trouble spécifique du langage n'est habituellement associé ni à une communication non verbale anormale, ni à des comportements, intérêts ou activités restreints et répétitifs.</p><p>Lorsqu'une personne présente une altération de la communication sociale et des interactions sociales, mais pas de comportements ou d'intérêts restreints et répétitifs, les critères d'un trouble de la communication sociale (pragmatique), plutôt que d'un trouble du spectre de l'autisme, peuvent être remplis. Le diagnostic de trouble du spectre de l'autisme prévaut sur celui de trouble de la communication sociale (pragmatique) dès lors que ses critères sont réunis ; il convient de rechercher soigneusement les comportements restreints ou répétitifs passés ou actuels.</p>\n<h4>Mutisme sélectif</h4><p>Dans le mutisme sélectif, le développement précoce n'est généralement pas perturbé. L'enfant concerné montre habituellement des compétences de communication adaptées dans certains contextes et milieux. Même dans les situations où il est mutique, la réciprocité sociale n'est pas altérée et il n'existe pas de comportements restreints ou répétitifs.</p>\n<h4>Trouble des mouvements stéréotypés</h4><p>Les stéréotypies motrices figurent parmi les caractéristiques diagnostiques du trouble du spectre de l'autisme ; un diagnostic supplémentaire de trouble des mouvements stéréotypés n'est donc pas posé lorsque ces comportements répétitifs sont mieux expliqués par le trouble du spectre de l'autisme. Toutefois, lorsque les stéréotypies entraînent des blessures auto-infligées et deviennent une cible du traitement, les deux diagnostics peuvent être appropriés.</p>\n<h4>Syndrome de Rett</h4><p>Une perturbation de l'interaction sociale peut être observée pendant la phase régressive du syndrome de Rett (habituellement entre 1 et 4 ans) ; une proportion importante des jeunes filles concernées peut ainsi présenter un tableau remplissant les critères diagnostiques du trouble du spectre de l'autisme. Cependant, après cette période, la plupart des personnes ayant un syndrome de Rett améliorent leurs compétences de communication sociale et les caractéristiques autistiques ne constituent plus une préoccupation majeure. Par conséquent, le trouble du spectre de l'autisme ne doit être envisagé que si tous les critères diagnostiques sont remplis.</p>\n<h4>Symptômes associés aux troubles anxieux</h4><p>Le chevauchement des symptômes anxieux avec les symptômes centraux du trouble du spectre de l'autisme peut rendre difficile la classification de l'anxiété dans ce contexte. Par exemple, le retrait social et les comportements répétitifs sont des caractéristiques centrales du trouble du spectre de l'autisme, mais ils peuvent aussi être des expressions de l'anxiété. Les troubles anxieux les plus fréquents dans le trouble du spectre de l'autisme sont la phobie spécifique (jusqu'à 30 % des cas), ainsi que l'anxiété sociale et l'agoraphobie (jusqu'à 17 % des cas).</p>\n<h4>Trouble obsessionnel-compulsif</h4><p>Les comportements répétitifs constituent une caractéristique définissant aussi bien le trouble obsessionnel-compulsif que le trouble du spectre de l'autisme. Dans les deux affections, ils sont considérés comme inappropriés ou étranges. Dans le trouble obsessionnel-compulsif, les pensées intrusives portent souvent sur la contamination, l'organisation ou des thèmes sexuels ou religieux. Les compulsions sont réalisées en réponse à ces pensées, dans le but de soulager l'anxiété. Dans le trouble du spectre de l'autisme, les comportements répétitifs comprennent classiquement des comportements moteurs plus stéréotypés, tels que les battements des mains et les mouvements des doigts, ou des comportements plus complexes, comme l'insistance sur les routines ou l'alignement d'objets. Contrairement au trouble obsessionnel-compulsif, les comportements répétitifs du trouble du spectre de l'autisme peuvent être perçus comme agréables et renforçants.</p>\n<h4>Schizophrénie</h4><p>La schizophrénie débutant dans l'enfance apparaît généralement après une période de développement normal ou presque normal. Un état prodromique a été décrit, comportant une altération sociale et des intérêts et croyances atypiques, qui pourraient être confondus avec les déficits sociaux et les intérêts fixes et restreints du trouble du spectre de l'autisme. Les hallucinations et les idées délirantes, qui sont des caractéristiques définissant la schizophrénie, ne font pas partie du trouble du spectre de l'autisme. Toutefois, les cliniciens doivent tenir compte de la possibilité que les personnes présentant un trouble du spectre de l'autisme interprètent concrètement les questions portant sur les caractéristiques essentielles de la schizophrénie (p. ex. « Entendez-vous des voix quand personne n'est là ? » « Oui [à la radio]. »). Le trouble du spectre de l'autisme et la schizophrénie peuvent coexister et les deux doivent être diagnostiqués lorsque leurs critères sont remplis.</p>\n<h4>Troubles de la personnalité</h4><p>Chez les adultes sans trouble du développement intellectuel ni altération significative du langage, certains comportements associés au trouble du spectre de l'autisme peuvent être perçus par autrui comme des symptômes de personnalité narcissique, schizotypique ou schizoïde. La personnalité schizotypique, en particulier, peut recouper le trouble du spectre de l'autisme par des préoccupations et expériences perceptives inhabituelles, une pensée et un langage étranges, des affects restreints et une anxiété sociale, l'absence d'amis proches et un comportement étrange ou excentrique. L'évolution développementale précoce du trouble du spectre de l'autisme — absence de jeu imaginatif, comportements restreints ou répétitifs, sensibilités sensorielles — est l'élément le plus utile pour le distinguer des troubles de la personnalité.</p>"},{"title":"Comorbidité","kind":"comorbidity","pdf":[232,232],"html":"<p>Le trouble du spectre de l'autisme est fréquemment associé au trouble du développement intellectuel et au trouble du langage, c'est-à-dire à une incapacité à comprendre et à construire des phrases grammaticalement correctes. Les difficultés spécifiques d'apprentissage en lecture-écriture et en calcul sont fréquentes, de même que le trouble développemental de la coordination.</p>\n<p>Des comorbidités psychiatriques accompagnent également le trouble du spectre de l'autisme. Environ 70 % des personnes concernées peuvent présenter un trouble mental comorbide et 40 % deux troubles mentaux comorbides ou plus. Les troubles anxieux, la dépression et le TDAH sont particulièrement fréquents. Le trouble de restriction ou d'évitement de l'ingestion d'aliments constitue une manifestation de présentation assez fréquente du trouble du spectre de l'autisme, et des préférences alimentaires extrêmes et très étroites peuvent persister.</p>\n<p>Chez les personnes non verbales ou ayant des déficits langagiers, des signes observables tels que des changements du sommeil ou de l'alimentation et une augmentation des comportements difficiles doivent déclencher une évaluation à la recherche d'anxiété ou de dépression, ainsi que d'une douleur ou d'un inconfort possibles dus à des problèmes médicaux ou dentaires non diagnostiqués. Les affections médicales fréquemment associées au trouble du spectre de l'autisme comprennent l'épilepsie et la constipation.</p>"}]},{"id":"tdah","family":"attention","title":"Déficit de l’attention / hyperactivité","subtitle":"TDAH","english":"Attention-Deficit/Hyperactivity Disorder","codes":["F90.2","F90.0","F90.1"],"aliases":["TDAH","TDA","ADHD","inattention","hyperactivité","impulsivité","déficit attentionnel","désorganisation","attention","agitation","distractibilité","oubli","oublis","concentration","hyperactif","inattentif","impulsif"],"pages":"68–76","pdf":[232,247],"criteriaPages":"68–70","criteriaPdf":[233,236],"related":["tdah-autre","tdah-non-specifie","autisme","apprentissages"],"chapter":"neurodev","sections":[{"title":"Critères diagnostiques","kind":"criteria","pdf":[233,236],"html":"<p><strong>A.</strong> Un mode persistant d'inattention et/ou d'hyperactivité-impulsivité qui interfère avec le fonctionnement ou le développement, caractérisé par (1) et/ou (2) :</p>\n<h4>1. Inattention</h4><p><strong>Six symptômes ou plus</strong> parmi les suivants ont persisté pendant <strong>au moins 6 mois</strong>, à un degré incompatible avec le niveau de développement et ayant un effet négatif direct sur les activités sociales et scolaires ou professionnelles :</p>\n<p><strong>Note :</strong> Les symptômes ne sont pas uniquement la manifestation d'un comportement oppositionnel, de défi, d'hostilité ou d'une incompréhension des tâches ou des consignes. Pour les adolescents plus âgés et les adultes (<strong>17 ans et plus</strong>), <strong>au moins cinq symptômes</strong> sont requis.</p>\n<ol type=\"a\"><li>Souvent, ne prête pas suffisamment attention aux détails ou fait des erreurs d'étourderie dans les devoirs scolaires, au travail ou dans d'autres activités (p. ex. néglige ou manque des détails, travail imprécis).</li><li>A souvent du mal à soutenir son attention dans les tâches ou les activités de jeu (p. ex. difficulté à rester concentré pendant les cours, les conversations ou une lecture longue).</li><li>Semble souvent ne pas écouter lorsqu'on lui parle directement (p. ex. paraît avoir l'esprit ailleurs, même en l'absence de distraction évidente).</li><li>Souvent, ne suit pas les consignes jusqu'au bout et ne termine pas ses devoirs scolaires, ses tâches domestiques ou ses obligations professionnelles (p. ex. commence une tâche mais perd rapidement le fil et se laisse facilement détourner).</li><li>A souvent du mal à organiser les tâches et les activités (p. ex. difficulté à gérer les tâches séquentielles, à maintenir en ordre matériel et affaires personnelles ; travail désordonné et désorganisé ; mauvaise gestion du temps ; délais non respectés).</li><li>Souvent, évite, n'aime pas ou entreprend à contrecœur les tâches nécessitant un effort mental soutenu (p. ex. travail scolaire ou devoirs à la maison ; chez les adolescents plus âgés et les adultes, préparation de rapports, remplissage de formulaires, examen de longs documents).</li><li>Perd souvent les objets nécessaires aux tâches ou aux activités (p. ex. matériel scolaire, crayons, livres, outils, portefeuilles, clés, documents, lunettes, téléphones portables).</li><li>Se laisse souvent facilement distraire par des stimuli extérieurs (chez les adolescents plus âgés et les adultes, cela peut comprendre des pensées sans rapport avec la tâche).</li><li>A des oublis fréquents dans les activités quotidiennes (p. ex. tâches domestiques, courses ; chez les adolescents plus âgés et les adultes, rappeler les personnes au téléphone, payer les factures, honorer les rendez-vous).</li></ol>\n<h4>2. Hyperactivité et impulsivité</h4><p><strong>Six symptômes ou plus</strong> parmi les suivants ont persisté pendant <strong>au moins 6 mois</strong>, à un degré incompatible avec le niveau de développement et ayant un effet négatif direct sur les activités sociales et scolaires ou professionnelles :</p>\n<p><strong>Note :</strong> Les symptômes ne sont pas uniquement la manifestation d'un comportement oppositionnel, de défi, d'hostilité ou d'une incompréhension des tâches ou des consignes. Pour les adolescents plus âgés et les adultes (<strong>17 ans et plus</strong>), <strong>au moins cinq symptômes</strong> sont requis.</p>\n<ol type=\"a\"><li>Remue souvent les mains ou les pieds, les tapote, ou se tortille sur son siège.</li><li>Se lève souvent dans des situations où il est attendu de rester assis (p. ex. quitte sa place en classe, au bureau ou sur un autre lieu de travail, ou dans d'autres situations exigeant de rester en place).</li><li>Court ou grimpe souvent dans des situations où cela est inapproprié. <strong>Note :</strong> Chez les adolescents ou les adultes, cela peut se limiter à un sentiment d'agitation intérieure.</li><li>Est souvent incapable de jouer ou de participer à des loisirs calmement.</li><li>Est souvent « en mouvement », agissant comme s'il était « mû par un moteur » (p. ex. incapable ou mal à l'aise de rester immobile pendant un temps prolongé, comme au restaurant ou en réunion ; peut être perçu par les autres comme agité ou difficile à suivre).</li><li>Parle souvent excessivement.</li><li>Laisse souvent échapper une réponse avant que la question soit terminée (p. ex. termine les phrases des autres ; ne peut attendre son tour dans une conversation).</li><li>A souvent du mal à attendre son tour (p. ex. dans une file d'attente).</li><li>Interrompt souvent les autres ou s'impose à eux (p. ex. intervient dans les conversations, jeux ou activités ; peut commencer à utiliser les affaires d'autrui sans demander ni recevoir la permission ; chez les adolescents et les adultes, peut s'immiscer dans ce que font les autres ou prendre leur place dans l'activité).</li></ol>\n<p><strong>B.</strong> Plusieurs symptômes d'inattention ou d'hyperactivité-impulsivité étaient présents <strong>avant l'âge de 12 ans</strong>.</p>\n<p><strong>C.</strong> Plusieurs symptômes d'inattention ou d'hyperactivité-impulsivité sont présents dans <strong>au moins deux contextes</strong> (p. ex. à la maison, à l'école ou au travail ; avec les amis ou les proches ; dans d'autres activités).</p>\n<p><strong>D.</strong> Des éléments clairs montrent que les symptômes interfèrent avec le fonctionnement social, scolaire ou professionnel, ou en réduisent la qualité.</p>\n<p><strong>E.</strong> Les symptômes ne surviennent pas exclusivement au cours d'une schizophrénie ou d'un autre trouble psychotique et ne sont pas mieux expliqués par un autre trouble mental (p. ex. trouble de l'humeur, trouble anxieux, trouble dissociatif, trouble de la personnalité, intoxication ou sevrage d'une substance).</p>"},{"title":"Spécifications","kind":"specifiers","pdf":[236,236],"html":"<h4>Spécifier la présentation</h4>\n<p><strong>F90.2 — Présentation combinée :</strong> Si le critère A1 (inattention) et le critère A2 (hyperactivité-impulsivité) ont tous deux été remplis au cours des 6 derniers mois.</p>\n<p><strong>F90.0 — Présentation inattentive prédominante :</strong> Si le critère A1 (inattention) a été rempli, mais pas le critère A2 (hyperactivité-impulsivité), au cours des 6 derniers mois.</p>\n<p><strong>F90.1 — Présentation hyperactive/impulsive prédominante :</strong> Si le critère A2 (hyperactivité-impulsivité) a été rempli, mais pas le critère A1 (inattention), au cours des 6 derniers mois.</p>\n<h4>Spécifier si</h4><p><strong>En rémission partielle :</strong> Lorsque les critères complets étaient auparavant remplis, mais ne le sont plus tous au cours des 6 derniers mois, et que les symptômes entraînent encore une altération du fonctionnement social, scolaire ou professionnel.</p>\n<h4>Spécifier la sévérité actuelle</h4>\n<p><strong>Léger :</strong> Peu ou pas de symptômes en excès de ceux nécessaires au diagnostic sont présents, et les symptômes n'entraînent qu'une altération mineure du fonctionnement social ou professionnel.</p>\n<p><strong>Moyen :</strong> Des symptômes ou une altération fonctionnelle intermédiaires entre « léger » et « grave » sont présents.</p>\n<p><strong>Grave :</strong> De nombreux symptômes en excès de ceux requis pour le diagnostic, ou plusieurs symptômes particulièrement sévères, sont présents, ou les symptômes entraînent une altération marquée du fonctionnement social ou professionnel.</p>"},{"title":"Caractéristiques diagnostiques","kind":"clinical","pdf":[236,238],"html":"<p>La caractéristique essentielle du déficit de l'attention/hyperactivité (TDAH) est un mode persistant d'inattention et/ou d'hyperactivité-impulsivité qui interfère avec le fonctionnement ou le développement. Dans le TDAH, l'inattention se manifeste dans le comportement par le fait de s'écarter de la tâche, de ne pas suivre les consignes jusqu'au bout ou de ne pas terminer le travail ou les tâches domestiques, par des difficultés à maintenir la concentration et par une désorganisation ; elle n'est pas attribuable à une attitude de défi ou à un manque de compréhension. L'hyperactivité désigne une activité motrice excessive (comme un enfant qui court partout) dans des situations où elle est inappropriée, ou une agitation, des tapotements ou une loquacité excessifs. Chez l'adulte, l'hyperactivité peut se manifester par une agitation extrême ou par une activité épuisante pour les autres. L'impulsivité désigne des actions précipitées, réalisées dans l'instant sans réflexion préalable et potentiellement préjudiciables à la personne (p. ex. se précipiter dans la rue sans regarder). L'impulsivité peut refléter un désir de récompenses immédiates ou une incapacité à différer la gratification. Les comportements impulsifs peuvent se manifester par une intrusion sociale (p. ex. interrompre excessivement autrui) et/ou par des décisions importantes prises sans tenir compte des conséquences à long terme (p. ex. accepter un emploi sans disposer d'informations suffisantes).</p>\n<p>Le TDAH débute pendant l'enfance. L'exigence que plusieurs symptômes aient été présents avant l'âge de 12 ans traduit l'importance d'une présentation clinique substantielle pendant l'enfance. Parallèlement, un âge de début plus précoce n'est pas fixé en raison des difficultés à établir rétrospectivement le début précis dans l'enfance. Le souvenir des symptômes de l'enfance chez l'adulte tend à manquer de fiabilité et il est utile d'obtenir des informations complémentaires. Le TDAH ne peut être diagnostiqué en l'absence de tout symptôme avant l'âge de 12 ans. Lorsque des symptômes qui paraissent être ceux d'un TDAH surviennent pour la première fois après l'âge de 13 ans, il est plus probable qu'ils soient expliqués par un autre trouble mental ou qu'ils représentent les effets cognitifs de l'usage de substances.</p>\n<p>Les manifestations du trouble doivent être présentes dans plus d'un contexte (p. ex. domicile et école, ou domicile et travail). Il n'est généralement pas possible de confirmer avec précision des symptômes substantiels dans plusieurs contextes sans consulter des informateurs ayant observé la personne dans ces contextes. Habituellement, les symptômes varient en fonction de la situation à l'intérieur d'un même contexte. Les signes du trouble peuvent être minimes ou absents lorsque la personne reçoit des récompenses fréquentes pour un comportement approprié, bénéficie d'une surveillance rapprochée, se trouve dans un environnement nouveau, est engagée dans des activités particulièrement intéressantes, reçoit une stimulation extérieure constante (p. ex. par des écrans électroniques) ou interagit en tête à tête (p. ex. au cabinet du clinicien).</p>"},{"title":"Caractéristiques associées","kind":"associated","pdf":[238,238],"html":"<p>Des retards du développement langagier, moteur ou social ne sont pas spécifiques du TDAH, mais lui sont souvent associés. La dysrégulation émotionnelle ou l'impulsivité émotionnelle est fréquente chez les enfants et les adultes présentant un TDAH. Les personnes concernées se décrivent, et sont décrites par autrui, comme se mettant vite en colère, facilement frustrées et excessivement réactives sur le plan émotionnel.</p>\n<p>Même en l'absence de trouble spécifique des apprentissages, les performances scolaires ou professionnelles sont souvent altérées. Les personnes présentant un TDAH peuvent avoir des déficits neurocognitifs dans divers domaines, dont la mémoire de travail, la flexibilité cognitive, la variabilité du temps de réaction, l'inhibition de la réponse, la vigilance et la planification/organisation, bien que ces tests ne soient pas suffisamment sensibles ou spécifiques pour servir d'indices diagnostiques.</p>\n<p>Bien que le TDAH ne soit pas associé à des caractéristiques physiques spécifiques, les taux d'anomalies physiques mineures (p. ex. hypertélorisme, palais ogival, oreilles d'implantation basse) peuvent être augmentés. De discrets retards moteurs et d'autres signes neurologiques mineurs peuvent survenir. Il convient de noter qu'une maladresse et des retards moteurs associés marqués doivent être codés séparément (p. ex. trouble développemental de la coordination).</p>\n<p>Les enfants ayant un trouble neurodéveloppemental de cause connue (p. ex. syndrome de l'X fragile, syndrome de délétion 22q11) peuvent souvent présenter aussi des symptômes d'inattention et d'impulsivité/hyperactivité ; ils doivent recevoir un diagnostic de TDAH si leurs symptômes remplissent l'ensemble des critères du trouble.</p>"},{"title":"Prévalence","kind":"prevalence","pdf":[238,238],"html":"<p>Les enquêtes de population suggèrent que le TDAH touche environ 7,2 % des enfants dans le monde ; cependant, la prévalence entre pays varie largement, de 0,1 % à 10,2 % des enfants et adolescents. La prévalence est plus élevée dans certaines populations, comme les enfants placés en famille d'accueil ou les personnes en milieu correctionnel. Dans une méta-analyse internationale, le TDAH concernait 2,5 % des adultes.</p>"},{"title":"Développement et évolution","kind":"course","pdf":[239,239],"html":"<p>De nombreux parents observent pour la première fois une activité motrice excessive lorsque l'enfant est tout-petit, mais les symptômes sont difficiles à distinguer des comportements ordinaires, très variables, avant l'âge de 4 ans. Le TDAH est le plus souvent identifié pendant les années d'école primaire, lorsque l'inattention devient plus marquée et plus invalidante. Le trouble est relativement stable jusqu'au début de l'adolescence, mais certaines personnes connaissent une évolution défavorable avec l'apparition de comportements antisociaux. Chez la plupart des personnes présentant un TDAH, les symptômes d'hyperactivité motrice deviennent moins évidents à l'adolescence et à l'âge adulte, mais les difficultés liées à l'agitation, à l'inattention, à la mauvaise planification et à l'impulsivité persistent. Une proportion importante des enfants présentant un TDAH conserve une altération fonctionnelle notable à l'âge adulte.</p>\n<p>À l'âge préscolaire, la manifestation principale est l'hyperactivité. L'inattention devient plus marquée à l'école primaire. À l'adolescence, les signes d'hyperactivité (p. ex. courir et grimper) sont moins fréquents et peuvent se limiter à une agitation motrice ou à une sensation intérieure de nervosité, d'agitation ou d'impatience. À l'âge adulte, en plus de l'inattention et de l'agitation, l'impulsivité peut rester problématique même lorsque l'hyperactivité a diminué.</p>"},{"title":"Facteurs de risque et facteurs pronostiques","kind":"risk","pdf":[239,240],"html":"<h4>Tempéramentaux</h4><p>Le TDAH est associé à une réduction de l'inhibition comportementale, du contrôle volontaire ou de la retenue ; à une émotivité négative ; et/ou à une recherche élevée de nouveauté. Ces traits peuvent prédisposer certains enfants au TDAH, mais ne sont pas spécifiques du trouble.</p>\n<h4>Environnementaux</h4><p>Un très faible poids de naissance et le degré de prématurité augmentent le risque de TDAH ; plus le faible poids est extrême, plus le risque est élevé. L'exposition prénatale au tabagisme est associée au TDAH même après contrôle des antécédents psychiatriques parentaux et du statut socioéconomique. Une minorité de cas peut être liée à des réactions à certains aspects de l'alimentation. L'exposition aux neurotoxiques (p. ex. plomb), les infections (p. ex. encéphalite) et l'exposition à l'alcool in utero ont été corrélées à un TDAH ultérieur, mais on ne sait pas si ces associations sont causales.</p>\n<h4>Génétiques et physiologiques</h4><p>L'héritabilité du TDAH est d'environ 74 %. Des études d'association pangénomiques (GWAS) de grande ampleur ont identifié plusieurs loci enrichis dans des régions génomiques soumises à de fortes contraintes évolutives et dans des gènes avec perte de fonction, ainsi qu'à proximité de régions régulatrices exprimées dans le cerveau. Il n'existe pas de gène unique du TDAH.</p><p>Les déficiences visuelles et auditives, les anomalies métaboliques et les carences nutritionnelles doivent être considérées comme des influences possibles sur les symptômes du TDAH. Le TDAH est plus fréquent chez les personnes présentant une épilepsie idiopathique.</p>\n<h4>Facteurs modifiant l'évolution</h4><p>Il est peu probable que les modes d'interaction familiale de la petite enfance causent le TDAH, mais ils peuvent influencer son évolution ou contribuer au développement secondaire de problèmes de conduite.</p>"},{"title":"Questions diagnostiques liées à la culture","kind":"culture","pdf":[240,240],"html":"<p>Les différences de prévalence du TDAH entre régions semblent principalement attribuables à des procédures diagnostiques et à des pratiques méthodologiques différentes, notamment à l'utilisation d'entretiens diagnostiques différents et à la prise en compte ou non d'une altération fonctionnelle et, lorsqu'elle est exigée, à sa définition. La prévalence est également influencée par les variations culturelles des attitudes envers les normes comportementales et les attentes à l'égard des enfants et des jeunes dans différents contextes sociaux, ainsi que par les différences culturelles d'interprétation du comportement des enfants par les parents et les enseignants, y compris les différences selon le genre. Aux États-Unis, les taux de repérage clinique dans les populations afro-américaines et Latinx tendent à être inférieurs à ceux des populations blanches non Latinx. Le sous-repérage peut résulter d'une attribution erronée des symptômes du TDAH à l'opposition ou à la perturbation du comportement chez les groupes ethniques ou racialisés socialement opprimés, du fait de biais explicites ou implicites du clinicien, conduisant à un surdiagnostic des troubles disruptifs. La prévalence plus élevée chez les jeunes blancs non Latinx peut également être influencée par une demande parentale plus forte de diagnostic pour des comportements perçus comme liés au TDAH. Les évaluations des symptômes par les informateurs peuvent être influencées par le milieu culturel de l'enfant et de l'informateur, ce qui souligne la pertinence de pratiques diagnostiques culturellement compétentes dans l'évaluation du TDAH.</p>"},{"title":"Questions diagnostiques liées au sexe et au genre","kind":"gender","pdf":[240,241],"html":"<p>Le TDAH est plus fréquent chez les personnes de sexe masculin que chez celles de sexe féminin dans la population générale, avec un ratio d'environ 2:1 chez les enfants et 1,6:1 chez les adultes. Les personnes de sexe féminin présentent plus souvent que celles de sexe masculin des caractéristiques principalement inattentives. Les différences de sévérité des symptômes du TDAH selon le sexe peuvent être liées à des vulnérabilités génétiques et cognitives différentes.</p>"},{"title":"Marqueurs diagnostiques","kind":"clinical","pdf":[241,241],"html":"<p>Aucun marqueur biologique n'est diagnostique du TDAH. Bien que le TDAH ait été associé à une augmentation de la puissance des ondes lentes (« thêta », 4–7 Hz) ainsi qu'à une diminution de la puissance des ondes rapides (« bêta », 14–30 Hz), une revue ultérieure n'a trouvé aucune différence de puissance thêta ou bêta chez les enfants ou les adultes présentant un TDAH par rapport aux témoins.</p>\n<p>Bien que certaines études de neuro-imagerie aient montré des différences chez les enfants présentant un TDAH par rapport aux témoins, la méta-analyse de l'ensemble des études de neuro-imagerie ne montre pas de différences entre les personnes présentant un TDAH et les témoins. Cela est probablement dû à des différences de critères diagnostiques, de taille d'échantillon, de tâche utilisée et d'aspects techniques de la méthode de neuro-imagerie. Tant que ces questions ne sont pas résolues, aucune forme de neuro-imagerie ne peut être utilisée pour diagnostiquer le TDAH.</p>"},{"title":"Association aux pensées ou comportements suicidaires","kind":"suicide","pdf":[241,241],"html":"<p>Le TDAH est un facteur de risque d'idées et de comportements suicidaires chez les enfants. De même, à l'âge adulte, il est associé à un risque accru de tentative de suicide lorsqu'il est comorbide avec des troubles de l'humeur, des conduites ou de l'usage de substances, même après contrôle de la comorbidité. Les pensées suicidaires sont également plus fréquentes dans les populations présentant un TDAH que chez les témoins sans TDAH. Le TDAH était prédictif de la persistance des pensées suicidaires chez des soldats de l'armée américaine.</p>"},{"title":"Conséquences fonctionnelles du déficit de l’attention/hyperactivité","kind":"functional","pdf":[241,242],"html":"<p>Le TDAH est associé à de moindres performances scolaires et à un niveau d'études moins élevé. Les déficits scolaires, les problèmes liés à l'école et le fait d'être ignoré par les pairs tendent à être principalement associés à des symptômes d'inattention élevés, tandis que le rejet par les pairs et, dans une moindre mesure, les blessures accidentelles sont surtout liés à des symptômes marqués d'hyperactivité ou d'impulsivité. Une implication insuffisante ou variable dans les tâches qui demandent un effort soutenu est souvent interprétée par les autres comme de la paresse, de l'irresponsabilité ou un refus de coopérer.</p>\n<p>Les jeunes adultes présentant un TDAH ont une faible stabilité de l'emploi. Les adultes concernés présentent de moins bonnes performances, réalisations et assiduité professionnelles, une probabilité plus élevée de chômage ainsi que davantage de conflits interpersonnels. En moyenne, les personnes présentant un TDAH suivent moins d'années d'études, ont une moins bonne réussite professionnelle et des scores intellectuels plus bas que leurs pairs, avec toutefois une grande variabilité. Dans ses formes sévères, le trouble entraîne une altération marquée de l'adaptation sociale, familiale et scolaire ou professionnelle.</p>\n<p>Les relations familiales peuvent être caractérisées par la discorde et des interactions négatives. Les personnes présentant un TDAH ont une estime de soi plus faible que leurs pairs sans TDAH. Les relations avec les pairs sont souvent perturbées par le rejet, la mise à l'écart ou les moqueries à leur égard.</p>\n<p>Les enfants présentant un TDAH sont significativement plus susceptibles que leurs pairs sans TDAH de développer un trouble des conduites à l'adolescence et une personnalité antisociale à l'âge adulte, ce qui augmente ensuite la probabilité de troubles de l'usage de substances et d'incarcération. Le risque de troubles ultérieurs de l'usage de substances est élevé, en particulier lorsqu'un trouble des conduites ou une personnalité antisociale se développe.</p>\n<p>Les personnes présentant un TDAH sont plus susceptibles que leurs pairs de subir des blessures. Les enfants et les adultes concernés ont un risque accru de subir des traumatismes et de développer ensuite un syndrome de stress post-traumatique. Les accidents et infractions de la circulation sont plus fréquents chez les conducteurs présentant un TDAH. La mortalité globale est plus élevée chez les personnes présentant un TDAH, en grande partie du fait des accidents et des blessures. La probabilité d'obésité et d'hypertension peut également être augmentée.</p>"},{"title":"Diagnostic différentiel","kind":"differential","pdf":[242,246],"html":"<h4>Trouble oppositionnel avec provocation</h4><p>Les personnes présentant un trouble oppositionnel avec provocation peuvent résister aux tâches professionnelles ou scolaires qui exigent de s'appliquer parce qu'elles refusent de se conformer aux demandes d'autrui. Leur comportement est caractérisé par la négativité, l'hostilité et le défi. Ces symptômes doivent être distingués de l'aversion pour l'école ou pour les tâches mentalement exigeantes liée aux difficultés à maintenir l'effort mental, aux oublis des consignes et à l'impulsivité chez les personnes présentant un TDAH. Le diagnostic différentiel est compliqué par le fait que certaines personnes présentant un TDAH peuvent développer secondairement des attitudes oppositionnelles envers ces tâches et en dévaloriser l'importance.</p>\n<h4>Trouble explosif intermittent</h4><p>Le TDAH et le trouble explosif intermittent ont en commun des niveaux élevés de comportements impulsifs. Toutefois, les
