<script>
(function(g){g.DSM5_DATA={"version":"3.0.0","edition":"DSM-5-TR · 2022","localPdf":"file:///C:/Users/douss/Documents/5.%20BIBLIO%20PSY%20%F0%9F%A4%AA/%F0%9F%93%96%20Livres/Ressources%20psy/MANUELS/DSM5-TR.pdf","chapters":[{"id":"neurodev","name":"Troubles du neurodéveloppement","english":"Neurodevelopmental Disorders","number":"01","status":"ready","pages":"35–100","pdf":[174,291],"recordCount":22,"quickSearch":["TDAH","TSA","Dyslexie","Tourette"],"searchPlaceholder":"Ex. TDAH, autisme, dyslexie, F90.0…"},{"id":"psychoses","name":"Spectre de la schizophrénie et autres troubles psychotiques","english":"Schizophrenia Spectrum and Other Psychotic Disorders","number":"02","status":"ready","pages":"101–138","pdf":[293,362],"recordCount":13,"quickSearch":["Schizophrénie","Délire","Catatonie","Psychose induite"],"searchPlaceholder":"Ex. schizophrénie, délire, catatonie, F25.0…"}],"families":[{"id":"intellectuel","name":"Développement intellectuel","short":"Développement intellectuel","chapter":"neurodev","color":"#7651ae","tint":"#f3edf9"},{"id":"communication","name":"Troubles de la communication","short":"Communication","chapter":"neurodev","color":"#496ca3","tint":"#eef3fb"},{"id":"autisme","name":"Trouble du spectre de l’autisme","short":"Spectre de l’autisme","chapter":"neurodev","color":"#327f73","tint":"#edf7f4"},{"id":"attention","name":"Déficit de l’attention / hyperactivité","short":"Attention / hyperactivité","chapter":"neurodev","color":"#9254af","tint":"#f7eefb"},{"id":"apprentissages","name":"Trouble spécifique des apprentissages","short":"Apprentissages","chapter":"neurodev","color":"#997035","tint":"#faf5e9"},{"id":"moteurs","name":"Troubles moteurs et tics","short":"Motricité et tics","chapter":"neurodev","color":"#ad6068","tint":"#fcf0f1"},{"id":"autres","name":"Autres troubles du neurodéveloppement","short":"Autres troubles","chapter":"neurodev","color":"#64758d","tint":"#f0f3f8"},{"id":"psychoses-schizotypique","name":"Trouble de la personnalité schizotypique","short":"Personnalité schizotypique","chapter":"psychoses","color":"#64758d","tint":"#f0f3f8"},{"id":"psychoses-primaires","name":"Troubles psychotiques primaires","short":"Psychoses primaires","chapter":"psychoses","color":"#7651ae","tint":"#f3edf9"},{"id":"psychoses-secondaires","name":"Psychoses induites ou dues à une affection médicale","short":"Psychoses induites ou secondaires","chapter":"psychoses","color":"#327f73","tint":"#edf7f4"},{"id":"catatonie","name":"Catatonie","short":"Catatonie","chapter":"psychoses","color":"#496ca3","tint":"#eef3fb"},{"id":"psychoses-autres","name":"Autres troubles psychotiques spécifiés ou non spécifiés","short":"Autres troubles psychotiques","chapter":"psychoses","color":"#997035","tint":"#faf5e9"}],"disorders":[{"id":"developpement-intellectuel","family":"intellectuel","title":"Trouble du développement intellectuel","subtitle":"Handicap intellectuel","english":"Intellectual Developmental Disorder (Intellectual Disability)","codes":["F70","F71","F72","F73"],"aliases":["TDI","déficience intellectuelle","retard mental","intellectual disability"],"pages":"37–46","pdf":[178,192],"criteriaPages":"37–38","criteriaPdf":[178,179],"related":["retard-global","intellectuel-non-specifie","autisme"],"chapter":"neurodev","sections":[{"title":"Critères diagnostiques","kind":"criteria","pdf":[178,179],"html":"<p>Le trouble du développement intellectuel (handicap intellectuel) débute pendant la période développementale et comprend des déficits du fonctionnement intellectuel et du fonctionnement adaptatif dans les domaines conceptuel, social et pratique. Les trois critères suivants doivent être remplis :</p><p><strong>A.</strong> Déficits des fonctions intellectuelles telles que le raisonnement, la résolution de problèmes, la planification, la pensée abstraite, le jugement, les apprentissages scolaires et l’apprentissage par l’expérience, confirmés à la fois par l’évaluation clinique et par des tests d’intelligence standardisés administrés individuellement.</p><p><strong>B.</strong> Déficits du fonctionnement adaptatif empêchant d’atteindre les normes développementales et socioculturelles d’autonomie personnelle et de responsabilité sociale. Sans soutien continu, ces déficits limitent le fonctionnement dans une ou plusieurs activités de la vie quotidienne, telles que la communication, la participation sociale et la vie autonome, dans plusieurs environnements : domicile, école, travail et communauté.</p><p><strong>C.</strong> Début des déficits intellectuels et adaptatifs pendant la période développementale.</p><p><strong>Note :</strong> Le terme « trouble du développement intellectuel » est utilisé pour préciser son lien avec la classification CIM-11 de l’OMS, qui emploie le terme « troubles du développement intellectuel ». Le terme équivalent « handicap intellectuel » figure entre parenthèses afin que son utilisation puisse se poursuivre. La littérature médicale et scientifique utilise les deux termes, tandis que « handicap intellectuel » est couramment utilisé dans l’éducation et d’autres professions, par les associations de défense des droits et par le grand public. Aux États-Unis, la loi publique 111-256, dite loi Rosa, a remplacé dans les lois fédérales toutes les références au « retard mental » par « handicap intellectuel ».</p><p><strong>Spécifier la sévérité actuelle</strong> (voir tableau 1) :</p><ul><li><strong>F70</strong> Léger</li><li><strong>F71</strong> Moyen</li><li><strong>F72</strong> Grave</li><li><strong>F73</strong> Profond</li></ul>"},{"title":"Tableau 1 — Niveaux de sévérité du trouble du développement intellectuel (handicap intellectuel)","kind":"specifiers","pdf":[179,183],"html":"<table><thead><tr><th>Niveau</th><th>Domaine conceptuel</th><th>Domaine social</th><th>Domaine pratique</th></tr></thead><tbody>\n<tr><th>Léger</th><td>Chez les enfants d’âge préscolaire, les différences conceptuelles peuvent ne pas être évidentes. Chez les enfants d’âge scolaire et les adultes, il existe des difficultés d’apprentissage des compétences scolaires touchant la lecture, l’écriture, le calcul, le temps ou l’argent ; un soutien est nécessaire dans un ou plusieurs domaines pour atteindre les attentes liées à l’âge. Chez l’adulte, la pensée abstraite, les fonctions exécutives — planification, élaboration de stratégies, hiérarchisation des priorités et flexibilité cognitive —, la mémoire à court terme et l’utilisation fonctionnelle des compétences scolaires, comme la lecture ou la gestion de l’argent, sont altérées. L’approche des problèmes et de leurs solutions est quelque peu concrète par rapport aux personnes du même âge.</td><td>Comparativement aux personnes du même âge au développement typique, la personne est immature dans ses interactions sociales. Elle peut par exemple avoir du mal à percevoir exactement les signaux sociaux de ses pairs. La communication, la conversation et le langage sont plus concrets ou immatures que ce qui est attendu pour l’âge. Des difficultés à réguler les émotions et le comportement d’une manière adaptée à l’âge peuvent être présentes ; les pairs les remarquent dans les situations sociales. La compréhension du risque dans ces situations est limitée ; le jugement social est immature pour l’âge et la personne risque d’être manipulée par les autres — crédulité.</td><td>La personne peut fonctionner de façon appropriée à son âge pour les soins personnels. Elle a besoin, par rapport à ses pairs, d’un certain soutien pour les tâches complexes de la vie quotidienne. À l’âge adulte, ce soutien concerne typiquement les courses, les transports, l’organisation du foyer et de la garde des enfants, la préparation de repas équilibrés et les opérations bancaires ou la gestion de l’argent. Les compétences de loisirs ressemblent à celles des personnes du même âge, mais le jugement relatif au bien-être et l’organisation des loisirs nécessitent un soutien. À l’âge adulte, l’emploi en milieu ordinaire est souvent possible dans des postes qui sollicitent peu les compétences conceptuelles. Les personnes ont généralement besoin de soutien pour prendre des décisions de santé et des décisions juridiques, ainsi que pour apprendre à exercer avec compétence un métier qualifié. Un soutien est généralement nécessaire pour élever une famille.</td></tr>\n<tr><th>Moyen</th><td>Tout au long du développement, les compétences conceptuelles sont nettement en retrait de celles des pairs. À l’âge préscolaire, le langage et les compétences préscolaires se développent lentement. À l’âge scolaire, les progrès en lecture, écriture, mathématiques et compréhension du temps et de l’argent sont lents et nettement limités par rapport à ceux des pairs. Chez l’adulte, les compétences scolaires restent typiquement à un niveau élémentaire, et toute utilisation de celles-ci dans la vie professionnelle et personnelle nécessite un soutien. Une aide quotidienne continue est nécessaire pour réaliser les tâches conceptuelles de la vie courante ; d’autres personnes peuvent assumer entièrement ces responsabilités.</td><td>La personne présente, tout au long du développement, des différences marquées par rapport à ses pairs dans les comportements sociaux et de communication. Le langage parlé est généralement un outil principal de communication sociale, mais il est beaucoup moins complexe que celui des pairs. La capacité à établir des relations est manifeste dans les liens avec la famille et les amis ; la personne peut avoir des amitiés satisfaisantes tout au long de la vie et parfois des relations amoureuses à l’âge adulte. Elle peut néanmoins mal percevoir ou interpréter les signaux sociaux. Le jugement social et les capacités de décision sont limités, et les aidants doivent l’accompagner dans les décisions de vie. Les amitiés avec des pairs au développement typique sont souvent affectées par les limitations sociales ou de communication. Un soutien social et communicationnel important est nécessaire à la réussite dans le milieu de travail.</td><td>À l’âge adulte, la personne peut répondre à ses besoins personnels concernant l’alimentation, l’habillage, l’élimination et l’hygiène, mais une période prolongée d’enseignement et du temps sont nécessaires pour atteindre l’autonomie dans ces domaines ; des rappels peuvent être nécessaires. De même, elle peut participer à toutes les tâches ménagères à l’âge adulte, mais après un enseignement prolongé, et des soutiens continus restent généralement nécessaires pour une performance de niveau adulte. Un emploi autonome dans des postes exigeant peu de compétences conceptuelles ou de communication est possible, mais un soutien considérable des collègues, des superviseurs et d’autres personnes est nécessaire pour gérer les attentes sociales, la complexité du travail et les responsabilités annexes telles que les horaires, les transports, les prestations de santé et la gestion de l’argent. Diverses compétences de loisirs peuvent être acquises ; elles demandent habituellement des soutiens supplémentaires et des occasions d’apprentissage sur une longue période. Des comportements inadaptés sont présents chez une minorité importante et provoquent des problèmes sociaux.</td></tr>\n<tr><th>Grave</th><td>L’acquisition des compétences conceptuelles est limitée. La personne comprend généralement peu le langage écrit ou les concepts impliquant les nombres, les quantités, le temps et l’argent. Les aidants fournissent un soutien étendu pour résoudre les problèmes tout au long de la vie.</td><td>Le langage parlé est très limité en vocabulaire et en grammaire. Il peut se réduire à des mots isolés ou à des phrases et être complété par des moyens de communication augmentative. La parole et la communication sont centrées sur l’ici et maintenant des événements quotidiens. Le langage sert davantage à la communication sociale qu’à l’explication. La personne comprend une parole simple et la communication gestuelle. Les relations avec les membres de la famille et les autres personnes familières sont une source de plaisir et d’aide.</td><td>La personne a besoin de soutien pour toutes les activités quotidiennes, notamment les repas, l’habillage, la toilette et l’élimination. Une surveillance permanente est nécessaire. Elle ne peut pas prendre de décisions responsables concernant son propre bien-être ou celui des autres. À l’âge adulte, la participation aux tâches domestiques, aux loisirs et au travail nécessite un soutien et une aide continus. Dans tous les domaines, l’acquisition des compétences suppose un enseignement prolongé et des soutiens permanents. Des comportements inadaptés, dont l’autoagressivité, sont présents chez une minorité importante.</td></tr>\n<tr><th>Profond</th><td>Les compétences conceptuelles portent généralement sur le monde physique plutôt que sur les processus symboliques. La personne peut utiliser des objets dans un but précis pour les soins personnels, le travail et les loisirs. Certaines compétences visuospatiales, comme l’appariement et le tri selon les caractéristiques physiques, peuvent être acquises. Des atteintes motrices et sensorielles associées peuvent toutefois empêcher l’utilisation fonctionnelle des objets.</td><td>La compréhension de la communication symbolique, parlée ou gestuelle, est très limitée. La personne peut comprendre certaines instructions ou certains gestes simples. Elle exprime largement ses désirs et ses émotions par une communication non verbale et non symbolique. Elle apprécie les relations avec les membres de la famille qu’elle connaît bien, les aidants et les autres personnes familières, et initie des interactions sociales ou y répond par des signaux gestuels et émotionnels. Des atteintes sensorielles et physiques associées peuvent empêcher de nombreuses activités sociales.</td><td>La personne dépend des autres pour tous les aspects des soins physiques quotidiens, de la santé et de la sécurité, même si elle peut participer à certaines de ces activités. En l’absence de handicap physique sévère, elle peut aider à certaines tâches quotidiennes du foyer, comme apporter les assiettes à table. Des actions simples avec des objets peuvent permettre la participation à certaines activités professionnelles, avec un niveau élevé de soutien continu. Les loisirs peuvent inclure le plaisir d’écouter de la musique, de regarder des films, de se promener ou de participer à des activités aquatiques, toujours avec l’aide d’autrui. Les atteintes physiques et sensorielles associées constituent fréquemment des obstacles à une participation active, au-delà de l’observation, aux activités domestiques, récréatives et professionnelles. Des comportements inadaptés sont présents chez une minorité importante.</td></tr>\n</tbody></table>"},{"title":"Spécifications","kind":"specifiers","pdf":[183,184],"html":"<p>Les différents niveaux de sévérité sont définis selon le fonctionnement adaptatif, et non selon les scores de QI, car c’est le fonctionnement adaptatif qui détermine le niveau de soutien nécessaire. De plus, les mesures de QI sont moins valides dans la partie basse de l’échelle des QI.</p>"},{"title":"Caractéristiques diagnostiques","kind":"clinical","pdf":[184,186],"html":"<p>Les caractéristiques essentielles du trouble du développement intellectuel (handicap intellectuel) sont des déficits des capacités mentales générales (critère A) et une altération du fonctionnement adaptatif quotidien par rapport à des pairs de même âge, de même genre et de contexte socioculturel comparable (critère B). Le début se situe pendant la période développementale (critère C). Le diagnostic repose à la fois sur l’évaluation clinique et sur des tests standardisés des fonctions intellectuelles, des tests neuropsychologiques standardisés et des tests standardisés du fonctionnement adaptatif.</p>\n<p>Le critère A concerne les fonctions intellectuelles impliquant le raisonnement, la résolution de problèmes, la planification, la pensée abstraite, le jugement, l’apprentissage à partir de l’enseignement et de l’expérience, et la compréhension pratique. Leurs composantes essentielles comprennent la compréhension verbale, la mémoire de travail, le raisonnement perceptif, le raisonnement quantitatif, la pensée abstraite et l’efficience cognitive. Le fonctionnement intellectuel est habituellement mesuré par des tests d’intelligence complets, administrés individuellement, psychométriquement valides et culturellement adaptés. Les personnes ayant un trouble du développement intellectuel obtiennent des scores d’environ deux écarts-types ou davantage sous la moyenne de la population, en tenant compte d’une marge d’erreur de mesure, généralement ± 5 points. Sur les tests d’écart-type 15 et de moyenne 100, cela correspond à un score de 65–75 (70 ± 5). Une formation et un jugement cliniques sont nécessaires pour interpréter les résultats et évaluer les performances intellectuelles.</p>\n<p>Parmi les facteurs pouvant affecter les scores figurent les effets de pratique — apprentissage lié à la répétition des tests — et l’« effet Flynn » — scores excessivement élevés liés à des normes devenues anciennes. L’utilisation de tests brefs de dépistage de l’intelligence ou de tests collectifs peut produire des scores non valides ; des résultats très discordants entre les sous-tests peuvent rendre non valide un QI global. Les instruments doivent être étalonnés pour le contexte socioculturel et la langue maternelle de la personne. Des troubles associés affectant la communication, le langage et/ou les fonctions motrices ou sensorielles peuvent influencer les scores. Des profils cognitifs individuels fondés sur des tests neuropsychologiques, ainsi qu’une évaluation intellectuelle croisant plusieurs batteries — plusieurs tests de QI ou autres tests cognitifs pour construire un profil — sont plus utiles à la compréhension des capacités intellectuelles qu’un seul score de QI.</p>\n<p>Ces évaluations peuvent identifier les points forts et les faiblesses relatifs, ce qui importe pour la planification scolaire et professionnelle. Les scores de QI sont des approximations du fonctionnement conceptuel, mais peuvent être insuffisants pour évaluer le raisonnement dans les situations réelles et la maîtrise des tâches pratiques. Ainsi, une personne ayant des déficits intellectuels et un QI quelque peu supérieur à 65–75 peut néanmoins présenter des difficultés adaptatives de jugement social ou d’autres domaines si importantes que son fonctionnement réel est cliniquement comparable à celui de personnes ayant un QI plus bas. Le jugement clinique est donc important dans l’interprétation des résultats de QI, qui ne suffisent pas comme seuls critères diagnostiques d’un trouble du développement intellectuel.</p>\n<p>Les déficits du fonctionnement adaptatif (critère B) concernent la manière dont une personne satisfait aux normes de sa communauté en matière d’autonomie personnelle et de responsabilité sociale, comparativement aux personnes d’âge et de contexte socioculturel semblables. Le fonctionnement adaptatif implique un raisonnement adaptatif dans trois domaines : conceptuel, social et pratique. Le domaine conceptuel, ou scolaire, comprend notamment la mémoire, le langage, la lecture, l’écriture, le raisonnement mathématique, l’acquisition de connaissances pratiques, la résolution de problèmes et le jugement dans les situations nouvelles. Le domaine social comprend notamment la conscience des pensées, sentiments et expériences d’autrui, l’empathie, les compétences de communication interpersonnelle, la capacité à nouer des amitiés et le jugement social. Le domaine pratique comprend l’apprentissage et l’autogestion dans les différents milieux de vie, notamment les soins personnels, les responsabilités professionnelles, la gestion de l’argent, les loisirs, l’autorégulation du comportement et l’organisation des tâches scolaires et professionnelles. Les capacités intellectuelles, l’éducation, la motivation, la socialisation, les caractéristiques de personnalité, les possibilités professionnelles, l’expérience culturelle et les autres affections médicales ou troubles mentaux associés influencent le fonctionnement adaptatif.</p>\n<p>Le fonctionnement adaptatif est évalué par l’examen clinique et par des mesures individualisées, culturellement adaptées et psychométriquement solides. Les mesures standardisées sont utilisées avec des informateurs connaissant bien la personne — parent ou autre membre de la famille, enseignant, conseiller, soignant — ainsi qu’avec la personne elle-même dans la mesure du possible. D’autres informations proviennent des évaluations éducatives, développementales, médicales et de santé mentale. Les scores des mesures standardisées et les données d’entretien doivent être interprétés à l’aide du jugement clinique. Lorsque les tests standardisés sont difficiles ou impossibles pour diverses raisons, telles qu’une atteinte sensorielle ou des comportements très problématiques, un trouble du développement intellectuel non spécifié peut être diagnostiqué. Le fonctionnement adaptatif peut être difficile à évaluer en milieu contrôlé — prison ou centre de détention, par exemple ; si possible, recueillir des informations corroborantes sur le fonctionnement hors de ces milieux.</p>\n<p>Le critère B est rempli lorsqu’au moins un domaine du fonctionnement adaptatif — conceptuel, social ou pratique — est suffisamment altéré pour qu’un soutien continu soit nécessaire afin que la personne fonctionne de manière adéquate dans plusieurs environnements, tels que le domicile, l’école, le travail et la communauté. Le critère C, début pendant la période développementale, correspond à la reconnaissance de déficits intellectuels et adaptatifs présents durant l’enfance ou l’adolescence.</p>\n<p>Une évaluation complète comprend l’appréciation des capacités intellectuelles et du fonctionnement adaptatif, l’identification des étiologies génétiques et non génétiques, la recherche d’affections médicales associées — paralysie cérébrale ou épilepsie, par exemple — et l’évaluation des troubles mentaux, émotionnels et comportementaux concomitants. Elle peut inclure l’histoire médicale pré- et périnatale de base, un arbre généalogique sur trois générations, l’examen physique, une évaluation génétique — caryotype ou analyse chromosomique sur puce et recherche de syndromes génétiques spécifiques —, un dépistage métabolique et une évaluation par neuro-imagerie.</p>"},{"title":"Caractéristiques associées","kind":"associated","pdf":[186,187],"html":"<p>Le trouble du développement intellectuel est une affection hétérogène aux causes multiples. Des difficultés peuvent lui être associées concernant le jugement social, l’évaluation des risques, l’autogestion des comportements, des émotions ou des relations interpersonnelles, ou la motivation en milieu scolaire ou professionnel. La méconnaissance du risque et du danger peut augmenter les blessures accidentelles. Le manque de compétences de communication peut prédisposer à des comportements perturbateurs et agressifs. La crédulité est fréquente : naïveté en situation sociale et tendance à se laisser facilement entraîner par les autres. La crédulité et la méconnaissance du risque peuvent favoriser l’exploitation par autrui et une possible victimisation, des escroqueries, une implication involontaire dans des actes criminels, de faux aveux et un risque de violences physiques et sexuelles. Ces caractéristiques associées peuvent avoir de l’importance dans les affaires pénales, y compris dans les audiences de type Atkins impliquant la peine de mort.</p><p>Au-delà des déficits du fonctionnement adaptatif, les personnes peuvent souffrir de leurs limitations intellectuelles. Même si cette souffrance n’est pas toujours considérée comme affectant le fonctionnement, elle peut constituer un élément important du tableau clinique.</p>"},{"title":"Prévalence","kind":"prevalence","pdf":[187,187],"html":"<p>La prévalence générale du trouble du développement intellectuel est d’environ 10 pour 1 000 dans la population générale ; elle varie toutefois selon les pays et leur niveau de développement, étant approximativement de 16 pour 1 000 dans les pays à revenu intermédiaire et de 9 pour 1 000 dans les pays à revenu élevé. Elle varie également selon l’âge, étant plus élevée chez les jeunes que chez les adultes. Aux États-Unis, la prévalence pour 1 000 habitants ne varie pas significativement selon les groupes ethnoraciaux.</p>"},{"title":"Développement et évolution","kind":"course","pdf":[187,189],"html":"<p>Le trouble du développement intellectuel débute pendant la période développementale. L’âge et les caractéristiques initiales dépendent de l’étiologie et de la sévérité du dysfonctionnement cérébral. Des retards d’acquisition motrice, langagière et sociale peuvent être repérés pendant les deux premières années dans les formes les plus sévères, tandis que les formes légères peuvent n’être identifiables qu’à l’âge scolaire, lorsque les difficultés d’apprentissage deviennent apparentes. Tous les critères, y compris le critère C, doivent être remplis dans les antécédents ou dans la présentation actuelle. Certains enfants de moins de 5 ans qui rempliront ultérieurement les critères du trouble du développement intellectuel présentent des déficits répondant aux critères du retard global du développement.</p><p>Lorsqu’il est associé à un syndrome génétique, une apparence physique caractéristique peut être présente, comme dans la trisomie 21. Certains syndromes comportent un phénotype comportemental, c’est-à-dire des comportements caractéristiques d’un trouble génétique particulier, tel le syndrome de Lesch-Nyhan. Dans les formes acquises, le début peut être brutal après une maladie telle qu’une méningite ou une encéphalite, ou après un traumatisme crânien survenu pendant la période développementale. Lorsque le trouble résulte d’une perte de compétences cognitives antérieurement acquises, comme après un traumatisme crânien grave, les diagnostics de trouble du développement intellectuel et de trouble neurocognitif peuvent être tous deux posés.</p><p>Bien que le trouble soit généralement non progressif, certaines affections génétiques, comme le syndrome de Rett, comportent des périodes d’aggravation suivies de stabilisation ; d’autres, comme le syndrome de Sanfilippo ou la trisomie 21, comportent une aggravation progressive de degré variable du fonctionnement intellectuel. Dans certains cas, cette aggravation représente la survenue surajoutée d’un trouble neurocognitif à l’âge adulte : les personnes ayant une trisomie 21 présentent notamment un risque élevé de trouble neurocognitif dû à la maladie d’Alzheimer à l’âge adulte. Dans cette situation, les deux diagnostics sont posés.</p><p>Le trouble dure généralement toute la vie, bien que sa sévérité puisse évoluer. L’évolution peut être influencée par les affections médicales ou génétiques sous-jacentes et les affections associées, comme les déficiences auditives ou visuelles et l’épilepsie. Des interventions précoces et continues peuvent améliorer le fonctionnement adaptatif durant l’enfance et à l’âge adulte. Elles entraînent parfois une amélioration significative du fonctionnement intellectuel, au point que le diagnostic n’est plus approprié. Il est donc courant, lors de l’évaluation des nourrissons et des jeunes enfants, de différer ce diagnostic jusqu’à ce qu’une intervention appropriée ait été mise en œuvre. Chez les enfants plus âgés et les adultes, le soutien apporté peut permettre une participation complète aux activités quotidiennes et une amélioration du fonctionnement adaptatif. Les évaluations diagnostiques doivent déterminer si cette amélioration résulte d’une acquisition stable et généralisée de nouvelles compétences — auquel cas le diagnostic peut ne plus être approprié — ou si elle dépend des soutiens et des interventions continus — auquel cas le diagnostic peut rester approprié.</p>"},{"title":"Facteurs de risque et pronostiques","kind":"risk","pdf":[189,189],"html":"<p><strong>Génétiques et physiologiques.</strong> Les étiologies prénatales comprennent les syndromes génétiques — variations de séquence ou du nombre de copies impliquant un ou plusieurs gènes, anomalies chromosomiques —, les erreurs innées du métabolisme, les malformations cérébrales, les maladies maternelles, y compris placentaires, et les influences environnementales : alcool, autres substances, toxines et agents tératogènes. Les causes périnatales comprennent divers événements liés au travail et à l’accouchement conduisant à une encéphalopathie néonatale. Les causes postnatales comprennent les lésions hypoxo-ischémiques, les traumatismes crâniens, les infections, les maladies démyélinisantes, les troubles épileptiques tels que les spasmes infantiles, les carences sociales graves et chroniques, ainsi que les syndromes métaboliques toxiques et les intoxications, notamment au plomb ou au mercure.</p>"},{"title":"Questions diagnostiques liées à la culture","kind":"culture","pdf":[189,190],"html":"<p>Le trouble du développement intellectuel se rencontre dans tous les groupes ethnoraciaux. Les différences de prévalence selon les contextes sociaux et culturels peuvent refléter des variations des risques environnementaux — lésions périnatales ou carence sociale chronique, par exemple — associés au statut socioéconomique et à l’accès à des soins de qualité. En Australie-Occidentale, par exemple, la prévalence dans la population des enfants aborigènes est de 39 pour 1 000, contre 16 pour 1 000 chez les jeunes non aborigènes, plus favorisés économiquement. L’évaluation nécessite une sensibilité culturelle et une connaissance des conditions sociostructurelles ; il faut prendre en compte le contexte socioéconomique, ethnique, culturel et linguistique, les expériences accessibles et le fonctionnement adaptatif de la personne dans sa communauté et son environnement culturel. Les explications culturelles de ce trouble varient et peuvent inclure des croyances en des influences surnaturelles ou en une punition pour une faute supposée ou réelle de la mère ou des parents, pouvant être associées à la honte et à une sous-déclaration du trouble.</p>"},{"title":"Questions diagnostiques liées au sexe et au genre","kind":"gender","pdf":[190,190],"html":"<p>Globalement, les personnes de sexe masculin reçoivent plus souvent que celles de sexe féminin un diagnostic de trouble du développement intellectuel, dans les formes légères — rapport masculin/féminin moyen de 1,6:1 — comme dans les formes graves — rapport moyen de 1,2:1. Ces rapports varient toutefois largement selon les études. Des facteurs génétiques liés au sexe, des différences selon le sexe dans d’autres facteurs génétiques, comme certains variants du nombre de copies, et la vulnérabilité masculine aux atteintes cérébrales peuvent expliquer une partie de ces différences.</p>"},{"title":"Association aux pensées ou comportements suicidaires","kind":"suicide","pdf":[190,190],"html":"<p>Les personnes ayant un trouble du développement intellectuel peuvent présenter un risque suicidaire associé à un trouble mental concomitant, à un niveau plus élevé de fonctionnement intellectuel et adaptatif et à des facteurs de stress immédiatement antérieurs. Les troubles mentaux associés peuvent se manifester de manière atypique ; leur reconnaissance et la recherche de pensées suicidaires sont donc importantes dans l’évaluation, avec une attention particulière aux changements du comportement de la personne.</p>"},{"title":"Diagnostic différentiel","kind":"differential","pdf":[190,191],"html":"<p>Le diagnostic de trouble du développement intellectuel doit être posé chaque fois que les critères A, B et C sont réunis. Il ne doit pas être présumé du seul fait d’une affection génétique ou médicale particulière. Un syndrome génétique lié à ce trouble doit être indiqué comme diagnostic concomitant.</p><p><strong>Troubles neurocognitifs majeur et léger.</strong> Le trouble du développement intellectuel est classé parmi les troubles du neurodéveloppement et se distingue des troubles neurocognitifs, caractérisés par une perte du fonctionnement cognitif. Un trouble neurocognitif majeur peut coexister avec lui, par exemple lorsqu’une personne ayant une trisomie 21 développe une maladie d’Alzheimer ou qu’une personne ayant un trouble du développement intellectuel perd des capacités cognitives supplémentaires après un traumatisme crânien. Les deux diagnostics peuvent alors être retenus. De plus, lorsque le fonctionnement cognitif se stabilise après une lésion cérébrale traumatique ou non traumatique survenue pendant l’enfance ou l’adolescence et qu’il n’existe pas de déclin cognitif continu, les deux diagnostics peuvent être utilisés si les critères du trouble du développement intellectuel sont remplis.</p><p><strong>Troubles de la communication et trouble spécifique des apprentissages.</strong> Ces troubles du neurodéveloppement sont spécifiques aux domaines de la communication et des apprentissages et ne comportent pas de déficits intellectuels et adaptatifs. Ils peuvent coexister avec un trouble du développement intellectuel. Les deux diagnostics sont posés si tous les critères du trouble du développement intellectuel et du trouble de la communication ou des apprentissages sont réunis.</p><p><strong>Trouble du spectre de l’autisme.</strong> Le trouble du développement intellectuel est fréquent chez les personnes ayant un trouble du spectre de l’autisme. L’évaluation des capacités intellectuelles peut être compliquée par les déficits de communication sociale et de comportement propres au trouble du spectre de l’autisme, qui peuvent gêner la compréhension et le respect des procédures de test. Une évaluation appropriée du fonctionnement intellectuel est indispensable, avec réévaluations au cours de la période développementale, car les scores de QI peuvent être instables, notamment dans la petite enfance.</p>"},{"title":"Comorbidité","kind":"comorbidity","pdf":[191,192],"html":"<p>Les affections neurodéveloppementales, mentales et médicales associées sont fréquentes dans le trouble du développement intellectuel. Certaines, comme les troubles mentaux, la paralysie cérébrale et l’épilepsie, sont trois à quatre fois plus fréquentes que dans la population générale. Le pronostic et le devenir des diagnostics associés peuvent être influencés par la présence du trouble intellectuel. Les procédures d’évaluation peuvent nécessiter des adaptations en raison de troubles associés, notamment de la communication, du spectre de l’autisme, moteurs, sensoriels ou autres. Des informateurs connaissant bien la personne sont essentiels pour identifier l’irritabilité, la dysrégulation de l’humeur, l’agressivité, les problèmes d’alimentation et de sommeil, et pour évaluer le fonctionnement adaptatif dans différents milieux communautaires.</p><p>Les troubles neurodéveloppementaux et autres troubles mentaux associés les plus courants sont le TDAH, les troubles dépressifs et bipolaires, les troubles anxieux, le trouble du spectre de l’autisme, le trouble des mouvements stéréotypés avec ou sans autoagressivité, les troubles du contrôle des impulsions et le trouble neurocognitif majeur. Un trouble dépressif caractérisé peut survenir à tous les niveaux de sévérité du trouble intellectuel. Les comportements autoagressifs nécessitent une attention diagnostique rapide et peuvent justifier un diagnostic séparé de trouble des mouvements stéréotypés. Les personnes ayant un trouble du développement intellectuel, particulièrement dans les formes les plus graves, peuvent aussi présenter une agressivité et des comportements perturbateurs, y compris des violences envers autrui ou des destructions de biens.</p><p>Les personnes ayant un trouble du développement intellectuel ont, de façon disproportionnée, davantage de problèmes de santé, dont l’obésité, que la population générale. Elles ne peuvent fréquemment pas verbaliser les symptômes physiques ressentis, ce qui peut laisser des problèmes de santé non diagnostiqués et non traités.</p>"},{"title":"Relations avec les autres classifications","kind":"classification","pdf":[192,192],"html":"<p>La CIM-11 utilise le terme « troubles du développement intellectuel » pour indiquer qu’il s’agit de troubles impliquant une altération précoce du fonctionnement cérébral. Elle les décrit comme un métasyndrome survenant pendant la période développementale, analogue à la démence ou au trouble neurocognitif majeur survenant plus tard dans la vie. La CIM-11 comporte quatre sous-types : léger, moyen, grave et profond.</p><p>L’American Association on Intellectual and Developmental Disabilities (AAIDD) utilise le terme « handicap intellectuel ». Sa classification est multidimensionnelle plutôt que catégorielle et repose sur le concept de handicap. Plutôt que d’énumérer des spécifications de sévérité comme le DSM-5, l’AAIDD met l’accent sur un profil des soutiens fondé sur la sévérité.</p>"}]},{"id":"retard-global","family":"intellectuel","title":"Retard global du développement","english":"Global Developmental Delay","codes":["F88"],"aliases":["retard psychomoteur","retard développemental","RGD"],"pages":"46","pdf":[193,193],"kind":"description","related":["developpement-intellectuel","intellectuel-non-specifie"],"chapter":"neurodev","sections":[{"title":"Retard global du développement","kind":"criteria","pdf":[193,193],"html":"<p><strong>F88</strong></p><p>Ce diagnostic est réservé aux enfants de moins de 5 ans lorsque le niveau de sévérité clinique ne peut pas être évalué de façon fiable pendant la petite enfance. Cette catégorie est diagnostiquée lorsqu’une personne n’atteint pas les étapes développementales attendues dans plusieurs domaines du fonctionnement intellectuel ; elle s’applique aux personnes qui ne peuvent pas bénéficier d’évaluations systématiques du fonctionnement intellectuel, y compris les enfants trop jeunes pour participer aux tests standardisés. Cette catégorie nécessite une réévaluation après un certain temps.</p>"}]},{"id":"intellectuel-non-specifie","family":"intellectuel","title":"Trouble du développement intellectuel non spécifié","subtitle":"Handicap intellectuel non spécifié","english":"Unspecified Intellectual Developmental Disorder (Intellectual Disability)","codes":["F79"],"aliases":["déficience intellectuelle non précisée","retard mental non spécifié"],"pages":"46","pdf":[193,193],"kind":"description","related":["developpement-intellectuel","retard-global"],"chapter":"neurodev","sections":[{"title":"Trouble du développement intellectuel (handicap intellectuel) non spécifié","kind":"criteria","pdf":[193,193],"html":"<p><strong>F79</strong></p><p>Cette catégorie est réservée aux personnes de plus de 5 ans lorsque l’évaluation du degré de trouble du développement intellectuel (handicap intellectuel) par les procédures disponibles localement est rendue difficile ou impossible par des atteintes sensorielles ou physiques associées — comme la cécité, une surdité prélinguale ou un handicap locomoteur —, par des troubles graves du comportement ou par un trouble mental concomitant. Cette catégorie ne doit être utilisée que dans des circonstances exceptionnelles et nécessite une réévaluation après un certain temps.</p>"}]},{"id":"langage","family":"communication","title":"Trouble du langage","english":"Language Disorder","codes":["F80.2"],"aliases":["dysphasie","TDL","trouble développemental du langage","langage réceptif","langage expressif","retard de langage","compréhension du langage","vocabulaire"],"pages":"47–50","pdf":[194,199],"criteriaPages":"47","criteriaPdf":[195,195],"related":["sons-parole","communication-sociale","autisme","apprentissages"],"chapter":"neurodev","sections":[{"title":"Critères diagnostiques","kind":"criteria","pdf":[195,195],"html":"<p><strong>F80.2</strong></p><p><strong>A.</strong> Difficultés persistantes d’acquisition et d’utilisation du langage dans ses différentes modalités — orale, écrite, langue des signes ou autre — dues à des déficits de compréhension ou de production comprenant :</p><ol><li>Un vocabulaire réduit : connaissance et utilisation des mots.</li><li>Une structure de phrase limitée : capacité à combiner des mots et leurs terminaisons pour former des phrases selon les règles de grammaire et de morphologie.</li><li>Une altération du discours : capacité à utiliser le vocabulaire et à relier des phrases pour expliquer ou décrire un sujet ou une suite d’événements, ou tenir une conversation.</li></ol><p><strong>B.</strong> Les capacités langagières sont nettement et de façon quantifiable inférieures au niveau attendu pour l’âge, entraînant des limitations fonctionnelles de la communication efficace, de la participation sociale, de la réussite scolaire ou du fonctionnement professionnel, isolément ou conjointement.</p><p><strong>C.</strong> Le début des symptômes se situe pendant la période développementale précoce.</p><p><strong>D.</strong> Les difficultés ne sont pas attribuables à une déficience auditive ou à une autre atteinte sensorielle, à un dysfonctionnement moteur ou à une autre affection médicale ou neurologique, et ne sont pas mieux expliquées par un trouble du développement intellectuel (handicap intellectuel) ou un retard global du développement.</p>"},{"title":"Caractéristiques diagnostiques","kind":"clinical","pdf":[195,196],"html":"<p>Les caractéristiques essentielles du trouble du langage sont les difficultés d’acquisition et d’utilisation du langage dues à des déficits de compréhension ou de production du vocabulaire, de la grammaire, de la structure des phrases et du discours. Les déficits sont manifestes dans la communication orale, écrite ou en langue des signes. L’apprentissage et l’utilisation du langage dépendent des compétences réceptives et expressives. La capacité expressive désigne la production de signaux vocaux, gestuels ou verbaux, tandis que la capacité réceptive désigne la réception et la compréhension des messages langagiers. Les compétences doivent être évaluées dans les deux modalités, car leur sévérité peut différer.</p><p>Le trouble affecte habituellement le vocabulaire et la grammaire, ce qui limite ensuite le discours. L’apparition des premiers mots et des premières phrases est susceptible d’être retardée ; le vocabulaire est plus réduit et moins varié qu’attendu ; les phrases sont plus courtes et moins complexes, avec des erreurs grammaticales, notamment au passé. Les déficits de compréhension sont souvent sous-estimés, car les enfants peuvent bien utiliser le contexte pour déduire le sens. Il peut exister des difficultés à trouver les mots, des définitions verbales pauvres ou une mauvaise compréhension des synonymes, des sens multiples ou des jeux de mots adaptés à l’âge et à la culture. Les difficultés à mémoriser de nouveaux mots et phrases se manifestent par des difficultés à suivre des consignes de longueur croissante, à répéter des séries d’informations verbales — numéro de téléphone ou liste de courses, par exemple — et à retenir de nouvelles séquences sonores, compétence pouvant être importante pour apprendre de nouveaux mots. Les difficultés de discours se traduisent par une capacité réduite à donner des informations adéquates sur les événements essentiels et à raconter une histoire cohérente.</p><p>La difficulté langagière se manifeste par des capacités nettement et de façon quantifiable inférieures à celles attendues pour l’âge, interférant significativement avec la réussite scolaire, les performances professionnelles, la communication efficace ou la socialisation (critère B). Le diagnostic repose sur la synthèse de l’histoire de la personne, de l’observation clinique directe dans différents contextes — domicile, école ou travail — et des scores de tests standardisés de capacités langagières, qui peuvent guider l’estimation de la sévérité.</p>"},{"title":"Caractéristiques associées","kind":"associated","pdf":[196,197],"html":"<p>Les personnes, même les enfants, peuvent être habiles à s’adapter à leurs limitations langagières. Elles peuvent paraître timides ou réticentes à parler et préférer communiquer uniquement avec les membres de leur famille ou d’autres personnes familières. Bien que ces indices sociaux ne permettent pas de diagnostiquer un trouble du langage, leur caractère notable et persistant justifie une orientation pour une évaluation complète du langage.</p>"},{"title":"Développement et évolution","kind":"course","pdf":[197,197],"html":"<p>L’acquisition du langage est marquée par des changements depuis son apparition chez le tout-petit jusqu’au niveau de compétence adulte atteint à l’adolescence. Ils concernent toutes ses dimensions — sons, mots, grammaire, récits et textes explicatifs, compétences conversationnelles — selon des progressions et des synchronisations liées à l’âge. Le trouble du langage émerge pendant la période développementale précoce ; cependant, l’acquisition du premier vocabulaire et des premières combinaisons de mots varie considérablement. Prises isolément, les différences individuelles de la petite enfance prédisent peu le devenir ultérieur, bien qu’un début tardif du langage à 24 mois ait été, dans un échantillon de population générale, le meilleur prédicteur de l’évolution à 7 ans. À 4 ans, les différences individuelles de capacité langagière sont plus stables, les mesures sont plus précises et prédisent fortement le devenir ultérieur. Un trouble du langage diagnostiqué à partir de 4 ans est susceptible d’être stable dans le temps et persiste généralement à l’âge adulte, bien que le profil particulier des forces et des déficits langagiers puisse évoluer au cours du développement.</p><p>Les troubles du langage peuvent avoir des conséquences sociales tout au long de la vie. Les enfants concernés sont exposés à la victimisation par leurs pairs. Les femmes ayant présenté un trouble du langage dans l’enfance pourraient avoir un risque d’agression sexuelle à l’âge adulte presque trois fois supérieur à celui des enfants non concernés.</p>"},{"title":"Facteurs de risque et pronostiques","kind":"risk","pdf":[197,198],"html":"<p>Les enfants présentant des déficits du langage réceptif ont un pronostic moins favorable que ceux ayant des déficits principalement expressifs. Les déficits réceptifs résistent davantage au traitement, et des difficultés de compréhension de lecture sont fréquemment observées.</p><p><strong>Environnementaux.</strong> Le bilinguisme ne cause pas et n’aggrave pas un trouble du langage, mais les enfants bilingues peuvent présenter des retards ou des différences de développement langagier. Un trouble du langage chez un enfant bilingue affecte les deux langues ; il importe donc d’envisager une évaluation dans les deux langues.</p><p><strong>Génétiques et physiologiques.</strong> Les troubles du langage sont fortement héritables, et les membres de la famille ont plus souvent des antécédents de difficultés langagières. Les études de jumeaux en population générale retrouvent de façon constante une héritabilité importante ; les études moléculaires suggèrent l’interaction de plusieurs gènes au sein des voies causales.</p>"},{"title":"Diagnostic différentiel","kind":"differential","pdf":[198,199],"html":"<p><strong>Variations normales du langage.</strong> Le trouble du langage doit être distingué des variations développementales habituelles, ce qui peut être difficile avant 4 ans. Les variations régionales, sociales ou culturelles et ethniques — dialectes, par exemple — doivent être prises en compte lors de l’évaluation.</p><p><strong>Déficience auditive ou autre atteinte sensorielle.</strong> Une déficience auditive doit être exclue comme cause principale des difficultés langagières. Des déficits du langage peuvent accompagner une déficience auditive, un autre déficit sensoriel ou un déficit moteur de la parole. S’ils dépassent ceux habituellement associés à ces problèmes, un trouble du langage peut être diagnostiqué.</p><p><strong>Trouble du développement intellectuel (handicap intellectuel).</strong> L’altération du langage en est souvent la manifestation initiale. Le diagnostic définitif du trouble intellectuel peut toutefois devoir attendre que l’enfant soit capable de réaliser les évaluations standardisées. Le trouble du langage peut survenir à différents niveaux de capacité intellectuelle ; une discordance entre les capacités verbales et non verbales n’est pas nécessaire au diagnostic.</p><p><strong>Trouble du spectre de l’autisme.</strong> Il se manifeste fréquemment par un retard de langage, mais s’accompagne souvent de comportements absents du trouble du langage : manque d’intérêt social ou interactions inhabituelles — tirer quelqu’un par la main sans tenter de le regarder —, jeux étranges — transporter des jouets sans jamais jouer avec —, communication inhabituelle — connaître l’alphabet sans répondre à son propre prénom — et adhésion rigide aux routines et comportements répétitifs — battements des mains, tournoiements, écholalie.</p><p><strong>Troubles neurologiques.</strong> Le trouble du langage peut être acquis en association avec des affections neurologiques, notamment une épilepsie, comme dans l’aphasie acquise ou le syndrome de Landau-Kleffner.</p><p><strong>Régression du langage.</strong> La perte de parole et de langage chez un enfant, quel que soit son âge, justifie une évaluation approfondie à la recherche d’une affection neurologique spécifique, comme le syndrome de Landau-Kleffner. La perte du langage peut être un symptôme de crises épileptiques ; une évaluation diagnostique est nécessaire pour exclure une épilepsie, notamment par un électroencéphalogramme standard et de sommeil. Une diminution de comportements sociaux et communicationnels essentiels pendant les deux premières années est manifeste chez la plupart des enfants présentant un trouble du spectre de l’autisme et doit conduire à une évaluation de ce trouble.</p>"},{"title":"Comorbidité","kind":"comorbidity","pdf":[199,199],"html":"<p>Le trouble du langage peut être associé à d’autres troubles du neurodéveloppement : trouble spécifique des apprentissages touchant l’écrit et les compétences numériques, trouble du développement intellectuel, TDAH, trouble du spectre de l’autisme et trouble développemental de la coordination. Il est également associé au trouble de la communication sociale (pragmatique). Dans les échantillons cliniques, il peut coexister avec le trouble des sons de la parole, bien que les données d’un vaste échantillon de population d’enfants de 6 ans aux États-Unis suggèrent que cette comorbidité pourrait être rare, à 1,3 %. Des antécédents familiaux de troubles de la parole ou du langage sont souvent présents.</p>"}]},{"id":"sons-parole","family":"communication","title":"Trouble des sons de la parole","subtitle":"Trouble de la phonation","english":"Speech Sound Disorder","codes":["F80.0"],"aliases":["phonologique","articulation","phonation","dyslalie","prononciation","intelligibilité","sons","articulation"],"pages":"50–51","pdf":[199,203],"criteriaPages":"50","criteriaPdf":[200,200],"related":["langage","begaiement"],"chapter":"neurodev","sections":[{"title":"Critères diagnostiques","kind":"criteria","pdf":[199,200],"html":"<p><strong>F80.0</strong></p><p><strong>A.</strong> Difficulté persistante de production des sons de la parole, réduisant l’intelligibilité de la parole ou empêchant la communication verbale de messages.</p><p><strong>B.</strong> La perturbation limite la communication efficace et interfère avec la participation sociale, la réussite scolaire ou le fonctionnement professionnel, isolément ou conjointement.</p><p><strong>C.</strong> Les symptômes débutent pendant la période développementale précoce.</p><p><strong>D.</strong> Les difficultés ne sont pas attribuables à une affection congénitale ou acquise, telle qu’une paralysie cérébrale, une fente palatine, une surdité ou une baisse de l’audition, un traumatisme crânien ou une autre affection médicale ou neurologique.</p>"},{"title":"Caractéristiques diagnostiques","kind":"clinical","pdf":[200,200],"html":"<p>La production des sons de la parole désigne l’articulation claire des phonèmes — sons individuels — qui, combinés, constituent les mots parlés. Elle nécessite à la fois la connaissance phonologique des sons et la capacité à coordonner les mouvements des articulateurs — mâchoire, langue et lèvres — avec la respiration et la vocalisation. Les enfants ayant des difficultés de production de la parole peuvent présenter, à des degrés variables, des difficultés de connaissance phonologique des sons ou de coordination des mouvements nécessaires à la parole. Le trouble est diagnostiqué lorsque la production des sons ne correspond pas à ce qui est attendu selon l’âge et le stade de développement, et lorsque les déficits ne résultent pas d’une atteinte physique, structurelle, neurologique ou auditive. Chez les enfants au développement typique, la parole devrait être globalement intelligible à 3 ans, alors qu’à 2 ans, seulement 50 % de leur parole peut être compréhensible. Les garçons présentent plus souvent ce trouble que les filles, avec un rapport de 1,5–1,8 pour 1.</p>"},{"title":"Caractéristiques associées","kind":"associated","pdf":[200,201],"html":"<p>Un trouble du langage peut coexister avec le trouble des sons de la parole, bien que cette association soit rare à 6 ans. Des antécédents familiaux de troubles de la parole ou du langage sont souvent présents.</p><p>Si la coordination rapide des articulateurs constitue une difficulté particulière, il peut exister des antécédents de retard ou d’incoordination dans l’acquisition d’autres compétences utilisant ces articulateurs et la musculature faciale associée, notamment la mastication, le maintien de la bouche fermée et le mouchage. D’autres domaines de coordination motrice peuvent être altérés, comme dans le trouble développemental de la coordination. Les termes « apraxie de la parole de l’enfant » et « dyspraxie verbale » désignent des difficultés de production de la parole comportant une composante motrice.</p>"},{"title":"Développement et évolution","kind":"course","pdf":[201,202],"html":"<p>Apprendre à produire les sons clairement et précisément et à enchaîner la parole avec fluidité constitue une acquisition développementale. L’articulation des sons suit une progression reflétée par les normes d’âge des tests standardisés. Les enfants au développement typique utilisent souvent des procédés développementaux de raccourcissement des mots et syllabes lorsqu’ils apprennent à parler ; leur progression dans la maîtrise des sons devrait cependant aboutir à une parole majoritairement intelligible à 3 ans. Les enfants présentant ce trouble continuent d’utiliser des procédés immatures de simplification phonologique après l’âge auquel la plupart peuvent produire les mots clairement.</p><p>Vers 5 ans, la plupart des sons devraient être produits clairement et la plupart des mots prononcés correctement selon les normes d’âge et de la communauté. Les sons les plus fréquemment mal articulés en anglais sont aussi généralement acquis tardivement, d’où leur appellation « late eight » : l, r, s, z, th, ch, dzh et zh. La mauvaise articulation isolée d’un de ces sons peut être considérée comme dans les limites normales jusqu’à 8 ans ; toutefois, si plusieurs sons sont concernés, il importe d’en cibler certains dans un projet d’amélioration de l’intelligibilité, plutôt que d’attendre l’âge auquel presque tous les enfants les produisent correctement. Le sigmatisme — mauvaise articulation des sifflantes — est particulièrement fréquent et peut impliquer une direction frontale ou latérale du flux d’air. Il peut être associé à une déglutition avec poussée linguale.</p><p>La plupart des enfants répondent bien au traitement et les difficultés de parole s’améliorent avec le temps ; le trouble peut donc ne pas persister toute la vie. En revanche, lorsqu’un trouble du langage est également présent, le pronostic est moins favorable et un trouble spécifique des apprentissages peut être associé.</p>"},{"title":"Diagnostic différentiel","kind":"differential","pdf":[202,202],"html":"<p><strong>Variations normales de la parole.</strong> Les variations régionales, sociales, culturelles ou ethniques doivent être considérées avant de poser le diagnostic. Lorsqu’ils sont évalués uniquement en anglais, les enfants bilingues peuvent avoir une intelligibilité globale plus faible, faire davantage d’erreurs de consonnes et de voyelles et produire plus de formes d’erreurs inhabituelles que les enfants anglophones monolingues.</p><p><strong>Déficience auditive ou autre atteinte sensorielle.</strong> Les personnes sourdes ou malentendantes peuvent présenter des erreurs de production des sons. Si les déficits de parole dépassent ceux habituellement associés à ces difficultés, un trouble des sons de la parole peut être diagnostiqué.</p><p><strong>Déficits structurels.</strong> L’altération de la parole peut être due à une anomalie structurelle, telle qu’une fente palatine.</p><p><strong>Dysarthrie.</strong> L’altération de la parole peut être attribuable à un trouble moteur comme la paralysie cérébrale. Des signes neurologiques et des caractéristiques particulières de la voix permettent de distinguer la dysarthrie du trouble des sons de la parole. La distinction peut toutefois être difficile avant 3 ans, particulièrement en l’absence d’atteinte motrice corporelle générale ou lorsque celle-ci est minime, comme dans le syndrome de Worster-Drought.</p><p><strong>Mutisme sélectif.</strong> Une utilisation limitée de la parole peut indiquer un mutisme sélectif, trouble anxieux caractérisé par l’absence de parole dans un ou plusieurs contextes. Il peut apparaître chez des enfants ayant un trouble de la parole en raison de la gêne liée à leurs difficultés, mais beaucoup d’enfants présentant un mutisme sélectif parlent normalement dans des milieux « sûrs », comme à la maison ou avec des amis proches.</p>"},{"title":"Comorbidité","kind":"comorbidity","pdf":[202,203],"html":"<p>La parole peut être altérée de façon particulière dans certaines affections génétiques, telles que la trisomie 21, la délétion 22q ou une mutation du gène FoxP2. Si elles sont présentes, ces affections doivent également être codées.</p>"}]},{"id":"begaiement","family":"communication","title":"Trouble de la fluidité verbale débutant dans l’enfance","subtitle":"Bégaiement","english":"Childhood-Onset Fluency Disorder (Stuttering)","codes":["F80.81"],"aliases":["bégaiement","begaiement","dysfluence","fluence","stuttering","bégayer","bégaye","blocages de parole"],"pages":"51–54","pdf":[203,207],"criteriaPages":"51–52","criteriaPdf":[203,204],"related":["sons-parole","langage","tourette"],"chapter":"neurodev","sections":[{"title":"Critères diagnostiques","kind":"criteria","pdf":[203,204],"html":"<p><strong>F80.81</strong></p><p><strong>A.</strong> Perturbations de la fluidité normale et de l’organisation temporelle de la parole, inappropriées à l’âge et aux compétences langagières de la personne, persistantes dans le temps et caractérisées par la survenue fréquente et marquée d’un ou plusieurs des éléments suivants :</p><ol><li>Répétitions de sons et de syllabes.</li><li>Prolongations de sons, aussi bien consonnes que voyelles.</li><li>Mots interrompus, par exemple des pauses à l’intérieur d’un mot.</li><li>Blocages audibles ou silencieux : pauses remplies ou non dans la parole.</li><li>Circonlocutions : substitution de mots pour éviter les mots problématiques.</li><li>Mots produits avec une tension physique excessive.</li><li>Répétitions de mots entiers monosyllabiques, par exemple « je-je-je-je le vois ».</li></ol><p><strong>B.</strong> La perturbation provoque une anxiété à propos de la parole ou des limitations de la communication efficace, de la participation sociale ou du fonctionnement scolaire ou professionnel, isolément ou conjointement.</p><p><strong>C.</strong> Les symptômes débutent pendant la période développementale précoce. <strong>Note :</strong> les cas de début plus tardif sont diagnostiqués F98.5, trouble de la fluidité verbale débutant à l’âge adulte.</p><p><strong>D.</strong> La perturbation n’est pas attribuable à un déficit moteur de la parole ou sensoriel, à une dysfluence liée à une atteinte neurologique — AVC, tumeur ou traumatisme, par exemple — ou à une autre affection médicale ; elle n’est pas mieux expliquée par un autre trouble mental.</p>"},{"title":"Caractéristiques diagnostiques","kind":"clinical","pdf":[204,204],"html":"<p>La caractéristique essentielle du trouble de la fluidité verbale débutant dans l’enfance (bégaiement) est une perturbation de la fluidité normale et de l’organisation temporelle de la parole, inappropriée à l’âge. Elle se caractérise par des répétitions ou prolongations fréquentes de sons ou de syllabes et par d’autres dysfluences : mots interrompus, par exemple pauses à l’intérieur d’un mot ; blocages audibles ou silencieux, c’est-à-dire pauses remplies ou non ; circonlocutions, c’est-à-dire substitution de mots pour éviter les mots problématiques ; mots produits avec une tension physique excessive ; répétitions de mots entiers monosyllabiques, comme « je-je-je-je le vois ». La perturbation de la fluidité peut interférer avec la réussite scolaire ou professionnelle et la communication sociale. Son importance varie selon les situations et est souvent plus grande lorsqu’il existe une pression particulière à communiquer, comme présenter un exposé à l’école ou passer un entretien d’embauche. La dysfluence est souvent absente lors de la lecture à voix haute, du chant ou lorsque la personne parle à des objets inanimés ou à des animaux domestiques.</p>"},{"title":"Caractéristiques associées","kind":"associated","pdf":[204,205],"html":"<p>Une anticipation anxieuse du problème peut apparaître. La personne peut tenter d’éviter les dysfluences par des mécanismes langagiers — modifier le débit, éviter certains mots ou sons — ou en évitant certaines situations de parole, telles que téléphoner ou parler en public. Outre leur présence dans le tableau, il a été montré que le stress et l’anxiété exacerbent la dysfluence.</p><p>Le trouble peut également s’accompagner de mouvements moteurs : clignements des yeux, tics, tremblements des lèvres ou du visage, secousses de la tête, mouvements respiratoires ou crispation des poings. Les enfants présentant ce trouble ont des capacités langagières variées, et la relation entre trouble de la fluidité et capacités langagières n’est pas claire.</p><p>Des études ont montré des différences neurologiques structurelles et fonctionnelles chez les enfants qui bégaient. Les personnes de sexe masculin sont plus susceptibles de bégayer que celles de sexe féminin, les estimations variant selon l’âge et la cause possible. Les causes du bégaiement sont multifactorielles et comprennent certains facteurs génétiques et neurophysiologiques.</p>"},{"title":"Développement et évolution","kind":"course","pdf":[205,205],"html":"<p>Le trouble de la fluidité verbale débutant dans l’enfance, ou bégaiement développemental, apparaît au plus tard à 6 ans chez 80–90 % des personnes concernées, l’âge de début s’étendant de 2 à 7 ans. Le début peut être insidieux ou plus soudain. Habituellement, les dysfluences apparaissent progressivement, avec la répétition des consonnes initiales, des premiers mots d’une phrase ou des mots longs. L’enfant peut ne pas en avoir conscience. À mesure que le trouble progresse, les dysfluences deviennent plus fréquentes et gênantes et concernent les mots ou expressions les plus porteurs de sens. En prenant conscience de sa difficulté à parler, l’enfant peut développer des mécanismes pour éviter les dysfluences et des réactions émotionnelles, notamment éviter la parole en public et utiliser des énoncés courts et simples. Les études longitudinales montrent que 65–85 % des enfants récupèrent ; la sévérité du trouble à 8 ans prédit sa disparition ou sa persistance à l’adolescence et au-delà.</p>"},{"title":"Facteurs de risque et pronostiques","kind":"risk","pdf":[205,205],"html":"<p><strong>Génétiques et physiologiques.</strong> Le risque de bégaiement chez les apparentés biologiques du premier degré est plus de trois fois supérieur à celui de la population générale. À ce jour, des mutations de quatre gènes sous-tendant certains cas de bégaiement ont été identifiées.</p>"},{"title":"Conséquences fonctionnelles du trouble de la fluidité verbale débutant dans l’enfance (bégaiement)","kind":"functional","pdf":[205,206],"html":"<p>Outre leur présence dans le tableau clinique, le stress et l’anxiété peuvent exacerber la dysfluence. L’anxiété peut altérer le fonctionnement social. Des attitudes négatives à l’égard de la communication peuvent être une conséquence fonctionnelle du bégaiement, commençant dès les années préscolaires et augmentant avec l’âge.</p>"},{"title":"Diagnostic différentiel","kind":"differential","pdf":[206,207],"html":"<p><strong>Déficits sensoriels.</strong> Les dysfluences peuvent être associées à une atteinte auditive, un autre déficit sensoriel ou un déficit moteur de la parole. Si elles dépassent celles habituellement associées à ces problèmes, un trouble de la fluidité verbale débutant dans l’enfance peut être diagnostiqué.</p><p><strong>Dysfluences normales de la parole.</strong> Le trouble doit être distingué des dysfluences habituelles, fréquentes chez les jeunes enfants : répétitions de mots entiers ou de phrases, par exemple « je veux, je veux une glace », phrases incomplètes, interjections, pauses non remplies et remarques incidentes. Si ces difficultés deviennent plus fréquentes ou complexes à mesure que l’enfant grandit, le diagnostic peut être approprié.</p><p><strong>Trouble spécifique des apprentissages avec déficit de la lecture.</strong> Les enfants présentant des dysfluences lors de la lecture à voix haute peuvent recevoir à tort un diagnostic de trouble de la lecture. La fluidité de lecture orale est généralement mesurée par des épreuves chronométrées. La lenteur peut ne pas refléter exactement la capacité réelle de lecture des enfants qui bégaient.</p><p><strong>Bilinguisme.</strong> Il faut distinguer les dysfluences résultant des tentatives d’apprentissage d’une nouvelle langue de celles qui indiquent un trouble de la fluidité et apparaissent généralement dans les deux langues.</p><p><strong>Effets indésirables des médicaments.</strong> Le bégaiement peut être un effet indésirable d’un médicament et être identifié par sa relation temporelle à l’exposition.</p><p><strong>Dysfluences débutant à l’âge adulte.</strong> Lorsque les dysfluences commencent pendant ou après l’adolescence, il s’agit d’une « dysfluence débutant à l’âge adulte » plutôt que d’un trouble du neurodéveloppement. Ces dysfluences sont associées à des atteintes neurologiques spécifiques ainsi qu’à diverses affections médicales et divers troubles mentaux ; elles peuvent être précisées avec ces affections, mais ne constituent pas un diagnostic du DSM-5.</p><p><strong>Syndrome de Tourette.</strong> Les tics vocaux et vocalisations répétitives du syndrome de Tourette doivent pouvoir être distingués des sons répétitifs du trouble de la fluidité verbale débutant dans l’enfance par leur nature et leur temporalité.</p>"},{"title":"Comorbidité","kind":"comorbidity","pdf":[207,207],"html":"<p>Le trouble de la fluidité verbale débutant dans l’enfance peut coexister avec d’autres troubles, tels que le TDAH, le trouble du spectre de l’autisme, le trouble du développement intellectuel (handicap intellectuel), le trouble du langage ou le trouble spécifique des apprentissages, les troubles épileptiques, l’anxiété sociale, le trouble des sons de la parole et d’autres troubles du développement.</p>"}]},{"id":"communication-sociale","family":"communication","title":"Trouble de la communication sociale (pragmatique)","english":"Social (Pragmatic) Communication Disorder","codes":["F80.82"],"aliases":["pragmatique","communication sociale","implicite","inférences","humour","inférences","conversation"],"pages":"54–56","pdf":[207,211],"criteriaPages":"54","criteriaPdf":[207,208],"related":["autisme","langage","tdah"],"chapter":"neurodev","sections":[{"title":"Critères diagnostiques","kind":"criteria","pdf":[207,208],"html":"<p><strong>F80.82</strong></p><p><strong>A.</strong> Difficultés persistantes dans l’utilisation sociale de la communication verbale et non verbale, se manifestant par tous les éléments suivants :</p><ol><li>Déficits de l’utilisation de la communication à des fins sociales, telles que saluer et partager des informations, de manière adaptée au contexte social.</li><li>Altération de la capacité à adapter la communication au contexte ou aux besoins de l’interlocuteur : parler différemment en classe et dans la cour de récréation, à un enfant et à un adulte, et éviter un langage excessivement formel.</li><li>Difficultés à suivre les règles de la conversation et du récit : prendre son tour dans la conversation, reformuler lorsqu’on est mal compris et savoir utiliser les signaux verbaux et non verbaux pour réguler l’interaction.</li><li>Difficultés à comprendre ce qui n’est pas explicite — faire des inférences, par exemple — et les sens non littéraux ou ambigus du langage : expressions idiomatiques, humour, métaphores, significations multiples dont l’interprétation dépend du contexte.</li></ol><p><strong>B.</strong> Les déficits entraînent des limitations fonctionnelles de la communication efficace, de la participation sociale, des relations sociales, de la réussite scolaire ou des performances professionnelles, isolément ou conjointement.</p><p><strong>C.</strong> Les symptômes débutent pendant la période développementale précoce, mais les déficits peuvent ne devenir pleinement manifestes que lorsque les demandes de communication sociale dépassent les capacités limitées.</p><p><strong>D.</strong> Les symptômes ne sont pas attribuables à une autre affection médicale ou neurologique, ni à de faibles capacités dans les domaines de la structure des mots et de la grammaire ; ils ne sont pas mieux expliqués par un trouble du spectre de l’autisme, un trouble du développement intellectuel (handicap intellectuel), un retard global du développement ou un autre trouble mental.</p>"},{"title":"Caractéristiques diagnostiques","kind":"clinical","pdf":[208,208],"html":"<p>Le trouble de la communication sociale (pragmatique) se caractérise par une difficulté principale dans la pragmatique — utilisation sociale du langage et de la communication —, se manifestant par des déficits de compréhension et de respect des règles sociales de la communication verbale et non verbale dans les situations naturelles, d’adaptation du langage aux besoins de l’interlocuteur ou de la situation, et de respect des règles de conversation et de récit. Les déficits de communication sociale entraînent des limitations fonctionnelles de la communication efficace, de la participation sociale, du développement des relations sociales, de la réussite scolaire ou des performances professionnelles. Ils ne sont pas mieux expliqués par de faibles capacités dans les aspects structurels du langage ou les capacités cognitives, ni par un trouble du spectre de l’autisme.</p>"},{"title":"Caractéristiques associées","kind":"associated","pdf":[208,209],"html":"<p>La caractéristique associée la plus fréquente est une altération du langage, avec antécédents de retard dans l’acquisition des étapes langagières et difficultés structurelles du langage anciennes, sinon actuelles ; voir « Trouble du langage » plus haut dans ce chapitre. Les personnes ayant des déficits de communication sociale peuvent éviter les interactions sociales. Le TDAH, les difficultés émotionnelles et comportementales et les troubles spécifiques des apprentissages sont également plus fréquents chez elles.</p>"},{"title":"Développement et évolution","kind":"course","pdf":[209,209],"html":"<p>La communication sociale (pragmatique) dépendant de progrès développementaux suffisants de la parole et du langage, ce diagnostic est rare avant 4 ans. Vers 4 ou 5 ans, la plupart des enfants devraient disposer de capacités suffisantes pour identifier des déficits spécifiques de communication sociale. Les formes légères peuvent ne devenir apparentes qu’au début de l’adolescence, lorsque le langage et les interactions sociales se complexifient.</p><p>L’évolution est variable : certains enfants s’améliorent nettement avec le temps, tandis que d’autres gardent des difficultés jusqu’à l’âge adulte. Même chez ceux qui s’améliorent beaucoup, les déficits précoces de pragmatique peuvent entraîner des altérations durables des relations sociales et du comportement, ainsi que de faibles performances dans d’autres compétences liées, comme l’expression écrite, la compréhension en lecture et la lecture orale.</p>"},{"title":"Facteurs de risque et pronostiques","kind":"risk","pdf":[209,209],"html":"<p><strong>Génétiques et physiologiques.</strong> Des antécédents familiaux de trouble du spectre de l’autisme, de troubles de la communication ou de trouble spécifique des apprentissages semblent augmenter le risque de trouble de la communication sociale (pragmatique). Cela comprend les frères et sœurs d’enfants présentant ces troubles, qui peuvent montrer des symptômes précoces du trouble de la communication sociale (pragmatique).</p>"},{"title":"Diagnostic différentiel","kind":"differential","pdf":[209,211],"html":"<p><strong>Trouble du spectre de l’autisme.</strong> C’est la principale hypothèse diagnostique chez une personne présentant des déficits de communication sociale. Les deux troubles se distinguent par la présence, dans le trouble du spectre de l’autisme, de modes restreints et répétitifs de comportements, d’intérêts ou d’activités, et leur absence dans le trouble de la communication sociale (pragmatique). Chez les personnes autistes, ces manifestations peuvent n’avoir été présentes que pendant la période développementale précoce ; une histoire complète doit donc être recueillie. Leur absence actuelle n’exclut pas le diagnostic de trouble du spectre de l’autisme si les intérêts restreints et les comportements répétitifs existaient auparavant. Le diagnostic de trouble de la communication sociale (pragmatique) ne doit être envisagé que si les symptômes actuels ou l’histoire développementale ne mettent pas en évidence des symptômes répondant aux critères des comportements, intérêts ou activités restreints et répétitifs du trouble du spectre de l’autisme — critère B — avec altération actuelle du fonctionnement. Les symptômes de communication sociale peuvent être plus légers que dans le trouble du spectre de l’autisme, bien que qualitativement semblables.</p><p><strong>Déficit de l’attention/hyperactivité.</strong> Les déficits principaux du TDAH peuvent entraîner des altérations de la communication sociale et des limitations fonctionnelles de la communication efficace, de la participation sociale ou de la réussite scolaire.</p><p><strong>Trouble anxiété sociale.</strong> Les symptômes des deux troubles se recoupent. L’élément distinctif est la chronologie du début des symptômes. Dans le trouble de la communication sociale (pragmatique), la personne n’a jamais eu une communication sociale efficace ; dans l’anxiété sociale, les compétences se sont développées de façon appropriée, mais ne sont pas utilisées en raison de l’anxiété, de la peur ou de la détresse liées aux interactions.</p><p><strong>Trouble du développement intellectuel (handicap intellectuel) et retard global du développement.</strong> Les compétences de communication sociale peuvent être déficitaires dans ces affections, mais un diagnostic séparé n’est posé que si les déficits de communication sociale dépassent clairement les limitations intellectuelles.</p>"}]},{"id":"communication-non-specifiee","family":"communication","title":"Trouble de la communication non spécifié","english":"Unspecified Communication Disorder","codes":["F80.9"],"aliases":["communication non précisée"],"pages":"56","pdf":[211,211],"kind":"description","related":["langage","communication-sociale","sons-parole"],"chapter":"neurodev","sections":[{"title":"Trouble de la communication non spécifié","kind":"criteria","pdf":[211,211],"html":"<p><strong>F80.9</strong></p><p>Cette catégorie s’applique aux présentations dans lesquelles prédominent des symptômes caractéristiques d’un trouble de la communication, entraînant une détresse cliniquement significative ou une altération du fonctionnement social, professionnel ou d’autres domaines importants, sans remplir l’ensemble des critères d’un trouble de la communication ou d’un autre trouble de la classe diagnostique des troubles du neurodéveloppement. Elle est utilisée lorsque le clinicien choisit de ne pas préciser pourquoi les critères ne sont pas remplis pour un trouble de la communication ou un trouble spécifique du neurodéveloppement ; elle comprend les présentations dans lesquelles les informations sont insuffisantes pour établir un diagnostic plus précis.</p>"}]},{"id":"autisme","family":"autisme","title":"Trouble du spectre de l’autisme","subtitle":"TSA","english":"Autism Spectrum Disorder","codes":["F84.0"],"aliases":["TSA","autisme","autistique","Asperger","TED","Kanner","autism","camouflage","masquage","écholalie","sensoriel","intérêts restreints","autiste","retrait social","hypersensibilité","rigidité","routines","réciprocité"],"pages":"56–68","pdf":[211,232],"criteriaPages":"56–58","criteriaPdf":[211,214],"related":["communication-sociale","tdah","developpement-intellectuel","mouvements-stereotypes"],"chapter":"neurodev","sections":[{"title":"Critères diagnostiques","kind":"criteria","pdf":[211,214],"html":"<p><strong>F84.0</strong></p>\n<p><strong>A.</strong> Déficits persistants de la communication sociale et des interactions sociales dans de multiples contextes, se manifestant par <strong>tous</strong> le
