Autre trouble du neurodéveloppement spécifié","english":"Other Specified Neurodevelopmental Disorder","codes":["F88"],"aliases":["TND autre spécifié","alcoolisation fœtale","alcoolisation foetale","exposition prénatale alcool","TSAF"],"pages":"99","pdf":[290,290],"kind":"description","related":["neurodev-non-specifie","retard-global"],"chapter":"neurodev","sections":[{"title":"Définition","kind":"criteria","pdf":[290,290],"html":"<p><strong>F88</strong></p><p>Cette catégorie s’applique aux présentations dans lesquelles prédominent des symptômes caractéristiques d’un trouble neurodéveloppemental, entraînant une altération du fonctionnement social, professionnel ou d’autres domaines importants, sans remplir l’ensemble des critères d’aucun des troubles de la classe diagnostique des troubles du neurodéveloppement. La catégorie autre trouble du neurodéveloppement spécifié est utilisée lorsque le clinicien choisit de communiquer la raison précise pour laquelle la présentation ne remplit pas les critères d’un trouble neurodéveloppemental spécifique. Cela consiste à consigner « autre trouble du neurodéveloppement spécifié », suivi de la raison précise, par exemple « trouble du neurodéveloppement associé à une exposition prénatale à l’alcool ».</p><p>Un exemple de présentation pouvant être précisée avec la désignation « autre spécifié » est le suivant :</p><p><strong>Trouble du neurodéveloppement associé à une exposition prénatale à l’alcool :</strong> Le trouble du neurodéveloppement associé à une exposition prénatale à l’alcool se caractérise par un ensemble de handicaps développementaux consécutifs à une exposition à l’alcool in utero.</p>"}]},{"id":"neurodev-non-specifie","family":"autres","title":"Trouble du neurodéveloppement non spécifié","english":"Unspecified Neurodevelopmental Disorder","codes":["F89"],"aliases":["TND non spécifié","trouble neurodéveloppemental non précisé"],"pages":"99–100","pdf":[290,291],"kind":"description","related":["neurodev-autre"],"chapter":"neurodev","sections":[{"title":"Définition","kind":"criteria","pdf":[290,291],"html":"<p><strong>F89</strong></p><p>Cette catégorie s’applique aux présentations dans lesquelles prédominent des symptômes caractéristiques d’un trouble neurodéveloppemental, entraînant une altération du fonctionnement social, professionnel ou d’autres domaines importants, sans remplir l’ensemble des critères d’aucun des troubles de la classe diagnostique des troubles du neurodéveloppement. La catégorie trouble du neurodéveloppement non spécifié est utilisée lorsque le clinicien choisit de ne pas préciser la raison pour laquelle les critères d’un trouble neurodéveloppemental spécifique ne sont pas remplis. Elle comprend les présentations pour lesquelles les informations sont insuffisantes pour établir un diagnostic plus précis, par exemple dans un service d’urgence.</p>"}]},{"id":"schizotypique","title":"Trouble (de la personnalité) schizotypique","subtitle":"Renvoi au chapitre des troubles de la personnalité","english":"Schizotypal (Personality) Disorder","codes":["F21"],"pdf":[299,299],"criteriaPdf":[299,299],"aliases":["personnalité schizotypique","trouble schizotypique","schizotypie","schizotypal personality disorder"],"pages":"104","chapter":"psychoses","related":["schizophrenie","delirant"],"family":"psychoses-schizotypique","sections":[{"title":"Renvoi au chapitre des troubles de la personnalité","kind":"definition","pdf":[299,299],"html":"<p>Les critères et le texte concernant la personnalité schizotypique figurent dans le chapitre « Troubles de la personnalité ». Comme ce trouble est considéré comme faisant partie du spectre de la schizophrénie et qu’il est désigné, dans cette section de la CIM-10, comme trouble schizotypique, il est mentionné dans le présent chapitre et décrit en détail dans le chapitre « Troubles de la personnalité » du DSM-5.</p>"}]},{"id":"delirant","title":"Trouble délirant","english":"Delusional Disorder","codes":["F22"],"criteriaPdf":[299,300],"pdf":[299,307],"aliases":["délire","idées délirantes","paranoïa","érotomanie","délire de jalousie","délire de persécution","délire somatique","delusional disorder"],"pages":"104–108","chapter":"psychoses","related":["schizophrenie","psychotique-bref","psychotique-affection-medicale"],"family":"psychoses-primaires","sections":[{"title":"Critères diagnostiques","kind":"criteria","pdf":[299,300],"html":"<p><strong>F22</strong></p><p><strong>A.</strong> Présence d’une ou de plusieurs idées délirantes pendant une durée de 1 mois ou plus.</p><p><strong>B.</strong> Le critère A de la schizophrénie n’a jamais été rempli.</p><p><strong>Note :</strong> Les hallucinations, si elles sont présentes, ne sont pas au premier plan et sont en rapport avec le thème délirant (par exemple, la sensation d’être infesté par des insectes associée à des idées délirantes d’infestation).</p><p><strong>C.</strong> En dehors de l’impact de la ou des idées délirantes ou de leurs ramifications, le fonctionnement n’est pas nettement altéré et le comportement n’est pas manifestement bizarre ou étrange.</p><p><strong>D.</strong> Si des épisodes maniaques ou dépressifs caractérisés sont survenus, ils ont été brefs par rapport à la durée des périodes délirantes.</p><p><strong>E.</strong> La perturbation n’est pas attribuable aux effets physiologiques d’une substance ou d’une autre affection médicale et n’est pas mieux expliquée par un autre trouble mental, tel qu’une obsession d’une dysmorphie corporelle ou un trouble obsessionnel-compulsif.</p>"},{"title":"Spécifications","kind":"specifiers","pdf":[300,302],"html":"<h4>Spécifier le type :</h4><p><strong>Type érotomaniaque :</strong> Ce sous-type s’applique lorsque le thème central de l’idée délirante est qu’une autre personne est amoureuse du sujet.</p><p><strong>Type mégalomaniaque :</strong> Ce sous-type s’applique lorsque le thème central de l’idée délirante est la conviction de posséder un grand talent ou une grande perspicacité (non reconnus), ou d’avoir fait une découverte importante.</p><p><strong>Type de jalousie :</strong> Ce sous-type s’applique lorsque le thème central de l’idée délirante du sujet est que son conjoint ou son partenaire lui est infidèle.</p><p><strong>Type de persécution :</strong> Ce sous-type s’applique lorsque le thème central de l’idée délirante implique la conviction du sujet qu’on conspire contre lui, qu’on le trompe, l’espionne, le suit, l’empoisonne ou le drogue, qu’on le calomnie avec malveillance, le harcèle ou l’entrave dans la poursuite de ses objectifs à long terme.</p><p><strong>Type somatique :</strong> Ce sous-type s’applique lorsque le thème central de l’idée délirante concerne des fonctions ou des sensations corporelles.</p><p><strong>Type mixte :</strong> Ce sous-type s’applique lorsqu’aucun thème délirant ne prédomine.</p><p><strong>Type non spécifié :</strong> Ce sous-type s’applique lorsque la conviction délirante dominante ne peut pas être clairement déterminée ou n’est pas décrite dans les types spécifiques (par exemple, des idées délirantes de référence sans composante de persécution ou de grandeur au premier plan).</p><h4>Spécifier si :</h4><p><strong>Avec contenu bizarre :</strong> Les idées délirantes sont considérées comme bizarres si elles sont clairement invraisemblables, incompréhensibles et ne découlent pas d’expériences ordinaires de la vie (par exemple, la conviction d’un sujet qu’un inconnu a retiré ses organes internes et les a remplacés par les organes de quelqu’un d’autre sans laisser de blessure ni de cicatrice).</p><h4>Spécifier si :</h4><p>Les spécifications évolutives suivantes ne doivent être utilisées qu’après une durée du trouble de 1 an :</p><p><strong>Premier épisode, actuellement en épisode aigu :</strong> Première manifestation du trouble répondant aux critères diagnostiques qui le définissent en matière de symptômes et de durée. Un épisode aigu est une période au cours de laquelle les critères symptomatiques sont remplis.</p><p><strong>Premier épisode, actuellement en rémission partielle :</strong> Une rémission partielle est une période au cours de laquelle une amélioration consécutive à un épisode antérieur se maintient et les critères qui définissent le trouble ne sont que partiellement remplis.</p><p><strong>Premier épisode, actuellement en rémission complète :</strong> Une rémission complète est une période suivant un épisode antérieur pendant laquelle aucun symptôme spécifique du trouble n’est présent.</p><p><strong>Épisodes multiples, actuellement en épisode aigu</strong></p><p><strong>Épisodes multiples, actuellement en rémission partielle</strong></p><p><strong>Épisodes multiples, actuellement en rémission complète</strong></p><p><strong>Continu :</strong> Les symptômes remplissant les critères symptomatiques diagnostiques du trouble persistent pendant la majeure partie de l’évolution de la maladie, les périodes de symptômes sous le seuil diagnostique étant très brèves par rapport à l’évolution globale.</p><p><strong>Non spécifié</strong></p><h4>Spécifier la sévérité actuelle :</h4><p>La sévérité est cotée par une évaluation quantitative des principaux symptômes de la psychose, notamment les idées délirantes, les hallucinations, le discours désorganisé, le comportement psychomoteur anormal et les symptômes négatifs. Chacun de ces symptômes peut être coté selon sa sévérité actuelle (sévérité maximale au cours des 7 derniers jours) sur une échelle à 5 points allant de 0 (absent) à 4 (présent et sévère). (Voir « Dimensions de la sévérité des symptômes psychotiques évaluées par le clinicien » dans le chapitre « Mesures d’évaluation ».)</p><p><strong>Note :</strong> Le diagnostic de trouble délirant peut être posé sans utiliser cette spécification de sévérité.</p>"},{"title":"Sous-types","kind":"specifiers","pdf":[302,303],"html":"<p>Dans le <strong>type érotomaniaque</strong>, le thème central de l’idée délirante est qu’une autre personne est amoureuse du sujet. La personne faisant l’objet de cette conviction est habituellement d’un statut supérieur (par exemple, une personne célèbre ou un supérieur au travail), mais peut être un parfait inconnu. Les tentatives pour entrer en contact avec l’objet du délire sont fréquentes. Dans le <strong>type mégalomaniaque</strong>, le thème central de l’idée délirante est la conviction de posséder un grand talent ou une grande perspicacité, ou d’avoir fait une découverte importante. Plus rarement, le sujet peut avoir la conviction délirante d’entretenir une relation particulière avec un personnage éminent ou d’être lui-même un personnage éminent (auquel cas la personne réelle peut être considérée comme un imposteur). Les idées délirantes de grandeur peuvent avoir un contenu religieux. Dans le <strong>type de jalousie</strong>, le thème central de l’idée délirante est l’infidélité du partenaire. Cette conviction se forme sans motif valable et repose sur des inférences erronées étayées par de petits éléments de « preuve » (par exemple, des vêtements en désordre). Le sujet délirant confronte habituellement son conjoint ou son partenaire et tente d’intervenir dans l’infidélité imaginée. Dans le <strong>type de persécution</strong>, le thème central de l’idée délirante implique la conviction du sujet qu’on conspire contre lui, qu’on le trompe, l’espionne, le suit, l’empoisonne, qu’on le calomnie avec malveillance, le harcèle ou l’entrave dans la poursuite de ses objectifs à long terme. De petits affronts peuvent être exagérés et devenir le centre d’un système délirant. Le sujet atteint peut multiplier les tentatives pour obtenir réparation par des actions judiciaires ou législatives. Les sujets ayant des idées délirantes de persécution sont souvent rancuniers et en colère, et peuvent recourir à la violence contre ceux qu’ils pensent leur faire du mal. Dans le <strong>type somatique</strong>, le thème central de l’idée délirante concerne des fonctions ou des sensations corporelles. Les idées délirantes somatiques peuvent prendre plusieurs formes. Les plus fréquentes sont la conviction que le sujet dégage une odeur nauséabonde, qu’il est infesté d’insectes sur ou sous la peau, qu’il a un parasite interne ou que certaines parties de son corps ne fonctionnent pas.</p>"},{"title":"Caractéristiques diagnostiques","kind":"clinical","pdf":[303,304],"html":"<p>La caractéristique essentielle du trouble délirant est la présence d’une ou de plusieurs idées délirantes persistant pendant au moins 1 mois (critère A). Le diagnostic de trouble délirant n’est pas posé si le sujet a déjà présenté un tableau symptomatique répondant au critère A de la schizophrénie (critère B). En dehors de l’impact direct des idées délirantes, les altérations du fonctionnement psychosocial peuvent être plus circonscrites que celles observées dans d’autres troubles psychotiques tels que la schizophrénie, et le comportement n’est pas manifestement bizarre ou étrange (critère C). Si des épisodes thymiques surviennent en même temps que les idées délirantes, la durée totale de ces épisodes thymiques est brève par rapport à la durée totale des périodes délirantes (critère D). Les idées délirantes ne sont pas attribuables aux effets physiologiques d’une substance (par exemple, la cocaïne) ou d’une autre affection médicale (par exemple, la maladie d’Alzheimer) et ne sont pas mieux expliquées par un autre trouble mental, tel qu’une obsession d’une dysmorphie corporelle ou un trouble obsessionnel-compulsif (critère E).</p><p>Outre les idées délirantes identifiées dans les critères diagnostiques, l’évaluation des domaines symptomatiques de la cognition, de la dépression et de la manie est essentielle pour établir les distinctions cruciales entre les différents troubles du spectre de la schizophrénie et autres troubles psychotiques. Alors que les idées délirantes sont une condition sine qua non du trouble délirant, les hallucinations et les symptômes négatifs sont peu fréquents et la désorganisation est rare. Par définition, la présence d’une catatonie conjointement à des idées délirantes exclut le trouble délirant, puisque le critère A de la schizophrénie serait rempli. Une partie des cas présente des symptômes dépressifs au premier plan, mais une altération cognitive et une manie sont rarement mises en évidence.</p>"},{"title":"Caractéristiques associées","kind":"associated","pdf":[304,304],"html":"<p>Des problèmes sociaux, conjugaux ou professionnels peuvent résulter des convictions délirantes du trouble délirant. Les sujets ayant un trouble délirant peuvent être capables de décrire factuellement que les autres considèrent leurs convictions comme irrationnelles, mais sont incapables de l’admettre eux-mêmes (c’est-à-dire qu’il peut exister une « conscience factuelle » du trouble, mais pas de véritable prise de conscience). Beaucoup de sujets développent une humeur irritable ou dysphorique, qui peut parfois être comprise comme une réaction à leurs convictions délirantes. De la colère et des comportements violents peuvent survenir dans les types de persécution, de jalousie et érotomaniaque. Le sujet peut adopter des comportements procéduriers ou antagonistes (par exemple, envoyer des centaines de lettres de protestation au gouvernement). Des difficultés judiciaires peuvent survenir, particulièrement dans les types de jalousie et érotomaniaque.</p>"},{"title":"Prévalence","kind":"prevalence","pdf":[304,304],"html":"<p>La prévalence vie entière du trouble délirant a été estimée à environ 0,2 % dans un échantillon finlandais, et le sous-type le plus fréquent est celui de persécution. Le trouble délirant de type de jalousie est probablement plus fréquent chez les hommes que chez les femmes, mais il n’existe pas de différences majeures liées au sexe ou au genre dans la fréquence globale du trouble délirant ou dans le contenu des idées délirantes.</p>"},{"title":"Développement et évolution","kind":"course","pdf":[304,305],"html":"<p>En moyenne, le fonctionnement global est généralement meilleur que celui observé dans la schizophrénie. Bien que le diagnostic soit généralement stable, une proportion des sujets évolue vers une schizophrénie. Alors qu’environ un tiers des sujets ayant un trouble délirant d’une durée de 1 à 3 mois reçoivent ensuite un diagnostic de schizophrénie, le diagnostic de trouble délirant est beaucoup moins susceptible de changer si la durée du trouble est supérieure à 6 à 12 mois. Bien que le trouble délirant puisse survenir dans des groupes d’âge plus jeunes, il peut être plus fréquent chez les sujets âgés.</p>"},{"title":"Facteurs de risque et pronostiques","kind":"risk","pdf":[305,305],"html":"<h4>Génétiques et physiologiques</h4><p>Le trouble délirant présente une association familiale significative avec la schizophrénie et avec la personnalité schizotypique.</p>"},{"title":"Questions diagnostiques liées à la culture","kind":"culture","pdf":[305,305],"html":"<p>Le contexte culturel et religieux du sujet doit être pris en compte lors de l’évaluation de la présence possible d’un trouble délirant ; en effet, certaines croyances traditionnelles peu familières aux cultures occidentales peuvent être qualifiées à tort de délirantes, de sorte que leur contexte doit être évalué avec soin. La nature et le contenu des idées délirantes varient également entre les différents groupes culturels.</p>"},{"title":"Conséquences fonctionnelles du trouble délirant","kind":"functional","pdf":[305,305],"html":"<p>L’altération du fonctionnement est habituellement plus circonscrite que celle observée dans d’autres troubles psychotiques, bien que, dans certains cas, elle puisse être substantielle et comprendre un mauvais fonctionnement professionnel et un isolement social. Lorsqu’un mauvais fonctionnement psychosocial est présent, les convictions délirantes elles-mêmes jouent souvent un rôle important. Une caractéristique fréquente des sujets ayant un trouble délirant est l’apparente normalité de leur comportement et de leur apparence lorsque leurs idées délirantes ne sont ni discutées ni mises en acte. Les hommes ayant un trouble délirant présentent généralement des symptômes plus sévères et une évolution fonctionnelle moins favorable que les femmes.</p>"},{"title":"Diagnostic différentiel","kind":"differential","pdf":[305,307],"html":"<h4>Troubles obsessionnels-compulsifs et apparentés</h4><p>Si un sujet ayant un trouble obsessionnel-compulsif est entièrement convaincu de la véracité de ses croyances liées au trouble obsessionnel-compulsif, il faut poser le diagnostic de trouble obsessionnel-compulsif, avec la spécification « avec absence de prise de conscience / croyances délirantes », plutôt qu’un diagnostic de trouble délirant. De même, si un sujet ayant une obsession d’une dysmorphie corporelle est entièrement convaincu de la véracité de ses croyances liées à cette obsession d’une dysmorphie corporelle, il faut poser le diagnostic d’obsession d’une dysmorphie corporelle, avec la spécification « avec absence de prise de conscience / croyances délirantes », plutôt qu’un diagnostic de trouble délirant.</p><h4>État confusionnel, trouble neurocognitif majeur et trouble psychotique dû à une autre affection médicale</h4><p>Les sujets présentant ces troubles peuvent avoir des symptômes évoquant un trouble délirant. Par exemple, de simples idées délirantes de persécution dans le contexte d’un trouble neurocognitif majeur conduiraient au diagnostic de trouble neurocognitif majeur, avec perturbation du comportement.</p><h4>Trouble psychotique induit par une substance / un médicament</h4><p>Un trouble psychotique induit par une substance / un médicament peut, lors d’une évaluation transversale, avoir une symptomatologie identique à celle du trouble délirant, mais il peut en être distingué par la relation chronologique entre l’usage de la substance et le début ainsi que la rémission des convictions délirantes.</p><h4>Schizophrénie et trouble schizophréniforme</h4><p>Le trouble délirant peut être distingué de la schizophrénie et du trouble schizophréniforme par l’absence des autres symptômes caractéristiques de la phase active de la schizophrénie. En outre, la qualité des idées délirantes peut aider à différencier la schizophrénie du trouble délirant. Dans la schizophrénie, les idées délirantes présentent une plus grande désorganisation (le degré auquel les idées délirantes sont cohérentes sur le plan interne, logiques et systématisées), tandis que, dans le trouble délirant, elles présentent une plus grande conviction (le degré auquel le sujet est convaincu de la réalité de l’idée délirante), une plus grande extension (le degré auquel l’idée délirante concerne divers domaines de la vie du sujet) et une plus grande pression (le degré auquel le sujet est préoccupé et soucieux de l’idée délirante exprimée).</p><h4>Troubles dépressifs et bipolaires et trouble schizoaffectif</h4><p>Ces troubles peuvent être distingués du trouble délirant par la relation temporelle entre la perturbation thymique et les idées délirantes, ainsi que par la sévérité des symptômes thymiques. Si les idées délirantes surviennent exclusivement pendant des épisodes thymiques, le diagnostic est celui de trouble dépressif caractérisé ou de trouble bipolaire, avec caractéristiques psychotiques. Des symptômes thymiques répondant à l’ensemble des critères d’un épisode thymique peuvent se surajouter au trouble délirant. Le trouble délirant ne peut être diagnostiqué que si la durée totale de tous les épisodes thymiques reste brève par rapport à la durée totale de la perturbation délirante. Dans le cas contraire, un diagnostic d’autre trouble du spectre de la schizophrénie ou autre trouble psychotique spécifié ou non spécifié, accompagné d’un autre trouble dépressif spécifié, d’un trouble dépressif non spécifié, d’un autre trouble bipolaire ou apparenté spécifié ou d’un trouble bipolaire ou apparenté non spécifié, est approprié.</p>"}]},{"id":"psychotique-bref","title":"Trouble psychotique bref","english":"Brief Psychotic Disorder","codes":["F23"],"criteriaPdf":[307,307],"pdf":[307,312],"aliases":["psychose brève","psychose réactionnelle brève","épisode psychotique bref","brief psychotic disorder","BDA","bouffée délirante aiguë"],"pages":"108–111","chapter":"psychoses","related":["schizophreniforme","schizophrenie","psychotique-induit"],"family":"psychoses-primaires","sections":[{"title":"Critères diagnostiques","kind":"criteria","pdf":[307,307],"html":"<p><strong>F23</strong></p><p><strong>A.</strong> Présence d’un ou de plusieurs des symptômes suivants. Au moins l’un d’entre eux doit être (1), (2) ou (3) :</p><ol><li>Idées délirantes.</li><li>Hallucinations.</li><li>Discours désorganisé (par exemple, déraillements fréquents ou incohérence).</li><li>Comportement grossièrement désorganisé ou catatonique.</li></ol><p><strong>Note :</strong> Ne pas inclure un symptôme s’il s’agit d’une réponse culturellement admise.</p><p><strong>B.</strong> La durée d’un épisode de la perturbation est d’au moins 1 jour mais de moins de 1 mois, avec retour complet à terme au niveau de fonctionnement prémorbide.</p><p><strong>C.</strong> La perturbation n’est pas mieux expliquée par un trouble dépressif caractérisé ou un trouble bipolaire avec caractéristiques psychotiques, ou par un autre trouble psychotique tel que la schizophrénie ou la catatonie, et n’est pas attribuable aux effets physiologiques d’une substance (par exemple, une substance donnant lieu à un abus, un médicament) ou d’une autre affection médicale.</p>"},{"title":"Spécifications","kind":"specifiers","pdf":[308,308],"html":"<h4>Spécifier si :</h4><p><strong>Avec facteur(s) de stress marqué(s) (psychose réactionnelle brève) :</strong> Si les symptômes surviennent en réponse à des événements qui, isolément ou conjointement, seraient nettement stressants pour presque toute personne placée dans des circonstances similaires au sein de la culture du sujet.</p><p><strong>Sans facteur(s) de stress marqué(s) :</strong> Si les symptômes ne surviennent pas en réponse à des événements qui, isolément ou conjointement, seraient nettement stressants pour presque toute personne placée dans des circonstances similaires au sein de la culture du sujet.</p><p><strong>Avec début lors du péripartum :</strong> Si le début se situe pendant la grossesse ou dans les 4 semaines suivant l’accouchement.</p><h4>Spécifier si :</h4><p><strong>Avec catatonie</strong> (pour la définition, se référer aux critères de la catatonie associée à un autre trouble mental, p. 135).</p><p><strong>Note de codage :</strong> Utiliser le code supplémentaire F06.1, catatonie associée au trouble psychotique bref, pour indiquer la présence de la catatonie comorbide.</p><h4>Spécifier la sévérité actuelle :</h4><p>La sévérité est cotée par une évaluation quantitative des principaux symptômes de la psychose, notamment les idées délirantes, les hallucinations, le discours désorganisé, le comportement psychomoteur anormal et les symptômes négatifs. Chacun de ces symptômes peut être coté selon sa sévérité actuelle (sévérité maximale au cours des 7 derniers jours) sur une échelle à 5 points allant de 0 (absent) à 4 (présent et sévère). (Voir « Dimensions de la sévérité des symptômes psychotiques évaluées par le clinicien » dans le chapitre « Mesures d’évaluation ».)</p><p><strong>Note :</strong> Le diagnostic de trouble psychotique bref peut être posé sans utiliser cette spécification de sévérité.</p>"},{"title":"Caractéristiques diagnostiques","kind":"clinical","pdf":[308,309],"html":"<p>La caractéristique essentielle du trouble psychotique bref est une perturbation comportant au moins un des symptômes psychotiques positifs suivants : idées délirantes, hallucinations, discours désorganisé (par exemple, déraillements fréquents ou incohérence) ou comportement psychomoteur grossièrement anormal, notamment une catatonie (critère A). Un épisode de la perturbation dure au moins 1 jour mais moins de 1 mois, et le sujet retrouve à terme entièrement son niveau de fonctionnement prémorbide (critère B). La perturbation n’est pas mieux expliquée par un trouble dépressif ou bipolaire avec caractéristiques psychotiques, par un trouble schizoaffectif ou par une schizophrénie, et n’est pas attribuable aux effets physiologiques d’une substance (par exemple, un hallucinogène) ou d’une autre affection médicale (par exemple, un hématome sous-dural) (critère C).</p><p>Outre les quatre domaines symptomatiques identifiés dans les critères diagnostiques, l’évaluation des domaines symptomatiques de la cognition, de la dépression et de la manie est essentielle pour établir les distinctions cruciales entre les différents troubles du spectre de la schizophrénie et autres troubles psychotiques.</p>"},{"title":"Caractéristiques associées","kind":"associated","pdf":[309,309],"html":"<p>Les sujets ayant un trouble psychotique bref éprouvent habituellement un bouleversement émotionnel ou une confusion envahissante. Ils peuvent passer rapidement d’un affect intense à un autre. Bien que la perturbation soit brève, le degré d’altération peut être sévère, et une surveillance peut être nécessaire pour veiller à ce que les besoins nutritionnels et d’hygiène soient satisfaits et à ce que le sujet soit protégé des conséquences d’un mauvais jugement, d’une altération cognitive ou d’actions fondées sur des idées délirantes. Il semble exister un risque accru de comportement suicidaire, particulièrement pendant l’épisode aigu.</p>"},{"title":"Prévalence","kind":"prevalence","pdf":[309,309],"html":"<p>Le trouble psychotique bref peut représenter 2 % à 7 % des cas de premier épisode psychotique dans plusieurs pays.</p>"},{"title":"Développement et évolution","kind":"course","pdf":[309,310],"html":"<p>Le trouble psychotique bref peut apparaître à l’adolescence ou au début de l’âge adulte, et son début peut survenir à n’importe quel moment de la vie, l’âge moyen de début se situant au milieu de la trentaine. Par définition, le diagnostic de trouble psychotique bref requiert une rémission complète de tous les symptômes et un retour complet à terme au niveau de fonctionnement prémorbide dans le mois suivant le début de la perturbation. Chez certains sujets, la durée des symptômes psychotiques peut être très brève (par exemple, quelques jours).</p><p>Bien que le trouble psychotique bref atteigne par définition une rémission complète en moins de 1 mois, plus de 50 % des sujets présentent ultérieurement une rechute. Malgré la possibilité de rechute, l’évolution est favorable pour la plupart des sujets en matière de fonctionnement social et de symptomatologie.</p><p>Dans moins de la moitié des cas ayant reçu un diagnostic de trouble psychotique bref selon le DSM-IV ou de trouble psychotique aigu et transitoire selon la CIM-10, le diagnostic change — plus souvent vers des troubles du spectre de la schizophrénie et moins souvent vers des troubles affectifs ou d’autres troubles psychotiques.</p>"},{"title":"Questions diagnostiques liées à la culture","kind":"culture","pdf":[310,310],"html":"<p>Il est important de distinguer les symptômes du trouble psychotique bref des modes de réaction culturellement admis. Par exemple, lors de certaines cérémonies religieuses, un sujet peut rapporter entendre des voix, mais celles-ci ne persistent généralement pas et ne sont pas perçues comme anormales par la plupart des membres de sa communauté. Dans un large éventail de contextes culturels, il serait courant ou attendu que des proches endeuillés entendent ou voient l’esprit d’un être cher récemment décédé, ou interagissent avec lui, sans séquelles pathologiques notables. En outre, le contexte culturel et religieux doit être pris en compte pour déterminer si des croyances sont délirantes.</p>"},{"title":"Diagnostic différentiel","kind":"differential","pdf":[310,312],"html":"<h4>Autres affections médicales</h4><p>Diverses affections médicales peuvent se manifester par des symptômes psychotiques de courte durée. Un trouble psychotique dû à une autre affection médicale ou un état confusionnel est diagnostiqué lorsque les antécédents, l’examen clinique ou les examens complémentaires montrent que les idées délirantes ou les hallucinations sont la conséquence physiologique directe d’une affection médicale spécifique (par exemple, un syndrome de Cushing, une tumeur cérébrale) (voir « Trouble psychotique dû à une autre affection médicale » plus loin dans ce chapitre).</p><h4>Troubles liés à une substance</h4><p>Le trouble psychotique induit par une substance / un médicament, l’état confusionnel induit par une substance et l’intoxication par une substance se distinguent du trouble psychotique bref par le fait qu’une substance (par exemple, une substance donnant lieu à un abus, un médicament, une exposition à une toxine) est jugée étiologiquement liée aux symptômes psychotiques (voir « Trouble psychotique induit par une substance / un médicament » plus loin dans ce chapitre). Des examens complémentaires, tels qu’une recherche de substances dans les urines ou une alcoolémie, peuvent aider à le déterminer, de même qu’un recueil soigneux des antécédents de consommation de substances, en prêtant attention aux relations temporelles entre la prise de la substance et le début des symptômes, ainsi qu’à la nature de la substance utilisée.</p><h4>Troubles dépressifs et bipolaires</h4><p>Le diagnostic de trouble psychotique bref ne peut pas être posé si les symptômes psychotiques sont mieux expliqués par un épisode thymique (c’est-à-dire si les symptômes psychotiques surviennent exclusivement au cours d’un épisode dépressif caractérisé, maniaque ou mixte complet).</p><h4>Autres troubles psychotiques</h4><p>Si les symptômes psychotiques persistent pendant 1 mois ou plus, le diagnostic est soit un trouble schizophréniforme, un trouble délirant, un trouble dépressif avec caractéristiques psychotiques, un trouble bipolaire avec caractéristiques psychotiques, soit un autre trouble du spectre de la schizophrénie ou autre trouble psychotique spécifié ou non spécifié, selon les autres symptômes du tableau. Le diagnostic différentiel entre trouble psychotique bref et trouble schizophréniforme est difficile lorsque les symptômes psychotiques ont régressé avant 1 mois en réponse à un traitement médicamenteux efficace. Il convient de prêter une attention particulière à la possibilité qu’un trouble récurrent (par exemple, un trouble bipolaire, des exacerbations aiguës récurrentes de la schizophrénie) soit responsable d’épisodes psychotiques récurrents.</p><h4>Simulation et troubles factices</h4><p>Un épisode de trouble factice avec prédominance de signes et symptômes psychologiques peut prendre l’apparence d’un trouble psychotique bref, mais il existe dans ces cas des éléments indiquant que les symptômes sont produits intentionnellement. Lorsque la simulation comporte des symptômes apparemment psychotiques, il existe habituellement des éléments indiquant que la maladie est feinte dans un but compréhensible.</p><h4>Troubles de la personnalité</h4><p>Chez certains sujets ayant un trouble de la personnalité, des facteurs de stress psychosociaux peuvent précipiter de brèves périodes de symptômes psychotiques. Ces symptômes sont habituellement transitoires et ne justifient pas un diagnostic distinct. Si les symptômes psychotiques persistent pendant au moins 1 jour, un diagnostic supplémentaire de trouble psychotique bref peut être approprié.</p>"}]},{"id":"schizophreniforme","title":"Trouble schizophréniforme","english":"Schizophreniform Disorder","codes":["F20.81"],"criteriaPdf":[312,312],"pdf":[312,316],"aliases":["schizophréniforme","schizophreniform disorder"],"pages":"111–113","chapter":"psychoses","related":["schizophrenie","psychotique-bref","schizoaffectif"],"family":"psychoses-primaires","sections":[{"title":"Critères diagnostiques","kind":"criteria","pdf":[312,312],"html":"<p><strong>F20.81</strong></p><p><strong>A.</strong> Deux (ou plus) des éléments suivants, chacun étant présent pendant une partie significative du temps au cours d’une période de 1 mois (ou moins si le traitement est efficace). Au moins l’un d’entre eux doit être (1), (2) ou (3) :</p><ol><li>Idées délirantes.</li><li>Hallucinations.</li><li>Discours désorganisé (par exemple, déraillements fréquents ou incohérence).</li><li>Comportement grossièrement désorganisé ou catatonique.</li><li>Symptômes négatifs (c’est-à-dire diminution de l’expression émotionnelle ou avolition).</li></ol><p><strong>B.</strong> Un épisode du trouble dure au moins 1 mois mais moins de 6 mois. Lorsque le diagnostic doit être posé sans attendre le rétablissement, il doit être qualifié de « provisoire ».</p><p><strong>C.</strong> Un trouble schizoaffectif et un trouble dépressif ou bipolaire avec caractéristiques psychotiques ont été exclus parce que soit 1) aucun épisode dépressif caractérisé ou maniaque n’est survenu simultanément aux symptômes de la phase active, soit 2) si des épisodes thymiques sont survenus pendant les symptômes de la phase active, ils ont été présents pendant une minorité de la durée totale des périodes actives et résiduelles de la maladie.</p><p><strong>D.</strong> La perturbation n’est pas attribuable aux effets physiologiques d’une substance (par exemple, une substance donnant lieu à un abus, un médicament) ou d’une autre affection médicale.</p>"},{"title":"Spécifications et note de lecture","kind":"specifiers","pdf":[312,313],"html":"<h4>Spécifier si :</h4><p><strong>Avec caractéristiques de bon pronostic :</strong> Cette spécification requiert la présence d’au moins deux des caractéristiques suivantes : début de symptômes psychotiques au premier plan dans les 4 semaines suivant le premier changement perceptible du comportement ou du fonctionnement habituels ; confusion ou perplexité ; bon fonctionnement social et professionnel prémorbide ; et absence d’émoussement ou d’aplatissement affectif.</p><p><strong>Sans caractéristiques de bon pronostic :</strong> Cette spécification s’applique si la présence d’au moins deux des caractéristiques ci-dessus n’a pas été constatée.</p><h4>Spécifier si :</h4><p><strong>Avec catatonie</strong> (pour la définition, se référer aux critères de la catatonie associée à un autre trouble mental, p. 135).</p><p><strong>Note de codage :</strong> Utiliser le code supplémentaire F06.1, catatonie associée au trouble schizophréniforme, pour indiquer la présence de la catatonie comorbide.</p><h4>Spécifier la sévérité actuelle :</h4><p>La sévérité est cotée par une évaluation quantitative des principaux symptômes de la psychose, notamment les idées délirantes, les hallucinations, le discours désorganisé, le comportement psychomoteur anormal et les symptômes négatifs. Chacun de ces symptômes peut être coté selon sa sévérité actuelle (sévérité maximale au cours des 7 derniers jours) sur une échelle à 5 points allant de 0 (absent) à 4 (présent et sévère). (Voir « Dimensions de la sévérité des symptômes psychotiques évaluées par le clinicien » dans le chapitre « Mesures d’évaluation ».)</p><p><strong>Note :</strong> Le diagnostic de trouble schizophréniforme peut être posé sans utiliser cette spécification de sévérité.</p><p><strong>Note :</strong> Pour des informations complémentaires sur les caractéristiques associées, le développement et l’évolution (facteurs liés à l’âge), les questions diagnostiques liées à la culture, les questions diagnostiques liées au sexe et au genre, le diagnostic différentiel et les comorbidités, voir les rubriques correspondantes de la schizophrénie.</p>"},{"title":"Caractéristiques diagnostiques","kind":"clinical","pdf":[314,314],"html":"<p>Les symptômes caractéristiques du trouble schizophréniforme sont identiques à ceux de la schizophrénie (critère A). Le trouble schizophréniforme se distingue par sa différence de durée : la durée totale de la maladie, comprenant les phases prodromique, active et résiduelle, est d’au moins 1 mois mais de moins de 6 mois (critère B). La condition de durée du trouble schizophréniforme est intermédiaire entre celle du trouble psychotique bref, qui dure plus de 1 jour et régresse avant 1 mois, et celle de la schizophrénie, qui dure au moins 6 mois. Le diagnostic de trouble schizophréniforme est posé dans deux situations : 1) lorsqu’un épisode de maladie dure entre 1 et 6 mois et que le sujet est déjà rétabli, et 2) lorsqu’un sujet présente des symptômes depuis moins des 6 mois requis pour le diagnostic de schizophrénie, mais n’est pas encore rétabli. Dans ce cas, le diagnostic doit être noté « trouble schizophréniforme (provisoire) », car il est incertain que le sujet se rétablisse de la perturbation dans la période de 6 mois. Si la perturbation persiste au-delà de 6 mois, le diagnostic doit être modifié en schizophrénie.</p><p>Une autre caractéristique distinctive du trouble schizophréniforme est l’absence de critère exigeant une altération du fonctionnement social et professionnel. Bien que de telles altérations puissent éventuellement être présentes, elles ne sont pas nécessaires au diagnostic de trouble schizophréniforme.</p><p>Outre les cinq domaines symptomatiques identifiés dans les critères diagnostiques, l’évaluation des domaines symptomatiques de la cognition, de la dépression et de la manie est essentielle pour établir les distinctions cruciales entre les différents troubles du spectre de la schizophrénie et autres troubles psychotiques.</p>"},{"title":"Caractéristiques associées","kind":"associated","pdf":[314,314],"html":"<p>Comme pour la schizophrénie, il n’existe actuellement aucun examen biologique ni test psychométrique pour le trouble schizophréniforme. Les recherches en neuro-imagerie, en neuropathologie et en neurophysiologie ont mis en évidence des anomalies dans plusieurs régions cérébrales, mais aucune n’a de valeur diagnostique.</p>"},{"title":"Prévalence","kind":"prevalence","pdf":[314,315],"html":"<p>L’incidence du trouble schizophréniforme dans les différents contextes socioculturels est probablement similaire à celle observée pour la schizophrénie. Aux États-Unis et dans d’autres pays à revenu élevé, l’incidence est faible, peut-être cinq fois inférieure à celle de la schizophrénie. Dans les pays à plus faible revenu, l’incidence peut être plus élevée, particulièrement pour la spécification « avec caractéristiques de bon pronostic » ; dans certains de ces contextes, le trouble schizophréniforme peut être aussi fréquent que la schizophrénie.</p>"},{"title":"Développement et évolution","kind":"course","pdf":[315,315],"html":"<p>Le développement du trouble schizophréniforme est similaire à celui de la schizophrénie. Environ un tiers des sujets ayant reçu un diagnostic initial de trouble schizophréniforme (provisoire) se rétablissent dans la période de 6 mois, et le trouble schizophréniforme est leur diagnostic final. La majorité des deux tiers restants recevra finalement un diagnostic de schizophrénie ou de trouble schizoaffectif.</p>"},{"title":"Facteurs de risque et pronostiques","kind":"risk","pdf":[315,315],"html":"<h4>Génétiques et physiologiques</h4><p>Les apparentés des sujets ayant un trouble schizophréniforme ont un risque accru de schizophrénie.</p>"},{"title":"Conséquences fonctionnelles du trouble schizophréniforme","kind":"functional","pdf":[315,315],"html":"<p>Pour la majorité des sujets ayant un trouble schizophréniforme qui reçoivent finalement un diagnostic de schizophrénie ou de trouble schizoaffectif, les conséquences fonctionnelles sont similaires à celles de ces troubles. La plupart des sujets présentent un dysfonctionnement dans plusieurs domaines du fonctionnement quotidien, tels que l’école ou le travail, les relations interpersonnelles et les soins personnels. Les sujets qui se rétablissent d’un trouble schizophréniforme ont une évolution fonctionnelle plus favorable.</p>"},{"title":"Diagnostic différentiel","kind":"differential","pdf":[315,316],"html":"<h4>Autres troubles mentaux et affections médicales</h4><p>Un large éventail de troubles mentaux et d’affections médicales peut se manifester par des symptômes psychotiques qui doivent être envisagés dans le diagnostic différentiel du trouble schizophréniforme. Ils comprennent le trouble psychotique dû à une autre affection médicale ou à son traitement ; l’état confusionnel ou le trouble neurocognitif majeur ; le trouble psychotique ou l’état confusionnel induit par une substance / un médicament ; le trouble dépressif caractérisé ou le trouble bipolaire avec caractéristiques psychotiques ; le trouble schizoaffectif ; un autre trouble bipolaire ou apparenté spécifié ou non spécifié ; le trouble dépressif caractérisé ou le trouble bipolaire avec caractéristiques catatoniques ; la schizophrénie ; le trouble délirant ; un autre trouble du spectre de la schizophrénie ou autre trouble psychotique spécifié ou non spécifié ; les personnalités schizotypique, schizoïde ou paranoïaque ; le trouble du spectre de l’autisme ; les troubles se manifestant dans l’enfance par un discours désorganisé ; le déficit de l’attention/hyperactivité ; le trouble obsessionnel-compulsif ; le trouble stress post-traumatique ; et le traumatisme crânien.</p><p>Les critères diagnostiques du trouble schizophréniforme et de la schizophrénie différant principalement par la durée de la maladie, la discussion du diagnostic différentiel de la schizophrénie s’applique également au trouble schizophréniforme.</p><h4>Trouble psychotique bref</h4><p>Le trouble schizophréniforme se distingue par sa durée du trouble psychotique bref, qui dure moins de 1 mois.</p>"}]},{"id":"schizophrenie","title":"Schizophrénie","english":"Schizophrenia","codes":["F20.9"],"criteriaPdf":[316,318],"pdf":[316,330],"aliases":["schizophrénie","schizophrenia"],"pages":"113–121","chapter":"psychoses","related":["schizoaffectif","schizophreniforme","delirant","autisme"],"family":"psychoses-primaires","sections":[{"title":"Critères diagnostiques","kind":"criteria","pdf":[316,318],"html":"<p><strong>F20.9</strong></p><p><strong>A.</strong> Deux (ou plus) des symptômes suivants, chacun étant présent pendant une proportion significative du temps au cours d’une période d’un mois (ou moins en cas de traitement efficace). Au moins l’un de ces symptômes doit être (1), (2) ou (3) :</p><ol><li>Idées délirantes.</li><li>Hallucinations.</li><li>Discours désorganisé (par exemple, déraillements fréquents ou incohérence).</li><li>Comportement grossièrement désorganisé ou catatonique.</li><li>Symptômes négatifs (c’est-à-dire diminution de l’expression émotionnelle ou aboulie).</li></ol><p><strong>B.</strong> Pendant une proportion significative du temps depuis le début de la perturbation, le niveau de fonctionnement dans un ou plusieurs domaines majeurs, tels que le travail, les relations interpersonnelles ou les soins personnels, est nettement inférieur au niveau atteint avant le début du trouble (ou, lorsque le début se situe dans l’enfance ou l’adolescence, le niveau attendu de fonctionnement interpersonnel, scolaire ou professionnel n’est pas atteint).</p><p><strong>C.</strong> Des signes continus de la perturbation persistent pendant au moins 6 mois. Cette période de 6 mois doit comprendre au moins 1 mois de symptômes (ou moins en cas de traitement efficace) répondant au critère A (c’est-à-dire des symptômes de la phase active) et peut comprendre des périodes de symptômes prodromiques ou résiduels. Pendant ces périodes prodromiques ou résiduelles, les signes de la perturbation peuvent se manifester uniquement par des symptômes négatifs ou par deux symptômes ou plus figurant au critère A, présents sous une forme atténuée (par exemple, croyances étranges, expériences perceptives inhabituelles).</p><p><strong>D.</strong> Un trouble schizoaffectif et un trouble dépressif ou bipolaire avec caractéristiques psychotiques ont été exclus parce que, soit 1) aucun épisode dépressif caractérisé ou maniaque n’est survenu simultanément aux symptômes de la phase active, soit 2) si des épisodes thymiques sont survenus pendant les symptômes de la phase active, ils ont été présents pendant une minorité de la durée totale des périodes actives et résiduelles de la maladie.</p><p><strong>E.</strong> La perturbation n’est pas attribuable aux effets physiologiques d’une substance (par exemple, une substance donnant lieu à abus, un médicament) ou à une autre affection médicale.</p><p><strong>F.</strong> S’il existe des antécédents de trouble du spectre de l’autisme ou de trouble de la communication débutant dans l’enfance, le diagnostic supplémentaire de schizophrénie n’est posé que si des idées délirantes ou des hallucinations prononcées, en plus des autres symptômes requis de la schizophrénie, sont également présentes pendant au moins 1 mois (ou moins en cas de traitement efficace).</p>"},{"title":"Spécifications","kind":"specifiers","pdf":[318,319],"html":"<h4>Spécifier si :</h4><p>Les spécifications évolutives suivantes ne doivent être utilisées qu’après une durée d’un an du trouble et si elles ne sont pas en contradiction avec les critères diagnostiques d’évolution.</p><p><strong>Premier épisode, actuellement en épisode aigu :</strong> Première manifestation du trouble répondant aux critères diagnostiques définissant les symptômes et leur durée. Un épisode aigu est une période pendant laquelle les critères symptomatiques sont remplis.</p><p><strong>Premier épisode, actuellement en rémission partielle :</strong> La rémission partielle est une période pendant laquelle l’amélioration obtenue après un épisode précédent se maintient et durant laquelle les critères définissant le trouble ne sont que partiellement remplis.</p><p><strong>Premier épisode, actuellement en rémission complète :</strong> La rémission complète est une période suivant un épisode précédent, pendant laquelle aucun symptôme spécifique du trouble n’est présent.</p><p><strong>Épisodes multiples, actuellement en épisode aigu :</strong> Des épisodes multiples peuvent être retenus après un minimum de deux épisodes (c’est-à-dire après un premier épisode, une rémission et au moins une rechute).</p><p><strong>Épisodes multiples, actuellement en rémission partielle</strong></p><p><strong>Épisodes multiples, actuellement en rémission complète</strong></p><p><strong>Continu :</strong> Les symptômes répondant aux critères symptomatiques diagnostiques du trouble persistent pendant la majeure partie de l’évolution de la maladie, les périodes de symptômes sous le seuil diagnostique étant très brèves par rapport à l’ensemble de l’évolution.</p><p><strong>Non spécifié</strong></p><h4>Spécifier si :</h4><p><strong>Avec catatonie</strong> (pour la définition, se référer aux critères de la catatonie associée à un autre trouble mental, p. 135).</p><p><strong>Note de codage :</strong> Utiliser le code supplémentaire F06.1, catatonie associée à la schizophrénie, pour indiquer la présence de la catatonie comorbide.</p><h4>Spécifier la sévérité actuelle :</h4><p>La sévérité est cotée par une évaluation quantitative des principaux symptômes de psychose, comprenant les idées délirantes, les hallucinations, le discours désorganisé, le comportement psychomoteur anormal et les symptômes négatifs. Chacun de ces symptômes peut être coté pour sa sévérité actuelle (la plus importante au cours des 7 derniers jours) sur une échelle à 5 points allant de 0 (absent) à 4 (présent et sévère). (Voir les Dimensions de la sévérité des symptômes psychotiques cotées par le clinicien dans le chapitre « Mesures d’évaluation ».)</p><p><strong>Note :</strong> Le diagnostic de schizophrénie peut être posé sans utiliser cette spécification de sévérité.</p>"},{"title":"Caractéristiques diagnostiques","kind":"clinical","pdf":[319,320],"html":"<p>Les symptômes caractéristiques de la schizophrénie impliquent un ensemble de dysfonctionnements cognitifs, comportementaux et émotionnels, mais aucun symptôme isolé n’est pathognomonique du trouble. Le diagnostic repose sur la reconnaissance d’un ensemble de signes et de symptômes associés à une altération du fonctionnement professionnel ou social. Les personnes présentant ce trouble diffèrent considérablement pour la plupart de ces caractéristiques, la schizophrénie étant un syndrome clinique hétérogène.</p><p>Au moins deux symptômes du critère A doivent être présents pendant une proportion significative du temps au cours d’une période d’un mois ou plus. Au moins l’un de ces symptômes doit être la présence nette d’idées délirantes (critère A1), d’hallucinations (critère A2) ou d’un discours désorganisé (critère A3). Un comportement grossièrement désorganisé ou catatonique (critère A4) et des symptômes négatifs (critère A5) peuvent également être présents. Dans les situations où les symptômes de la phase active disparaissent en moins d’un mois en réponse au traitement, le critère A reste rempli si le clinicien estime qu’ils auraient persisté en l’absence de traitement.</p><p>La schizophrénie implique une altération dans un ou plusieurs domaines majeurs du fonctionnement (critère B). Si la perturbation débute dans l’enfance ou l’adolescence, le niveau attendu de fonctionnement n’est pas atteint. La comparaison avec les frères et sœurs non atteints peut être utile. Le dysfonctionnement persiste pendant une période substantielle au cours de l’évolution du trouble et ne paraît pas résulter directement d’une caractéristique isolée. L’aboulie (c’est-à-dire la réduction de l’élan à poursuivre des comportements dirigés vers un but ; critère A5) est liée au dysfonctionnement social décrit dans le critère B. Il existe également des données solides en faveur d’une relation entre l’altération cognitive (voir la rubrique « Caractéristiques associées » de ce trouble) et l’altération du fonctionnement chez les personnes présentant une schizophrénie.</p><p>Certains signes de la perturbation doivent persister pendant une période continue d’au moins 6 mois (critère C). Des symptômes prodromiques précèdent souvent la phase active et des symptômes résiduels peuvent lui succéder, caractérisés par des formes légères ou sous le seuil diagnostique d’hallucinations ou d’idées délirantes. Les personnes peuvent exprimer diverses croyances inhabituelles ou étranges qui n’atteignent pas des proportions délirantes (par exemple, idées de référence ou pensée magique) ; elles peuvent avoir des expériences perceptives inhabituelles (par exemple, sentir la présence d’une personne invisible) ; leur discours peut être globalement compréhensible mais vague ; et leur comportement peut être inhabituel sans être grossièrement désorganisé (par exemple, marmonner en public). Les symptômes négatifs sont fréquents pendant les phases prodromiques et résiduelles et peuvent être sévères. Des personnes auparavant actives sur le plan social peuvent se retirer de leurs activités habituelles. Ces comportements sont souvent le premier signe d’un trouble.</p><p>Les symptômes thymiques et les épisodes thymiques complets sont fréquents dans la schizophrénie et peuvent être contemporains de la symptomatologie de la phase active. Toutefois, à la différence d’un trouble de l’humeur avec caractéristiques psychotiques, le diagnostic de schizophrénie nécessite la présence d’idées délirantes ou d’hallucinations en l’absence d’épisodes thymiques. De plus, les épisodes thymiques, considérés dans leur ensemble, ne doivent être présents que pendant une minorité de la durée totale des périodes actives et résiduelles de la maladie.</p><p>Outre les cinq domaines symptomatiques identifiés dans les critères diagnostiques, l’évaluation des domaines de la cognition, de la dépression et de la manie est essentielle pour établir des distinctions d’importance majeure entre les différents troubles du spectre de la schizophrénie et les autres troubles psychotiques.</p>"},{"title":"Caractéristiques associées","kind":"associated","pdf":[320,322],"html":"<p>Les personnes présentant une schizophrénie peuvent manifester des affects inappropriés (par exemple, rire en l’absence d’un stimulus approprié) ; une humeur dysphorique pouvant prendre la forme d’une dépression, d’une anxiété ou d’une colère ; une perturbation du rythme du sommeil (par exemple, dormir le jour et être actif la nuit) ; et un manque d’intérêt pour l’alimentation ou un refus alimentaire. Une dépersonnalisation, une déréalisation et des préoccupations somatiques peuvent survenir et parfois atteindre des proportions délirantes. L’anxiété et les phobies sont fréquentes. Les déficits cognitifs sont fréquents dans la schizophrénie et sont fortement liés aux altérations professionnelles et fonctionnelles. Ces déficits peuvent comprendre une diminution de la mémoire déclarative, de la mémoire de travail, des fonctions langagières et d’autres fonctions exécutives, ainsi qu’un ralentissement de la vitesse de traitement. Des anomalies du traitement sensoriel et des capacités d’inhibition, ainsi qu’une diminution de l’attention, sont également observées. Certaines personnes présentant une schizophrénie ont des déficits de cognition sociale, notamment dans la capacité à inférer les intentions d’autrui (théorie de l’esprit), et peuvent porter attention à des événements ou stimuli sans pertinence puis leur attribuer une signification, ce qui peut conduire à la production d’idées délirantes explicatives. Ces altérations persistent fréquemment pendant la rémission symptomatique.</p><p>Certaines personnes présentant une psychose peuvent manquer d’insight ou de conscience de leur trouble (c’est-à-dire présenter une anosognosie). Ce manque d’« insight » comprend la non-reconnaissance des symptômes de la schizophrénie et peut être présent tout au long de l’évolution de la maladie. La méconnaissance de la maladie est habituellement un symptôme de la schizophrénie elle-même plutôt qu’une stratégie d’adaptation. Elle est comparable à l’absence de conscience de déficits neurologiques après une lésion cérébrale, appelée anosognosie. Ce symptôme est le prédicteur le plus fréquent de la non-adhésion au traitement ; il prédit des taux de rechute plus élevés, un nombre accru de traitements sans consentement, un moins bon fonctionnement psychosocial, de l’agressivité et une évolution moins favorable de la maladie.</p><p>L’hostilité et l’agressivité peuvent être associées à la schizophrénie, bien que les agressions spontanées ou commises au hasard soient peu fréquentes. L’agressivité est plus fréquente chez les hommes jeunes et chez les personnes ayant des antécédents de violence, de non-adhésion au traitement, d’abus de substances et d’impulsivité. Il faut noter que la grande majorité des personnes présentant une schizophrénie ne sont pas agressives et sont plus fréquemment victimes que les personnes de la population générale.</p><p>Il n’existe actuellement aucun examen radiologique, biologique ou psychométrique permettant de diagnostiquer le trouble. Des différences sont mises en évidence dans de multiples régions cérébrales entre les groupes de personnes en bonne santé et les personnes présentant une schizophrénie, notamment dans les études de neuro-imagerie, neuropathologiques et neurophysiologiques. Des différences sont également observées dans l’architecture cellulaire, la connectivité de la substance blanche et le volume de substance grise dans diverses régions, telles que les cortex préfrontal et temporal. Une réduction du volume cérébral global a été observée, ainsi qu’une diminution accrue du volume cérébral avec l’âge. Les réductions du volume cérébral avec l’âge sont plus prononcées chez les personnes présentant une schizophrénie que chez les personnes en bonne santé. Enfin, les personnes présentant une schizophrénie semblent différer de celles qui n’ont pas ce trouble quant aux indices de poursuite oculaire et aux indices électrophysiologiques.</p><p>Les signes neurologiques mineurs fréquents chez les personnes présentant une schizophrénie comprennent des altérations de la coordination motrice, de l’intégration sensorielle et de l’enchaînement moteur de mouvements complexes ; une confusion droite-gauche ; et une désinhibition des mouvements associés. De plus, des anomalies physiques mineures du visage et des membres peuvent être présentes.</p>"},{"title":"Prévalence","kind":"prevalence","pdf":[322,322],"html":"<p>La prévalence vie entière estimée de la schizophrénie est d’environ 0,3 % à 0,7 %, avec une variation d’un facteur cinq dans les méta-analyses d’enquêtes représentatives à l’échelle nationale. Des études ont montré une augmentation de la prévalence et de l’incidence de la schizophrénie dans certains groupes selon le statut migratoire et de réfugié, le caractère urbain du milieu de vie, ainsi que le niveau économique et la latitude du pays. Il est important de noter que la prévalence et l’incidence rapportées de la schizophrénie peuvent être influencées par le fait que certains groupes risquent davantage de recevoir un diagnostic erroné ou d’être surdiagnostiqués.</p><p>Le rapport entre les sexes diffère selon les échantillons et les populations : par exemple, les présentations comportant des symptômes négatifs prononcés et une durée plus longue du trouble (associées à une évolution moins favorable) présentent des taux d’incidence plus élevés chez les hommes, tandis que les définitions permettant d’inclure davantage de symptômes thymiques et des présentations brèves (associées à une meilleure évolution) montrent des risques équivalents pour les deux sexes. Une vaste étude mondiale, fondée sur un ensemble de définitions de la schizophrénie, n’a pas trouvé de différence de prévalence entre les sexes.</p>"},{"title":"Développement et évolution","kind":"course","pdf":[323,324],"html":"<p>Les caractéristiques psychotiques requises pour le diagnostic de schizophrénie apparaissent habituellement entre la fin de l’adolescence et le milieu de la trentaine ; un début avant l’adolescence est rare. Le pic d’âge de début se situe du début au milieu de la vingtaine chez les hommes et vers la fin de la vingtaine chez les femmes. Le début peut être brutal ou insidieux, mais la majorité des personnes présentent une installation lente et progressive de divers signes et symptômes cliniquement significatifs, en particulier un retrait social, des changements émotionnels et des changements cognitifs entraînant une détérioration du fonctionnement dans leurs rôles habituels. La moitié de ces personnes présentent des symptômes dépressifs. Le pronostic est influencé à la fois par la durée et la sévérité de la maladie et par le genre. Les hommes, en particulier ceux chez qui la psychose a duré longtemps avant le traitement et dont l’adaptation prémorbide était moins bonne, présentent des symptômes négatifs plus prononcés, une altération cognitive et, en général, un devenir fonctionnel moins favorable que les femmes. Des déficits sociocognitifs peuvent se manifester au cours du développement et précéder l’émergence de la psychose, prenant la forme d’altérations stables à l’âge adulte, réfractaires aux médicaments antipsychotiques.</p><p>L’évolution et le devenir de la schizophrénie sont hétérogènes, et le pronostic est incertain au début de la psychose. Bien que la plupart des personnes présentant une schizophrénie restent vulnérables à une exacerbation des symptômes psychotiques et qu’une évolution chronique définie par les symptômes et l’altération fonctionnelle soit fréquente, de nombreuses personnes connaissent des périodes de rémission, voire de rétablissement. Selon une méta-analyse de 79 études longitudinales sur le premier épisode psychotique avec plus d’un an de suivi, le taux groupé de rémission (définie qualitativement par des symptômes légers ou absents pendant au moins 6 mois) lors d’un premier épisode de schizophrénie était de 56 %, et le taux groupé de rétablissement (défini qualitativement par une amélioration symptomatique et fonctionnelle pendant plus de 2 ans) était de 30 %. Une autre méta-analyse de 50 études portant sur des personnes présentant une schizophrénie au sens large (c’est-à-dire une schizophrénie, un trouble schizophréniforme, schizoaffectif ou délirant) a constaté que la proportion médiane de personnes répondant aux critères de rétablissement (des symptômes tout au plus légers et des améliorations du fonctionnement social et/ou professionnel persistant pendant au moins 2 ans) était de 13,5 %. Les expériences psychotiques tendent à diminuer à un âge avancé. Outre la psychose, l’altération cognitive et la pathologie des symptômes négatifs sont des caractéristiques centrales de la schizophrénie, et leur évolution diffère de celle des symptômes psychotiques positifs. La cognition tend à décliner au cours du développement avant l’installation d’une psychose complète et reste relativement stable à plus long terme. Les symptômes négatifs, lorsqu’ils sont présents pendant le développement, tendent également à constituer des traits relativement stables au fil du temps. Les symptômes négatifs apparaissant après le début de la psychose sont plus variables et peuvent refléter des causes secondaires. Un certain degré de chronicité est nécessaire pour poser le diagnostic de schizophrénie, et l’évolution à long terme traduit, chez de nombreuses personnes, un besoin de soins de santé mentale et de soutien dans la vie quotidienne. Bien que la schizophrénie ne soit généralement pas un trouble neurodégénératif progressif, les difficultés de la vie, les changements de mode de vie et la persistance des symptômes peuvent entraîner un dysfonctionnement progressif dans les cas chroniques les plus sévères.</p><p>Les caractéristiques essentielles de la schizophrénie sont les mêmes dans l’enfance, mais le diagnostic est plus difficile à établir. Chez l’enfant, les idées délirantes et les hallucinations peuvent être moins élaborées que chez l’adulte, et les hallucinations visuelles sont plus fréquentes et doivent être distinguées des jeux imaginatifs normaux. Le discours désorganisé s’observe dans de nombreux troubles débutant dans l’enfance (par exemple, le trouble du spectre de l’autisme), tout comme le comportement désorganisé (par exemple, dans le déficit de l’attention/hyperactivité). Ces symptômes ne doivent pas être attribués à une schizophrénie sans prendre dûment en considération les troubles plus fréquents de l’enfance. Les cas débutant dans l’enfance tendent à ressembler aux cas adultes d’évolution défavorable, avec un début progressif et des symptômes négatifs prononcés. Les enfants qui recevront ultérieurement un diagnostic de schizophrénie ont plus souvent présenté des perturbations émotionnelles et comportementales non spécifiques et une psychopathologie, des altérations intellectuelles et langagières, ainsi que des retards moteurs subtils.</p><p>Les cas à début tardif (c’est-à-dire après l’âge de 40 ans) concernent de façon disproportionnée des femmes, qui peuvent avoir été mariées. Souvent, l’évolution est caractérisée par une prédominance des symptômes psychotiques avec une préservation des affects et du fonctionnement social. Ces cas à début tardif peuvent néanmoins répondre aux critères diagnostiques de la schizophrénie, mais on ne sait pas encore clairement s’il s’agit de la même affection que la schizophrénie diagnostiquée avant le milieu de la vie (par exemple, avant l’âge de 55 ans).</p>"},{"title":"Facteurs de risque et pronostiques","kind":"risk","pdf":[324,325],"html":"<h4>Environnementaux</h4><p>La saison de naissance a été associée à l’incidence de la schizophrénie, notamment la fin de l’hiver et le début du printemps dans certaines régions, et l’été pour la forme déficitaire de la maladie. L’incidence de la schizophrénie et des troubles apparentés peut être plus élevée chez les enfants grandissant en milieu urbain, chez les réfugiés, dans certains groupes de migrants et dans les groupes socialement opprimés confrontés à la discrimination. Des données indiquent que la privation sociale, l’adversité sociale et des facteurs socioéconomiques peuvent être associés à une augmentation de la fréquence de ce trouble. Chez les personnes présentant une schizophrénie ou d’autres troubles psychotiques, la sévérité des symptômes positifs et négatifs semble corrélée à la sévérité des expériences adverses de l’enfance, telles que les traumatismes et la négligence. Des taux plus élevés de schizophrénie ont été documentés dans certains groupes ethniques et racisés lorsqu’ils vivent dans des zones où la proportion de personnes appartenant au même groupe ethnique ou racisé est plus faible. Les raisons ne sont pas entièrement établies, mais semblent liées à plusieurs facteurs, notamment : 1) des niveaux plus élevés de discrimination ou de peur de la discrimination ; 2) un soutien social moindre et une stigmatisation plus importante des personnes présentant une schizophrénie ; 3) un isolement social plus élevé ; et 4) une moindre disponibilité et un moindre accès à des explications normalisantes des expériences perceptives et des croyances anormales rapportées par les personnes à haut risque de développer une schizophrénie.</p><h4>Génétiques et physiologiques</h4><p>Les facteurs génétiques contribuent fortement à déterminer le risque de schizophrénie, bien que la plupart des personnes ayant reçu ce diagnostic n’aient pas d’antécédents familiaux de psychose. La vulnérabilité est conférée par un ensemble d’allèles de risque, fréquents et rares, chaque allèle ne contribuant que pour une petite fraction à la variance totale dans la population. Les allèles de risque identifiés à ce jour sont également associés à d’autres troubles mentaux, notamment le trouble bipolaire, la dépression et le trouble du spectre de l’autisme.</p><p>Les complications de la grossesse et de l’accouchement comportant une hypoxie, ainsi qu’un âge paternel plus élevé, sont associés à un risque accru de schizophrénie pour le fœtus en développement. De plus, d’autres adversités prénatales et périnatales, notamment le stress, les infections, la malnutrition, le diabète maternel et d’autres affections médicales, ont été associées à la schizophrénie. Toutefois, la grande majorité des enfants exposés à ces facteurs de risque ne développent pas de schizophrénie.</p>"},{"title":"Questions diagnostiques liées à la culture","kind":"culture","pdf":[326,326],"html":"<p>La forme et le contenu des symptômes de schizophrénie peuvent varier selon les cultures, notamment dans les dimensions suivantes : la proportion relative d’hallucinations visuelles et auditives (par exemple, bien que les hallucinations auditives tendent à être plus fréquentes que les hallucinations visuelles dans le monde entier, la proportion relative d’hallucinations visuelles peut être particulièrement plus élevée dans certaines régions que dans d’autres) ; le contenu spécifique des idées délirantes (par exemple, persécutoires, de grandeur, somatiques) et des hallucinations (par exemple, donnant des ordres, injurieuses, religieuses) ; et le niveau de peur qui leur est associé. Les facteurs culturels et socioéconomiques doivent être pris en compte, en particulier lorsque la personne et le clinicien ne partagent pas le même contexte culturel et socioéconomique. Des idées paraissant délirantes dans un contexte culturel (par exemple, le mauvais œil, le fait de provoquer une maladie par des malédictions, l’influence des esprits) peuvent être communément admises dans d’autres.</p><p>Dans certains contextes culturels, des hallucinations visuelles ou auditives à contenu religieux (par exemple, entendre la voix de Dieu) font normalement partie de l’expérience religieuse. De plus, l’évaluation du discours désorganisé peut être rendue difficile par les variations linguistiques des styles narratifs entre cultures. L’évaluation des affects nécessite une sensibilité aux différences dans les styles d’expression émotionnelle, le contact visuel et le langage corporel, qui varient selon les cultures. Si l’évaluation est menée dans une langue différente de la langue principale de la personne, il faut veiller à ce que l’alogie ne soit pas liée à des barrières linguistiques. Dans certaines cultures, la détresse peut prendre la forme d’hallucinations ou de pseudo-hallucinations et d’idées surinvesties, dont la présentation clinique peut ressembler à une véritable psychose mais qui sont normales dans le sous-groupe de la personne. Un diagnostic erroné de schizophrénie chez des personnes présentant un trouble de l’humeur avec caractéristiques psychotiques ou d’autres troubles psychiatriques est plus susceptible de survenir parmi les membres de groupes ethniques et racisés insuffisamment desservis (aux États-Unis, en particulier chez les Afro-Américains). Cela peut être attribuable à des biais cliniques, au racisme ou à la discrimination, qui limitent la qualité des informations et peuvent conduire à une mauvaise interprétation des symptômes.</p>"},{"title":"Questions diagnostiques liées au sexe et au genre","kind":"sex","pdf":[326,327],"html":"<p>Un certain nombre de caractéristiques distinguent l’expression clinique de la schizophrénie chez les femmes et les hommes. L’âge de début est plus tardif chez les femmes, avec un second pic au milieu de la vie. Les symptômes tendent à être plus chargés affectivement chez les femmes, et les symptômes psychotiques sont plus nombreux, avec une plus grande tendance à leur aggravation à un âge avancé. Parmi les autres différences symptomatiques figurent des symptômes négatifs et une désorganisation moins fréquents. Enfin, le fonctionnement social tend à rester mieux préservé chez les femmes. Il existe toutefois de fréquentes exceptions à ces observations générales.</p><p>Une aggravation des symptômes psychotiques a été observée pendant la période prémenstruelle, lorsque les taux d’œstrogènes diminuent ; en conséquence, les taux d’hospitalisation psychiatrique augmentent chez les femmes présentant une schizophrénie juste avant et pendant les règles. La diminution des taux d’œstrogènes liée à la ménopause peut constituer un autre facteur associé au second pic de début chez les femmes au milieu de la vie. De même, les symptômes psychotiques semblent s’améliorer pendant la grossesse, lorsque les taux d’œstrogènes sont élevés, et s’aggraver de nouveau en postpartum, lorsque ces taux chutent brutalement.</p>"},{"title":"Association avec les pensées ou comportements suicidaires","kind":"suicide","pdf":[327,328],"html":"<p>Environ 5 % à 6 % des personnes présentant une schizophrénie meurent par suicide, environ 20 % font une ou plusieurs tentatives de suicide, et bien davantage présentent des idées suicidaires importantes. Les comportements suicidaires répondent parfois à des hallucinations donnant l’ordre de se faire du mal ou de faire du mal à autrui. Le risque suicidaire demeure élevé tout au long de la vie chez les hommes et les femmes, bien qu’il puisse être particulièrement élevé chez les hommes jeunes ayant une consommation de substances comorbide. Les autres facteurs de risque comprennent les symptômes dépressifs, le désespoir, le chômage, la période suivant un épisode psychotique ou une sortie d’hospitalisation, le nombre d’hospitalisations psychiatriques, la proximité du début de la maladie et un âge plus avancé au début de la maladie. Une revue systématique et méta-analyse d’études longitudinales a constaté que les odds de comportement suicidaire pendant le suivi après un premier épisode psychotique étaient plus élevées chez les personnes ayant des symptômes dépressifs pendant ce premier épisode que chez celles qui n’en avaient pas. Une méta-analyse d’un grand nombre d’études sur la relation entre la schizophrénie et les comportements suicidaires a constaté que l’abus d’alcool, de tabac et de drogues, la dépression, le nombre d’hospitalisations, la comorbidité somatique et les antécédents familiaux de dépression et de comportement suicidaire augmentaient le risque de tentative de suicide. Les facteurs de risque de suicide comprenaient le sexe masculin, un âge plus jeune, un QI plus élevé, des antécédents de tentatives, le désespoir et une mauvaise adhésion au traitement.</p>"},{"title":"Conséquences fonctionnelles de la schizophrénie","kind":"functional","pdf":[328,328],"html":"<p>La schizophrénie est associée à un dysfonctionnement social et professionnel important. Chez les personnes présentant une schizophrénie, les déficits des capacités de lecture sont plus sévères que ce que permettraient de prédire les altérations cognitives générales associées au trouble. Ces déficits peuvent être conceptualisés comme une dyslexie secondaire ou acquise sous-tendant les difficultés scolaires observées dans la schizophrénie. La progression dans les études et le maintien dans l’emploi sont fréquemment entravés par l’aboulie ou d’autres manifestations du trouble, même lorsque les capacités cognitives sont suffisantes pour les tâches à accomplir. La plupart des personnes occupent un emploi de niveau inférieur à celui de leurs parents, et la plupart, en particulier les hommes, ne se marient pas ou n’ont que peu de contacts sociaux en dehors de leur famille.</p>"},{"title":"Diagnostic différentiel","kind":"differential","pdf":[328,330],"html":"<h4>Trouble dépressif caractérisé ou trouble bipolaire avec caractéristiques psychotiques ou catatoniques</h4><p>La distinction entre la schizophrénie et un trouble dépressif caractérisé ou bipolaire avec caractéristiques psychotiques ou avec catatonie dépend de la relation temporelle entre la perturbation de l’humeur et la psychose, ainsi que de la sévérité des symptômes dépressifs ou maniaques. Si les idées délirantes ou les hallucinations surviennent exclusivement pendant un épisode dépressif caractérisé ou maniaque, le diagnostic est celui d’un trouble dépressif ou bipolaire avec caractéristiques psychotiques.</p><h4>Trouble schizoaffectif</h4><p>Le diagnostic de trouble schizoaffectif nécessite qu’un épisode dépressif caractérisé ou maniaque survienne simultanément aux symptômes de la phase active et que les symptômes thymiques soient présents pendant la majorité de la durée totale des périodes actives.</p><h4>Trouble schizophréniforme et trouble psychotique bref</h4><p>Ces troubles sont de plus courte durée que la schizophrénie, telle que définie au critère C, qui exige 6 mois de symptômes. Dans le trouble schizophréniforme, la perturbation est présente pendant moins de 6 mois, et dans le trouble psychotique bref, les symptômes sont présents pendant au moins 1 jour mais moins d’un mois.</p><h4>Trouble délirant</h4><p>Le trouble délirant peut être distingué de la schizophrénie par l’absence des autres symptômes caractéristiques de la schizophrénie (par exemple, idées délirantes, hallucinations auditives ou visuelles prononcées, discours désorganisé, comportement grossièrement désorganisé ou catatonique, symptômes négatifs).</p><h4>Personnalité schizotypique</h4><p>La personnalité schizotypique peut être distinguée de la schizophrénie par des symptômes sous le seuil diagnostique, associés à des caractéristiques persistantes de la personnalité.</p><h4>Trouble obsessionnel-compulsif et trouble dysmorphique corporel</h4><p>Les personnes présentant un trouble obsessionnel-compulsif ou un trouble dysmorphique corporel peuvent avoir un insight faible ou absent, et leurs préoccupations peuvent atteindre des proportions délirantes. Toutefois, ces troubles se distinguent de la schizophrénie par la prédominance d’obsessions, de compulsions, de préoccupations concernant l’apparence ou l’odeur corporelle, d’une accumulation ou de comportements répétitifs centrés sur le corps.</p><h4>Trouble de stress post-traumatique</h4><p>Le trouble de stress post-traumatique peut comprendre des flashbacks ayant une qualité hallucinatoire, et l’hypervigilance peut atteindre des proportions paranoïdes. Toutefois, un événement traumatique et des caractéristiques symptomatiques relatives à la reviviscence de l’événement ou aux réactions à celui-ci sont nécessaires pour poser le diagnostic de trouble de stress post-traumatique.</p><h4>Trouble du spectre de l’autisme ou troubles de la communication</h4><p>Ces troubles peuvent également comporter des symptômes ressemblant à un épisode psychotique, mais ils se distinguent par leurs déficits respectifs des interactions sociales, associés à des comportements répétitifs et restreints, et par d’autres déficits cognitifs et de communication. Pour qu’un diagnostic de schizophrénie comorbide soit posé chez une personne présentant un trouble du spectre de l’autisme ou un trouble de la communication, ses symptômes doivent répondre à l’ensemble des critères de schizophrénie, avec des hallucinations ou des idées délirantes prononcées pendant au moins 1 mois.</p><h4>Autres troubles mentaux associés à un épisode psychotique</h4><p>Le diagnostic de schizophrénie n’est posé que lorsque l’épisode psychotique est persistant et n’est pas attribuable aux effets physiologiques d’une substance ou à une autre affection médicale. Les personnes présentant un delirium ou un trouble neurocognitif majeur ou léger peuvent présenter des symptômes psychotiques, mais ceux-ci ont alors une relation temporelle avec l’apparition de changements cognitifs compatibles avec ces troubles.</p><h4>Trouble psychotique induit par une substance ou un médicament</h4><p>Les personnes présentant un trouble psychotique induit par une substance ou un médicament peuvent avoir des symptômes caractéristiques du critère A de la schizophrénie, mais ce trouble peut généralement être distingué par la relation chronologique entre l’usage de la substance et le début de la psychose, ainsi que par la rémission de la psychose en l’absence d’usage de la substance.</p>","sourceNote":"Dans le paragraphe consacré au trouble délirant, le PDF cite « idées délirantes » parmi les symptômes dont l’absence distingue ce trouble de la schizophrénie. Le critère A du trouble délirant exige pourtant leur présence pendant au moins un mois. Ce passage du PDF p. 329 est conservé tel qu’il figure dans le document."},{"title":"Comorbidité"
