aussi fréquemment associés à d’autres troubles mentaux et comportementaux débutant dans l’enfance ; par exemple, les troubles de la communication et le trouble du spectre de l’autisme peuvent être associés à des troubles anxieux, le TDAH au trouble oppositionnel avec provocation, et les tics au trouble obsessionnel-compulsif. Pour certains troubles du neurodéveloppement, le tableau clinique comprend des comportements plus fréquents ou plus intenses que chez les enfants au développement habituel de même âge développemental et de même genre, ainsi que des déficits et des retards dans l’acquisition des étapes attendues du développement. Ainsi, le trouble du spectre de l’autisme n’est diagnostiqué que lorsque les déficits caractéristiques de la communication sociale s’accompagnent de comportements excessivement répétitifs, d’intérêts restreints et d’une insistance sur l’immuabilité.</p>\n<p>Le trouble du développement intellectuel se caractérise par des déficits des capacités mentales générales, telles que le raisonnement, la résolution de problèmes, la planification, la pensée abstraite, le jugement, les apprentissages scolaires et l’apprentissage par l’expérience. Ces déficits entraînent des altérations du fonctionnement adaptatif : la personne n’atteint pas les normes d’autonomie personnelle et de responsabilité sociale dans un ou plusieurs aspects de la vie quotidienne, notamment la communication, la participation sociale, le fonctionnement scolaire ou professionnel et l’autonomie au domicile ou dans la communauté. Le retard global du développement, comme son nom l’indique, est diagnostiqué lorsqu’une personne n’atteint pas les étapes développementales attendues dans plusieurs domaines du fonctionnement intellectuel. Ce diagnostic est utilisé chez les enfants de moins de 5 ans qui ne peuvent pas bénéficier d’évaluations systématiques du fonctionnement intellectuel et chez lesquels le niveau de sévérité clinique ne peut donc pas être évalué de façon fiable. Le trouble du développement intellectuel peut résulter d’une atteinte acquise pendant la période développementale, par exemple un traumatisme crânien grave ; un trouble neurocognitif peut alors également être diagnostiqué.</p>\n<p>Les troubles de la communication comprennent le trouble du langage, le trouble des sons de la parole, le trouble de la communication sociale (pragmatique) et le trouble de la fluidité verbale débutant dans l’enfance (bégaiement). Les trois premiers se caractérisent respectivement par des déficits du développement et de l’utilisation du langage, de la parole et de la communication sociale. Le trouble de la communication sociale comporte des déficits des compétences de communication verbale et non verbale entraînant une altération sociale et qui ne sont pas mieux expliqués par de faibles capacités dans les aspects structurels du langage, un trouble du développement intellectuel ou un trouble du spectre de l’autisme. Le trouble de la fluidité verbale débutant dans l’enfance se caractérise par des perturbations de la fluidité normale et de la production motrice de la parole : répétitions de sons ou de syllabes, prolongations de consonnes ou de voyelles, mots interrompus, blocages ou mots produits avec une tension physique excessive. Comme les autres troubles du neurodéveloppement, les troubles de la communication commencent tôt dans la vie et peuvent entraîner des altérations fonctionnelles durables.</p>\n<p>Le trouble du spectre de l’autisme se caractérise par des déficits persistants de la communication sociale et des interactions sociales dans plusieurs contextes, notamment des déficits de la réciprocité sociale, des comportements de communication non verbale utilisés dans les interactions sociales et des compétences nécessaires pour développer, maintenir et comprendre les relations. En plus des déficits de communication sociale, son diagnostic nécessite la présence de modes restreints et répétitifs de comportements, d’intérêts ou d’activités. Les symptômes changeant avec le développement et pouvant être masqués par des mécanismes compensatoires, les critères diagnostiques peuvent être remplis à partir des informations sur les antécédents, bien que la présentation actuelle doive entraîner une altération significative.</p>\n<p>Dans le diagnostic de trouble du spectre de l’autisme, les caractéristiques cliniques individuelles sont précisées par des spécifications : avec ou sans altération intellectuelle associée ; avec ou sans altération structurelle du langage associée ; associé à une affection génétique ou autre affection médicale connue ou à un facteur environnemental ; associé à un problème neurodéveloppemental, mental ou comportemental. D’autres spécifications décrivent la sévérité des symptômes autistiques. Elles permettent aux cliniciens d’individualiser le diagnostic et de communiquer une description clinique plus riche des personnes concernées. Ainsi, de nombreuses personnes ayant auparavant reçu un diagnostic de syndrome d’Asperger recevraient maintenant un diagnostic de trouble du spectre de l’autisme sans altération du langage ni altération intellectuelle.</p>\n<p>Le TDAH est un trouble du neurodéveloppement défini par des niveaux d’inattention, de désorganisation et/ou d’hyperactivité-impulsivité entraînant une altération du fonctionnement. L’inattention et la désorganisation comprennent l’incapacité à rester engagé dans une tâche, le fait de sembler ne pas écouter et la perte du matériel nécessaire aux tâches, à des niveaux incompatibles avec l’âge ou le niveau de développement. L’hyperactivité-impulsivité comprend une activité excessive, le fait de remuer, l’incapacité à rester assis, l’intrusion dans les activités des autres et l’incapacité à attendre — symptômes excessifs pour l’âge ou le niveau développemental. Dans l’enfance, le TDAH recoupe fréquemment des troubles souvent considérés comme « externalisés », tels que le trouble oppositionnel avec provocation et le trouble des conduites. Le TDAH persiste souvent à l’âge adulte et entraîne des altérations du fonctionnement social, scolaire et professionnel.</p>\n<p>Le trouble spécifique des apprentissages, comme son nom l’indique, est diagnostiqué en présence de déficits spécifiques de la capacité d’une personne à percevoir ou traiter les informations permettant d’acquérir efficacement et précisément les compétences scolaires. Ce trouble du neurodéveloppement se manifeste d’abord au cours de la scolarité formelle et se caractérise par des difficultés persistantes, avec retentissement, dans l’acquisition des compétences scolaires fondamentales en lecture, écriture et/ou mathématiques. Les performances dans les compétences concernées sont nettement inférieures à la moyenne pour l’âge, ou un niveau acceptable n’est atteint qu’au prix d’efforts extraordinaires. Le trouble spécifique des apprentissages peut survenir chez des personnes identifiées comme intellectuellement douées et ne se manifester que lorsque les exigences d’apprentissage ou les procédures d’évaluation — épreuves chronométrées, par exemple — créent des obstacles que leur intelligence innée et leurs stratégies compensatoires ne permettent pas de surmonter. Chez toutes les personnes concernées, il peut entraîner des altérations durables des activités dépendant de ces compétences, y compris du fonctionnement professionnel.</p>\n<p>Les troubles moteurs neurodéveloppementaux comprennent le trouble développemental de la coordination, le trouble des mouvements stéréotypés et les troubles de tics. Le trouble développemental de la coordination se caractérise par des déficits de l’acquisition et de l’exécution des habiletés motrices coordonnées ; il se manifeste par une maladresse, une lenteur ou une imprécision de l’exécution des habiletés motrices, qui interfèrent avec les activités de la vie quotidienne. Le trouble des mouvements stéréotypés est diagnostiqué en présence de comportements moteurs répétitifs, semblant contraints et apparemment sans but, tels que battre des mains, balancer le corps, se cogner la tête, se mordre ou se frapper. Ces mouvements interfèrent avec les activités sociales, scolaires ou autres. Si les comportements provoquent des blessures auto-infligées, cela doit être précisé dans la description diagnostique. Les troubles de tics sont caractérisés par des tics moteurs ou vocaux : mouvements moteurs ou vocalisations soudains, rapides, récurrents, non rythmiques et stéréotypés. La durée, l’étiologie présumée et la présentation clinique définissent le trouble spécifique diagnostiqué : syndrome de Tourette, tics moteurs ou vocaux persistants (chroniques), tics provisoires, autres tics spécifiés et tics non spécifiés. Le syndrome de Tourette est diagnostiqué en présence de tics moteurs et vocaux multiples, présents depuis au moins un an et dont l’évolution symptomatique fluctue en intensité.</p>\n<p>L’utilisation de spécifications pour les diagnostics de troubles du neurodéveloppement enrichit la description clinique de l’évolution et de la symptomatologie actuelle. Des spécifications de sévérité sont disponibles pour le trouble du développement intellectuel, le trouble du spectre de l’autisme, le TDAH, le trouble spécifique des apprentissages et le trouble des mouvements stéréotypés. Des spécifications de la symptomatologie actuelle sont disponibles pour le TDAH, le trouble spécifique des apprentissages et les tics moteurs ou vocaux persistants. Le trouble du spectre de l’autisme et le trouble des mouvements stéréotypés comportent également la spécification « associé à une affection génétique ou autre affection médicale connue ou à un facteur environnemental ». Celle-ci permet de documenter les facteurs susceptibles d’avoir joué un rôle dans l’étiologie du trouble, ainsi que ceux susceptibles d’en influencer l’évolution clinique.</p>"}],"pages":"35–37","pdf":[174,178],"english":"Neurodevelopmental Disorders"},"psychoses":{"title":"Spectre de la schizophrénie et autres troubles psychotiques","english":"Schizophrenia Spectrum and Other Psychotic Disorders","pages":"101–104","pdf":[293,299],"sections":[{"title":"Présentation du chapitre","kind":"introduction","pdf":[293,293],"html":"<p>Le spectre de la schizophrénie et les autres troubles psychotiques comprennent la schizophrénie, les autres troubles psychotiques et le trouble (de la personnalité) schizotypique. Ils sont définis par des anomalies dans un ou plusieurs des cinq domaines suivants : <strong>idées délirantes, hallucinations, pensée désorganisée (discours), comportement moteur grossièrement désorganisé ou anormal (y compris la catatonie), et symptômes négatifs.</strong></p>"},{"title":"Caractéristiques fondamentales des troubles psychotiques — Idées délirantes","kind":"clinical","pdf":[293,294],"html":"<p>Les <strong>idées délirantes</strong> sont des croyances fixes qui ne peuvent être modifiées à la lumière de preuves contradictoires. Leur contenu peut comprendre divers thèmes (p. ex. persécution, référence, thèmes somatiques, religieux ou de grandeur). Les <strong>idées délirantes de persécution</strong> (c’est-à-dire la croyance que l’on va être lésé, harcelé, etc., par une personne, une organisation ou un autre groupe) sont les plus fréquentes. Les <strong>idées délirantes de référence</strong> (c’est-à-dire la croyance que certains gestes, commentaires, indices de l’environnement, etc., s’adressent à soi) sont également fréquentes. On observe aussi des <strong>idées délirantes de grandeur</strong> (c’est-à-dire lorsqu’une personne croit posséder des capacités, une richesse ou une célébrité exceptionnelles) et des <strong>idées délirantes érotomaniaques</strong> (c’est-à-dire lorsqu’une personne croit à tort qu’une autre personne est amoureuse d’elle). Les <strong>idées délirantes nihilistes</strong> impliquent la conviction qu’une catastrophe majeure va se produire, et les <strong>idées délirantes somatiques</strong> portent sur des préoccupations concernant la santé et le fonctionnement des organes.</p><p>Les idées délirantes sont considérées comme <strong>bizarres</strong> lorsqu’elles sont manifestement invraisemblables, incompréhensibles pour des pairs appartenant à la même culture et ne découlent pas d’expériences ordinaires de la vie. Un exemple d’idée délirante bizarre est la croyance qu’une force extérieure a retiré les organes internes de la personne et les a remplacés par ceux de quelqu’un d’autre sans laisser de plaies ni de cicatrices. Un exemple d’idée délirante non bizarre est la croyance d’être sous surveillance policière en l’absence de preuves convaincantes. Les idées délirantes exprimant une perte de contrôle sur l’esprit ou le corps sont généralement considérées comme bizarres ; elles comprennent la croyance que ses pensées ont été « retirées » par une force extérieure (<em>vol de la pensée</em>), que des pensées étrangères ont été introduites dans son esprit (<em>insertion de pensées</em>) ou que son corps ou ses actions sont soumis à l’action ou à la manipulation d’une force extérieure (<em>idées délirantes de contrôle</em>).</p><p>La distinction entre une idée délirante et une idée à laquelle on adhère fortement est parfois difficile à établir et dépend en partie du degré de conviction avec lequel la croyance est maintenue malgré des preuves contradictoires claires ou raisonnables concernant sa véracité. L’évaluation des idées délirantes chez des personnes d’origines culturelles variées peut être difficile. Certaines croyances religieuses et surnaturelles (p. ex. le mauvais œil, les maladies causées par des malédictions, l’influence d’esprits) peuvent être considérées comme bizarres et éventuellement délirantes dans certains contextes culturels, tout en étant généralement acceptées dans d’autres. Toutefois, une religiosité accrue peut caractériser de nombreuses présentations psychotiques.</p><p>Les personnes ayant subi la torture, des violences politiques ou des discriminations peuvent rapporter des craintes susceptibles d’être prises à tort pour des idées délirantes de persécution ; il peut s’agir plutôt de craintes intenses que les événements se reproduisent ou de symptômes post-traumatiques. Une évaluation attentive du caractère justifié des craintes de la personne compte tenu de la nature du traumatisme peut aider à distinguer des craintes appropriées d’idées délirantes de persécution.</p>"},{"title":"Caractéristiques fondamentales — Hallucinations","kind":"clinical","pdf":[294,295],"html":"<p>Les <strong>hallucinations</strong> sont des expériences semblables à des perceptions qui surviennent sans stimulus extérieur. Elles sont vives et claires, avec toute la force et tout l’impact des perceptions normales, et ne sont pas sous le contrôle volontaire. Elles peuvent survenir dans n’importe quelle modalité sensorielle, mais les hallucinations auditives sont les plus fréquentes dans la schizophrénie et les troubles apparentés. Les hallucinations auditives sont habituellement vécues sous la forme de voix, familières ou non, perçues comme distinctes des propres pensées de la personne. Les hallucinations doivent survenir dans un contexte de conscience claire ; celles qui surviennent à l’endormissement (<em>hypnagogiques</em>) ou au réveil (<em>hypnopompiques</em>) sont considérées comme faisant partie des expériences normales. Dans certains contextes culturels, les hallucinations peuvent faire normalement partie de l’expérience religieuse.</p>"},{"title":"Caractéristiques fondamentales — Pensée désorganisée (discours)","kind":"clinical","pdf":[295,295],"html":"<p>La <strong>pensée désorganisée</strong> (trouble formel de la pensée) est généralement déduite du discours de la personne. Celle-ci peut passer d’un sujet à un autre (<em>déraillement</em> ou <em>relâchement des associations</em>). Les réponses aux questions peuvent n’avoir qu’un rapport indirect avec celles-ci ou n’en avoir aucun (<em>tangentialité</em>). Rarement, le discours peut être si gravement désorganisé qu’il est presque incompréhensible et ressemble à une aphasie réceptive par sa désorganisation linguistique (<em>incohérence</em> ou « salade de mots »). Comme une légère désorganisation du discours est fréquente et non spécifique, le symptôme doit être suffisamment sévère pour altérer substantiellement l’efficacité de la communication. La sévérité de cette altération peut être difficile à évaluer si la personne qui établit le diagnostic a un contexte linguistique différent de celui de la personne examinée. Par exemple, certains groupes religieux pratiquent la glossolalie (« parler en langues ») ; d’autres décrivent des expériences de transe de possession (états de transe dans lesquels l’identité personnelle est remplacée par une identité extérieure qui possède la personne). Ces phénomènes se caractérisent par un discours désorganisé. Ces manifestations ne constituent pas des signes de psychose à moins de s’accompagner d’autres symptômes clairement psychotiques. Une désorganisation moins sévère de la pensée ou du discours peut survenir pendant les périodes prodromiques et résiduelles de la schizophrénie.</p>"},{"title":"Caractéristiques fondamentales — Comportement moteur grossièrement désorganisé ou anormal (y compris la catatonie)","kind":"clinical","pdf":[295,296],"html":"<p>Un <strong>comportement moteur grossièrement désorganisé ou anormal</strong> peut se manifester de diverses manières, allant d’une « niaiserie » enfantine à une agitation imprévisible. Des problèmes peuvent être observés dans toute forme de comportement dirigé vers un but, entraînant des difficultés à réaliser les activités de la vie quotidienne.</p><p>Le <strong>comportement catatonique</strong> est une diminution marquée de la réactivité à l’environnement. Il va de la résistance aux consignes (<em>négativisme</em>) au maintien d’une posture rigide, inappropriée ou bizarre, jusqu’à l’absence complète de réponses verbales et motrices (<em>mutisme</em> et <em>stupeur</em>). Il peut également comprendre une activité motrice excessive et sans but, sans cause évidente (<em>excitation catatonique</em>). D’autres caractéristiques sont des mouvements stéréotypés répétés, un regard fixe, des grimaces et la répétition en écho du discours. Bien que la catatonie ait historiquement été associée à la schizophrénie, les symptômes catatoniques ne sont pas spécifiques et peuvent survenir dans d’autres troubles mentaux (p. ex. troubles bipolaires ou dépressifs avec catatonie) et dans des affections médicales (trouble catatonique dû à une autre affection médicale).</p>"},{"title":"Caractéristiques fondamentales — Symptômes négatifs","kind":"clinical","pdf":[296,296],"html":"<p>Les <strong>symptômes négatifs</strong> représentent une part importante de la morbidité associée à la schizophrénie, mais sont moins marqués dans les autres troubles psychotiques. Deux symptômes négatifs sont particulièrement saillants dans la schizophrénie : la <strong>diminution de l’expression émotionnelle</strong> et l’<strong>avolition</strong>. La diminution de l’expression émotionnelle comprend une réduction de l’expression des émotions sur le visage, du contact visuel, de l’intonation du discours (prosodie) et des mouvements des mains, de la tête et du visage qui donnent normalement une coloration émotionnelle au discours. L’avolition est une diminution des activités motivées, dirigées vers un but et initiées par la personne elle-même. La personne peut rester assise pendant de longues périodes et manifester peu d’intérêt pour la participation à des activités professionnelles ou sociales. Les autres symptômes négatifs comprennent l’<strong>alogie</strong>, l’<strong>anhédonie</strong> et l’<strong>asocialité</strong>. L’alogie se manifeste par une diminution de la production du discours. L’anhédonie est une diminution de la capacité à éprouver du plaisir. Les personnes ayant une schizophrénie peuvent encore apprécier une activité plaisante sur le moment et s’en souvenir, mais présentent une réduction de la fréquence de leur participation à des activités plaisantes. L’asocialité désigne le manque apparent d’intérêt pour les interactions sociales et peut être associée à l’avolition, mais elle peut également être la manifestation d’occasions limitées d’interactions sociales.</p>"},{"title":"Troubles présentés dans ce chapitre","kind":"introduction","pdf":[297,298],"html":"<p>Ce chapitre est organisé selon un gradient psychopathologique. Les cliniciens doivent d’abord envisager les affections qui ne remplissent pas tous les critères d’un trouble psychotique ou qui sont limitées à un seul domaine de la psychopathologie. Ils doivent ensuite envisager les affections de durée limitée. Enfin, le diagnostic d’un trouble du spectre de la schizophrénie nécessite d’exclure une autre affection susceptible de provoquer une psychose.</p><p>La personnalité schizotypique est mentionnée dans ce chapitre car elle est considérée comme faisant partie du spectre de la schizophrénie, bien que sa description complète figure dans le chapitre « Troubles de la personnalité ». Le diagnostic de personnalité schizotypique recouvre un mode envahissant de déficits sociaux et interpersonnels, comprenant une capacité réduite à nouer des relations proches, des distorsions cognitives ou perceptives et des excentricités du comportement, qui débute généralement au début de l’âge adulte mais devient, dans certains cas, apparent dès l’enfance ou l’adolescence. Les anomalies des croyances, de la pensée et des perceptions restent en dessous du seuil requis pour le diagnostic d’un trouble psychotique.</p><p>Deux affections sont définies par des anomalies limitées à un seul domaine de la psychose : les idées délirantes ou la catatonie. Le trouble délirant est caractérisé par la présence d’idées délirantes pendant au moins 1 mois, sans autres symptômes psychotiques. La catatonie est décrite plus loin dans ce chapitre et dans la suite de cette présentation.</p><p>Le trouble psychotique bref dure plus de 1 jour et entre en rémission avant 1 mois. Le trouble schizophréniforme se caractérise par une présentation symptomatique équivalente à celle de la schizophrénie, à l’exception de sa durée (moins de 6 mois) et de l’absence d’exigence d’un déclin du fonctionnement.</p><p>La schizophrénie dure au moins 6 mois et comprend au moins 1 mois de symptômes de la phase active. Dans le trouble schizoaffectif, un épisode thymique et les symptômes de la phase active de la schizophrénie surviennent conjointement et ont été précédés ou sont suivis d’au moins 2 semaines d’idées délirantes ou d’hallucinations sans symptômes thymiques prédominants.</p><p>Les troubles psychotiques peuvent être induits par des substances, des médicaments, des toxiques et d’autres affections médicales. Dans le trouble psychotique induit par une substance/un médicament, les symptômes psychotiques sont considérés comme la conséquence physiologique directe d’une substance donnant lieu à un usage abusif, d’un médicament ou d’une exposition à un toxique, et cessent après le retrait de l’agent. Dans le trouble psychotique dû à une autre affection médicale, les symptômes psychotiques sont considérés comme la conséquence physiologique directe d’une autre affection médicale.</p><p>La catatonie peut survenir dans plusieurs troubles, notamment les troubles neurodéveloppementaux, psychotiques, bipolaires, dépressifs et d’autres troubles mentaux. Ce chapitre comprend également les diagnostics de catatonie associée à un autre trouble mental (spécification de catatonie), de trouble catatonique dû à une autre affection médicale et de catatonie non spécifiée ; les critères diagnostiques de ces trois affections sont décrits ensemble.</p><p>Les autres troubles spécifiés ou non spécifiés du spectre de la schizophrénie et autres troubles psychotiques sont inclus afin de classer les présentations psychotiques qui ne répondent aux critères d’aucun trouble psychotique spécifique, ou les symptomatologies psychotiques pour lesquelles les informations sont insuffisantes ou contradictoires.</p>"},{"title":"Évaluation par le clinicien des symptômes et des phénomènes cliniques associés à la psychose","kind":"clinical","pdf":[298,299],"html":"<p>Les troubles psychotiques sont hétérogènes, et la sévérité des symptômes peut prédire des aspects importants de la maladie, tels que le degré des déficits cognitifs ou neurobiologiques. Afin de faire progresser ce domaine, un cadre détaillé d’évaluation de la sévérité est inclus dans la Section III, « Mesures d’évaluation » ; il peut aider à la planification du traitement, aux décisions pronostiques et à la recherche sur les mécanismes physiopathologiques. La Section III, « Mesures d’évaluation », contient également des évaluations dimensionnelles des symptômes principaux de la psychose, notamment les hallucinations, les idées délirantes, le discours désorganisé (sauf pour le trouble psychotique induit par une substance/un médicament et le trouble psychotique dû à une autre affection médicale), le comportement psychomoteur anormal et les symptômes négatifs, ainsi que des évaluations dimensionnelles de la dépression et de la manie. La sévérité des symptômes thymiques dans la psychose a une valeur pronostique et guide le traitement. Ainsi, les évaluations dimensionnelles de la dépression et de la manie pour tous les troubles psychotiques alertent les cliniciens sur la pathologie thymique et sur la nécessité de la traiter lorsque cela est approprié. L’échelle de la Section III comprend également une évaluation dimensionnelle de l’altération cognitive. De nombreuses personnes ayant des troubles psychotiques présentent des altérations dans différents domaines cognitifs qui prédisent le statut fonctionnel. L’évaluation neuropsychologique clinique peut aider à orienter le diagnostic et le traitement, mais des évaluations brèves, sans évaluation neuropsychologique formelle, peuvent fournir des informations utiles qui peuvent suffire à des fins diagnostiques. Lorsqu’ils sont réalisés, les tests neuropsychologiques formels doivent être administrés et cotés par du personnel formé à l’utilisation des instruments de test. En l’absence d’évaluation neuropsychologique formelle, le clinicien doit utiliser les meilleures informations disponibles pour porter un jugement. Des recherches supplémentaires sur ces évaluations sont nécessaires pour déterminer leur utilité clinique ; les évaluations disponibles dans la Section III doivent donc servir de prototype pour stimuler ces recherches.</p>"},{"title":"Considérations culturelles dans l’évaluation des symptômes psychotiques","kind":"culture","pdf":[299,299],"html":"<p>L’exactitude du diagnostic et la qualité de la planification du traitement peuvent être améliorées par des approches d’entretien, des échelles et des outils adaptés ou validés pour la culture de la personne, ainsi que par l’utilisation d’un entretien de formulation culturelle (voir Section III, « Culture et diagnostic psychiatrique »). L’évaluation de la psychose par l’intermédiaire d’interprètes ou dans une deuxième ou une troisième langue doit éviter de prendre à tort des métaphores peu familières pour des idées délirantes.</p>"}]}},"familyIntros":{"communication":{"title":"Troubles de la communication","sections":[{"title":"Troubles de la communication","kind":"clinical","pdf":[193,194],"html":"<p>Les troubles de la communication comprennent des déficits du langage, de la parole et de la communication. La parole est la production expressive des sons ; elle comprend l’articulation, la fluidité, la voix et la qualité de résonance de la personne. Le langage comprend la forme, la fonction et l’utilisation d’un système conventionnel de symboles — mots parlés, langue des signes, mots écrits, images — selon des règles permettant la communication. La communication comprend tout comportement verbal ou non verbal, intentionnel ou non, susceptible d’influencer le comportement, les idées ou les attitudes d’une autre personne. L’évaluation des capacités de parole, de langage et de communication doit prendre en compte le contexte culturel et linguistique, particulièrement chez les personnes grandissant en milieu bilingue. Les mesures standardisées du développement langagier et des capacités intellectuelles non verbales doivent être pertinentes pour le groupe culturel et linguistique : des tests conçus et étalonnés pour un groupe peuvent ne pas fournir de normes adaptées à un autre. La catégorie diagnostique des troubles de la communication comprend le trouble du langage, le trouble des sons de la parole, le trouble de la fluidité verbale débutant dans l’enfance (bégaiement), le trouble de la communication sociale (pragmatique) et le trouble de la communication non spécifié. Les différences selon le sexe dans le développement précoce de la communication peuvent conduire à une prévalence plus élevée chez les garçons que chez les filles. En raison de leurs caractéristiques associées et du lien entre communication et autres domaines développementaux, les troubles de la communication présentent des taux élevés de comorbidité avec d’autres troubles du neurodéveloppement — trouble du spectre de l’autisme, TDAH, trouble spécifique des apprentissages, trouble du développement intellectuel (handicap intellectuel) —, des troubles mentaux comme les troubles anxieux et certaines affections médicales comme les épilepsies ou des anomalies chromosomiques spécifiques.</p>"}],"pages":"46–47","pdf":[193,194]},"catatonie":{"title":"Catatonie","english":"Catatonia","pages":"134–135","pdf":[355,356],"sections":[{"title":"Catatonie","kind":"clinical","pdf":[355,356],"html":"<p>La catatonie peut survenir dans le contexte de plusieurs troubles, notamment les troubles du neurodéveloppement, psychotiques, bipolaires et dépressifs, et d’autres affections médicales (par exemple, déficit cérébral en folates, affections auto-immunes et paranéoplasiques rares). Le manuel ne traite pas la catatonie comme une classe indépendante, mais reconnaît a) la catatonie associée à un autre trouble mental (c’est-à-dire un trouble du neurodéveloppement, un trouble psychotique, un trouble bipolaire, un trouble dépressif ou un autre trouble mental), b) le trouble catatonique dû à une autre affection médicale et c) la catatonie non spécifiée.</p><p>La catatonie est définie par la présence d’au moins 3 des 12 caractéristiques psychomotrices figurant dans les critères diagnostiques de la catatonie associée à un autre trouble mental et du trouble catatonique dû à une autre affection médicale. La caractéristique essentielle de la catatonie est une perturbation psychomotrice marquée, qui peut comprendre une diminution de l’activité motrice, une diminution de l’engagement pendant l’entretien ou l’examen physique, ou une activité motrice excessive et singulière. La présentation clinique de la catatonie peut être déroutante, car la perturbation psychomotrice peut aller d’une absence marquée de réactivité à une agitation marquée. L’immobilité motrice peut être sévère (stupeur) ou modérée (catalepsie et flexibilité cireuse). De même, la diminution de l’engagement peut être sévère (mutisme) ou modérée (négativisme). Les comportements moteurs excessifs et singuliers peuvent être complexes (par exemple, stéréotypies) ou simples (agitation) et peuvent comprendre une écholalie et une échopraxie. Dans les cas extrêmes, une même personne peut fluctuer entre une activité motrice diminuée et une activité motrice excessive. Les caractéristiques cliniques apparemment opposées, les manifestations variables du diagnostic et l’importance excessive accordée dans l’enseignement à des signes rares et sévères comme la flexibilité cireuse contribuent à une méconnaissance de la catatonie et à un moindre repérage de celle-ci. Pendant les phases sévères de catatonie, une surveillance attentive de la personne peut être nécessaire pour éviter qu’elle ne se blesse ou ne blesse autrui. Il existe des risques potentiels de dénutrition, d’épuisement, de thromboembolie, d’escarres, de contractions musculaires, d’hyperpyrexie et de blessures auto-infligées.</p>"}]}}};})(typeof window!=='undefined'?window:globalThis);

 function sourceUrl(page){const base=sourceObjectURL||options.sourcePdfUrl||((location.protocol==='file:')?data.localPdf:null);return base?base.replace(/#.*$/,'')+'#page='+page:null;}
 function sourceLink(page,label,cls='d-source-link'){const url=sourceUrl(page);return url?`<a class="${cls}" href="${esc(url)}" target="_blank" rel="noopener" data-source-page="${page}">${icon('external')}${esc(label)}</a>`:`<button class="${cls}" data-pdf-page="${page}">${icon('external')}${esc(label)}</button>`;}
 function renderSection(s,i,open=false){const group=groupFor(s.kind),g=groups[group];return `<details class="d-section" id="dsm-section-${i}" data-kind="${esc(s.kind)}" data-group="${group}" style="--s-color:${g.color};--s-tint:${g.tint}"${open?' open':''}><summary><span class="d-section-number">${String(i+1).padStart(2,'0')}</span><span class="d-section-title">${esc(s.title)}</span>${icon('down')}</summary><div class="d-section-body"><div class="d-prose">${formatReading(s)}</div>${s.sourceNote?`<aside class="d-source-note" aria-label="Note de lecture du document"><strong>Note de lecture du document</strong><p>${esc(s.sourceNote)}</p></aside>`:''}<div class="d-section-end">${s.pdf?`<div class="d-section-ref">${sourceLink(s.pdf[0],'Source · PDF p. '+range(s.pdf))}</div>`:''}<button class="d-collapse-section" data-action="collapse-section" aria-label="Replier la section : ${esc(s.title)}" title="Replier cette section" aria-controls="dsm-section-${i}">${icon('down')}<span>Replier</span></button></div></div></details>`;}
 function detail(d,{intro=false}={}){
  activeRecord=d;const f=families.get(d.family),chapter=chapters.get(d.chapter||state.chapter);const sections=d.sections;
  const keys=Object.keys(groups).filter(k=>sections.some(s=>groupFor(s.kind)===k));
  $('#dsm-reader').innerHTML=`<button class="d-btn d-back-results" data-action="back-results">${icon('arrow')} Revenir aux résultats</button><article class="d-sheet" aria-labelledby="dsm-diagnosis"><header class="d-sheet-head"${f?` style="${famStyle(f)}"`:''}><p class="d-print-heading">DSM5 · ${esc(chapter?.name||'DSM-5-TR')}</p><div class="d-sheet-topline"><div class="d-eyebrow">${esc(f?.name||chapter?.name||'DSM-5-TR')}</div><button class="d-close" data-action="close" aria-label="Fermer la fiche">${icon('close')}</button></div><h2 id="dsm-diagnosis" tabindex="-1">${esc(d.title)}</h2>${d.subtitle?`<p class="d-subtitle">${esc(d.subtitle)}</p>`:''}${d.english?`<p class="d-english" lang="en">${esc(d.english)}</p>`:''}<div class="d-refline">${d.codes?`<span><strong>${esc(d.codeLabel||d.codes.join(' · '))}</strong> · ICD-10-CM du manuel</span>`:''}${d.pages?`<span>DSM-5-TR · p. ${esc(d.pages)}</span>`:''}</div></header>
 <div class="d-toolbar"><button class="d-btn" data-action="copy">${icon('copy')} Copier la fiche</button><button class="d-btn" data-action="print">${icon('print')} Imprimer</button>${sourceLink(d.criteriaPdf?.[0]||d.pdf?.[0]||sections[0]?.pdf?.[0]||174,'PDF source','d-btn')}<button class="d-btn d-expand" data-action="expand" aria-expanded="false">Tout déplier</button></div>
 <nav class="d-sheet-nav" aria-label="Accès direct aux rubriques">${keys.map(k=>`<button data-jump="${k}" style="--s-color:${groups[k].color};--s-tint:${groups[k].tint}"><span></span>${groups[k].name}</button>`).join('')}</nav>
 <div class="d-sections">${sections.map((s,i)=>renderSection(s,i,i===0)).join('')}</div>
 ${d.related?.length?`<details class="d-related-section" id="dsm-related"><summary>À consulter aussi ${icon('down')}</summary><div class="d-related">${d.related.filter(id=>byId.has(id)).map(id=>`<button class="d-btn" data-related="${id}">${esc(byId.get(id).title)}</button>`).join('')}</div><div class="d-section-end"><button class="d-collapse-section" data-action="collapse-section" aria-label="Replier la section : À consulter aussi" aria-controls="dsm-related" title="Replier cette section">${icon('down')}<span>Replier</span></button></div></details>`:''}
 <footer class="d-sheet-foot"><strong>Source :</strong> American Psychiatric Association · DSM-5-TR (2022)${chapter?' · '+esc(chapter.english):''}${d.pages?' · p. '+esc(d.pages):''}.<br>Les codes sont ceux de l’édition américaine du manuel (ICD-10-CM).</footer></article>`;
  $('#dsm-reader').querySelectorAll('.d-section').forEach(el=>on(el,'toggle',updateExpand));
  $('#dsm-reader').querySelectorAll('table').forEach(table=>{const headers=table.tHead?[...table.tHead.rows[0].cells].map(c=>{c.scope='col';return c.textContent.trim();}):[];for(const body of table.tBodies)for(const row of body.rows)[...row.cells].forEach((cell,i)=>{if(cell.tagName==='TD'&&headers[i])cell.dataset.label=headers[i];if(cell.tagName==='TH')cell.scope='row';});if(!table.parentElement.classList.contains('d-table-wrap')){const wrap=document.createElement('div');wrap.className='d-table-wrap';wrap.tabIndex=0;wrap.setAttribute('role','region');wrap.setAttribute('aria-label',table.caption?.textContent||'Tableau du manuel');table.replaceWith(wrap);wrap.append(table);}});
 }
 function updateExpand(){const all=[...$('#dsm-reader').querySelectorAll('.d-section')];const open=all.length&&all.every(s=>s.open);const btn=$('[data-action=expand]');if(btn){btn.textContent=open?'Tout replier':'Tout déplier';btn.setAttribute('aria-expanded',String(!!open));}}
 function saveHash(){if(!options.useHash)return;const url=new URL(location.href),params=new URLSearchParams();if(state.selected)params.set('dsm5',state.selected);else{if(state.chapter)params.set('chapter',state.chapter);if(state.view==='chapter-intro')params.set('view','intro');if(state.view==='family-intro')params.set('familyIntro',state.family);}url.hash=params.toString();try{history.pushState(null,'',url);}catch{location.hash=url.hash;}}
 function focusReader(){const title=$('#dsm-diagnosis');title?.focus({preventScroll:true});if(matchMedia('(max-width:760px)').matches||$('#dsm-reader').getBoundingClientRect().top<65)$('#dsm-reader').scrollIntoView({block:'start',behavior:'instant'});}
 function open(id,{navigate=true,focus=true,clear=false}={}){const d=byId.get(id);if(!d)return;if(clear){state.q='';state.family='';}if(state.chapter&&state.chapter!==d.chapter)state.chapter=d.chapter;state.selected=id;state.view='diagnosis';results();detail(d);if(navigate)saveHash();if(focus)focusReader();}
 function intro(which,{navigate=true,focus=true}={}){const target=which==='family'?data.familyIntros?.[state.family]:data.chapterIntros?.[state.chapter];if(!target)return;state.selected=null;state.view=which==='family'?'family-intro':'chapter-intro';const chapter=which==='family'?families.get(state.family)?.chapter:state.chapter;detail({...target,chapter,family:which==='family'?state.family:undefined},{intro:true});results();if(navigate)saveHash();if(focus)focusReader();}
 function reset(){state.q='';state.fulltext=false;if(state.chapter&&chapters.get(state.chapter)?.status!=='ready')state.chapter=data.chapters.find(c=>c.status==='ready').id;state.family='';state.selected=null;state.view='catalogue';results();welcome();saveHash();$('#dsm-results').scrollTop=0;}
 function beforePrint(){if(printState)return;printState=[...$('#dsm-reader').querySelectorAll('details')].map(el=>({el,open:el.open}));printState.forEach(({el})=>el.open=true);}
 function afterPrint(){if(printState){printState.forEach(({el,open})=>el.open=open);printState=null;}}
 function fullText(){const box=document.createElement('div');box.innerHTML=activeRecord.sections.map(s=>'<h3>'+esc(s.title)+'</h3>'+s.html+(s.sourceNote?'<p>Note de lecture du document : '+esc(s.sourceNote)+'</p>':'')).join('');box.querySelectorAll('li').forEach((el,i)=>{const parent=el.parentElement;const value=el.getAttribute('value');if(parent.tagName==='OL'){const idx=[...parent.children].indexOf(el)+Number(parent.getAttribute('start')||1);const type=parent.getAttribute('type');el.prepend((type==='A'?String.fromCharCode(64+idx):type==='a'?String.fromCharCode(96+idx):value||idx)+'. ');}else el.prepend('• ');});box.querySelectorAll('p,h3,h4,li,tr,caption').forEach(el=>el.append('\n'));box.querySelectorAll('th,td').forEach(el=>el.append('\t'));return [activeRecord.title,activeRecord.english||'',activeRecord.codes?.join(' · ')||'',box.textContent.trim(),`Source : DSM-5-TR (2022)${activeRecord.pages?', p. '+activeRecord.pages:''}.`].join('\n\n');}
 async function copy(){let ok=false;const text=fullText();try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text);ok=true;}}catch{}if(!ok){const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;left:-9999px';root.append(ta);ta.select();try{ok=document.execCommand('copy');}catch{}ta.remove();$('[data-action=copy]')?.focus();}if(!dead)toast(ok?'Fiche complète copiée avec sa référence.':'La copie est bloquée par le navigateur. Sélectionnez le texte de la fiche.');}
 on($('#dsm-search'),'input',e=>{state.q=e.target.value;results();$('#dsm-results').scrollTop=0;});
 on($('#dsm-fulltext'),'change',e=>{state.fulltext=e.target.checked;results();$('#dsm-results').scrollTop=0;});
 on($('#dsm-chapter'),'change',e=>{state.chapter=e.target.value;state.family='';state.selected=null;results();welcome();saveHash();$('#dsm-results').scrollTop=0;});
 on($('#dsm-family'),'change',e=>{state.family=e.target.value;results();$('#dsm-results').scrollTop=0;});
 on($('#dsm-pdf-file'),'change',e=>{const file=e.target.files[0];if(!file)return;if(sourceObjectURL)URL.revokeObjectURL(sourceObjectURL);sourceObjectURL=URL.createObjectURL(file);const page=pendingPdfPage||1;pendingPdfPage=null;if(activeRecord)detail(activeRecord);const a=document.createElement('a');a.href=sourceUrl(page);a.target='_blank';a.rel='noopener';root.append(a);a.click();a.remove();});
 on(root,'click',e=>{const button=e.target.closest('button');if(!button||!root.contains(button))return;
  if(button.dataset.open){open(button.dataset.open);return;}if(button.dataset.related){open(button.dataset.related,{clear:true});return;}
  if(button.dataset.query){state.q=button.dataset.query;state.family='';results();$('#dsm-results').scrollTop=0;$('#dsm-search').focus();return;}
  if(button.dataset.family){const f=families.get(button.dataset.family);state.chapter=f.chapter;state.family=f.id;state.q='';results();$('#dsm-results').scrollTop=0;$('#dsm-family').focus();return;}
  if(button.dataset.jump){const target=$('.d-section[data-group="'+button.dataset.jump+'"]');if(target){target.open=true;target.scrollIntoView({block:'start',behavior:'instant'});target.querySelector('summary').focus({preventScroll:true});}return;}
  if(button.dataset.pdfPage){pendingPdfPage=Number(button.dataset.pdfPage);$('#dsm-pdf-file').click();return;}
  const a=button.dataset.action;if(a==='clear'){state.q='';results();$('#dsm-search').focus();}if(a==='reset'){reset();$('#dsm-search').focus();}
  if(a==='collapse-section'){const section=button.closest('details');if(section){section.open=false;updateExpand();section.querySelector('summary').focus({preventScroll:true});section.scrollIntoView({block:'start',behavior:'instant'});}return;}
  if(a==='close'){state.selected=null;results();welcome();saveHash();$('#dsm-search').focus({preventScroll:true});}
  if(a==='back-results'){$('#dsm-results').scrollIntoView({block:'center',behavior:'instant'});$('#dsm-results [aria-current=true]')?.focus({preventScroll:true});}
  if(a==='chapter-intro')intro('chapter');if(a==='family-intro')intro('family');
  if(a==='expand'){const sections=[...$('#dsm-reader').querySelectorAll('.d-section')];const value=!sections.every(el=>el.open);sections.forEach(el=>el.open=value);updateExpand();}
  if(a==='copy'&&activeRecord)void copy();if(a==='print'&&activeRecord){beforePrint();global.print();}
 });
 on(document,'keydown',e=>{const edit=e.target instanceof Element&&e.target.closest('input,textarea,select,[contenteditable=true]');if(e.key==='/'&&!edit&&!e.ctrlKey&&!e.altKey&&!e.metaKey){e.preventDefault();$('#dsm-search').focus();}if(e.key==='Escape'&&e.target===$('#dsm-search')){state.q='';results();}if(e.key==='Enter'&&e.target===$('#dsm-search')){const first=$('#dsm-results [data-open]');if(first){e.preventDefault();open(first.dataset.open);}}});
 on(global,'beforeprint',beforePrint);on(global,'afterprint',afterPrint);
 function fromHash(){if(!options.useHash)return;const p=new URLSearchParams(location.hash.slice(1));const id=p.get('dsm5');if(byId.has(id)){open(id,{navigate:false,focus:false,clear:true});return;}if(chapters.has(p.get('chapter')))state.chapter=p.get('chapter');state.selected=null;state.family='';results();welcome();if(p.get('view')==='intro')intro('chapter',{navigate:false,focus:false});if(families.has(p.get('familyIntro'))){state.family=p.get('familyIntro');state.chapter=families.get(state.family).chapter;intro('family',{navigate:false,focus:false});}}
 if(options.useHash)on(global,'hashchange',fromHash);results();welcome();fromHash();
 const api={open:id=>open(id,{clear:true}),getState:()=>({...state}),destroy(){dead=true;clearTimeout(toastTimer);abort.abort();if(sourceObjectURL)URL.revokeObjectURL(sourceObjectURL);mounts.delete(root);}};mounts.set(root,api);return api;
}
 global.DSM5={render,search,normalize};
})(typeof window!=='undefined'?window:globalThis);

</script>
<script>window.DSM5.render(document.getElementById('dsm5-root'),{useHash:true});</script>
</body>
